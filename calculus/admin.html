<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>内容管理后台 · 微积分题库</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">∫</div>
        <div class="brand-copy">
          <strong>微积分内容库</strong>
          <span>Content Studio</span>
        </div>
      </div>

      <nav class="main-nav" aria-label="后台导航">
        <button class="nav-item is-active" data-nav="dashboard">
          <span class="nav-icon">⌂</span>
          <span>总览</span>
        </button>
        <button class="nav-item" data-nav="questions">
          <span class="nav-icon">∑</span>
          <span>题库管理</span>
          <span class="nav-count" id="navQuestionCount">0</span>
        </button>
        <button class="nav-item" data-nav="knowledge">
          <span class="nav-icon">◇</span>
          <span>知识库</span>
          <span class="nav-count" id="navKnowledgeCount">0</span>
        </button>
        <button class="nav-item" data-nav="taxonomy">
          <span class="nav-icon">≋</span>
          <span>章节结构</span>
        </button>
        <button class="nav-item" data-nav="data">
          <span class="nav-icon">⇅</span>
          <span>数据与备份</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <span class="eyebrow">内容同步</span>
        <p>编辑会先保存在本地草稿，确认后再发布到公开网站。</p>
      </div>

      <div class="server-state" id="serverState">
        <span class="state-dot"></span>
        <div>
          <strong>正在连接服务…</strong>
          <span>检查数据接口</span>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">☰</button>
        <div class="breadcrumb">
          <span>管理后台</span>
          <span class="slash">/</span>
          <strong id="viewTitle">总览</strong>
        </div>
        <label class="global-search">
          <span>⌕</span>
          <input id="globalSearch" type="search" autocomplete="off"
                 placeholder="搜索题目、知识点、编号或标签">
          <kbd>Esc</kbd>
        </label>
        <div class="topbar-actions">
          <span class="save-state" id="saveState"><i></i><span>已同步</span></span>
          <a class="btn ghost hide-mobile" href="../">← 题库目录</a>
          <a class="btn ghost hide-mobile" href="index.html" target="_blank" rel="noopener">预览网站 ↗</a>
          <button class="btn primary" id="publishBtn">发布更新</button>
        </div>
      </header>

      <main class="main-view" id="mainView" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <aside class="editor-drawer" id="editorDrawer" aria-hidden="true">
    <header class="drawer-head">
      <div>
        <span class="eyebrow" id="editorEyebrow">编辑内容</span>
        <h2 id="editorTitle">新建条目</h2>
      </div>
      <button class="icon-btn" id="closeEditor" aria-label="关闭编辑器">×</button>
    </header>
    <form class="editor-form" id="editorForm" novalidate>
      <div class="editor-body" id="editorBody"></div>
      <footer class="drawer-foot">
        <span class="form-hint" id="formHint">带 * 的字段为必填项</span>
        <button type="button" class="btn ghost" id="cancelEditor">取消</button>
        <button type="submit" class="btn primary" id="saveEditor">保存条目</button>
      </footer>
    </form>
  </aside>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <script src="data.js"></script>
  <script src="framework-import.js"></script>
  <script src="deep-content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
