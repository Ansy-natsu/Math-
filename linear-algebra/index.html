<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>线性代数题库</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#1c1c1c;--muted:#6b6b6b;--line:#e6e2da;--accent:#b5651d;--bg:#faf9f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
 font-family:"Songti SC","SimSun",Georgia,serif;
 display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:12px 24px;z-index:9;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-family:"Heiti SC","SimHei",sans-serif}
.tabs{display:flex;gap:6px}
.tab{padding:5px 14px;border-radius:16px;cursor:pointer;font-size:13.5px;
 font-family:"Heiti SC","SimHei",sans-serif;background:#f1ece3;color:#5a5a5a}
.tab.on{background:var(--accent);color:#fff}
#q{flex:1;min-width:160px;padding:7px 12px;border:1px solid var(--line);
 border-radius:8px;font-size:14px;font-family:inherit}
.stat{font-size:12.5px;color:var(--muted);font-family:"Heiti SC","SimHei",sans-serif}
.btn{font-size:12.5px;font-family:"Heiti SC","SimHei",sans-serif;border:1px solid var(--line);
 background:#faf8f4;border-radius:7px;padding:5px 11px;cursor:pointer;color:#5a5a5a}
.btn:hover{background:#f1ece3}
.links{display:flex;gap:4px;align-items:center;flex-wrap:wrap;
 padding-left:8px;border-left:1px solid var(--line)}
.links .lbl{font-size:11.5px;color:#b3a894;font-family:"Heiti SC","SimHei",sans-serif}
.links a{font-size:12.5px;color:#8a6b3a;text-decoration:none;padding:3px 9px;
 border-radius:7px;background:#faf6ee;border:1px solid #efe6d4;
 font-family:"Heiti SC","SimHei",sans-serif}
.links a:hover{background:#f3e9d6;color:var(--accent)}
#itvbox{flex:1;min-height:0;display:none;background:#fff}
#itvbox iframe{width:100%;height:100%;border:0;display:block}
main{flex:1;min-height:0;overflow:auto;width:100%;max-width:1120px;
 margin:0 auto;padding:18px 24px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;
 padding:14px 18px;margin:12px 0;cursor:pointer}
.card:hover{border-color:#cdb489;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.id{font-family:"Heiti SC","SimHei",sans-serif;font-size:13px;color:var(--accent);font-weight:700}
.star{color:#d8a12b;font-size:13px}
.ttl{font-size:15.5px;flex:1;min-width:200px}
.tag{font-size:11.5px;background:#f4efe6;color:#7a6a4a;border-radius:10px;
 padding:1px 9px;font-family:"Heiti SC","SimHei",sans-serif}
.body{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.card.on .body{display:block}
.k{font-size:13px;font-family:"Heiti SC","SimHei",sans-serif;color:#8a6b3a;
 margin:12px 0 5px;padding-left:9px;border-left:3px solid #dcc9a4}
.f{background:#f7f5f0;border-radius:6px;padding:7px 12px;margin:5px 0;
 font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:14px;word-break:break-word}
ul{margin:4px 0 4px 20px;padding:0}
li{margin:3px 0}
.ok{color:#2e7d32;background:#f1f8f1;border-left:3px solid #a5d6a7;
 padding:6px 11px;border-radius:5px;margin:5px 0;font-size:14px}
.no{color:#b3261e;background:#fdf3f2;border-left:3px solid #e8a49e;
 padding:6px 11px;border-radius:5px;margin:5px 0;font-size:14px}
.rel{font-size:12.5px;color:var(--muted);margin-top:8px}
.p{margin:5px 0}
.chap{margin:26px 0 10px}
.chd{display:flex;align-items:baseline;gap:9px;cursor:pointer;
 font-family:"Heiti SC","SimHei",sans-serif;font-weight:700;font-size:19px;
 padding:6px 0 6px 12px;border-left:5px solid var(--accent)}
.grp{margin:6px 0 6px 26px;padding-left:10px;border-left:2px solid #dcc9a4}
.ghd{display:flex;align-items:baseline;gap:9px;cursor:pointer;
 font-family:"Heiti SC","SimHei",sans-serif;font-weight:700;font-size:15.5px;
 padding:5px 0;color:#6b5432}
.sub{margin:2px 0 2px 20px;padding-left:10px;border-left:1px solid #e6dcc6}
.shd{display:flex;align-items:baseline;gap:9px;cursor:pointer;font-size:14px;
 padding:4px 0;color:#8a6b3a;font-family:"Heiti SC","SimHei",sans-serif}
.arw{font-size:11px;color:#c9b895;width:11px;display:inline-block}
.cnt{font-size:11.5px;color:#b3a894;font-weight:400;font-family:"Heiti SC","SimHei",sans-serif}
.gbody.hide,.sbody.hide,.cbody.hide{display:none}
.ghd.off{color:#c2b8a6;cursor:default;font-weight:400}
.ghd.off .arw{color:#ded5c5}
.item{margin:2px 0 2px 16px}
.ihd{display:flex;align-items:baseline;gap:8px;cursor:pointer;font-size:14px;
 padding:4px 8px;border-radius:6px}
.ihd:hover{background:#f6f1e7}
.badge{font-size:11px;border-radius:9px;padding:0 8px;flex:none;
 font-family:"Heiti SC","SimHei",sans-serif;background:#edf3e9;color:#3f6b3f;
 border:1px solid #cfe0cf}
.badge.err{background:#fdf0ee;color:#a8452e;border-color:#f0c9c0}
.badge.prob{background:#eef2fa;color:#3a5a8a;border-color:#c9d8ee}
.pid{font-family:"Heiti SC","SimHei",sans-serif;font-size:12.5px;color:var(--accent);font-weight:700}
.star{color:#d8a12b;font-size:11.5px;letter-spacing:-1px;flex:none}
.pdate{font-size:11px;color:#b8ae9c;margin-left:auto;white-space:nowrap;flex:none}
.ihd{align-items:baseline}
.ihd .pst{flex:1;min-width:120px}
.ibody{display:grid;grid-template-columns:1fr 244px;gap:18px;
 padding:2px 0 12px 26px}
.ibody.hide{display:none}
.ic .f{margin-left:0}
.ic ul{margin-left:20px}
.im{font-size:12.5px;color:#6b6b6b}
.im .empty{color:#c9c1b3;font-size:11.5px}
.pn{background:#fffdf2;border:1px solid #eadfc0;border-radius:7px;
 padding:7px 26px 7px 10px;margin:0 0 7px;position:relative;
 font-family:"Kaiti SC","KaiTi","STKaiti",serif;color:#4a4238;font-size:13px}
.pn .del{position:absolute;right:7px;top:5px;color:#c8bda8;cursor:pointer;font-size:12px}
.pn .del:hover{color:#b3261e}
.pn textarea{width:100%;border:0;background:transparent;font:inherit;color:inherit;
 resize:vertical;min-height:42px;outline:none}
.mk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#7a6a52;
 padding:2px 4px;border-radius:4px}
.mk:hover{background:#f7f2e8}
.mk i{width:11px;height:11px;border-radius:3px;display:inline-block;
 border:1px solid rgba(0,0,0,.12)}
.mk .delm{margin-left:auto;color:#c8bda8;cursor:pointer;font-size:11px}
.mk .delm:hover{color:#b3261e}
mark{background:#fff2a8;padding:0 1px;border-radius:2px}
.uln{border-bottom:2px solid #e2ab4c;padding-bottom:1px}
.f{position:relative}
.f:hover{outline:1px dashed #e0d3b8;outline-offset:2px}
.f.sel{outline:2px dashed #c9a86a;outline-offset:2px}
.f.mk-hl-y{background:#fff2a8}
.f.mk-hl-g{background:#c9ecc9}
.f.mk-hl-b{background:#c9e2f7}
.f.mk-hl-p{background:#f8d7e3}
.f.mk-ul-o{box-shadow:inset 0 -2px 0 #e2ab4c}
.f.mk-ul-r{box-shadow:inset 0 -2px 0 #d9534f}
.f.mk-ul-t{box-shadow:inset 0 -2px 0 #2e7d32}
.f.mk-ul-v{box-shadow:inset 0 -2px 0 #6a5acd}
::highlight(hl-y){background-color:#fff2a8}
::highlight(hl-g){background-color:#c9ecc9}
::highlight(hl-b){background-color:#c9e2f7}
::highlight(hl-p){background-color:#f8d7e3}
::highlight(ul-o){text-decoration:underline;text-decoration-color:#e2ab4c;text-decoration-thickness:2px}
::highlight(ul-r){text-decoration:underline;text-decoration-color:#d9534f;text-decoration-thickness:2px}
::highlight(ul-t){text-decoration:underline;text-decoration-color:#2e7d32;text-decoration-thickness:2px}
::highlight(ul-v){text-decoration:underline;text-decoration-color:#6a5acd;text-decoration-thickness:2px}
#tb{position:fixed;display:none;background:#33383d;border-radius:10px;padding:6px 9px;
 align-items:center;gap:5px;z-index:99;font-size:12.5px;
 font-family:"Heiti SC","SimHei",sans-serif;box-shadow:0 5px 18px rgba(0,0,0,.28)}
#tb .gl{color:#aeb4bb;font-size:11.5px;margin:0 2px}
#tb .sw{display:inline-block;width:17px;height:17px;border-radius:5px;cursor:pointer;
 border:1px solid rgba(255,255,255,.35);background:var(--c)}
#tb .sw:hover{transform:scale(1.15)}
#tb .sw.ul{height:7px;border-radius:4px}
#tb .sp{width:1px;height:18px;background:#555b62;margin:0 3px}
#tb button{background:transparent;border:0;color:#fff;cursor:pointer;padding:4px 9px;
 border-radius:6px;font:inherit}
#tb button:hover{background:#555b62}
@media(max-width:820px){.ibody{grid-template-columns:1fr;gap:8px}
 .im{border-top:1px dashed var(--line);padding-top:6px}}
</style>

</head><body>
<header>
  <h1>线性代数题库</h1>
  <div class="tabs">
    <div class="tab on" data-t="p">题目</div>
    <div class="tab" data-t="k">知识点 · 易错点</div>
    <div class="tab" data-t="i">交互版</div>
  </div>
  <input id="q" placeholder="搜索：关键词、编号、矩阵、定理…">
  <span class="stat" id="stat"></span>
  <span id="annbar" style="display:none">
    <button class="btn" id="exp">导出批注</button>
    <button class="btn" id="imp">导入批注</button>
  </span>
  <a class="btn" href="../">← 题库目录</a>
  <a class="btn" href="admin.html">管理后台</a>
</header>
<main id="main"></main>
<div id="itvbox"><iframe id="itv" title="线性代数·交互版"></iframe></div>
<div id="tb">
  <span class="gl">高亮</span>
  <i class="sw" data-a="hl" data-c="y" style="--c:#fff2a8"></i>
  <i class="sw" data-a="hl" data-c="g" style="--c:#c9ecc9"></i>
  <i class="sw" data-a="hl" data-c="b" style="--c:#c9e2f7"></i>
  <i class="sw" data-a="hl" data-c="p" style="--c:#f8d7e3"></i>
  <span class="sp"></span>
  <span class="gl">下划线</span>
  <i class="sw ul" data-a="ul" data-c="o" style="--c:#e2ab4c"></i>
  <i class="sw ul" data-a="ul" data-c="r" style="--c:#d9534f"></i>
  <i class="sw ul" data-a="ul" data-c="t" style="--c:#2e7d32"></i>
  <i class="sw ul" data-a="ul" data-c="v" style="--c:#6a5acd"></i>
  <span class="sp"></span>
  <button data-a="note">旁批</button>
  <button data-a="clr">清除</button>
</div>
<input type="file" id="filein" accept=".json" style="display:none">
<script>
const BASE = {};
const LS = 'lalg-annot-v1';
const COLORS = {y:'#fff2a8',g:'#c9ecc9',b:'#c9e2f7',p:'#f8d7e3',
                o:'#e2ab4c',r:'#d9534f',t:'#2e7d32',v:'#6a5acd'};
const HAS_HL = (typeof Highlight !== 'undefined') && window.CSS && CSS.highlights;

let ANN = JSON.parse(JSON.stringify(BASE));
try {
  const local = JSON.parse(localStorage.getItem(LS) || '{}');
  Object.keys(local).forEach(k=>{
    if(!ANN[k]){ ANN[k] = local[k]; return; }
    const mk = (ANN[k].marks||[]).concat(local[k].marks||[]);
    const seen = new Set();
    ANN[k] = {
      marks: mk.filter(m=>{ const t=[m.start,m.end,m.type,m.c,m.fi].join('|');
        if(seen.has(t)) return false; seen.add(t); return true; }),
      notes: (ANN[k].notes||[]).concat(local[k].notes||[])
    };
  });
} catch(e) {}
function saveAnn(){ try{ localStorage.setItem(LS, JSON.stringify(ANN)); }catch(e){} }
function annOf(k){ return ANN[k] || (ANN[k] = {marks:[],notes:[]}); }

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
/* 把 **文字** 渲染成加粗（数据里沿用了 Markdown 强调） */
function md(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
function ulist(a){return a&&a.length?'<ul>'+a.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>':'';}
function card(r,inner){return '<div class="card"><div class="hd">'+r+'</div><div class="body">'+inner+'</div></div>';}

function renderProblems(list){
  return list.map(p=>{
    let hd='<span class="id">'+esc(p.id)+'</span>'
      +'<span class="star">'+stars(p.difficulty||3)+'</span>'
      +'<span class="ttl">'+esc(p.statement)+'</span>'
      +'<span class="tag">'+esc(p.type||'')+'</span>';
    let b='<div class="k">考点</div>'+ulist(p.topics);
    b+=p.key_points&&p.key_points.length?'<div class="k">解题关键</div>'+ulist(p.key_points):'';
    (p.solutions||[]).forEach(s=>{ b+='<div class="k">'+esc(s.name||'解法')+'</div>'+ulist(s.steps); });
    if(p.pitfalls&&p.pitfalls.length) b+='<div class="k">易错点</div>'+ulist(p.pitfalls);
    if(p.related&&p.related.length) b+='<div class="rel">关联：'+esc(p.related.join('；'))+'</div>';
    if(p.source) b+='<div class="rel">出处：'+esc(p.source)+'　收录：'+esc(p.added||'')+'</div>';
    return card(hd,b);
  }).join('');
}

let UID = 0;
/* 题目/知识点正文默认折叠，首次展开时才生成，避免一次性解析全部解答 */
const LAZY = new Map();
function fml(list, a){
  return (list||[]).map((x,i)=>{
    let cls='f';
    (((a||{}).marks)||[]).forEach(m=>{
      if(m.fi===i) cls += (m.type==='fhl' ? ' mk-hl-' : ' mk-ul-') + (m.c||'y');
    });
    return '<div class="'+cls+'" data-f="'+i+'">'+esc(x)+'</div>';
  }).join('');
}
function itemBody(it, a){
  let b='';
  if(it.kind === '易错点'){
    if(it.rule) b+='<div class="p">'+md(it.rule)+'</div>';
    if(it.why) b+='<div class="p" style="color:#7a7a7a">'+md(it.why)+'</div>';
    if(it.valid) b+='<div class="ok">✓ '+md(it.valid)+'</div>';
    if(it.invalid) b+='<div class="no">✗ '+md(it.invalid)+'</div>';
    if(it.remedy) b+='<div class="p">'+md(it.remedy)+'</div>';
  } else if(it.kind === '题目'){
    b+='<div class="rel">出处：'+esc(it.source||'')+'　题型：'+esc(it.type||'')
      +'　难度：'+'★'.repeat(it.difficulty||3)+'　收录：'+esc(it.added||'')+'</div>';
    if(it.my_answer) b+='<div class="k">当时答案</div><div class="p">'+md(it.my_answer)+'</div>';
    if(it.right_answer) b+='<div class="k">正确答案</div><div class="p"><b>'+md(it.right_answer)+'</b></div>';
    if(it.error_analysis) b+='<div class="k">错因</div><div class="p">'+md(it.error_analysis)+'</div>';
    if(it.topics&&it.topics.length) b+='<div class="k">考点</div>'+ulist(it.topics);
    if(it.key_points&&it.key_points.length) b+='<div class="k">解题关键</div>'+ulist(it.key_points);
    (it.solutions||[]).forEach(s=>{ b+='<div class="k">'+esc(s.name||'解法')+'</div>'+ulist(s.steps); });
    if(it.pitfalls&&it.pitfalls.length) b+='<div class="k">易错点</div>'+ulist(it.pitfalls);
  } else {
    if(it.content) b+='<div class="p">'+md(it.content)+'</div>';
    b+=fml(it.formulas, a);
    b+=ulist(it.tips);
  }
  if(it.related&&it.related.length) b+='<div class="rel">关联：'+esc(it.related.join('；'))+'</div>';
  return b;
}
function itemHTML(ch, it){
  const key=ch.id+'|'+it.sec+'|'+it.name;
  const a=ANN[key]||{marks:[],notes:[]};
  const has=(a.marks&&a.marks.length)||(a.notes&&a.notes.length);
  const isErr = it.kind==='易错点';
  const isProb = it.kind==='题目';
  const bid='b'+(UID++);
  const bidge = isProb ? '<span class="badge prob">题目</span>'
              : isErr ? '<span class="badge err">易错点</span>'
                      : '<span class="badge">知识点</span>';
  const title = isProb
    ? '<span class="pid">'+esc(it.id)+'</span>'
      + '<span class="star">'+'★'.repeat(it.difficulty||3)+'</span>'
      + '<span class="pst">'+md(it.statement)+'</span>'
      + '<span class="pdate">'+esc(it.added||'')+'</span>'
    : '<span>'+md(it.name)+'</span>';
  const notes=(a.notes||[]).map((t,i)=>
    '<div class="pn"><span class="del" data-k="'+esc(key)+'" data-i="'+i+'">✕</span>'
    +'<textarea data-k="'+esc(key)+'" data-i="'+i+'">'+esc(t)+'</textarea></div>').join('');
  const mklist=(a.marks||[]).map((m,i)=>{
    const isF=(m.type||'').charAt(0)==='f';
    const isHL=(m.type||'').indexOf('hl')>=0;
    return '<div class="mk"><i style="background:'+(COLORS[m.c]||'#ddd')+'"></i>'
         + (isF?'公式':'文字')+(isHL?'高亮':'下划线')
         + '<span class="delm" data-k="'+esc(key)+'" data-i="'+i+'">✕</span></div>';
  }).join('');
  const margin=(notes+mklist)||'<div class="empty">选中文字或点公式可批注</div>';
  LAZY.set(bid, ()=>'<div class="ic">'+itemBody(it,a)+'</div>'
    + '<div class="im">'+margin+'</div>');
  return '<div class="item" data-key="'+esc(key)+'">'
    + '<div class="ihd" data-t="'+bid+'">'
    +   '<span class="arw">▸</span>'
    +   bidge + title + '</div>'
    + '<div class="ibody hide" id="'+bid+'" data-lazy="1">'
    + '</div></div>';
}
function hay(it){
  if(!Object.prototype.hasOwnProperty.call(it,'__hay'))
    Object.defineProperty(it,'__hay',{value:JSON.stringify(it).toLowerCase()});
  return it.__hay;
}
function renderTree(chaps, kw, kinds){
  const hit = it => (!kinds || kinds.indexOf(it.kind) >= 0)
                && (!kw || hay(it).indexOf(kw) >= 0);
  let out='';
  chaps.forEach((ch, ci)=>{
    const items = (ch.items||[]).filter(hit);
    if(!items.length) return;
    let body='';
    (ch.outline||[]).forEach((g, gi)=>{
      const gid='c'+ci+'g'+gi;
      const ORD = {'知识点':0,'易错点':1,'题目':2};
      const srt = a => a.sort((x,y)=>(ORD[x.kind]||0)-(ORD[y.kind]||0));
      const direct = srt(items.filter(it=>it.sec===g.sec));
      let inner = direct.map(it=>itemHTML(ch,it)).join('');
      let gCount = direct.length;
      (g.subs||[]).forEach((s, si)=>{
        const sItems = srt(items.filter(it=>it.sec===s.sec));
        if(!sItems.length) return;
        gCount += sItems.length;
        const sid=gid+'s'+si;
        inner += '<div class="sub"><div class="shd" data-t="'+sid+'">'
              +  '<span class="arw">▸</span><span>'+esc(s.sec+'　'+s.name)+'</span>'
              +  '<span class="cnt">'+sItems.length+'</span></div>'
              +  '<div class="sbody hide" id="'+sid+'">'
              +  sItems.map(it=>itemHTML(ch,it)).join('') + '</div></div>';
      });
      if(!gCount){
        const hasAny = (ch.items||[]).some(it => it.sec===g.sec
                        || (g.subs||[]).some(s=>it.sec===s.sec));
        if(!kw && !hasAny) body += '<div class="grp empty-grp"><div class="ghd off" data-chapter="'+esc(ch.chapter)+'" data-section="'+esc(g.sec+'　'+g.name)+'">'
              + '<span class="arw">·</span><span>'+esc(g.sec+'　'+g.name)+'</span>'
              + '<span class="cnt">暂无收录</span></div></div>';
        return;
      }
      body += '<div class="grp"><div class="ghd" data-t="'+gid+'" data-chapter="'+esc(ch.chapter)+'" data-section="'+esc(g.sec+'　'+g.name)+'">'
           +  '<span class="arw">▸</span><span>'+esc(g.sec+'　'+g.name)+'</span>'
           +  '<span class="cnt">'+gCount+'</span></div>'
           +  '<div class="gbody hide" id="'+gid+'">'+inner+'</div></div>';
    });
    const cid='c'+ci;
    out += '<div class="chap"><div class="chd" data-t="'+cid+'">'
        +  '<span class="arw">▾</span><span>'+esc(ch.chapter)+'</span>'
        +  '<span class="cnt">'+items.length+' 条目</span></div>'
        +  '<div class="cbody" id="'+cid+'">'+body+'</div></div>';
  });
  return out || '<p style="color:#888">没有匹配的内容。</p>';
}

function textNodes(root){
  const out=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p) return NodeFilter.FILTER_REJECT;
    if(p.closest('mjx-assistive-mml,textarea,.im,.pn,#tb')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  let n; while(n=w.nextNode()) out.push(n);
  return out;
}
function makeRange(root, m){
  const ns=textNodes(root);
  const all=ns.map(n=>n.nodeValue).join('');
  let s=m.start, e=m.end;
  if(m.text && all.substr(s, e-s) !== m.text){
    const i=all.indexOf(m.text);
    if(i>=0){ s=i; e=i+m.text.length; }
  }
  if(s==null||e==null||s>=e) return null;
  let pos=0, sN=null,sO=0,eN=null,eO=0;
  for(const n of ns){
    const len=n.nodeValue.length;
    if(sN===null && pos+len>s){ sN=n; sO=s-pos; }
    if(eN===null && pos+len>=e){ eN=n; eO=e-pos; }
    pos+=len;
    if(sN&&eN) break;
  }
  if(!sN||!eN) return null;
  try{
    const r=document.createRange();
    r.setStart(sN,Math.max(0,Math.min(sO,sN.nodeValue.length)));
    r.setEnd(eN,Math.max(0,Math.min(eO,eN.nodeValue.length)));
    return r;
  }catch(err){ return null; }
}
function offsetsOf(root, range){
  const ns=textNodes(root);
  let pos=0,s=-1,e=-1;
  for(const n of ns){
    const len=n.nodeValue.length;
    if(s<0 && n===range.startContainer) s=pos+range.startOffset;
    if(e<0 && n===range.endContainer) e=pos+range.endOffset;
    pos+=len;
  }
  if(s<0||e<0||s===e) return null;
  return {start:Math.min(s,e), end:Math.max(s,e)};
}
function applyMarks(root){
  const groups={};
  root.querySelectorAll('.item').forEach(el=>{
    const a=ANN[el.dataset.key]; if(!a||!a.marks) return;
    const cell=el.querySelector('.ic');
    if(!cell) return;
    a.marks.forEach(m=>{
      if(m.fi!==undefined && m.fi!==null) return;
      const r=makeRange(cell,m); if(!r) return;
      if(HAS_HL){ (groups[m.type+'-'+m.c]=groups[m.type+'-'+m.c]||[]).push(r); }
      else {
        try{
          const s=document.createElement(m.type==='ul'?'span':'mark');
          if(m.type==='ul'){ s.className='uln'; s.style.borderBottomColor=COLORS[m.c]||'#e2ab4c'; }
          else s.style.background=COLORS[m.c]||'#fff2a8';
          r.surroundContents(s);
        }catch(err){}
      }
    });
  });
  if(HAS_HL){
    CSS.highlights.clear();
    Object.keys(groups).forEach(name=>{
      CSS.highlights.set(name, new Highlight(...groups[name]));
    });
  }
}
let CUR=null;
const tb=document.getElementById('tb');
function place(x,y){
  tb.style.display='flex';
  tb.style.left=Math.max(8,Math.min(window.innerWidth-430,x))+'px';
  tb.style.top=Math.max(8,y-46)+'px';
}
function pickText(){
  const s=window.getSelection();
  if(!s||!s.rangeCount||!s.toString().trim()) return false;
  let e=s.anchorNode; e=e.nodeType===1?e:e.parentElement;
  const el=e?e.closest('.item'):null;
  if(!el) return false;
  CUR={el:el, cell:el.querySelector('.ic'), range:s.getRangeAt(0).cloneRange(), fi:null};
  const r=s.getRangeAt(0).getBoundingClientRect();
  place(r.left,r.top);
  return true;
}
document.addEventListener('selectionchange',()=>{ if(!pickText()) tb.style.display='none'; });
tb.addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('click',e=>{
  const f=e.target.closest('.f');
  if(f){
    const el=f.closest('.item'); if(!el) return;
    document.querySelectorAll('.f.sel').forEach(x=>x.classList.remove('sel'));
    f.classList.add('sel');
    CUR={el:el, cell:el.querySelector('.ic'), range:null, fi:+f.dataset.f};
    const r=f.getBoundingClientRect(); place(r.left,r.top);
    e.stopPropagation();
    return;
  }
  const dm=e.target.closest('.delm');
  if(dm){
    const a=annOf(dm.dataset.k); a.marks.splice(+dm.dataset.i,1);
    if(!a.notes.length&&!(a.marks||[]).length) delete ANN[dm.dataset.k];
    saveAnn(); draw(); e.stopPropagation(); return;
  }
  const d=e.target.closest('.pn .del');
  if(d){
    const a=annOf(d.dataset.k); a.notes.splice(+d.dataset.i,1);
    if(!a.notes.length&&!(a.marks||[]).length) delete ANN[d.dataset.k];
    saveAnn(); draw(); e.stopPropagation(); return;
  }
  const t=e.target.closest('[data-t]');
  if(t){
    const b=document.getElementById(t.dataset.t);
    if(b){
      if(b.dataset.lazy && LAZY.has(b.id)){
        b.innerHTML=LAZY.get(b.id)(); LAZY.delete(b.id); delete b.dataset.lazy;
        applyMarks(document.getElementById('main'));
      }
      b.classList.toggle('hide');
      const a=t.querySelector('.arw');
      if(a) a.textContent = b.classList.contains('hide') ? '▸' : '▾';
      if(!b.classList.contains('hide') && window.renderMath){
        if(t.classList.contains('ihd')){
          const cell=b.querySelector('.ic');
          if(cell) window.renderMath(cell);
        } else if(t.classList.contains('ghd') || t.classList.contains('shd')){
          b.querySelectorAll('.ihd').forEach(node=>window.renderMath(node));
        }
      }
    }
  }
});
tb.querySelectorAll('.sw,button').forEach(b=>b.onclick=()=>{
  if(!CUR) return;
  const k=CUR.el.dataset.key, a=annOf(k), act=b.dataset.a;
  if(act==='clr'){ delete ANN[k]; saveAnn(); draw(); tb.style.display='none'; CUR=null; return; }
  if(act==='note'){ a.notes=a.notes||[]; a.notes.push(''); saveAnn(); draw(); tb.style.display='none'; return; }
  a.marks=a.marks||[];
  if(CUR.fi!==null && CUR.fi!==undefined){
    a.marks=a.marks.filter(m=>m.fi!==CUR.fi);
    a.marks.push({type:'f'+act, c:b.dataset.c, fi:CUR.fi});
  } else if(CUR.range){
    const off=offsetsOf(CUR.cell,CUR.range);
    const txt=CUR.range.toString().replace(/\s+/g,' ').trim();
    if(!off||!txt) return;
    a.marks.push({type:act, c:b.dataset.c, start:off.start, end:off.end, text:txt});
  }
  saveAnn(); draw(); tb.style.display='none';
});
document.addEventListener('mousedown',e=>{
  if(!tb.contains(e.target) && !e.target.closest('.f')) tb.style.display='none';
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.tagName==='TEXTAREA'&&t.dataset.k){ annOf(t.dataset.k).notes[+t.dataset.i]=t.value; saveAnn(); }
});
document.getElementById('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(ANN,null,1)],{type:'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download='批注.json'; a.click(); URL.revokeObjectURL(u);
};
document.getElementById('imp').onclick=()=>document.getElementById('filein').click();
document.getElementById('filein').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
    Object.keys(o).forEach(k=>{ ANN[k]=o[k]; });
    saveAnn(); draw(); }catch(err){ alert('导入失败：'+err.message); } };
  r.readAsText(f);
};

let TAB='p';
function draw(){
  const isItv = (TAB==='i');
  document.getElementById('itvbox').style.display = isItv ? 'block' : 'none';
  document.getElementById('main').style.display = isItv ? 'none' : '';
  document.getElementById('q').style.display = isItv ? 'none' : '';
  document.getElementById('stat').style.display = isItv ? 'none' : '';
  document.getElementById('annbar').style.display = isItv ? 'none'
      : (TAB==='k' ? 'inline' : 'none');
  if(isItv){
    const f=document.getElementById('itv');
    if(!f.getAttribute('src')) f.setAttribute('src', 'interactive.html');
    return;
  }
  const kw=(document.getElementById('q').value||'').trim().toLowerCase();
  const m=document.getElementById('main');
  let html='', n=0;
  document.getElementById('annbar').style.display=(TAB==='k')?'inline':'none';
  const kinds = (TAB==='p') ? ['题目'] : ['知识点','易错点'];
  UID=0; LAZY.clear();
  CHAPS.forEach(ch=>{
    n += (ch.items||[]).filter(it=>{
      if(kinds.indexOf(it.kind) < 0) return false;
      return !kw || hay(it).indexOf(kw)>=0;
    }).length;
  });
  m.innerHTML = renderTree(CHAPS, kw, kinds);
  document.getElementById('stat').textContent=n+' 条';
  document.getElementById('annbar').style.display='inline';
  if(window.renderMath) m.querySelectorAll('.ghd').forEach(node=>window.renderMath(node));
  if(window.SectionComments) window.SectionComments.refresh(m);
  const done=()=>applyMarks(m);
  done();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); TAB=t.dataset.t; draw();
});
let searchTimer;
document.getElementById('q').oninput=()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(draw,180);
};
draw();
</script></body></html>
