<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>线性代数题库 · 黄正达《线性代数（第二版）》</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #1f2924;
      --muted: #7d877f;
      --paper: #f6f3eb;
      --card: #fffdf9;
      --line: #ded7ca;
      --accent: #a85a1d;
      --accent-soft: #faefe1;
      --green: #2f654c;
      --green-soft: #eaf3ed;
      --red: #a83f35;
      --red-soft: #faeeec;
      --blue: #405f7d;
      --blue-soft: #edf3f8;
      --sans: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --serif: "Songti SC", "SimSun", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0, rgba(168,90,29,.07), transparent 24%),
        var(--paper);
      font: 14px/1.75 var(--serif);
    }
    button, input { font: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,253,249,.94);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #efc28c;
      background: #243029;
      font: 23px/1 var(--serif);
    }
    .brand strong { display: block; font: 16px/1.25 var(--serif); letter-spacing: .05em; }
    .brand small { display: block; color: var(--muted); font: 9.5px/1.4 var(--sans); }
    .tabs {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #ece7dc;
    }
    .tab {
      padding: 5px 13px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font: 12px/1.4 var(--sans);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.is-active { color: var(--ink); background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .search {
      min-width: 180px;
      max-width: 500px;
      flex: 1;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
    }
    .search:focus-within { border-color: #caa278; box-shadow: 0 0 0 3px rgba(168,90,29,.07); }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .count { color: var(--muted); font: 11.5px/1 var(--sans); white-space: nowrap; }
    .btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: #fffdf9;
      font: 11.5px/1 var(--sans);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { border-color: #c7b18f; background: #fff; }
    .btn.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 35px 27px 22px;
    }
    .eyebrow { color: var(--accent); font: 700 10.5px/1.4 var(--sans); letter-spacing: .15em; text-transform: uppercase; }
    .hero h1 {
      max-width: 800px;
      margin: 7px 0 8px;
      font: 34px/1.35 var(--serif);
      letter-spacing: .02em;
    }
    .hero p { max-width: 810px; margin: 0; color: #6f786f; font-size: 13.5px; line-height: 1.85; }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .book-chip {
      padding: 4px 9px;
      border: 1px solid #e5d4b6;
      border-radius: 8px;
      color: #7b5c31;
      background: #fff9ee;
      font: 10.5px/1.5 var(--sans);
    }
    .hero-stats { display: flex; gap: 22px; margin-left: auto; }
    .hero-stat { text-align: right; }
    .hero-stat strong { display: block; font: 22px/1.25 var(--serif); }
    .hero-stat span { color: var(--muted); font: 9.5px/1.4 var(--sans); }
    .chapter-nav {
      max-width: 1180px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin: 0 auto;
      padding: 0 27px 22px;
    }
    .chapter-nav a {
      padding: 4px 9px;
      border: 1px solid #e9ddc9;
      border-radius: 7px;
      color: #7e6747;
      background: #fbf7ef;
      font: 10.5px/1.55 var(--sans);
      text-decoration: none;
    }
    .chapter-nav a:hover { color: var(--accent); background: #fff; }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 27px 90px;
    }
    .chapter {
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
    }
    .chapter-head {
      width: 100%;
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 18px;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .chapter-head:hover { background: #fcfaf5; }
    .chapter-num {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--accent);
      background: var(--accent-soft);
      font: 12px/1 var(--sans);
    }
    .chapter-head h2 { margin: 0; font: 17px/1.45 var(--serif); }
    .chapter-head p { margin: 1px 0 0; color: var(--muted); font: 10.5px/1.5 var(--sans); }
    .chapter-count { margin-left: auto; color: var(--muted); font: 11px/1.4 var(--sans); white-space: nowrap; }
    .arrow { margin-left: 5px; color: #b4a58e; font: 12px/1 var(--sans); transition: transform .2s; }
    .chapter.is-open .arrow { transform: rotate(90deg); }
    .chapter-body { display: none; border-top: 1px solid #eee8dd; }
    .chapter.is-open .chapter-body { display: block; }
    .section-block { padding: 17px 20px 5px; }
    .section-block + .section-block { border-top: 1px dashed #ebe4d8; }
    .section-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 10px; }
    .section-head strong { color: #705738; font: 13.5px/1.4 var(--serif); }
    .section-head span { color: var(--muted); font: 10px/1 var(--sans); }
    .cards { display: grid; gap: 9px; padding-bottom: 13px; }
    .card {
      padding: 14px 16px;
      border: 1px solid #e8e1d5;
      border-radius: 10px;
      background: #fff;
    }
    .card.problem { cursor: pointer; }
    .card.problem:hover { border-color: #cfb493; box-shadow: 0 2px 12px rgba(55,45,32,.04); }
    .card-head { display: flex; align-items: flex-start; gap: 9px; }
    .problem-id {
      flex: none;
      padding: 2px 7px;
      border-radius: 5px;
      color: var(--accent);
      background: var(--accent-soft);
      font: 10px/1.55 var(--sans);
    }
    .stars { flex: none; color: #c98a32; font-size: 10.5px; letter-spacing: -1px; }
    .card-title { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.75; }
    .card-type { flex: none; color: var(--muted); font: 9.5px/1.7 var(--sans); }
    .peek { margin-top: 6px; color: #8c968e; font: 10px/1.4 var(--sans); }
    .card-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e8e1d5; }
    .card.is-open .card-detail { display: block; }
    .k {
      margin: 12px 0 5px;
      padding-left: 8px;
      border-left: 3px solid #d7c19a;
      color: #785e3b;
      font: 700 10.5px/1.5 var(--sans);
    }
    .k:first-child { margin-top: 0; }
    .f {
      margin: 5px 0;
      padding: 7px 10px;
      border-radius: 6px;
      background: #f7f4ed;
      font: 12.5px/1.7 Cambria, "Times New Roman", serif;
      overflow-wrap: anywhere;
    }
    ul { margin: 4px 0 4px 20px; padding: 0; }
    li { margin: 3px 0; }
    .rel { margin-top: 10px; color: var(--muted); font-size: 10.5px; }
    .tagline { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
    .tag {
      padding: 1px 7px;
      border-radius: 8px;
      color: #68756c;
      background: #f1eee7;
      font: 9.5px/1.6 var(--sans);
    }
    .knowledge-card .card-title { color: #2f5f4b; font-weight: 700; }
    .pitfall-card .card-title { color: var(--red); font-weight: 700; }
    .ok, .no, .rule {
      margin: 6px 0;
      padding: 7px 10px;
      border-radius: 6px;
      line-height: 1.7;
      font-size: 12px;
    }
    .ok { color: #285b42; background: var(--green-soft); border-left: 3px solid #9bc8ae; }
    .no { color: #863a32; background: var(--red-soft); border-left: 3px solid #d9a39d; }
    .rule { color: #4b637a; background: var(--blue-soft); border-left: 3px solid #a9bfd2; }
    .empty {
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font: 18px/1.4 var(--serif); }
    footer {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 27px 35px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 10.5px/1.7 var(--sans);
      text-align: center;
    }
    @media (max-width: 820px) {
      .topbar { flex-wrap: wrap; padding: 10px 16px; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .top-actions .count { display: none; }
      .hero { padding: 25px 16px 18px; }
      .hero h1 { font-size: 27px; }
      .hero-stats { width: 100%; margin-left: 0; justify-content: space-between; }
      .chapter-nav { padding: 0 16px 18px; }
      main { padding: 0 16px 60px; }
      .chapter-head { padding: 12px; }
      .section-block { padding: 14px 12px 3px; }
      .card { padding: 12px; }
      .card-head { flex-wrap: wrap; }
      .card-type { display: none; }
    }
  </style>
  <script src="data.js"></script>
  <script src="site-data.js"></script>
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" style="text-decoration:none">
      <span class="brand-mark">λ</span>
      <span><strong>线性代数题库</strong><small>黄正达《线性代数（第二版）》</small></span>
    </a>
    <div class="tabs">
      <button class="tab is-active" data-tab="problems">题目</button>
      <button class="tab" data-tab="knowledge">知识点 · 易错点</button>
    </div>
    <label class="search">
      <span>⌕</span>
      <input id="search" placeholder="搜索题目、矩阵、定理、编号或标签">
    </label>
    <div class="top-actions">
      <span class="count" id="count"></span>
      <a class="btn" href="../">题库目录</a>
      <a class="btn primary" href="admin.html">管理后台</a>
    </div>
  </header>

  <section class="hero">
    <span class="eyebrow">Linear Algebra · Textbook Companion</span>
    <h1>从线性方程组到线性映射</h1>
    <p>按教材九章结构整理题目、知识点与易错点。题干与推导支持 LaTeX 公式，点击题目可展开考点、解题过程与常见错误。</p>
    <div class="hero-meta">
      <span class="book-chip" id="bookChip"></span>
      <div class="hero-stats">
        <div class="hero-stat"><strong id="problemTotal">0</strong><span>道题目</span></div>
        <div class="hero-stat"><strong id="knowledgeTotal">0</strong><span>个知识点</span></div>
        <div class="hero-stat"><strong id="pitfallTotal">0</strong><span>条易错点</span></div>
      </div>
    </div>
  </section>

  <nav class="chapter-nav" id="chapterNav"></nav>
  <main id="main"></main>
  <footer>内容为原创或改编，按章节整理，用于线性代数课程复习与自测。</footer>

  <script>
    (function () {
      'use strict';
      var DATA = window.LA_DATA || { chapters: [], counts: {} };
      var state = { tab: 'problems', query: '', open: new Set() };
      var main = document.getElementById('main');

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function md(value) {
        return esc(value).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      }
      function list(values) {
        return values && values.length ? '<ul>' + values.map(function (v) { return '<li>' + md(v) + '</li>'; }).join('') + '</ul>' : '';
      }
      function stars(n) {
        var value = Math.max(1, Math.min(5, Number(n) || 3));
        return '★'.repeat(value) + '☆'.repeat(5 - value);
      }
      function match(item, query) {
        return !query || JSON.stringify(item).toLowerCase().indexOf(query) >= 0;
      }
      function itemBody(item) {
        var body = '';
        if (item.kind === '题目') {
          body += '<div class="k">考点</div>' + list(item.topics);
          body += '<div class="k">解题关键</div>' + list(item.key_points);
          (item.solutions || []).forEach(function (solution) {
            body += '<div class="k">' + esc(solution.name || '解法') + '</div>' + list(solution.steps);
          });
          if (item.pitfalls && item.pitfalls.length) body += '<div class="k">易错点</div>' + list(item.pitfalls);
          if (item.related && item.related.length) body += '<div class="rel">关联：' + esc(item.related.join('；')) + '</div>';
          if (item.source) body += '<div class="rel">出处：' + esc(item.source) + '　收录：' + esc(item.added || '') + '</div>';
        } else if (item.kind === '知识点') {
          body += '<div class="k">知识说明</div><div>' + md(item.content || '') + '</div>';
          (item.formulas || []).forEach(function (formula) { body += '<div class="f">' + esc(formula) + '</div>'; });
          if (item.tips && item.tips.length) body += '<div class="k">使用提示</div>' + list(item.tips);
          if (item.related && item.related.length) body += '<div class="rel">关联：' + esc(item.related.join('；')) + '</div>';
        } else {
          body += '<div class="rule">' + md(item.rule || '') + '</div>';
          if (item.why) body += '<div class="k">为什么错</div><div>' + md(item.why) + '</div>';
          if (item.valid) body += '<div class="ok">✓ ' + md(item.valid) + '</div>';
          if (item.invalid) body += '<div class="no">✗ ' + md(item.invalid) + '</div>';
          if (item.remedy) body += '<div class="k">纠正方法</div><div>' + md(item.remedy) + '</div>';
          if (item.related && item.related.length) body += '<div class="rel">关联：' + esc(item.related.join('；')) + '</div>';
        }
        return body;
      }
      function card(item) {
        if (item.kind === '题目') {
          return '<article class="card problem" data-card>' +
            '<div class="card-head"><span class="problem-id">' + esc(item.id) + '</span><span class="stars">' + stars(item.difficulty) + '</span>' +
            '<div class="card-title">' + md(item.statement) + '</div><span class="card-type">' + esc(item.type || '') + '</span></div>' +
            '<div class="peek">展开解析 ▸</div><div class="card-detail">' + itemBody(item) + '</div></article>';
        }
        var cls = item.kind === '易错点' ? 'pitfall-card' : 'knowledge-card';
        var title = item.title || item.name || '';
        return '<article class="card ' + cls + '"><div class="card-head"><div class="card-title">' + md(title) + '</div></div>' +
          '<div class="tagline">' + (item.tags || []).map(function (tag) { return '<span class="tag">' + esc(tag) + '</span>'; }).join('') + '</div>' +
          '<div class="card-detail" style="display:block">' + itemBody(item) + '</div></article>';
      }
      function render() {
        var isProblems = state.tab === 'problems';
        var query = state.query.trim().toLowerCase();
        var kinds = isProblems ? ['题目'] : ['知识点', '易错点'];
        var total = 0;
        var html = '';
        DATA.chapters.forEach(function (chapter) {
          var items = (chapter.items || []).filter(function (item) {
            return kinds.indexOf(item.kind) >= 0 && match(item, query);
          });
          if (!items.length) return;
          total += items.length;
          if (query) state.open.add(chapter.id);
          var sections = chapter.sections && chapter.sections.length ? chapter.sections : [];
          var secNames = sections.map(function (s) { return s.sec; });
          items.forEach(function (item) {
            if (secNames.indexOf(item.sec) < 0) sections = sections.concat([{ sec: item.sec, name: '' }]);
            secNames = sections.map(function (s) { return s.sec; });
          });
          var body = sections.map(function (section) {
            var secItems = items.filter(function (item) { return item.sec === section.sec; });
            if (!secItems.length) return '';
            return '<div class="section-block"><div class="section-head"><strong>' + esc(section.sec) + '</strong><span>' +
              esc(section.name || '') + ' · ' + secItems.length + ' 条</span></div><div class="cards">' +
              secItems.map(card).join('') + '</div></div>';
          }).join('');
          html += '<section class="chapter ' + (state.open.has(chapter.id) ? 'is-open' : '') + '" id="' + esc(chapter.id) + '">' +
            '<button class="chapter-head" data-chapter="' + esc(chapter.id) + '"><span class="chapter-num">' + esc(chapter.num) + '</span>' +
            '<span><h2>' + esc(chapter.title) + '</h2><p>' + sections.length + ' 个小节</p></span>' +
            '<span class="chapter-count">' + items.length + ' 条</span><span class="arrow">▸</span></button>' +
            '<div class="chapter-body">' + body + '</div></section>';
        });
        main.innerHTML = html || '<div class="empty"><strong>没有找到匹配内容</strong><p>尝试搜索章节、矩阵、定理或题目编号。</p></div>';
        document.getElementById('count').textContent = total + ' 条';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([main]).catch(function () {});
      }
      function initHeader() {
        var meta = DATA.meta || {};
        document.getElementById('bookChip').textContent = meta.book || '线性代数教材同步题库';
        document.getElementById('problemTotal').textContent = DATA.counts.problems || 0;
        document.getElementById('knowledgeTotal').textContent = DATA.counts.knowledge || 0;
        document.getElementById('pitfallTotal').textContent = DATA.counts.pitfalls || 0;
        document.getElementById('chapterNav').innerHTML = DATA.chapters.map(function (chapter) {
          return '<a href="#' + esc(chapter.id) + '" data-go="' + esc(chapter.id) + '">' + esc(chapter.num) + '　' + esc(chapter.title) + '</a>';
        }).join('');
      }
      document.querySelectorAll('[data-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('[data-tab]').forEach(function (node) { node.classList.remove('is-active'); });
          button.classList.add('is-active');
          state.tab = button.dataset.tab;
          render();
        });
      });
      document.getElementById('search').addEventListener('input', function (event) {
        state.query = event.target.value;
        render();
      });
      document.addEventListener('click', function (event) {
        var chapter = event.target.closest('[data-chapter]');
        if (chapter) {
          var id = chapter.dataset.chapter;
          if (state.open.has(id)) state.open.delete(id);
          else state.open.add(id);
          chapter.closest('.chapter').classList.toggle('is-open');
          return;
        }
        var go = event.target.closest('[data-go]');
        if (go) {
          event.preventDefault();
          var targetId = go.dataset.go;
          state.open.add(targetId);
          render();
          var target = document.getElementById(targetId);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        var problem = event.target.closest('.card.problem');
        if (problem && !event.target.closest('a')) {
          problem.classList.toggle('is-open');
          var peek = problem.querySelector('.peek');
          if (peek) peek.textContent = problem.classList.contains('is-open') ? '收起解析 ▴' : '展开解析 ▸';
        }
      });
      initHeader();
      if (DATA.chapters[0]) state.open.add(DATA.chapters[0].id);
      render();
    })();
  </script>
</body>
</html>
