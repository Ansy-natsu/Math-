<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微积分题库</title>
<style>
:root{--ink:#1c1c1c;--muted:#6b6b6b;--line:#e6e2da;--accent:#b5651d;--bg:#faf9f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
 font-family:"Songti SC","SimSun",Georgia,serif;
 display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none;background:#fff;border-bottom:1px solid var(--line);
 padding:12px 24px;z-index:9;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-family:"Heiti SC","SimHei",sans-serif}
.tabs{display:flex;gap:6px}
.tab{padding:5px 14px;border-radius:16px;cursor:pointer;font-size:13.5px;
 font-family:"Heiti SC","SimHei",sans-serif;background:#f1ece3;color:#5a5a5a}
.tab.on{background:var(--accent);color:#fff}
#q{flex:1;min-width:160px;padding:7px 12px;border:1px solid var(--line);
 border-radius:8px;font-size:14px;font-family:inherit}
.stat{font-size:12.5px;color:var(--muted);font-family:"Heiti SC","SimHei",sans-serif}
.btn{font-size:12.5px;font-family:"Heiti SC","SimHei",sans-serif;border:1px solid var(--line);
 background:#faf8f4;border-radius:7px;padding:5px 11px;cursor:pointer;color:#5a5a5a}
.btn:hover{background:#f1ece3}
.links{display:flex;gap:4px;align-items:center;flex-wrap:wrap;
 padding-left:8px;border-left:1px solid var(--line)}
.links .lbl{font-size:11.5px;color:#b3a894;font-family:"Heiti SC","SimHei",sans-serif}
.links a{font-size:12.5px;color:#8a6b3a;text-decoration:none;padding:3px 9px;
 border-radius:7px;background:#faf6ee;border:1px solid #efe6d4;
 font-family:"Heiti SC","SimHei",sans-serif}
.links a:hover{background:#f3e9d6;color:var(--accent)}
#itvbox{flex:1;min-height:0;display:none;background:#fff}
#itvbox iframe{width:100%;height:100%;border:0;display:block}
main{flex:1;min-height:0;overflow:auto;width:100%;max-width:1120px;
 margin:0 auto;padding:18px 24px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;
 padding:14px 18px;margin:12px 0;cursor:pointer}
.card:hover{border-color:#cdb489;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.id{font-family:"Heiti SC","SimHei",sans-serif;font-size:13px;color:var(--accent);font-weight:700}
.star{color:#d8a12b;font-size:13px}
.ttl{font-size:15.5px;flex:1;min-width:200px}
.tag{font-size:11.5px;background:#f4efe6;color:#7a6a4a;border-radius:10px;
 padding:1px 9px;font-family:"Heiti SC","SimHei",sans-serif}
.body{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.card.on .body{display:block}
.k{font-size:13px;font-family:"Heiti SC","SimHei",sans-serif;color:#8a6b3a;
 margin:12px 0 5px;padding-left:9px;border-left:3px solid #dcc9a4}
.f{background:#f7f5f0;border-radius:6px;padding:7px 12px;margin:5px 0;
 font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:14px;word-break:break-word}
ul{margin:4px 0 4px 20px;padding:0}
li{margin:3px 0}
.ok{color:#2e7d32;background:#f1f8f1;border-left:3px solid #a5d6a7;
 padding:6px 11px;border-radius:5px;margin:5px 0;font-size:14px}
.no{color:#b3261e;background:#fdf3f2;border-left:3px solid #e8a49e;
 padding:6px 11px;border-radius:5px;margin:5px 0;font-size:14px}
.rel{font-size:12.5px;color:var(--muted);margin-top:8px}
.p{margin:5px 0}
.chap{margin:26px 0 10px}
.chd{display:flex;align-items:baseline;gap:9px;cursor:pointer;
 font-family:"Heiti SC","SimHei",sans-serif;font-weight:700;font-size:19px;
 padding:6px 0 6px 12px;border-left:5px solid var(--accent)}
.grp{margin:6px 0 6px 26px;padding-left:10px;border-left:2px solid #dcc9a4}
.ghd{display:flex;align-items:baseline;gap:9px;cursor:pointer;
 font-family:"Heiti SC","SimHei",sans-serif;font-weight:700;font-size:15.5px;
 padding:5px 0;color:#6b5432}
.sub{margin:2px 0 2px 20px;padding-left:10px;border-left:1px solid #e6dcc6}
.shd{display:flex;align-items:baseline;gap:9px;cursor:pointer;font-size:14px;
 padding:4px 0;color:#8a6b3a;font-family:"Heiti SC","SimHei",sans-serif}
.arw{font-size:11px;color:#c9b895;width:11px;display:inline-block}
.cnt{font-size:11.5px;color:#b3a894;font-weight:400;font-family:"Heiti SC","SimHei",sans-serif}
.gbody.hide,.sbody.hide,.cbody.hide{display:none}
.ghd.off{color:#c2b8a6;cursor:default;font-weight:400}
.ghd.off .arw{color:#ded5c5}
.item{margin:2px 0 2px 16px}
.ihd{display:flex;align-items:baseline;gap:8px;cursor:pointer;font-size:14px;
 padding:4px 8px;border-radius:6px}
.ihd:hover{background:#f6f1e7}
.badge{font-size:11px;border-radius:9px;padding:0 8px;flex:none;
 font-family:"Heiti SC","SimHei",sans-serif;background:#edf3e9;color:#3f6b3f;
 border:1px solid #cfe0cf}
.badge.err{background:#fdf0ee;color:#a8452e;border-color:#f0c9c0}
.badge.prob{background:#eef2fa;color:#3a5a8a;border-color:#c9d8ee}
.pid{font-family:"Heiti SC","SimHei",sans-serif;font-size:12.5px;color:var(--accent);font-weight:700}
.star{color:#d8a12b;font-size:11.5px;letter-spacing:-1px;flex:none}
.pdate{font-size:11px;color:#b8ae9c;margin-left:auto;white-space:nowrap;flex:none}
.ihd{align-items:baseline}
.ihd .pst{flex:1;min-width:120px}
.ibody{display:grid;grid-template-columns:1fr 244px;gap:18px;
 padding:2px 0 12px 26px}
.ibody.hide{display:none}
.ic .f{margin-left:0}
.ic ul{margin-left:20px}
.im{font-size:12.5px;color:#6b6b6b}
.im .empty{color:#c9c1b3;font-size:11.5px}
.pn{background:#fffdf2;border:1px solid #eadfc0;border-radius:7px;
 padding:7px 26px 7px 10px;margin:0 0 7px;position:relative;
 font-family:"Kaiti SC","KaiTi","STKaiti",serif;color:#4a4238;font-size:13px}
.pn .del{position:absolute;right:7px;top:5px;color:#c8bda8;cursor:pointer;font-size:12px}
.pn .del:hover{color:#b3261e}
.pn textarea{width:100%;border:0;background:transparent;font:inherit;color:inherit;
 resize:vertical;min-height:42px;outline:none}
.mk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#7a6a52;
 padding:2px 4px;border-radius:4px}
.mk:hover{background:#f7f2e8}
.mk i{width:11px;height:11px;border-radius:3px;display:inline-block;
 border:1px solid rgba(0,0,0,.12)}
.mk .delm{margin-left:auto;color:#c8bda8;cursor:pointer;font-size:11px}
.mk .delm:hover{color:#b3261e}
mark{background:#fff2a8;padding:0 1px;border-radius:2px}
.uln{border-bottom:2px solid #e2ab4c;padding-bottom:1px}
.f{position:relative}
.f:hover{outline:1px dashed #e0d3b8;outline-offset:2px}
.f.sel{outline:2px dashed #c9a86a;outline-offset:2px}
.f.mk-hl-y{background:#fff2a8}
.f.mk-hl-g{background:#c9ecc9}
.f.mk-hl-b{background:#c9e2f7}
.f.mk-hl-p{background:#f8d7e3}
.f.mk-ul-o{box-shadow:inset 0 -2px 0 #e2ab4c}
.f.mk-ul-r{box-shadow:inset 0 -2px 0 #d9534f}
.f.mk-ul-t{box-shadow:inset 0 -2px 0 #2e7d32}
.f.mk-ul-v{box-shadow:inset 0 -2px 0 #6a5acd}
::highlight(hl-y){background-color:#fff2a8}
::highlight(hl-g){background-color:#c9ecc9}
::highlight(hl-b){background-color:#c9e2f7}
::highlight(hl-p){background-color:#f8d7e3}
::highlight(ul-o){text-decoration:underline;text-decoration-color:#e2ab4c;text-decoration-thickness:2px}
::highlight(ul-r){text-decoration:underline;text-decoration-color:#d9534f;text-decoration-thickness:2px}
::highlight(ul-t){text-decoration:underline;text-decoration-color:#2e7d32;text-decoration-thickness:2px}
::highlight(ul-v){text-decoration:underline;text-decoration-color:#6a5acd;text-decoration-thickness:2px}
#tb{position:fixed;display:none;background:#33383d;border-radius:10px;padding:6px 9px;
 align-items:center;gap:5px;z-index:99;font-size:12.5px;
 font-family:"Heiti SC","SimHei",sans-serif;box-shadow:0 5px 18px rgba(0,0,0,.28)}
#tb .gl{color:#aeb4bb;font-size:11.5px;margin:0 2px}
#tb .sw{display:inline-block;width:17px;height:17px;border-radius:5px;cursor:pointer;
 border:1px solid rgba(255,255,255,.35);background:var(--c)}
#tb .sw:hover{transform:scale(1.15)}
#tb .sw.ul{height:7px;border-radius:4px}
#tb .sp{width:1px;height:18px;background:#555b62;margin:0 3px}
#tb button{background:transparent;border:0;color:#fff;cursor:pointer;padding:4px 9px;
 border-radius:6px;font:inherit}
#tb button:hover{background:#555b62}
@media(max-width:820px){.ibody{grid-template-columns:1fr;gap:8px}
 .im{border-top:1px dashed var(--line);padding-top:6px}}
</style>

MathJax = {
  tex: {inlineMath: [['$','$']]},

};

  <h1>微积分题库</h1>

<script>
const BANK = {"problems": [{"id": "1-3.5(4)", "source": "习题1-3 第5题(4)", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "证明 $\\lim\\limits_{x\\to 0} e^{1/x}$ 不存在。", "type": "证明题", "topics": ["极限不存在的证明", "归结原则（海涅定理，定理1.12）", "定理1.13 极限不存在的充要条件（2）", "单侧极限与左右行为差异", "无穷大量与极限不存在的区别"], "difficulty": 3, "tags": ["经典反例", "无穷型", "左右极限不同", "第四章间断点预备"], "key_points": ["支点在 $1/x$：$x\\to 0^+$ 时 $1/x\\to+\\infty$，$x\\to 0^-$ 时 $1/x\\to-\\infty$，两侧趋势相反", "因此 $e^{1/x}$ 右趋 $+\\infty$、左趋 $0$，整体不可能有有限极限", "用定理1.13(2) 时，必须补一句「$\\infty$ 不是有限数，故该数列极限不存在」，否则该步是空的", "它只在右侧趋于 $\\infty$，左侧趋于 $0$，所以它不是无穷大量（无穷大量要求整个去心邻域内 $|f|$ 都任意大）"], "solutions": [{"name": "解法一：定理1.13(2)（最省字）", "steps": ["取 $x_n=\\dfrac1n$（$n=1,2,\\dots$），则 $x_n\\neq 0$ 且 $x_n\\to 0$。", "此时 $f(x_n)=e^{1/x_n}=e^{n}$。", "数列 $\\{e^{n}\\}$ 无界，故 $\\lim\\limits_{n\\to\\infty} e^{n}$ 不存在（不是有限数）。", "由定理1.13(2)，$\\lim\\limits_{x\\to 0} e^{1/x}$ 不存在。"]}, {"name": "解法二：两条路径相互矛盾（最直观）", "steps": ["取 $x_n=\\dfrac1n\\to 0$，则 $e^{1/x_n}=e^{n}\\to+\\infty$。", "取 $x_n'=-\\dfrac1n\\to 0$，则 $e^{1/x_n'}=e^{-n}\\to 0$。", "若极限存在为 $A$，则任何趋于 $0$ 的数列都须给出 $f\\to A$；", "由第二条路径得 $A=0$，由第一条路径得 $f\\to+\\infty\\neq 0$，矛盾。"]}, {"name": "解法三：用单侧极限判定", "steps": ["$\\lim\\limits_{x\\to 0^-} e^{1/x}=0$（因 $1/x\\to-\\infty$）。", "$\\lim\\limits_{x\\to 0^+} e^{1/x}=+\\infty$（不是有限数，右极限不存在）。", "极限存在 $\\iff$ 左右极限都存在且相等；此处左极限为 $0$、右极限不存在，故整体极限不存在。"]}], "pitfalls": ["只写「$e^{1/x}\\to\\infty$，所以极限不存在」——只看了右侧，必须两侧都看", "误判为「无穷大量」——它与无穷大量的定义不符（左侧并不任意大）", "把 $+\\infty$ 当成极限值与 $A$ 比较（$\\infty$ 不是数），应表述为「该路径下函数值无界，故不收敛到任何有限数」"], "related": ["定理1.12 归结原则（海涅定理）", "定理1.13 极限不存在的充要条件", "习题1-3 第5题 其余小题 (1)(2)(3)", "第四章：$x=0$ 是 $e^{1/x}$ 的无穷型（第二类）间断点"], "added": "2026-10-12"}, {"id": "10.14-E", "source": "10.14 练习 E", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "当 $x\\to 0$ 时，$\\alpha(x)=kx^2$，$\\beta(x)=\\sqrt{1+x\\arcsin x}-\\sqrt{\\cos x}$。若 $\\alpha(x)\\sim\\beta(x)$，求常数 $k$。", "type": "计算题（含待定常数）", "topics": ["等价无穷小", "根式差有理化", "待定常数求法", "$\\arcsin x\\sim x$", "$1-\\cos x\\sim\\dfrac{x^2}{2}$", "$(1+u)^a-1\\sim au$"], "difficulty": 4, "tags": ["综合题", "有理化+等价", "常考"], "key_points": ["$\\alpha\\sim\\beta$ 等价于 $\\lim\\limits_{x\\to 0}\\dfrac{\\beta}{\\alpha}=1$，据此列出关于 $k$ 的方程", "$\\beta$ 是两根号之差，先有理化把差化成商：分母 $\\sqrt{1+x\\arcsin x}+\\sqrt{\\cos x}\\to 2$", "分子 $x\\arcsin x+1-\\cos x$ 中：$x\\arcsin x\\sim x^2$（因 $\\arcsin x\\sim x$），$1-\\cos x\\sim\\dfrac{x^2}{2}$，相加得 $\\dfrac{3}{2}x^2$", "于是 $\\beta\\sim\\dfrac{3}{4}x^2$，与 $\\alpha=kx^2$ 比较得 $k=\\dfrac{3}{4}$"], "solutions": [{"name": "解法一：有理化 + 等价", "steps": ["由 $\\alpha\\sim\\beta$ 得 $\\lim\\limits_{x\\to 0}\\dfrac{\\beta(x)}{\\alpha(x)}=1$。", "有理化：$\\beta(x)=\\dfrac{(1+x\\arcsin x)-\\cos x}{\\sqrt{1+x\\arcsin x}+\\sqrt{\\cos x}}$。", "分母 $\\to 1+1=2$，故 $\\beta(x)\\sim\\dfrac{x\\arcsin x+1-\\cos x}{2}$。", "$\\arcsin x\\sim x\\Rightarrow x\\arcsin x\\sim x^2$；又 $1-\\cos x\\sim\\dfrac{x^2}{2}$，故分子 $\\sim\\dfrac{3}{2}x^2$。", "于是 $\\beta(x)\\sim\\dfrac{1}{2}\\cdot\\dfrac{3}{2}x^2=\\dfrac{3}{4}x^2$。", "由 $\\beta\\sim\\alpha=kx^2$ 得 $k=\\dfrac{3}{4}$。"]}, {"name": "解法二：直接对两个根号用 $(1+u)^a-1\\sim au$", "steps": ["$\\sqrt{1+x\\arcsin x}=1+\\dfrac{x\\arcsin x}{2}+o(x^2)$，而 $x\\arcsin x\\sim x^2$，故 $\\sqrt{1+x\\arcsin x}=1+\\dfrac{x^2}{2}+o(x^2)$。", "$\\cos x=1-(1-\\cos x)$，故 $\\sqrt{\\cos x}=\\sqrt{1-(1-\\cos x)}=1-\\dfrac{1-\\cos x}{2}+o(x^2)=1-\\dfrac{x^2}{4}+o(x^2)$。", "两者相减：$\\beta(x)=\\dfrac{3}{4}x^2+o(x^2)$，故 $k=\\dfrac{3}{4}$。"]}], "pitfalls": ["忘了有理化，直接把两个根号相减当成 $0$（两个根号都 $\\to 1$，相减必须展开）", "把 $\\arcsin x$ 换成 $x$ 后忘了外面还乘着一个 $x$（正确是 $x\\arcsin x\\sim x^2$，不是 $x$）", "只算到 $\\beta\\sim\\dfrac{3}{2}x^2$ 就把系数当成 $k$（漏了有理化时分母的 $2$）"], "related": ["习题1-3 第11题（有理化求常数）", "§3.5 无穷小量、无穷大量、阶的比较", "题库易错点 E-001"], "added": "2026-10-12"}, {"id": "10.14-D", "source": "10.14 练习 D", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to 0}\\dfrac{1-\\cos(1-\\cos 2x)}{x^4}$。", "type": "计算题", "topics": ["等价无穷小", "复合函数中的等价替换", "$1-\\cos pha$。", "同理 $\\dfrac{x^\\beta-a^\\beta}{x-a}\\to a^{\\beta-1}\\beta$。", "两式相除得 $\\dfrac{\\alpha a^{\\alpha-1}}{\\beta a^{\\beta-1}}=\\dfrac{\\alpha}{\\beta}a^{\\alpha-\\beta}$。"]}], "pitfalls": ["换元后分母漏掉 $a$：$x-a=at$，不是 $t$", "漏掉系数 $\\gamma$：$(1+t)^\\gamma-1\\sim\\gamma t$ 前面的 $\\gamma$ 正是答案里的 $\\alpha$、$\\beta$", "把 $a^{\\alpha-\\beta}$ 错写成 $a^{\\alpha/\\beta}$（它来自 $a^\\alpha/a^\\beta$）", "用洛必达法则或导数定义——本章还没学，只能用换元 + 等价量"], "related": ["题库题目 10.14-E（同类：含参数 + 等价量）", "题库易错点 E-001（等价替换只能在因式位置）", "题库易错点 E-002（不能拆开不存在的极限）", "§3.6 两个重要极限", "常用等价无穷小：$(1+u)^\\gamma-1\\sim\\gamma u$"], "added": "2026-10-12"}, {"id": "1-4.12(5)", "source": "习题1-4 第12题(5)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to+\\infty}\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}$。", "type": "计算题", "topics": ["$\\infty/\\infty$ 型极限", "对数运算性质 $\\ln(ab)=\\ln a+\\ln b$", "提取主项（把大数化成小数）", "等价量替换 $\\ln(1+u)\\sim u$（需 $u\\to 0$）", "夹逼定理"], "difficulty": 3, "tags": ["∞/∞型", "提主项", "对数运算", "与 1-4.12(2) 配对"], "key_points": ["先认清类型：$x\\to+\\infty$ 时分子分母都 $\\to+\\infty$，是 $\\infty/\\infty$ 型（不是 $0/0$）", "**不能**直接用 $\\ln(1+u)\\sim u$：它要求 $u\\to 0$，而本题 $u=3^x\\to+\\infty$，条件不成立", "关键一步是提主项：$\\ln(1+3^x)=\\ln\\left[3^x(1+3^{-x})\\right]=x\\ln 3+\\ln(1+3^{-x})$，把大数化成小数 $3^{-x}\\to 0$", "分子分母同除 $x$ 后，剩下的两项是「无穷小 ÷ 无穷大」，都 $\\to 0$，只剩 $\\dfrac{\\ln 3}{\\ln 2}$"], "solutions": [{"name": "解法一：提取主项（标准做法）", "steps": ["$\\ln(1+3^x)=\\ln\\left[3^x\\left(1+3^{-x}\\right)\\right]=x\\ln 3+\\ln\\left(1+3^{-x}\\right)$。", "同理 $\\ln(1+2^x)=x\\ln 2+\\ln\\left(1+2^{-x}\\right)$。", "代入并同除 $x$：$\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}=\\dfrac{\\ln 3+\\dfrac{\\ln(1+3^{-x})}{x}}{\\ln 2+\\dfrac{\\ln(1+2^{-x})}{x}}$。", "$x\\to+\\infty$ 时 $3^{-x}\\to 0$、$2^{-x}\\to 0$，由 $\\ln(1+u)\\sim u$ 知两个对数都是无穷小，再除以 $x\\to+\\infty$，故两个分式都 $\\to 0$。", "所以原式 $=\\dfrac{\\ln 3}{\\ln 2}=\\log_2 3$。"]}, {"name": "解法二：夹逼定理（不用等价量）", "steps": ["当 $x$ 充分大时，$3^x<1+3^x\\le 3^x+3^x=2\\cdot 3^x\\le 3^{x+1}$，取对数得 $x\\ln 3<\\ln(1+3^x)\\le(x+1)\\ln 3$。", "同理 $x\\ln 2<\\ln(1+2^x)\\le(x+1)\\ln 2$。", "两式相除：$\\dfrac{x\\ln 3}{(x+1)\\ln 2}<\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}\\le\\dfrac{(x+1)\\ln 3}{x\\ln 2}$。", "左右两端当 $x\\to+\\infty$ 时都趋于 $\\dfrac{\\ln 3}{\\ln 2}$，由夹逼定理得原式 $=\\dfrac{\\ln 3}{\\ln 2}$。"]}], "pitfalls": ["误用 $\\ln(1+u)\\sim u$：它要求 $u\\to 0$。本题 $3^x\\to+\\infty$，若硬替换成 $\\dfrac{3^x}{2^x}$ 会得到 $+\\infty$，答案完全错", "提主项时漏掉系数：$\\ln 3^x=x\\ln 3$，那个 $x$ 不能丢", "答案写成 $\\ln\\dfrac{3}{2}$ 或 $\\dfrac{3}{2}$——正确是 $\\dfrac{\\ln 3}{\\ln 2}=\\log_2 3$"], "related": ["题库题目 1-4.12(2)（同为含参数极限，那题是 $0/0$ 型，可作对照）", "题库易错点 E-001（等价替换只能在因式位置）", "§3.6 两个重要极限", "常用等价无穷小：$\\ln(1+u)\\sim u$（$u\\to 0$）"], "added": "2026-10-12"}, {"id": "1-4.12(8)", "source": "习题1-4 第12题(8)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to+\\infty}\\left[\\sin\\ln(x+1)-\\sin\\ln x\\right]$。", "type": "计算题", "topics": ["三角相减型 $\\infty-\\infty$", "和差化积", "有界量 × 无穷小量 = 无穷小量", "对数差化为 $\\ln(1+1/x)$", "夹逼定理"], "difficulty": 3, "tags": ["振荡", "有界×无穷小", "和差化积"], "key_points": ["**不能**对 $\\sin\\ln(x+1)$ 直接用 $\\sin u\\sim u$：这里 $u=\\ln(x+1)\\to+\\infty$，条件不成立", "先用和差化积，把「两个大角的正弦相减」拆成「有界 × 小角的正弦」", "关键观察：$\\ln(x+1)-\\ln x=\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$——两角之**差**趋于 $0$", "最后用「有界量 × 无穷小量 = 无穷小量」收尾"], "solutions": [{"name": "解法一：和差化积 + 有界×无穷小", "steps": ["和差化积：$\\sin\\ln(x+1)-\\sin\\ln x=2\\cos\\dfrac{\\ln(x+1)+\\ln x}{2}\\cdot\\sin\\dfrac{\\ln(x+1)-\\ln x}{2}$。", "算角差：$\\dfrac{\\ln(x+1)-\\ln x}{2}=\\dfrac{1}{2}\\ln\\dfrac{x+1}{x}=\\dfrac{1}{2}\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$。", "由 $\\sin u\\sim u$ 与 $\\ln(1+v)\\sim v$：$\\sin\\dfrac{1}{2}\\ln\\left(1+\\dfrac{1}{x}\\right)\\sim\\dfrac{1}{2x}\\to 0$。", "而 $\\left|2\\cos\\dfrac{\\ln(x+1)+\\ln x}{2}\\right|\\le 2$ 有界，由「有界量 × 无穷小量 = 无穷小量」得原式 $=0$。"]}, {"name": "解法二：用 $|\\sin A-\\sin B|\\le|A-B|$ 直接夹逼", "steps": ["由和差化积与 $|\\sin u|\\le|u|$ 推出 $|\\sin A-\\sin B|=2\\left|\\cos\\dfrac{A+B}{2}\\right|\\left|\\sin\\dfrac{A-B}{2}\\right|\\le|A-B|$。", "取 $A=\\ln(x+1)$，$B=\\ln x$：$\\left|\\sin\\ln(x+1)-\\sin\\ln x\\right|\\le\\ln\\dfrac{x+1}{x}=\\ln\\left(1+\\dfrac{1}{x}\\right)$。", "$x\\to+\\infty$ 时右端 $\\to 0$，由夹逼定理得原式 $=0$。"]}], "pitfalls": ["对 $\\sin\\ln(x+1)$ 直接用 $\\sin u\\sim u$（要求 $u\\to 0$，这里却趋于 $+\\infty$）", "把 $\\ln(x+1)-\\ln x$ 当成 $\\infty-\\infty$——它其实 $=\\ln(1+1/x)\\to 0$", "只算正弦部分，忘了前面那个 $\\cos$ 因子，没说明它「有界」"], "related": ["题库题目 1-4.12(5)", "题库知识点「10.14 函数极限·函数连续」八、未定式的处理流程", "§3.6 两个重要极限"], "added": "2026-10-12"}, {"id": "1-综.3(2)", "source": "第一章综合题 第3题(2)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（$1^\\infty$ 型）", "statement": "求 $\\lim\\limits_{x\\to0}\\left(\\dfrac{a_1^x+a_2^x+\\cdots+a_n^x}{n}\\right)^{\\frac{1}{x}}$（$a_1,a_2,\\cdots,a_n$ 均为正数）。", "type": "计算题（含参数，$1^\\infty$ 型）", "topics": ["$1^\\infty$ 型极限", "第二重要极限的推广式 $\\lim u^v=e^{\\lim v(u-1)}$", "取对数法", "$a^x-1\\sim x\\ln a$", "对数运算与几何平均数"], "difficulty": 4, "tags": ["1^∞型", "含参数", "取对数", "几何平均"], "key_points": ["先识别类型：底数 $\\to1$、指数 $\\to\\infty$，是 $1^\\infty$ 型", "两条路：① 直接用推广式 $\\lim u^v=e^{\\lim v(u-1)}$　② 取对数后算 $\\ln y$ 再还原", "核心一步：$v(u-1)=\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$", "每项用 $a_i^x-1\\sim x\\ln a_i$，于是 $\\dfrac{a_i^x-1}{x}\\to\\ln a_i$", "结果 $=\\sqrt[n]{a_1a_2\\cdots a_n}$（几何平均数），别停在 $\\dfrac{1}{n}\\sum\\ln a_i$ 上"], "solutions": [{"name": "解法一：用 $1^\\infty$ 型推广式", "steps": ["取 $u=\\dfrac{a_1^x+\\cdots+a_n^x}{n}$，$v=\\dfrac{1}{x}$，则 $u\\to1$、$v\\to\\infty$，由推广式 $\\lim u^v=e^{\\lim v(u-1)}$ 入手。", "计算 $v(u-1)=\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$。", "对每项用 $a_i^x-1\\sim x\\ln a_i$，得 $\\dfrac{a_i^x-1}{x}\\to\\ln a_i$。", "所以 $\\lim v(u-1)=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\ln a_i=\\ln\\sqrt[n]{a_1a_2\\cdots a_n}$。", "原式 $=e^{\\ln\\sqrt[n]{a_1\\cdots a_n}}=\\sqrt[n]{a_1a_2\\cdots a_n}$。"]}, {"name": "解法二：取对数（不背推广式也行）", "steps": ["设 $y=\\left(\\dfrac{a_1^x+\\cdots+a_n^x}{n}\\right)^{1/x}$，取对数得 $\\ln y=\\dfrac{1}{x}\\ln\\left(1+\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}\\right)$。", "$x\\to0$ 时括号内的量 $\\to0$，用 $\\ln(1+u)\\sim u$（$\\ln(1+u)$ 是乘积中的因式，替换合法）：$\\ln y\\sim\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$。", "再用 $a_i^x-1\\sim x\\ln a_i$，得 $\\ln y\\to\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\ln a_i=\\ln\\sqrt[n]{a_1a_2\\cdots a_n}$。", "由对数函数连续，$y\\to\\sqrt[n]{a_1a_2\\cdots a_n}$。"]}], "pitfalls": ["直接把和拆开求极限——整体是 $1^\\infty$ 型，要先化到 $v(u-1)$ 再处理（参见易错点 E-002）", "漏掉 $\\ln a_i$：$a_i^x-1\\sim x\\ln a_i$ 里的 $\\ln a_i$ 正是答案的来源", "算到 $\\dfrac{1}{n}\\sum\\ln a_i$ 就停手——要还原成 $\\ln\\sqrt[n]{a_1\\cdots a_n}$，再取指数", "用洛必达法则——本章超纲"], "related": ["题库知识点「10.14 函数极限·函数连续」八、未定式的处理流程", "§3.6 重要极限2的推广式（$1^\\infty$ 型）", "常用等价无穷小：$a^x-1\\sim x\\ln a$", "题库易错点 E-002（不能拆开极限不存在的项）"], "added": "2026-10-12"}, {"id": "错-1-3.8(8)", "source": "第一章作业 习题1-3 第8题(8)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to1}\\dfrac{x^{n+1}-(n+1)x+n}{(x-1)^2}$（$n$ 为正整数）。", "type": "计算题", "topics": ["二项式展开", "约分时提取最低次非零项系数", "$0/0$ 型（可约）"], "difficulty": 3, "tags": ["错题", "丢系数", "0/0型"], "my_answer": "1", "right_answer": "$\\dfrac{n(n+1)}{2}$", "error_analysis": "令 $t=x-1$ 后分子 $=(1+t)^{n+1}-(n+1)t-1=C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$，除以 $t^2$ 的常数项应是 $C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。我把展开写成 $t^{n-1}+\\cdots+1$，等于默认二次项系数为 1，**约分时把最低次非零项的系数丢了**。", "key_points": ["约分前必须先写出**最低次非零项及其系数**", "数值自检最快：取 $n=2$，$\\lim\\limits_{x\\to1}\\dfrac{x^3-3x+2}{(x-1)^2}=\\lim\\limits_{x\\to1}(x+2)=3$，与 $\\dfrac{2\\cdot3}{2}=3$ 相符", "$n=1$ 时答案才是 1——只验一个特例容易被骗过去"], "solutions": [{"name": "换元 + 二项式展开", "steps": ["令 $t=x-1$（$t\\to0$），则 $x=1+t$，分子 $=(1+t)^{n+1}-(n+1)t-1$。", "二项式展开：$(1+t)^{n+1}=1+(n+1)t+C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$", "代入得分子 $=C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$。", "除以 $t^2$ 后令 $t\\to0$：原式 $=C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。"]}], "pitfalls": ["把 $t^{n-1}+\\cdots+1$ 当成分子主部——这只保留了最高次项，最低次非零项的系数才是答案"], "related": ["同类型：作业 习题1-3 第8(2)题（展开后约 x² 得 10）", "题库易错点 E-007"], "added": "2026-10-16"}, {"id": "错-1-3.12(4)", "source": "第一章作业 习题1-3 第12题(4)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（$o$ 记号）", "statement": "证明 $o(x^n)\\cdot o(x^m)=o(x^{m+n})$（$x\\to0$）。", "type": "证明题", "topics": ["$o$ 记号的定义", "$o$ 的运算律（乘法）", "回到定义证明"], "difficulty": 3, "tags": ["错题", "证明不成立", "o记号"], "my_answer": "把两个极限改写成同一个分母，说「显然成立」", "right_answer": "设 $\\alpha=o(x^n),\\beta=o(x^m)$，则 $\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}\\to0$", "error_analysis": "我只用了恒等式 $x^mx^n=x^{m+n}$，把「证明极限为 0」偷换成「两个分母相等」——**全程没用到 $o$ 的定义**。而且开头写的 $\\lim\\dfrac{f}{x^m}=\\lim\\dfrac{f}{x^{m+n}}$ 一般不成立（两者都趋于 0 才偶然相等）。", "key_points": ["$o$ 的等式本质是「属于」，证明时**必须回到定义**：证某个比值的极限为 0", "乘法律的关键是**拆成两个已知的无穷小之积**：$\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}$", "「显然成立」在数学证明里等于没证，考试必扣分"], "solutions": [{"name": "回到定义", "steps": ["设 $\\alpha=o(x^n)$，$\\beta=o(x^m)$，按定义即 $\\lim\\limits_{x\\to0}\\dfrac{\\alpha}{x^n}=0$，$\\lim\\limits_{x\\to0}\\dfrac{\\beta}{x^m}=0$。", "$\n\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}$。", "由极限的乘法法则：$\\lim\\limits_{x\\to0}\\dfrac{\\alpha\\beta}{x^{m+n}}=0\\cdot0=0$。", "按定义即 $\\alpha\\beta=o(x^{m+n})$，也就是 $o(x^n)\\cdot o(x^m)=o(x^{m+n})$。"]}], "pitfalls": ["用恒等式或「显然」代替定义验证——本题要证的是「极限为 0」，这是必须算出来的"], "related": ["题库知识点「10.14 函数极限·函数连续」七、$o$ 记号", "题库易错点 E-006"], "added": "2026-10-16"}, {"id": "错-1-3.16(2)", "source": "第一章作业 习题1-3 第16题(2)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{\\sin(\\tan^2x)}{\\sqrt[n]{1+x^2}-1}$。", "type": "计算题", "topics": ["等价量替换", "$\\sin u\\sim u$", "$\\sqrt[n]{1+x^2}-1\\sim\\dfrac{x^2}{n}$"], "difficulty": 3, "tags": ["错题", "答数错", "等价量"], "my_answer": "1", "right_answer": "$n$", "error_analysis": "三重错误：① 无端把分式**取倒数**，还把 $x\\to0$ 改成 $x\\to\\infty$；② 最后 $\\sqrt[n]{\\frac{1}{x^{2n-2}}+\\frac{1}{x^{2n}}}\\to0$（$n>1$），却写成 1；③ 本题唯一该用的 $\\sqrt[n]{1+x^2}-1\\sim\\dfrac{x^2}{n}$ 反而没写出来。", "key_points": ["分母是 $\\sqrt[n]{1+x^2}-1$，用 $(1+u)^a-1\\sim au$（$a=\\frac1n$，$u=x^2$）：$\\sim\\dfrac{x^2}{n}$", "分子 $\\sin(\\tan^2x)\\sim\\tan^2x\\sim x^2$", "分子分母都是因式，比值 $=\\dfrac{x^2}{x^2/n}=n$", "**不要中途把分式取倒数、不要擅自改变极限过程**"], "solutions": [{"name": "等价量替换（因式位置）", "steps": ["$x\\to0$ 时 $\\tan^2x\\to0$，故 $\\sin(\\tan^2x)\\sim\\tan^2x\\sim x^2$。", "$\\sqrt[n]{1+x^2}-1=(1+x^2)^{1/n}-1\\sim\\dfrac{1}{n}x^2$。", "分子分母都是因式，可整体替换：原式 $=\\lim\\limits_{x\\to0}\\dfrac{x^2}{x^2/n}=n$。"]}], "pitfalls": ["忘记 $(1+u)^a-1\\sim au$ 里的系数 $a$（本题 $a=\\frac1n$，故答案是 $n$ 而不是 1）", "中途取倒数并改变极限过程"], "related": ["题库知识点「10.14」一、常用等价无穷小量", "题库易错点 E-003"], "added": "2026-10-16"}, {"id": "错-1-4.3(3)", "source": "第一章作业 习题1-4 第3题(3)", "chapter": "第一章 函数与极限", "section": "§4.1 函数连续的概念", "statement": "指出 $f(x)=e^{1/x}$ 的间断点，并判断其类型。", "type": "讨论题", "topics": ["间断点的分类", "第一类（可去、跳跃）与第二类（无穷、振荡）", "单侧极限的求法"], "difficulty": 3, "tags": ["错题", "间断点分类", "经典反例"], "my_answer": "跳跃间断点", "right_answer": "$x=0$ 是**第二类无穷间断点**", "error_analysis": "跳跃间断点要求**两个单侧极限都存在**（且不相等）。而这里 $\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$——右极限根本不存在，所以不是第一类。我只写了类型结论、没写单侧极限，错误因此没被自己发现。", "key_points": ["判类型**必须先把两个单侧极限求出来**，再对照定义分类", "$x\\to0^+$ 时 $1/x\\to+\\infty$，$e^{1/x}\\to+\\infty$；$x\\to0^-$ 时 $1/x\\to-\\infty$，$e^{1/x}\\to0$", "分类口诀：两侧都有限但不等 → 跳跃；一侧为 $\\infty$ → 无穷（第二类）；一列点振荡无极限 → 振荡（第二类）；两侧相等但 $\\ne f(x_0)$ → 可去"], "solutions": [{"name": "标准流程", "steps": ["$f$ 在 $x=0$ 无定义，故 $x=0$ 是间断点。", "算右极限：$\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$（因 $1/x\\to+\\infty$）。", "算左极限：$\\lim\\limits_{x\\to0^-}e^{1/x}=0$（因 $1/x\\to-\\infty$）。", "右极限不是有限数（极限不存在），故 $x=0$ 是**第二类无穷间断点**。"]}], "pitfalls": ["只写结论不写单侧极限", "把「一侧为 $\\infty$」误判为跳跃——跳跃要求两侧极限都是有限数"], "related": ["题库题目 1-3.5(4)（同一函数的极限不存在）", "题库易错点 E-004"], "added": "2026-10-16"}, {"id": "错-1-综.3(1)", "source": "第一章作业 第一章综合题 第3题(1)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{3\\sin x+x^2\\cos\\frac1x}{(1+\\cos x)\\ln(1+x)}$。", "type": "计算题", "topics": ["等价量替换", "有界量 × 无穷小量 = 无穷小量", "$o$ 记号", "展开的适用条件"], "difficulty": 4, "tags": ["错题", "答数错", "超范围使用展开"], "my_answer": "$-\\infty$", "right_answer": "$\\dfrac{3}{2}$", "error_analysis": "我把 $2x\\cos\\frac1x$ 换成了 $2x-\\frac1x$，即对 $\\cos t$ 用了 $\\cos t\\approx1-\\frac{t^2}{2}$。但这里 **$t=\\frac1x\\to\\infty$**，二次展开**只在 $t\\to0$ 时成立**。随后又把分母 $x(4-x^2)$ 拆错，双重错误。", "key_points": ["$x^2\\cos\\frac1x$ 是「有界量 $\\cos\\frac1x$」乘「无穷小 $x^2$」，故是 $o(x)$，记作 $o(x)$ 保留即可", "分子 $=3\\sin x+o(x)=3x+o(x)$；分母 $(1+\\cos x)\\ln(1+x)\\sim2\\cdot x=2x+o(x)$", "结果 $=\\dfrac{3x+o(x)}{2x+o(x)}=\\dfrac{3+o(1)}{2+o(1)}\\to\\dfrac32$", "**用任何展开前，先看括号里那个量是否趋于展开点**"], "solutions": [{"name": "有界 × 无穷小 + 等价量", "steps": ["$\\left|x^2\\cos\\frac1x\\right|\\le x^2\\to0$，故 $x^2\\cos\\frac1x=o(x)$。", "$3\\sin x\\sim3x$，故分子 $=3x+o(x)$。", "$1+\\cos x\\to2$，$\\ln(1+x)\\sim x$，故分母 $\\sim2x$。", "原式 $=\\lim\\limits_{x\\to0}\\dfrac{3x+o(x)}{2x}=\\dfrac32$。"]}], "pitfalls": ["对 $\\cos\\frac1x$ 套用 $\\cos t\\approx1-\\frac{t^2}{2}$——$t=\\frac1x\\to\\infty$，展开不成立", "把分母拆成 $x(4-x^2)$ 后分数裂项算错"], "related": ["题库易错点 E-003（等价量/展开只在自变量趋于展开点时成立）", "题库知识点「10.14」八、总纲"], "added": "2026-10-16"}, {"id": "错-1-3.2", "source": "第一章作业 习题1-3 第2题", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "设 $D(x)=1$（$x$ 为有理数），$D(x)=0$（$x$ 为无理数），证明 $D(x)$ 在每一点极限都不存在。", "type": "证明题", "topics": ["归结原则（海涅定理）", "有理数与无理数的稠密性", "极限不存在的证明"], "difficulty": 3, "tags": ["错题", "构造漏洞", "狄利克雷函数"], "my_answer": "取 $x_n'=x_0+\\dfrac1n$、$x_n''=x_0+\\dfrac1{\\sqrt n}$，断言前者有理、后者无理", "right_answer": "用稠密性：在 $(x_0,x_0+\\frac1n)$ 内分别取有理数 $r_n$ 与无理数 $s_n$", "error_analysis": "两处构造都站不住：① $x_0$ **无理**时 $x_0+\\frac1n$ 也无理，$D(x_n')\\to1$ 就不成立；② $n$ 为完全平方数时 $\\frac1{\\sqrt n}$ 是**有理数**，$x_n''$ 未必无理。所以数列根本不具备所需性质，只在个别情形下碰巧成立。", "key_points": ["归结原则要求：$\\{x_n\\}\\subset\\mathring U(x_0)$、$x_n\\to x_0$，且**函数值确实趋于两个不同的常数**", "构造之前先想清楚：这个数列真的能保证落在「有理数」/「无理数」集合里吗？", "最稳的做法是**直接用稠密性**：任何区间内既有无理数又有有理数，取一串即可，不必猜显式公式", "$x_0$ 是任意的，所以构造必须对一切 $x_0\\in\\mathbb R$ 都有效"], "solutions": [{"name": "用稠密性构造", "steps": ["任取 $x_0\\in\\mathbb R$。对每个 $n$，由有理数稠密性，在 $(x_0,x_0+\\frac1n)$ 内取有理数 $r_n$（自然 $r_n\\ne x_0$）。", "同样由无理数稠密性，在同一区间内取无理数 $s_n$。", "于是 $r_n\\to x_0$、$s_n\\to x_0$，而 $D(r_n)=1\\to1$、$D(s_n)=0\\to0$。", "由归结原则，$\\lim\\limits_{x\\to x_0}D(x)$ 不可能存在（否则两条路径必给同一极限）。由 $x_0$ 任意，$D$ 处处无极限。"]}], "pitfalls": ["凭直觉写 $x_0+\\frac1n$、$x_0+\\frac1{\\sqrt n}$ 并断言其有理/无理——性质依赖于 $x_0$ 与 $n$，一般不对"], "related": ["题库易错点 E-005（构造数列必须验证其性质）", "§3.3 归结原则"], "added": "2026-10-16"}, {"id": "错-1-3.6", "source": "第一章作业 习题1-3 第6题", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "利用 $\\lim\\limits_{n\\to\\infty}\\dfrac{n^k}{a^n}=0$（$a>1$ 为常数，$k$ 为常数），证明 $\\lim\\limits_{x\\to+\\infty}\\dfrac{x^k}{a^x}=0$（提示：用夹逼定理）。", "type": "证明题", "topics": ["夹逼定理", "取整夹逼（数列极限推函数极限）", "单调性"], "difficulty": 3, "tags": ["错题", "引用未证结论", "夹逼"], "my_answer": "证 $x^k/a^x$ 单调递减，然后直接说极限为 0", "right_answer": "用取整做双边夹逼", "error_analysis": "两个问题：① 引用了 $\\dfrac{x_1-x_2}{\\ln x_1-\\ln x_2}>\\sqrt{x_1x_2}$（对数平均 > 几何平均）——本章**没讲、我也没证**；② 更根本的是，**单调递减只能说明极限存在，不能说明极限等于 0**（还要证明下确界为 0）。此外 $k\\le0$ 的情形没讨论，$[x]$ 也没说明是取整。", "key_points": ["本题的提示是**夹逼定理**，思路应是把函数夹在两个数列之间", "取 $n=\\lfloor x\\rfloor$，则 $n\\le x<n+1$，于是 $\\dfrac{n^k}{a^{n+1}}\\le\\dfrac{x^k}{a^x}\\le\\dfrac{(n+1)^k}{a^n}$", "两端都化归为已知的数列极限：$\\dfrac{n^k}{a^{n+1}}=\\dfrac1a\\cdot\\dfrac{n^k}{a^n}\\to0$，$\\dfrac{(n+1)^k}{a^n}=a\\cdot\\dfrac{(n+1)^k}{a^{n+1}}\\to0$", "「单调有界」只能保证极限存在，要定出极限值必须另有工具"], "solutions": [{"name": "取整 + 双边夹逼（按提示）", "steps": ["对 $x>1$ 记 $n=\\lfloor x\\rfloor$（$x$ 的整数部分），则 $n\\le x<n+1$，且 $x\\to+\\infty$ 时 $n\\to\\infty$。", "因 $a>1$，$a^n\\le a^x$，故 $\\dfrac{x^k}{a^x}\\ge\\dfrac{n^k}{a^{n+1}}=\\dfrac1a\\cdot\\dfrac{n^k}{a^n}$（$k>0$ 时；$k\\le0$ 时同理可得）。", "又 $a^x>a^{n}$ 且 $x<n+1$，故 $\\dfrac{x^k}{a^x}\\le\\dfrac{(n+1)^k}{a^{n}}=a\\cdot\\dfrac{(n+1)^k}{a^{n+1}}$。", "由已知的数列极限，两端都 $\\to0$（$\\dfrac1a\\cdot0=0$，$a\\cdot0=0$）。", "由夹逼定理，$\\lim\\limits_{x\\to+\\infty}\\dfrac{x^k}{a^x}=0$。"]}], "pitfalls": ["引用未在书上证明的不等式（对数平均不等式）", "把「单调有界 ⇒ 极限存在」误当成「极限 = 0」"], "related": ["题库易错点 E-006（不能引用未证的结论）", "§3.6 夹逼定理"], "added": "2026-10-16"}, {"id": "错-1-4.9(3)", "source": "第一章作业 习题1-4 第9题(3)", "chapter": "第一章 函数与极限", "section": "§4.3 闭区间上连续函数的性质", "statement": "证明方程 $x-\\varepsilon\\sin x=1$（$0<\\varepsilon<1$）有且仅有一个实根。", "type": "证明题", "topics": ["零点定理（根的存在定理）", "介值定理", "根的唯一性", "和差化积"], "difficulty": 4, "tags": ["错题", "超纲用导数", "推理无效"], "my_answer": "用 $f'(x)=1-\\varepsilon\\cos x>0$ 证单调；存在性写「$\\because1\\in(-\\infty,+\\infty)\\therefore$至少一根」", "right_answer": "存在性用零点定理；唯一性用和差化积导出的 $|\\sin x_1-\\sin x_2|\\le|x_1-x_2|$", "error_analysis": "① 导数属于**第二章**内容，本章超纲；② 「$1\\in(-\\infty,+\\infty)$ 故作差以后必有零点」是**无效推理**——存在性必须由「找到两点使函数值异号」+ 零点定理给出。", "key_points": ["存在性：令 $f(x)=x-\\varepsilon\\sin x-1$。取 $x=0$ 得 $f(0)=-1<0$；取 $x=2$ 得 $f(2)=1-\\varepsilon\\sin2>1-1=0$。由零点定理，$(0,2)$ 内至少一根", "唯一性：反设有两根 $x_1<x_2$。由 $f(x_1)=f(x_2)=0$ 得 $x_1-x_2=\\varepsilon(\\sin x_1-\\sin x_2)$", "两边取绝对值并用和差化积：$|\\sin x_1-\\sin x_2|=2\\left|\\cos\\frac{x_1+x_2}{2}\\right|\\left|\\sin\\frac{x_1-x_2}{2}\\right|\\le|x_1-x_2|$", "于是 $|x_1-x_2|=\\varepsilon|\\sin x_1-\\sin x_2|\\le\\varepsilon|x_1-x_2|<|x_1-x_2|$（因 $0<\\varepsilon<1$），矛盾", "所以至多一根；结合存在性，恰有一根"], "solutions": [{"name": "零点定理 + 和差化积（第一章允许）", "steps": ["令 $f(x)=x-\\varepsilon\\sin x-1$，$f$ 在 $\\mathbb R$ 上连续。", "$f(0)=-1<0$；$f(2)=1-\\varepsilon\\sin2\\ge1-\\varepsilon>0$（因 $|\\sin2|<1$）。", "由零点定理，存在 $\\xi\\in(0,2)$ 使 $f(\\xi)=0$，即至少有一根。", "设另有一根 $\\eta\\ne\\xi$，由 $f(\\xi)=f(\\eta)=0$ 相减得 $\\xi-\\eta=\\varepsilon(\\sin\\xi-\\sin\\eta)$。", "取绝对值并用 $|\\sin\\xi-\\sin\\eta|\\le|\\xi-\\eta|$（和差化积 + $|\\sin u|\\le|u|$），得 $|\\xi-\\eta|\\le\\varepsilon|\\xi-\\eta|<|\\xi-\\eta|$，矛盾。", "故根唯一。"]}], "pitfalls": ["用导数判断单调——第二章才学", "把「区间是 $(-\\infty,+\\infty)$」当成存在性的理由"], "related": ["题库易错点 E-006", "§4.3 零点定理", "§3.6 和差化积"], "added": "2026-10-16"}, {"id": "错-1-4.12(1)", "source": "第一章作业 习题1-4 第12题(1)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{(1+\\alpha x)^a-(1+\\beta x)^b}{x}$。", "type": "计算题（含参数）", "topics": ["等价量替换", "$(1+u)^\\lambda-1\\sim\\lambda u$", "$0/0$ 型"], "difficulty": 3, "tags": ["错题", "超纲用广义二项式"], "my_answer": "按 $C_a^1,C_a^2,\\cdots$ 展开成幂级数后取常数项，得 $a\\alpha-b\\beta$（答案对）", "right_answer": "$a\\alpha-b\\beta$，但应用 $(1+u)^\\lambda-1=\\lambda u+o(u)$", "error_analysis": "答案正确，但**对非整数指数使用广义二项式 $C_a^k$ 属于超纲**（本章没有二项式级数），而且写成 $\\cdots$ 没有控制余项，证明不完整。", "key_points": ["第一章的合法工具：$(1+u)^\\lambda-1\\sim\\lambda u$（$u\\to0$，$\\lambda$ 任意实数）", "把分子拆成两个等价量之和：$(1+\\alpha x)^a-1\\sim a\\alpha x$，$(1+\\beta x)^b-1\\sim b\\beta x$", "注意这是**相减**结构，不能分别替换后相减了事，应先合并成**因式**或用 $o$ 记号：分子 $=a\\alpha x-b\\beta x+o(x)$", "最后除以 $x$ 得 $a\\alpha-b\\beta$"], "solutions": [{"name": "用 $(1+u)^\\lambda-1=\\lambda u+o(u)$", "steps": ["$(1+\\alpha x)^a=1+a\\alpha x+o(x)$（因为 $\\alpha x\\to0$，用 $(1+u)^\\lambda-1=\\lambda u+o(u)$）。", "同理 $(1+\\beta x)^b=1+b\\beta x+o(x)$。", "相减：分子 $=a\\alpha x-b\\beta x+o(x)=(a\\alpha-b\\beta)x+o(x)$。", "除以 $x$：原式 $=a\\alpha-b\\beta+o(1)\\to a\\alpha-b\\beta$。"]}], "pitfalls": ["对非整数指数用广义二项式展开（超纲）", "用 $\\cdots$ 代替余项控制", "在相减结构里分别替换却不注明 $o(x)$"], "related": ["题库题目 1-4.12(2)（同类：含参数）", "题库易错点 E-003"], "added": "2026-10-16"}, {"id": "错-1-综.17", "source": "第一章作业 第一章综合题 第17题", "chapter": "第一章 函数与极限", "section": "§4.1 函数连续的概念", "statement": "设 $f(x)=\\dfrac{\\sqrt{1+\\sin x+\\sin^2x}-(\\alpha+\\beta\\sin x)}{\\sin^2x}$ 在 $x=0$ 处为可去间断点，求 $\\alpha,\\beta$。", "type": "计算题（含待定常数）", "topics": ["可去间断点的充要条件", "两个单侧极限相等", "有理化", "等价量替换", "充分性验证"], "difficulty": 4, "tags": ["错题", "只求必要条件", "待定常数"], "my_answer": "$\\alpha=1,\\ \\beta=\\dfrac12$（答案正确，但推导缺一步、也没回代验证）", "right_answer": "$\\alpha=1,\\ \\beta=\\dfrac12$", "error_analysis": "① 由「两个单侧极限相等」到 $2\\beta=1$ 中间少了关键一步：应先**两式相减保留 $t$**，得 $t\\left[\\sqrt{t^2+t+1}-\\sqrt{t^2-t+1}-2\\beta\\right]\\to0$，再由括号内 $\\to1-2\\beta$ 才得 $2\\beta=1$——我直接把 $t$ 约掉了，逻辑上有跳跃；② **只求了必要条件，没有回代验证充分性**。", "key_points": ["可去间断点的条件：两个单侧极限都存在、相等且为有限数（与 $f(0)$ 无关，$f$ 在该点本无定义）", "令 $t=\\sin x$（$x\\to0^\\pm$ 时 $t\\to0^\\pm$），分母 $t^2$，用 $\\sqrt{1+t+t^2}-(\\alpha+\\beta t)$", "为使极限有限，需 $\\alpha=1$（否则分子 $\\to1-\\alpha\\ne0$，商发散）", "代入 $\\alpha=1$ 后，分子的线性项系数必须为零，才得 $\\beta=\\dfrac12$", "**求参数题的最后一步永远是回代验证**：$\\alpha=1,\\beta=\\frac12$ 时两侧极限都是 $\\dfrac38$，有限且相等，确实是可去间断点"], "solutions": [{"name": "必要条件 + 回代验证", "steps": ["记 $t=\\sin x$，$x\\to0$ 时 $t\\to0$。原式 $=\\dfrac{\\sqrt{1+t+t^2}-\\alpha-\\beta t}{t^2}$。", "若 $\\alpha\\ne1$，分子 $\\to1-\\alpha\\ne0$ 而分母 $\\to0$，商必发散，不是可去间断点。故必须 $\\alpha=1$。", "此时用 $\\sqrt{1+u}=1+\\dfrac u2-\\dfrac{u^2}{8}+o(u^2)$（$u=t+t^2$）：分子 $=1+\\dfrac{t+t^2}{2}-\\dfrac{t^2}{8}-1-\\beta t+o(t^2)=\\left(\\dfrac12-\\beta\\right)t+\\dfrac38t^2+o(t^2)$。", "要使 $\\dfrac{\\text{分子}}{t^2}$ 有有限极限，一次项系数必须为 0：$\\dfrac12-\\beta=0$，即 $\\beta=\\dfrac12$。", "回代验证：$\\alpha=1,\\beta=\\dfrac12$ 时，原式 $=\\dfrac38+o(1)\\to\\dfrac38$，两个单侧极限都是 $\\dfrac38$（有限且相等），确为可去间断点。"]}], "pitfalls": ["只求必要条件就交卷——必须回代验证", "由「两侧极限相等」到方程组时跳过中间的极限论证"], "related": ["题库易错点 E-008（求参数必须回代验证）", "题库题目 1-4.12(2)"], "added": "2026-10-16"}, {"id": "经典-01", "source": "第一章经典难题（递推数列）", "chapter": "第一章 函数与极限", "section": "§2.3 数列极限存在的准则", "statement": "设 $x_1=1$，$x_{n+1}=x_n+\\dfrac{1}{x_n}$（$n=1,2,\\cdots$）。(1) 证明 $\\lim\\limits_{n\\to\\infty}x_n=+\\infty$；(2) 求 $\\lim\\limits_{n\\to\\infty}\\dfrac{x_n}{\\sqrt{2n}}$。", "type": "证明题 + 计算题", "topics": ["单调有界准则", "反证法排除有界", "平方后构造可累加的递推式", "夹逼定理", "初等裂项 $\\frac1k\\le 2(\\sqrt k-\\sqrt{k-1})$"], "difficulty": 5, "tags": ["经典难题", "递推数列", "四工具串联", "题眼：先平方"], "key_points": ["第(1)问的坑：**单调递增 ≠ 发散**（$1-\\frac1n$ 就递增但有界），必须反设**有界**、用单调有界准则导出 $L=L+\\frac1L$ 的矛盾", "第(2)问的题眼：递推式里 $x_{n+1}$ 与 $x_n$ 不是线性关系，**直接累加不了**；先**平方**才出现可累加的常数项 $+2$", "夹逼 $\\sum\\frac{1}{x_k^2}$ 时用初等裂项 $\\frac1k\\le 2(\\sqrt k-\\sqrt{k-1})$，避免引用对数不等式（防超纲）", "最后开方要说明 $x_n>0$ 且 $\\sqrt{\\ }$ 连续（极限符号可与它交换）"], "solutions": [{"name": "(1) 单调 + 反证有界", "steps": ["由 $x_1=1>0$ 与递推式归纳得 $x_n>0$，故 $x_{n+1}-x_n=\\dfrac{1}{x_n}>0$，$\\{x_n\\}$ 严格递增。", "反设 $\\{x_n\\}$ 有界。由单调有界准则存在有限极限 $L$。", "在 $x_{n+1}=x_n+\\dfrac1{x_n}$ 两端令 $n\\to\\infty$（两端极限均存在，可用四则运算）得 $L=L+\\dfrac1L$，即 $\\dfrac1L=0$，与 $L\\ge1>0$ 矛盾。", "故 $\\{x_n\\}$ 无界；又单调递增，所以 $x_n\\to+\\infty$。"]}, {"name": "(2) 平方累加 + 夹逼", "steps": ["平方：$x_{n+1}^2=x_n^2+2+\\dfrac{1}{x_n^2}$。", "累加（$k=1$ 到 $n-1$）得 $x_n^2=x_1^2+2(n-1)+\\sum\\limits_{k=1}^{n-1}\\dfrac{1}{x_k^2}=2n-1+\\sum\\limits_{k=1}^{n-1}\\dfrac{1}{x_k^2}$。", "下界：$\\dfrac{x_n^2}{2n}>\\dfrac{2n-1}{2n}=1-\\dfrac{1}{2n}$。", "上界：由 $x_k^2>2k-1\\ge k$ 得 $\\dfrac{1}{x_k^2}\\le\\dfrac1k$；又 $\\dfrac1k\\le2(\\sqrt k-\\sqrt{k-1})$，裂项相消得 $\\sum\\limits_{k=1}^{n-1}\\dfrac1k\\le2\\sqrt{n-1}$。", "故 $1-\\dfrac{1}{2n}<\\dfrac{x_n^2}{2n}\\le1-\\dfrac{1}{2n}+\\dfrac{\\sqrt{n-1}}{n}$，两端都 $\\to1$，由夹逼定理 $\\dfrac{x_n^2}{2n}\\to1$。", "由 $x_n>0$ 及 $\\sqrt{\\ }$ 连续，开方得 $\\dfrac{x_n}{\\sqrt{2n}}\\to1$。"]}], "pitfalls": ["第(1)问直接说「单调递增所以趋于 $+\\infty$」——递增不一定发散，必须反证排除有界", "第(2)问对 $x_{n+1}=x_n+\\frac1{x_n}$ 直接累加——它不是线性关系，累加不出简单式子", "用 $\\sum\\frac1k\\le1+\\ln n$ 估计——需要对数不等式，本章未必已证（易错点 E-006），本题的裂项法纯初等更稳", "开方时不说明 $x_n>0$ 与 $\\sqrt{\\ }$ 连续"], "related": ["题库易错点 E-006（不能引用未证结论）", "题库知识点「10.14」九、题型三（取整夹逼）", "小测 Q9"], "added": "2026-10-16"}, {"id": "经典-02", "source": "第一章经典难题（夹逼求最大）", "chapter": "第一章 函数与极限", "section": "§2.3 数列极限存在的准则", "statement": "设 $a_1,a_2,\\cdots,a_m$ 均为正数，求 $\\lim\\limits_{n\\to\\infty}\\left(\\dfrac{a_1^n+a_2^n+\\cdots+a_m^n}{m}\\right)^{\\frac1n}$。", "type": "计算题", "topics": ["夹逼定理", "最大项主导", "$m^{1/n}\\to1$"], "difficulty": 5, "tags": ["经典难题", "题眼：只留最大项", "三行解决"], "key_points": ["题眼：**别管那些较小的项，最大的那一项主导一切**，只用 $M=\\max\\{a_i\\}$ 就能同时卡住上下界", "上界：$a_i\\le M\\Rightarrow\\sum a_i^n\\le mM^n\\Rightarrow$ 原式 $\\le M$", "下界：$\\sum a_i^n\\ge M^n\\Rightarrow$ 原式 $\\ge\\dfrac{M}{m^{1/n}}$", "$m$ 固定，$m^{1/n}=e^{\\frac{\\ln m}{n}}\\to e^0=1$（用 $e^x$ 连续），故左端 $\\to M$"], "solutions": [{"name": "双侧夹逼", "steps": ["记 $M=\\max\\{a_1,\\cdots,a_m\\}$。", "上界：每个 $a_i\\le M$，故 $a_1^n+\\cdots+a_m^n\\le mM^n$，于是 $\\left(\\dfrac{\\sum a_i^n}{m}\\right)^{1/n}\\le M$。", "下界：$\\sum a_i^n\\ge M^n$，故 $\\left(\\dfrac{\\sum a_i^n}{m}\\right)^{1/n}\\ge\\left(\\dfrac{M^n}{m}\\right)^{1/n}=\\dfrac{M}{m^{1/n}}$。", "合起来 $\\dfrac{M}{m^{1/n}}\\le\\left(\\dfrac{\\sum a_i^n}{m}\\right)^{1/n}\\le M$。", "由 $m^{1/n}\\to1$ 得左端 $\\to M$，由夹逼定理极限为 $M$。"]}], "pitfalls": ["以为 $(a_1^n+\\cdots+a_m^n)^{1/n}=a_1+\\cdots+a_m$——幂不能这样分配", "误当 $1^\\infty$ 型套推广式——这里底数趋于 $\\frac{M^n+\\cdots}{m}$（发散），不是趋于 1", "忘记交代 $m^{1/n}\\to1$ 的理由"], "related": ["题库题目 1-综.3(2)（$x\\to0$ 取几何平均，可作对照）", "§2.3 夹逼定理", "小测 Q10"], "added": "2026-10-16"}, {"id": "经典-03", "source": "第一章经典难题（$\\sqrt[n]{n}\\to1$）", "chapter": "第一章 函数与极限", "section": "§2.3 数列极限存在的准则", "statement": "求 $\\lim\\limits_{n\\to\\infty}\\sqrt[n]{n}$。", "type": "计算题", "topics": ["二项式定理放缩", "夹逼定理", "均值不等式"], "difficulty": 4, "tags": ["经典难题", "题眼：二项式留二次项"], "key_points": ["题眼：把 $\\sqrt[n]{n}$ 写成 $1+t_n$（$t_n\\ge0$），则 $n=(1+t_n)^n$；**二项式展开只留能压住 $t_n$ 的那一项**", "留 $C_n^1t_n$ 只能得 $t_n\\le1$（不够）；**留 $C_n^2t_n^2$** 得 $n\\ge\\dfrac{n(n-1)}{2}t_n^2$，即 $t_n^2\\le\\dfrac{2}{n-1}$", "于是 $0\\le t_n\\le\\sqrt{\\dfrac{2}{n-1}}\\to0$，由夹逼定理 $t_n\\to0$"], "solutions": [{"name": "二项式放缩 + 夹逼", "steps": ["$n\\ge1$ 时 $\\sqrt[n]{n}\\ge1$，记 $t_n=\\sqrt[n]{n}-1\\ge0$，则 $n=(1+t_n)^n$。", "由二项式定理（$n\\ge2$）：$n=(1+t_n)^n=\\sum\\limits_{k=0}^{n}C_n^kt_n^k\\ge C_n^2t_n^2=\\dfrac{n(n-1)}{2}t_n^2$。", "两边除以 $\\dfrac{n(n-1)}{2}$ 得 $t_n^2\\le\\dfrac{2}{n-1}$。", "所以 $0\\le t_n\\le\\sqrt{\\dfrac{2}{n-1}}\\to0$，由夹逼定理 $t_n\\to0$。", "故 $\\sqrt[n]{n}=1+t_n\\to1$。"]}], "pitfalls": ["用 $\\sqrt[n]{n}=e^{\\frac{\\ln n}{n}}$ 后直接说 $\\frac{\\ln n}{n}\\to0$——**这本身就是要证的结论**，属循环论证（除非书上已有 $\\lim\\frac{n^k}{a^n}=0$ 类结论）", "二项式只留 $t_n$ 那一项，得到 $t_n\\le1$，证不出趋于 0", "忘记说明 $t_n\\ge0$"], "related": ["题库题目 经典-01（同样用放缩 + 夹逼）", "题库易错点 E-006", "小测 Q11"], "added": "2026-10-16"}, {"id": "经典-04", "source": "第一章经典难题（Wallis 型）", "chapter": "第一章 函数与极限", "section": "§2.3 数列极限存在的准则", "statement": "求 $\\lim\\limits_{n\\to\\infty}\\dfrac{1\\cdot3\\cdot5\\cdots(2n-1)}{2\\cdot4\\cdot6\\cdots(2n)}$。", "type": "计算题", "topics": ["平方构造", "夹逼定理", "项数配平"], "difficulty": 4, "tags": ["经典难题", "题眼：先平方", "Wallis"], "key_points": ["题眼：直接放缩只能得「$\\le1$」，证不出 0；必须**平方**，让每个因子变成 $\\dfrac{4k^2-1}{4k^2}<1$ 的形式", "平方时**分子每个 $(2k-1)^2$ 要换成 $(2k-1)(2k+1)$**，多出来的因子最后用 $\\dfrac{1}{2n+1}$ 配平项数", "结果：$0<P_n^2<\\dfrac{1}{2n+1}$，开方得 $0<P_n<\\dfrac{1}{\\sqrt{2n+1}}\\to0$"], "solutions": [{"name": "平方 + 因子配对 + 夹逼", "steps": ["记 $P_n=\\dfrac{1\\cdot3\\cdots(2n-1)}{2\\cdot4\\cdots(2n)}>0$。", "平方并配平项数：$P_n^2=\\dfrac{1\\cdot3}{2^2}\\cdot\\dfrac{3\\cdot5}{4^2}\\cdots\\dfrac{(2n-1)(2n+1)}{(2n)^2}\\cdot\\dfrac{1}{2n+1}$。", "每个因子 $\\dfrac{(2k-1)(2k+1)}{(2k)^2}=\\dfrac{4k^2-1}{4k^2}<1$，故 $0<P_n^2<\\dfrac{1}{2n+1}$。", "开方得 $0<P_n<\\dfrac{1}{\\sqrt{2n+1}}$，右端 $\\to0$，由夹逼定理 $P_n\\to0$。"]}], "pitfalls": ["只写 $P_n<\\dfrac{2n-1}{2n}\\to1$——这只说明 $P_n\\le1$，**证不出极限为 0**", "平方后忘记配平项数（分子多出一个 $(2n+1)$，必须乘回 $\\dfrac{1}{2n+1}$）", "忘记说明 $P_n>0$ 才能开方取正"], "related": ["题库题目 经典-03（同为放缩 + 夹逼）", "§2.3 夹逼定理", "小测 Q12"], "added": "2026-10-16"}], "pitfalls": [{"id": "E-001", "title": "等价量替换只能在全部为因式时使用", "rule": "用等价无穷小替换时，被替换的部分必须整体作为乘除中的因式；若它处在加减项里（或与别的项相加减），不能单独替换。", "why": "等价无穷小只保证 $\\lim\\dfrac{\\alpha}{\\beta}=1$，即 $\\alpha$ 与 $\\beta$ 的「主体部分」相同，两者相差一个高阶无穷小。做减法时主体可能正好互相抵消，剩下的高阶零头反而成为决定极限的「主角」；此时把 $\\alpha$ 换成 $\\beta$，等于把真正起作用的那一项扔掉了。", "valid": "$\\lim\\limits_{x\\to 0}\\dfrac{\\sin x}{x}$：$\\sin x$ 是分子整体的因式，可直接替换为 $x$，得 $\\lim\\dfrac{x}{x}=1$ ✓", "invalid": "$\\lim\\limits_{x\\to 0}\\dfrac{x-\\sin x}{x^3}$：$x$ 与 $\\sin x$ 是相减关系，若把 $\\sin x$ 换成 $x$ 得 $0$，而实际答案为 $\\dfrac{1}{6}$ ✗", "remedy": "① 先做恒等变形（提取公因子、通分、有理化），把式子凑成「因式」形态后再替换；② 或改用更高阶的等价量，如 $x-\\sin x\\sim\\dfrac{x^3}{6}$（$x\\to 0$）；③ 相加减的两个无穷小若不同阶，低阶者为主，可只保留低阶项。", "related": ["定理4.4（等价无穷小的结论：$\\alpha=\\beta+o(\\beta)$）", "§3.5 无穷小量、无穷大量、阶的比较", "§3.6 两个重要极限（等价量替换定理）"], "added": "2026-10-12"}, {"id": "E-002", "title": "极限四则运算不能拆开极限不存在的项", "rule": "$\\lim(f\\pm g)=\\lim f\\pm\\lim g$、$\\lim(fg)=\\lim f\\cdot\\lim g$ 成立的前提是拆出来的每一项极限都存在（都是有限数）。只要有一项是 $\\infty$ 或不存在，就不能拆。", "why": "四则运算法则本质是「两个收敛的量」之间的运算律，前提是 $\\lim f$、$\\lim g$ 都是确定的实数。当某一项的极限是 $\\infty$ 时，它根本不是实数；把 $\\infty$ 当作数参与运算会写出无意义的式子——$\\infty\\cdot 0$、$\\infty-\\infty$、$\\infty/\\infty$ 都是未定式，结果不由法则决定。", "valid": "$\\lim\\limits_{x\\to 0}\\Bigl[\\dfrac{\\tan 5x}{\\sin 3x}+\\dfrac{1-\\cos x}{\\sin 3x}\\Bigr]$：两项极限分别为 $\\dfrac{5}{3}$ 与 $0$，都存在，可以拆，得 $\\dfrac{5}{3}$ ✓", "invalid": "$\\lim\\limits_{x\\to\\infty}x^2\\sin\\dfrac{1}{x}$：若拆成 $(\\lim x)\\cdot\\lim\\dfrac{\\sin(1/x)}{1/x}$，第一个因子 $\\lim\\limits_{x\\to\\infty}x=\\infty$ 不存在，不能拆。本题正确做法是整体替换 $\\sin\\dfrac1x\\sim\\dfrac1x$，得 $x^2\\cdot\\dfrac1x=x\\to+\\infty$ ✗", "remedy": "① 拆之前先逐项检查极限是否存在，都收敛才可拆；② 不能拆时改用整体等价替换、提公因式、有理化、和差化积等恒等变形；③ 遇到 $\\infty-\\infty$、$0\\cdot\\infty$、$\\infty/\\infty$ 一律先变形再求。", "related": ["§3.2 函数极限的性质（四则运算）", "作业练习 B（$\\lim\\limits_{x\\to\\infty}x^2\\sin\\frac1x$，不能在 ∞ 处拆项）", "题库易错点 E-001"], "added": "2026-10-12"}, {"id": "E-003", "title": "等价量与展开只在自变量趋于展开点时成立", "rule": "使用任何等价量替换或（局部）展开之前，必须先确认**括号里那个量确实趋于该展开点**（通常是趋于 $0$）。$\\sin u\\sim u$、$\\ln(1+u)\\sim u$、$\\cos u\\approx1-\\frac{u^2}{2}$ 等全部只对 $u\\to0$ 成立。", "why": "这些等价量都是函数在展开点（通常是 $0$）的**局部**线性/二次主部。当 $u$ 不趋于展开点时，主部形式完全改变：例如 $\\cos t$ 在 $t\\to\\infty$ 时并不趋于 $1-\\frac{t^2}{2}$（它根本没有极限，只是有界振荡），此时那个「二次项」与真实值毫无关系。", "valid": "$\\lim\\limits_{x\\to0}\\dfrac{\\sin(\\tan^2x)}{\\sqrt[n]{1+x^2}-1}$：$\\tan^2x\\to0$、$x^2\\to0$，两处都满足条件，得 $\\dfrac{x^2}{x^2/n}=n$ ✓", "invalid": "$\\lim\\limits_{x\\to0}\\dfrac{x^2\\cos\\frac1x}{(1+\\cos x)\\ln(1+x)}$ 中把 $\\cos\\frac1x$ 换成 $1-\\frac{1}{2x^2}$：这里 $\\frac1x\\to\\infty$，展开不成立。$x^2\\cos\\frac1x$ 应作有界量乘无穷小 $=o(x)$ ✗", "remedy": "① 每次替换前先问一句「括号里的量趋于几？」；② 若该量趋于 $\\infty$，改用「有界量 × 无穷小量」或「提取主项」；③ 若该量趋于某个 $a\\ne0$（如 $x\\to\\pi$ 时的 $mx\\to m\\pi$），应换元 $t=x-a$ 把它化成趋于 $0$。", "related": ["题库错题 错-1-综.3(1)", "题库错题 错-1-3.16(2)", "作业 习题1-3 第9(1)题（$\\lim\\limits_{x\\to\\pi}\\frac{\\sin mx}{\\sin nx}$，过程误用 $\\frac{\\sin mx}{mx}\\to1$）", "题库知识点「10.14」八、总纲"], "added": "2026-10-16"}, {"id": "E-004", "title": "判断间断点类型必须先写出两个单侧极限", "rule": "求间断点并分类时，**必须先把两个单侧极限算出来**（或写出分段表达式），再对照定义下结论。只写类型结论不给过程，等于没有依据。", "why": "四类间断点的判据全部建立在单侧极限上：「两侧都有限且相等但不等于函数值」→ 可去；「两侧都有限但不等」→ 跳跃（以上属第一类）；「至少一侧为 $\\infty$」→ 无穷；「振荡无极限」→ 振荡（以上属第二类）。不写出单侧极限，就无法排除其他类别。", "valid": "$f(x)=\\arctan\\frac1x$：$\\lim\\limits_{x\\to0^-}=-\\frac\\pi2$、$\\lim\\limits_{x\\to0^+}=\\frac\\pi2$，都有限且不等 ⟹ $x=0$ 是第一类跳跃间断点 ✓", "invalid": "$f(x)=e^{1/x}$ 判成「跳跃」：跳跃要求两侧极限都存在，而 $\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$ 不存在 ⟹ 实为第二类**无穷**间断点 ✗", "remedy": "① 先写出分段表达式或直接算 $f(x_0^-)$、$f(x_0^+)$；② 只要有一侧为 $\\infty$，一律归第二类（无穷型）；③ 两侧极限存在但$\\ne f(x_0)$（或无定义）才是可去；④ 遇 $\\sin\\frac1x$ 这类振荡，另取两串点证明极限不存在。", "related": ["题库错题 错-1-4.3(3)", "题库题目 1-3.5(4)（$e^{1/x}$ 的极限不存在）", "§4.1 函数连续的概念"], "added": "2026-10-16"}, {"id": "E-005", "title": "用归结原则构造数列，必须验证它真的具备所需性质", "rule": "用归结原则（海涅定理）证明极限不存在时，构造的数列 $\\{x_n\\}$ 必须同时满足：① $x_n\\in\\mathring U(x_0)$（即 $x_n\\ne x_0$）；② $x_n\\to x_0$；③ **函数值确实趋于两个不同的常数**（或确实不收敛）。第 ③ 条要靠数列本身的性质来保证。", "why": "很多人看到「有理数 / 无理数」就随手写 $x_0+\\frac1n$、$x_0+\\frac1{\\sqrt n}$，但 $x_0+\\frac1n$ 只在 $x_0$ 为有理数时才有理；而 $\\frac1{\\sqrt n}$ 在 $n$ 为完全平方数时是有理数。性质验证不过关，整个反例就无效。", "valid": "证 $D(x)$（Dirichlet 函数）处处无极限：直接用**稠密性**，在 $(x_0,x_0+\\frac1n)$ 内分别取有理数 $r_n$ 与无理数 $s_n$，则 $D(r_n)=1\\to1$、$D(s_n)=0\\to0$ ✓", "invalid": "取 $x_n'=x_0+\\frac1n$、$x_n''=x_0+\\frac1{\\sqrt n}$ 并断言「前者有理、后者无理」——对无理数的 $x_0$ 前者也无理；$n=4$ 时后者 $=\\frac12$ 是有理数 ✗", "remedy": "① 能不猜显式公式就不猜，优先用**稠密性**等存在性定理「取一串」；② 若一定要写显式公式，逐条验证所需性质在**所有 $n$** 下成立；③ 对导出的两串点再核一遍：$x_n\\to x_0$ 且 $x_n\\ne x_0$ 是否真的满足。", "related": ["题库错题 错-1-3.2", "§3.3 归结原则（海涅定理）"], "added": "2026-10-16"}, {"id": "E-006", "title": "不能引用未证明的结论，也不能用后面章节的工具", "rule": "证明过程中引用任何结论，都必须是**本章已经学过并证明过**的。第一章不得使用导数（第二章）与洛必达法则、泰勒展开；也不得引用教材上没有的不等式（如对数平均不等式）。", "why": "数学证明是把命题归约到**已知为真**的前提。引用未证结论，等于把待证的东西换了个名字；用超纲工具，在考试中不给分，而且掩盖了对本章方法的训练。", "valid": "证明 $x-\\varepsilon\\sin x=1$ 有唯一根：存在性用零点定理（取 $f(0)<0,f(2)>0$）；唯一性用和差化积得 $|\\sin x_1-\\sin x_2|\\le|x_1-x_2|$ 推出矛盾——全程第一章工具 ✓", "invalid": "用 $f'(x)=1-\\varepsilon\\cos x>0$ 判断单调（导数属第二章）；引用 $\\dfrac{x_1-x_2}{\\ln x_1-\\ln x_2}>\\sqrt{x_1x_2}$（对数平均不等式，本章未讲） ✗", "remedy": "① 写每一步时问自己「这条依据是书上哪一条？」；② 遇到「显然」「由某不等式」而说不出出处的，一律重做；③ 求极限时若想用洛必达，改回「等价量替换 / 提主项 / 有理化 / 和差化积 / 夹逼」。", "related": ["题库错题 错-1-4.9(3)", "题库错题 错-1-3.6", "题库错题 错-1-4.12(1)"], "added": "2026-10-16"}, {"id": "E-007", "title": "约分和比较系数时，别丢掉最低次非零项的系数", "rule": "遇到 $0/0$ 型做「展开后约掉公共零因子」时，**决定极限值的是最低次非零项，而不是最高次项**。约分前后都要把最低次非零项的**系数**写清楚。", "why": "极限只看主部（最低次非零项）。把展开简写成「$t^{n-1}+\\cdots+1$」会让人误以为最低次项系数是 $1$，于是答案丢掉一个因子。", "valid": "$\\lim\\limits_{x\\to1}\\dfrac{x^3-3x+2}{(x-1)^2}$：令 $t=x-1$，分子 $=(1+t)^3-3t-2=3t^2+t^3$，除以 $t^2$ 得 $3$，即 $\\dfrac{n(n+1)}{2}\\big|_{n=2}=3$ ✓", "invalid": "$\\lim\\limits_{x\\to1}\\dfrac{x^{n+1}-(n+1)x+n}{(x-1)^2}$：分子 $=C_{n+1}^{2}t^2+C_{n+1}^{3}t^3+\\cdots$，最低次非零项系数是 $C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。若写成「$t^{n-1}+\\cdots+1$」就会答成 $1$ ✗", "remedy": "① 展开后**逐项写出系数**，至少写到 $t^2$ 项；② 约分前明确标出「最低次非零项」是哪一项；③ 做完用 $n=2$ 这类小值做数值自检。", "related": ["题库错题 错-1-3.8(8)", "同类型：作业 习题1-3 第8(2)题（展开后约 x² 得 10）"], "added": "2026-10-16"}, {"id": "E-008", "title": "求待定参数的题，只求必要条件是不够的", "rule": "凡「已知某极限/连续性/可去间断点成立，求参数 $a,b$」的题，由条件解出参数只是**必要条件**，**必须代回原式验证充分性**，才能确认答案正确。", "why": "由「条件成立」推出「参数取值」是单向的。可能存在多组解，也可能某组值代回后条件并不成立（例如极限仍发散、或极限值与要求不符）。验证花不了一分钟，却是这类题唯一可能失分的地方。", "valid": "求 $f(x)=\\dfrac{\\sqrt{1+\\sin x+\\sin^2x}-(\\alpha+\\beta\\sin x)}{\\sin^2x}$ 在 $x=0$ 可去时的 $\\alpha,\\beta$：得 $\\alpha=1,\\beta=\\dfrac12$ 后，回代算得两侧极限都是 $\\dfrac38$（有限且相等），确认可去 ✓", "invalid": "解出 $\\alpha=1,\\beta=\\dfrac12$ 就直接交卷，不说明该组值下极限确实存在 ✗", "remedy": "① 解出参数后，**把值代回原式重新算一遍极限**；② 明确写出「此时两个单侧（或整体）极限为 $\\cdots$，有限，故条件成立」；③ 若条件中含「$\\ne0$」等约束，也要一并核对。", "related": ["题库错题 错-1-综.17", "题库题目 1-4.12(2)", "题库题目 10.14-E"], "added": "2026-10-16"}]};
