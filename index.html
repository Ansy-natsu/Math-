便根据它来求 N。<\/div>\n<div class=\"p note\">既然 ε 是任意的正数，那么 2ε，10ε，√ε，ε² 等同样也是任意的正数，因此定义中不等式右边的 ε 也可用 2ε，10ε，√ε 或 ε² 等来代替。<\/div>\n<div class=\"p note\">同样可以把“&lt;”号换成“≤”号。<\/div>\n<div class=\"p note\">（注意：可限制 ε 小于某一个正常数，不影响衡量 aₙ 与 a 接近的程度。）<\/div>\n<p class=\"lb note\">对数列极限定义的几点说明 2. N 的相应性<\/p>\n<div class=\"p note\">一般说，N 是随着 ε 的变小而变大的，但 ε 给定以后，确定的 N 不是唯一的，因为对已给的 ε，若 N=100 满足要求，则 N=101，102，⋯自然更能满足要求。<\/div>\n<div class=\"p note\">在定义中，只要求存在一个正整数 N，而不在于它的值有多大，只要求对一切 n&gt;N 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε。<\/div>\n<div class=\"p note\">至于 n≤N 时，|aₙ-a| 是大于或等于 ε 是无关紧要的，而且 n&gt;N 也可改成 n≥N。<\/div>\n<p class=\"lb note\">对数列极限定义的几点说明 3. 几何意义<\/p>\n<div class=\"p note\">lim(n→∞)aₙ=a 等价于任意给定正数 ε，相应地存在 N，当 n&gt;N 时，都有 |aₙ-a|&lt;ε，即有 a-ε&lt;aₙ&lt;a+ε 或 aₙ∈(a-ε, a+ε)。<\/div>\n<div class=\"p note\">换一句话说，a 的任何给定的 ε 邻域中都含有数列 {aₙ} 中除了有限项以外的所有项。<\/div>\n<p class=\"lb note\">性质1 的分析<\/p>\n<div class=\"p note\">如果不唯一，即有 lim(n→∞)aₙ=a，lim(n→∞)aₙ=b，a≠b。<\/div>\n<div class=\"p note\">当 n 充分大时，由于<\/div>\n<div class=\"f\">|a-b|=|a-aₙ+aₙ-b|≤|a-aₙ|+|aₙ-b|=|aₙ-a|+|aₙ-b|&lt;ε+ε=2ε，<\/div>\n<div class=\"p note\">要想推出矛盾，只要取 ε≤|a-b|/2 即可。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：反证法。假设极限值不唯一，即有 lim(n→∞)aₙ=a，lim(n→∞)aₙ=b，a≠b。<\/div>\n<div class=\"z\">取 ε=|a-b|/3&gt;0，由 lim(n→∞)aₙ=a 知，存在正整数 N₁，当 n&gt;N₁ 时，有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε。<\/div>\n<div class=\"z\">同理，由 lim(n→∞)aₙ=b 知，存在正整数 N₂，当 n&gt;N₂ 时，有<\/div>\n<div class=\"f\">|aₙ-b|&lt;ε。<\/div>\n<div class=\"z\">取 N=max{N₁, N₂}，当 n&gt;N 时，都有 |aₙ-a|&lt;ε，|aₙ-b|&lt;ε。则<\/div>\n<div class=\"f\">|a-b|=|a-aₙ+aₙ-b|≤|a-aₙ|+|aₙ-b|&lt;ε+ε=2ε=(2/3)|a-b|，<\/div>\n<div class=\"z\">由 |a-b|&gt;0，推出 1&lt;2/3。矛盾。<\/div>\n<p class=\"lb note\">取 N 时为何要取 max{1, …}<\/p>\n<div class=\"p note\">取 N=max{1, [(1/ε)^(1/k)]} 是为了保证 N 是正整数。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：（1）当 q=0 时，显然有 lim(n→∞)0=0。<\/div>\n<div class=\"z\">（2）当 0&lt;|q|&lt;1 时，∀ε&gt;0，要使<\/div>\n<div class=\"f\">|qⁿ-0|&lt;ε ⇔ |q|ⁿ&lt;ε ⇔ lg|q|ⁿ&lt;lg ε ⇔ nlg|q|&lt;lg ε（注意 lg|q| 为负数），<\/div>\n<div class=\"z\">只要 n&gt;lg ε/lg|q|。<\/div>\n<div class=\"z\">取 N=max{1, [lg ε/lg|q|]}，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|qⁿ-0|&lt;ε。<\/div>\n<div class=\"z\">所以 lim(n→∞)qⁿ=0，|q|&lt;1 为常数。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：∀ε&gt;0，要使<\/div>\n<div class=\"f\">|ⁿ√a-1|&lt;ε ⇔ ⁿ√a-1&lt;ε ⇔ a^(1/n)&lt;1+ε ⇔ logₐa^(1/n)&lt;logₐ(1+ε) ⇔ (1/n)logₐ(1+ε)，<\/div>\n<div class=\"z\">只要 n&gt;1/logₐ(1+ε)。<\/div>\n<div class=\"z\">取 N=max{1, [1/logₐ(1+ε)]}，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|ⁿ√a-1|&lt;ε。<\/div>\n<div class=\"z\">所以 lim(n→∞)ⁿ√a=1，a&gt;1 为常数。<\/div>\n<p class=\"lb note\">有界性只是数列收敛的必要条件，而非充分条件<\/p>\n<div class=\"p note\">有界性只是数列收敛的必要条件，而非充分条件。例如，数列 {(-1)ⁿ} 有界，但它并不收敛。该性质的逆否命题为真，即<\/div>\n<p class=\"lb note\">注：在性质4中，即使存在正整数 N₀，当 n&gt;N₀ 时，都有 aₙ&gt;bₙ<\/p>\n<div class=\"p note\">注：在性质4中，即使存在正整数 N₀，当 n&gt;N₀ 时，都有 aₙ&gt;bₙ，也不能保证 a&gt;b。例如，aₙ=1/n，bₙ=-1/n，aₙ&gt;bₙ（n=1，2，3，…），但 lim(n→∞)aₙ=0，lim(n→∞)bₙ=0，两极限相等。<\/div>\n<h2 id=\"ch1_2\">三、函数极限<span class=\"src\">选自 §3.1、§3.2、§3.3、§3.6<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义1.14 子列（子数列）<\/p>\n<div class=\"p\">给定数列 a₁，a₂，…，aₙ，…，如果任意地从中挑选无穷多项并按照原有的次序排列出来，即<\/div>\n<div class=\"f\">a n₁，a n₂，…，a nk，…（n₁&lt;n₂&lt;…&lt;nk&lt;…），<\/div>\n<div class=\"p\">就得到一个以 k 为序号的数列 {a nk}，称为原数列 {aₙ} 的子数列（或子列）。<\/div>\n<div class=\"p\">例如 a₁，a₃，a₅，…，a 2k-1，…；a₂，a₄，a₆，…，a 2k，…；a₃，a₆，a₉，…，a 3k，…都是 {aₙ} 的子列，这样的子列有无限多个。<\/div>\n<div class=\"p\">由子列的定义可知，<\/div>\n<div class=\"f\">nk≥k。<\/div>\n<p class=\"lb\">定义1.15 x→+∞ 时函数的极限<\/p>\n<div class=\"p\">设函数 f(x) 在 [b, +∞) 上有定义，<\/div>\n<div class=\"p\">若存在常数 A，对任给 ε&gt;0，存在 X&gt;0，当 x&gt;X 时，都有<\/div>\n<div class=\"f\">|f(x)-A|&lt;ε，<\/div>\n<div class=\"p\">则称数 A 为函数 f(x) 当 x→+∞ 时的极限，记作<\/div>\n<div class=\"f\">lim(x→+∞)f(x)=A 或 f(x)→A（x→+∞）。<\/div>\n<div class=\"p\"><span class=\"refgrp\">（见例1）<\/span><\/div>\n<p class=\"lb\">定义 x→-∞ 时函数的极限<\/p>\n<div class=\"p\">把定义1.15 中的「[b, +∞)」换成「(-∞, b]」，<\/div>\n<div class=\"p\">「x&gt;X」换成「x&lt;-X」，即得 lim(x→-∞)f(x)=A 的定义。<\/div>\n<p class=\"lb\">定义 x→∞ 时函数的极限<\/p>\n<div class=\"p\">把定义1.15 中的「[b, +∞)」换成「(-∞, a]∪[b, +∞)，a≤b」，<\/div>\n<div class=\"p\">「x&gt;X」换成「|x|&gt;X」，即得 lim(x→∞)f(x)=A 的定义。<span class=\"refgrp\">（见例2）<\/span><\/div>\n<p class=\"lb\">定义1.16 x→x₀ 时函数的极限（ε-δ 定义）<\/p>\n<div class=\"p\">设函数 f(x) 在点 x=x₀ 的某一空心邻域 Ů(x₀, δ₀) 内有定义，A 为一常数，<\/div>\n<div class=\"p\">若任给 ε&gt;0，总存在 δ&gt;0（δ≤δ₀），<\/div>\n<div class=\"p\">使得当 0&lt;|x-x₀|&lt;δ（即 x∈Ů(x₀, δ)）时，都有 |f(x)-A|&lt;ε（即 f(x)∈U(A, ε)）成立，<\/div>\n<div class=\"p\">则称 A 为函数 f(x) 当 x→x₀ 时的极限，记作<\/div>\n<div class=\"f\">lim(x→x₀)f(x)=A 或 f(x)→A（x→x₀）。<\/div>\n<div class=\"p\">这个定义称为 ε-δ 定义。<span class=\"refgrp\">（见例3、例4）<\/span><\/div>\n<p class=\"lb\">定义1.17 右极限<\/p>\n<div class=\"p\">设 f(x) 在 x₀ 的某右邻域 Ů₊(x₀) 内有定义，<\/div>\n<div class=\"p\">若存在一个确定的常数 A，任给 ε&gt;0，总存在 δ&gt;0（δ≤δ₀），<\/div>\n<div class=\"p\">使得当 x₀&lt;x&lt;x₀+δ（x∈Ů₊(x₀, δ)）时，都有<\/div>\n<div class=\"f\">|f(x)-A|&lt;ε，<\/div>\n<div class=\"p\">则称 A 为 f(x) 当 x→x₀ 时的右极限，记作<\/div>\n<div class=\"f\">lim(x→x₀⁺)f(x)=A 或 f(x₀⁺)=A 或 f(x₀+0)=A。<\/div>\n<p class=\"lb\">定义1.18 左极限<\/p>\n<div class=\"p\">设 f(x) 在 x₀ 的某左邻域 Ů₋(x₀) 内有定义，<\/div>\n<div class=\"p\">若存在一个确定的常数 A，任给 ε&gt;0，存在 δ&gt;0（δ≤δ₀），<\/div>\n<div class=\"p\">使得当 x₀-δ&lt;x&lt;x₀（x∈Ů₋(x₀, δ)）时，都有<\/div>\n<div class=\"f\">|f(x)-A|&lt;ε，<\/div>\n<div class=\"p\">则称 A 为 f(x) 当 x→x₀ 时的左极限，记作<\/div>\n<div class=\"f\">lim(x→x₀⁻)f(x)=A 或 f(x₀⁻)=A 或 f(x₀-0)=A。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">重要极限 e<\/p>\n<div class=\"f\">lim(n→∞)(1+1/n)ⁿ=e。（见例18、例20）<\/div>\n<div class=\"z\">证法一：设<\/div>\n<div class=\"f\">aₙ=(1+1/n)ⁿ，<\/div>\n<div class=\"p\">由于<\/div>\n<div class=\"f\">aₙ=(1+1/n)ⁿ=1+n(1/n)+n(n-1)/2!(1/n)²+…+n(n-1)…(n-k+1)/k!(1/n)ᵏ+…+n!/n!(1/n)ⁿ=1+1+1/2!(1-1/n)+1/3!(1-1/n)(1-2/n)+…+1/k!(1-1/n)(1-2/n)…(1-(k-1)/n)+…+1/n!(1-1/n)(1-2/n)…(1-(n-1)/n)，<\/div>\n<div class=\"f\">a n+1=(1+1/(n+1))^(n+1)=1+1+1/2!(1-1/(n+1))+1/3!(1-1/(n+1))(1-2/(n+1))+…+1/k!(1-1/(n+1))(1-2/(n+1))…(1-(k-1)/(n+1))+…+1/n!(1-1/(n+1))(1-2/(n+1))…(1-(n-1)/(n+1))+(1/(n+1))^(n+1)，<\/div>\n<div class=\"p\">可以看出，a n+1 有 n+2 项，且前 n+1 项均不小于 aₙ 对应的每一项，最后一项 (1/(n+1))^(n+1)&gt;0，故<\/div>\n<div class=\"f\">aₙ&lt;a n+1。<\/div>\n<div class=\"p\">即 {aₙ} 递增。<\/div>\n<div class=\"z\">另外<\/div>\n<div class=\"f\">aₙ=(1+1/n)ⁿ&lt;1+1+1/2!+1/3!+…+1/k!+…+1/n!（n&gt;1）&lt;1+1+1/(1×2)+1/(2×3)+…+1/((n-1)n)=2+1-1/2+1/2-1/3+…+1/(n-1)-1/n=3-1/n&lt;3，<\/div>\n<div class=\"p\">由单调有界定理知，<\/div>\n<div class=\"f\">lim(n→∞)(1+1/n)ⁿ<\/div>\n<div class=\"p\">存在。<\/div>\n<div class=\"z\">证法二：先建立一个不等式。<\/div>\n<div class=\"z\">由<\/div>\n<div class=\"f\">b^(n+1)-a^(n+1)=(b-a)(bⁿ+b^(n-1)a+…+aⁿ)，<\/div>\n<div class=\"p\">得<\/div>\n<div class=\"f\">(b^(n+1)-a^(n+1))/(b-a)=bⁿ+b^(n-1)a+…+aⁿ&lt;(n+1)bⁿ，<\/div>\n<div class=\"p\">其中，b&gt;a&gt;0，n∈N₊。<\/div>\n<div class=\"p\">于是有<\/div>\n<div class=\"f\">b^(n+1)-a^(n+1)&lt;(n+1)bⁿ(b-a)，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">a^(n+1)&gt;bⁿ[(n+1)a-nb]。（1.1）<\/div>\n<div class=\"p\">令 a=1+1/(n+1)，b=1+1/n，代入式（1.1），得<\/div>\n<div class=\"f\">(1+1/(n+1))^(n+1)&gt;(1+1/n)ⁿ[(n+1)(1+1/(n+1))-n(1+1/n)]=(1+1/n)ⁿ，<\/div>\n<div class=\"p\">故有<\/div>\n<div class=\"f\">(1+1/(n+1))^(n+1)&gt;(1+1/n)ⁿ，<\/div>\n<div class=\"p\">所以数列 {aₙ} 递增。<\/div>\n<div class=\"p\">再令 a=1，b=1+1/(2n)，代入式（1.1），得<\/div>\n<div class=\"f\">1&gt;(1+1/(2n))ⁿ[(n+1)-n(1+1/(2n))]=(1+1/(2n))ⁿ·1/2，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">(1+1/(2n))ⁿ&lt;2，<\/div>\n<div class=\"p\">两边平方得<\/div>\n<div class=\"f\">(1+1/(2n))^(2n)&lt;4，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">a 2n&lt;4。<\/div>\n<div class=\"p\">由于 aₙ&lt;a 2n&lt;4，所以 {aₙ} 有上界，由单调有界定理知<\/div>\n<div class=\"f\">lim(n→∞)(1+1/n)ⁿ<\/div>\n<div class=\"p\">存在。<\/div>\n<div class=\"p\">设此极限为 e，于是<\/div>\n<div class=\"f\">lim(n→∞)(1+1/n)ⁿ=e。<\/div>\n<p class=\"lb\">性质1 唯一性<\/p>\n<div class=\"p\">若极限 lim(x→x₀)f(x) 存在，则它只有一个极限。<\/div>\n<p class=\"lb\">性质2 局部有界性<\/p>\n<div class=\"p\">若极限 lim(x→x₀)f(x) 存在，<\/div>\n<div class=\"p\">则存在 x₀ 的某个空心邻域 Ů(x₀)，<\/div>\n<div class=\"p\">使 f(x) 在 Ů(x₀) 内有界。<\/div>\n<div class=\"z\">证：设 lim(x→x₀)f(x)=A，由 ε-δ 定义，取 ε=1，存在 δ₀&gt;0，当 x∈Ů(x₀, δ₀) 时，都有<\/div>\n<div class=\"f\">|f(x)-A|&lt;1，<\/div>\n<div class=\"z\">由于 |f(x)|-|A|≤|f(x)-A|&lt;1，<\/div>\n<div class=\"z\">所以 |f(x)|&lt;1+|A|，其中，1+|A| 为常数。<\/div>\n<div class=\"z\">从而 f(x) 在 Ů(x₀, δ₀) 内有界。<\/div>\n<p class=\"lb\">性质3 不等式性质<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=A，lim(x→x₀)g(x)=B，且 A&gt;B，则存在 x₀ 的某空心邻域 Ů(x₀, δ₀)，使得对一切 x∈Ů(x₀, δ₀)，<\/div>\n<div class=\"p\">都有 f(x)&gt;g(x)。<\/div>\n<p class=\"lb\">推论 局部保号性<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=A&gt;0（或&lt;0），则对任何常数 η（0&lt;η&lt;A）（或 A&lt;η&lt;0），<\/div>\n<div class=\"p\">存在 x₀ 的某空心邻域 Ů(x₀, δ₀)，使得对一切 x∈Ů(x₀, δ₀)，<\/div>\n<div class=\"p\">都有 f(x)&gt;η&gt;0（或 f(x)&lt;η&lt;0）成立。<\/div>\n<p class=\"lb\">性质4 不等式性质<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=A，lim(x→x₀)g(x)=B，且存在 x₀ 的某空心邻域 Ů(x₀, δ₀)，<\/div>\n<div class=\"p\">使得对一切 x∈Ů(x₀, δ₀)，都有 f(x)≤g(x)，则 A≤B。<\/div>\n<p class=\"lb\">性质5 函数极限的四则运算<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x) 与 lim(x→x₀)g(x) 存在，则函数 f±g，f·g，cf（c 为常数）在 x→x₀ 时的极限都存在，且<\/div>\n<div class=\"f\">lim(x→x₀)[f(x)±g(x)]=lim(x→x₀)f(x)±lim(x→x₀)g(x)，<\/div>\n<div class=\"f\">lim(x→x₀)f(x)g(x)=lim(x→x₀)f(x)·lim(x→x₀)g(x)，<\/div>\n<div class=\"f\">lim(x→x₀)cf(x)=c lim(x→x₀)f(x)；<\/div>\n<div class=\"p\">又若 lim(x→x₀)g(x)≠0，则 f/g 在 x→x₀ 时的极限也存在，且有<\/div>\n<div class=\"p\">lim(x→x₀)(f(x)/g(x))=(lim(x→x₀)f(x))/(lim(x→x₀)g(x))。<span class=\"refgrp\">（见例8、例9、例10）<\/span><\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理1.2（夹逼定理）<\/p>\n<div class=\"p\">设 {aₙ}，{bₙ} 为收敛数列，且 lim(n→∞)aₙ=a，lim(n→∞)bₙ=a，若存在正整数 N₀，当 n&gt;N₀ 时，都有 aₙ≤cₙ≤bₙ，则数列 {cₙ} 收敛，且<\/div>\n<div class=\"f\">lim(n→∞)cₙ=a。<\/div>\n<div class=\"z\">证：由 lim(n→∞)aₙ=a 知，任给 ε&gt;0，存在正整数 N₁，当 n&gt;N₁ 时，有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">a-ε&lt;aₙ&lt;a+ε。<\/div>\n<div class=\"z\">由 lim(n→∞)bₙ=a 知，对上述的 ε&gt;0，存在正整数 N₂，当 n&gt;N₂ 时，有<\/div>\n<div class=\"f\">|bₙ-a|&lt;ε，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">a-ε&lt;bₙ&lt;a+ε。<\/div>\n<div class=\"z\">又由题意知，当 n&gt;N₀ 时，有<\/div>\n<div class=\"f\">aₙ≤cₙ≤bₙ。<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">N=max{N₀，N₁，N₂}，<\/div>\n<div class=\"z\">当 n&gt;N 时，都有<\/div>\n<div class=\"f\">a-ε&lt;aₙ，aₙ≤cₙ≤bₙ，bₙ&lt;a+ε。<\/div>\n<div class=\"p\">于是，有<\/div>\n<div class=\"f\">a-ε&lt;cₙ&lt;a+ε<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">|cₙ-a|&lt;ε，<\/div>\n<div class=\"p\">所以数列 {cₙ} 收敛，且<\/div>\n<div class=\"f\">lim(n→∞)cₙ=a。□<\/div>\n<p class=\"lb\">定理1.3 数列收敛的充要条件<\/p>\n<div class=\"p\">数列 {aₙ} 收敛的充要条件是 {aₙ} 的任一子列 {a nk} 都收敛且极限相等。<\/div>\n<div class=\"z\">证：必要性。设 {a nk} 是 {aₙ} 的任意一个子列，由于 {aₙ} 收敛，即设 lim(n→∞)aₙ=a。∀ε&gt;0，∃正整数 N，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε。<\/div>\n<div class=\"z\">取 K=N，当 k&gt;K 时，有 nk≥k&gt;K=N，都有<\/div>\n<div class=\"f\">|a nk-a|&lt;ε。<\/div>\n<div class=\"p\">所以<\/div>\n<div class=\"f\">lim(k→∞)a nk=a。<\/div>\n<div class=\"p\">充分性。若 {aₙ} 的任意一个子列 {a nk} 都收敛且极限相等，由于 {aₙ} 本身就是 {aₙ} 的一个子列，故 {aₙ} 收敛。<\/div>\n<p class=\"lb\">定理1.4 数列发散的充要条件<\/p>\n<div class=\"p\">数列 {aₙ} 发散的充要条件是 {aₙ} 中有两个子列极限存在但不相等，或有一个子列极限不存在。<\/div>\n<p class=\"lb\">定理1.5 单调有界定理<\/p>\n<div class=\"p\">若数列 {aₙ} 递增（递减）有上界（下界），则数列 {aₙ} 收敛，即单调有界数列必有极限。<\/div>\n<div class=\"z\">证：不妨设 {aₙ} 递增，由于 {aₙ} 有上界，由确界原理知，必有上确界，设为 a，则<\/div>\n<div class=\"f\">aₙ≤a。<\/div>\n<div class=\"z\">任给 ε&gt;0，存在正整数 N，使<\/div>\n<div class=\"f\">aN&gt;a-ε。<\/div>\n<div class=\"z\">因为 {aₙ} 递增，所以当 n&gt;N 时，有<\/div>\n<div class=\"f\">a-ε&lt;aN≤aₙ≤a&lt;a+ε，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，<\/div>\n<div class=\"p\">于是<\/div>\n<div class=\"f\">lim(n→∞)aₙ=a。<\/div>\n<div class=\"p\">因此数列 {aₙ} 收敛。<\/div>\n<div class=\"p\">同理可证，递减有下界数列必有极限且这个极限就是该数列的下确界。<\/div>\n<p class=\"lb\">定理1.6 魏尔斯特拉斯（Weierstrass）定理<\/p>\n<div class=\"p\">有界数列必有收敛的子列。<\/div>\n<div class=\"z\">证：设数列 {aₙ} 有界，即存在正常数 M，使得对一切正整数 n，都有 |aₙ|≤M，<\/div>\n<div class=\"z\">即 aₙ∈[-M, M](def)[α₁, β₁]。<\/div>\n<div class=\"z\">现把 [α₁, β₁] 等分成两个区间 [α₁, (α₁+β₁)/2]，[(α₁+β₁)/2, β₁]，<\/div>\n<div class=\"z\">那么其中至少有一个区间包含 {aₙ} 的无穷多项（若 [α₁, (α₁+β₁)/2]，[(α₁+β₁)/2, β₁] 都含有 {aₙ} 中的有限项，则 [α₁, β₁] 作为这两个区间之并集含有 {aₙ} 中的有限项，与 [α₁, β₁] 的定义相矛盾），<\/div>\n<div class=\"z\">把这样的一个区间记为 [α₂, β₂]，再把 [α₂, β₂] 等分成两个区间，同样至少有一个区间包含 {aₙ} 的无穷多项，记它为 [α₃, β₃]，<\/div>\n<div class=\"z\">逐次这样作，便得到一系列闭区间：<\/div>\n<div class=\"f\">[α₁, β₁]⊃[α₂, β₂]⊃[α₃, β₃]⊃…⊃[αₙ, βₙ]⊃…，<\/div>\n<div class=\"z\">其中每一个都包含 {aₙ} 的无穷多项，且<\/div>\n<div class=\"f\">① α₁≤α₂≤…≤αₙ≤…≤βₙ≤…≤β₂≤β₁（n=1, 2, …）；<\/div>\n<div class=\"f\">② βₙ-αₙ=(β₁-α₁)/2ⁿ⁻¹→0（n→∞）。<\/div>\n<div class=\"z\">由①知数列 {αₙ} 递增有上界，数列 {βₙ} 递减有下界，<\/div>\n<div class=\"z\">由单调有界定理知这两个数列有极限，记为<\/div>\n<div class=\"f\">lim(n→∞)αₙ=α，lim(n→∞)βₙ=β，<\/div>\n<div class=\"z\">并且满足 αₙ≤α≤β≤βₙ（n=1, 2, 3, …），<\/div>\n<div class=\"z\">由于 lim(n→∞)(βₙ-αₙ)=β-α=0，<\/div>\n<div class=\"z\">所以 α=β 且 α∈[αₙ, βₙ]（n=1, 2, 3, …）。<\/div>\n<div class=\"z\">然后，我们在 [α₁, β₁] 中任取一项，记为 aₙ₁，<\/div>\n<div class=\"z\">由于 [α₂, β₂] 中含有 {aₙ} 中的无穷多项，<\/div>\n<div class=\"z\">因此，也含有下标大于 n₁ 的无限项（若 [α₂, β₂] 只含有下标大于 n₁ 的有限项，由于下标小于等于 n₁ 只有有限项，则 [α₂, β₂] 只含有 {aₙ} 中的有限项，矛盾），<\/div>\n<div class=\"z\">因此，在 [α₂, β₂] 中选取一个下标大于 n₁ 的项 aₙ₂，同样在 [α₃, β₃] 中选取一个下标大于 n₂ 的项 aₙ₃，<\/div>\n<div class=\"z\">如此继续下去，就得到 {aₙ} 的一个子列 {aₙₖ}：aₙ₁, aₙ₂, …, aₙₖ, …（n₁&lt;n₂&lt;n₃&lt;…&lt;nₖ&lt;…），其中 aₙₖ∈[αₖ, βₖ]（k=1, 2, 3, …），<\/div>\n<div class=\"z\">由于 |aₙₖ-α|≤βₖ-αₖ，而 lim(k→∞)(βₖ-αₖ)=0。<\/div>\n<div class=\"z\">所以任给 ε&gt;0，存在正整数 K，当 k&gt;K 时，有 βₖ-αₖ&lt;ε，即 |aₙₖ-α|&lt;ε。<\/div>\n<div class=\"z\">所以 lim(k→∞)aₙₖ=α。<\/div>\n<p class=\"lb\">定理1.7 柯西（Cauchy）收敛准则<\/p>\n<div class=\"p\">数列 {aₙ} 收敛的充分必要条件是任给 ε&gt;0，存在正整数 N，<\/div>\n<div class=\"p\">使得当 n, m&gt;N 时，都有 |aₘ-aₙ|&lt;ε 成立。<\/div>\n<div class=\"z\">证：必要性。由题意知，{aₙ} 收敛，设<\/div>\n<div class=\"f\">lim(n→∞)aₙ=a。<\/div>\n<div class=\"z\">即任给 ε&gt;0，对 ε/2&gt;0，存在正整数 N，<\/div>\n<div class=\"z\">当 n&gt;N 时，有 |aₙ-a|&lt;ε/2 成立。<\/div>\n<div class=\"z\">当 m&gt;N 时，也有 |aₘ-a|&lt;ε/2 成立，<\/div>\n<div class=\"z\">于是 |aₘ-aₙ|=|aₘ-a+a-aₙ|≤|aₘ-a|+|aₙ-a|&lt;ε/2+ε/2=ε。<\/div>\n<div class=\"z\">充分性。由题意知，{aₙ} 满足：∀ε&gt;0，∃ 正整数 N，当 n, m&gt;N 时，有<\/div>\n<div class=\"f\">|aₘ-aₙ|&lt;ε。<\/div>\n<div class=\"z\">取 ε=1，存在正整数 N₀，当 m, n&gt;N₀ 时，有 |aₘ-aₙ|&lt;1。<\/div>\n<div class=\"z\">由于 N₀+1&gt;N₀，所以，当 n&gt;N₀ 时，有 |aₙ-aₙ₀₊₁|&lt;1，<\/div>\n<div class=\"z\">从而 |aₙ|≤|aₙ₀₊₁|+1，<\/div>\n<div class=\"z\">令 M=max{|a₁|, |a₂|, …, |aₙ₀|, |aₙ₀₊₁|+1}，<\/div>\n<div class=\"z\">就有 |aₙ|≤M（n=1, 2, 3, …），即 {aₙ} 有界。<\/div>\n<div class=\"z\">由魏尔斯特拉斯定理知，存在一个收敛子列 {aₙₖ}，设<\/div>\n<div class=\"f\">lim(k→∞)aₙₖ=a。<\/div>\n<div class=\"z\">由定义知，任给 ε&gt;0，对 ε/2&gt;0，存在正整数 K，当 k&gt;K 时，有 |aₙₖ-a|&lt;ε/2。（1.2）<\/div>\n<div class=\"z\">由题意知，对 ε/2&gt;0，存在正整数 N（取 N≥K），当 n, m&gt;N 时，都有 |aₙ-aₘ|&lt;ε/2。<\/div>\n<div class=\"z\">取 m=n_N₊₁≥N+1&gt;N，有 |aₙ-aₙ_N₊₁|&lt;ε/2。<\/div>\n<div class=\"z\">因此，当 n&gt;N 时，就有 |aₙ-a|=|aₙ-aₙ_N₊₁+aₙ_N₊₁-a|≤|aₙ-aₙ_N₊₁|+|aₙ_N₊₁-a|。<\/div>\n<div class=\"z\">由于 N+1&gt;N≥K，由式（1.2）知 |aₙ_N₊₁-a|&lt;ε/2，<\/div>\n<div class=\"z\">从而 |aₙ-a|&lt;ε/2+ε/2=ε，<\/div>\n<div class=\"z\">所以数列 {aₙ} 收敛于 a。<\/div>\n<p class=\"lb\">推论 数列极限的柯西准则另一形式<\/p>\n<div class=\"p\">数列 {aₙ} 收敛的充要条件是任给 ε&gt;0，存在正整数 N，<\/div>\n<div class=\"p\">当 n&gt;N 时，对一切正整数 p，都有 |aₙ₊ₚ-aₙ|&lt;ε 成立。<\/div>\n<p class=\"lb\">定理1.8 数列发散的柯西准则<\/p>\n<div class=\"p\">数列 {aₙ} 发散的充要条件是存在 ε₀&gt;0，<\/div>\n<div class=\"p\">对无论多么大的正整数 N，总存在 n₀&gt;N，存在正整数 p₀，使 |aₙ₀₊ₚ₀-aₙ₀|≥ε₀。<\/div>\n<p class=\"lb\">定理1.9 x→∞ 时极限存在的充要条件<\/p>\n<div class=\"p\">lim(x→∞)f(x)=A 的充要条件是<\/div>\n<div class=\"f\">lim(x→+∞)f(x)=lim(x→-∞)f(x)=A。<\/div>\n<p class=\"lb\">定理1.10 极限存在的充要条件（左、右极限）<\/p>\n<div class=\"p\">lim(x→x₀)f(x)=A 的充要条件是<\/div>\n<div class=\"f\">lim(x→x₀⁺)f(x)=A 且 lim(x→x₀⁻)f(x)=A。<\/div>\n<div class=\"p\"><span class=\"refgrp\">（见例5、例6）<\/span><\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>有理式数列极限（分子分母同除以 nᵏ）<\/b>（例13）<\/p>\n<p class=\"bullet\">• <b>用 ε-N 定义证明 ⁿ√a→1<\/b>（例12）<\/p>\n<h3>注<\/h3>\n<p class=\"lb note\">注：数列极限的四则运算前提是两个数列的极限都存在<\/p>\n<div class=\"p note\">注：数列极限的四则运算前提是两个数列的极限都存在，并可把数列极限推广到有限项极限的四则运算，但数列极限的运算法则不能推广到无限项。例如 lim(n→∞)(1/n+1/n+…+1/n)≠lim(n→∞)1/n+lim(n→∞)1/n+…+lim(n→∞)1/n=0。实际上 lim(n→∞)(1/n+1/n+…+1/n)=lim(n→∞)1=1。<span class=\"refgrp\">（见例11）<\/span><\/div>\n<p class=\"lb note\">夹逼定理是求较复杂数列极限的重要方法。（见例14、例15）<\/p>\n<div class=\"p note\">夹逼定理是求较复杂数列极限的重要方法。<span class=\"refgrp\">（见例14、例15）<\/span><\/div>\n<p class=\"lb note\">例16：当 β=0 时<\/p>\n<div class=\"p note\">例16：当 β=0 时，显然有 lim(n→∞)(1+1/n)^β=1。当 β 为正整数 m 时，lim(n→∞)(1+1/n)^m=lim(n→∞)(1+1/n)(1+1/n)…(1+1/n)=1×1×…×1=1。当 β 为负整数 -k 时，lim(n→∞)(1+1/n)^(-k)=lim(n→∞)1/(1+1/n)^k=1/1=1。一般地，设 [β]=m，则 m 是固定整数，且 m≤β&lt;m+1，并有 (1+1/n)^m≤(1+1/n)^β&lt;(1+1/n)^(m+1)，且 lim(n→∞)(1+1/n)^m=1，lim(n→∞)(1+1/n)^(m+1)=1，由夹逼定理知 lim(n→∞)(1+1/n)^β=1。<span class=\"refgrp\">（见例16）<\/span><\/div>\n<p class=\"lb note\">我们常用两个子列极限存在但不相等来判断一个数列发散。（见例17）<\/p>\n<div class=\"p note\">我们常用两个子列极限存在但不相等来判断一个数列发散。<span class=\"refgrp\">（见例17）<\/span><\/div>\n<p class=\"lb note\">单调有界定理只能证明数列极限存在<\/p>\n<div class=\"p note\">单调有界定理只能证明数列极限存在，如何求极限需用其他方法。由于改变数列的有限项不影响数列的敛散性和极限，所以数列从某一项开始单调有界结论依然成立。<\/div>\n<p class=\"lb note\">在求由递推关系式给出数列的极限时<\/p>\n<div class=\"p note\">在求由递推关系式给出数列的极限时，一定要先证明数列极限存在，再求极限，否则就犯了逻辑错误。<span class=\"refgrp\">（见例19）<\/span><\/div>\n<p class=\"lb note\">可以证明 e 是一个无理数<\/p>\n<div class=\"p note\">可以证明 e 是一个无理数，用十进制小数表示时，其前 13 位数字是 e≈2.718 281 828 459。在科学上最频繁使用的对数的底就是这个数 e=2.718 281 828 459…。这个底如此重要以至于以 e 为底的对数称为自然对数，并用 ln 来表示。在大部分计算器上既有 eˣ 键，也有 ln 键。e 似乎显得很神秘，使用以 2.718 28…为底的对数怎么可能自然呢？在后面的内容中，我们会发现很多结果都会与 e 有着密切的联系，而且以 e 为底时，很多计算公式的结果要比用任何其他底简洁得多。这个例子是一个重要的极限，从这个例子也可以发现一个有趣的结果：数列 {(1+1/n)ⁿ} 的每一项都是有理数，但它的极限 e 却是无理数。事实上，对任一无理数 μ，我们都可以构造一个有理数列 {aₙ}，使 lim(n→∞)aₙ=μ。<\/div>\n<p class=\"lb note\">例18 分析<\/p>\n<div class=\"p note\">例18：由于 x n+1=√(c+xₙ)，容易观察出 {xₙ} 是递增的，并可用数学归纳法证明。<\/div>\n<div class=\"p note\">关键是证明它有上界，哪一个数是 {xₙ} 的上界呢？我们观察不出来。<\/div>\n<div class=\"p note\">由于 {xₙ} 是递增的，所以，若 {xₙ} 的极限存在，则极限一定是它的一个上界。<\/div>\n<div class=\"p note\">若 {xₙ} 有极限，设 lim(n→∞)xₙ=a。<\/div>\n<div class=\"p note\">由于 x n+1=√(c+xₙ)，令 n→∞，有<\/div>\n<div class=\"f\">a=√(c+a)，<\/div>\n<div class=\"p note\">两边平方得<\/div>\n<div class=\"f\">a²-a-c=0，<\/div>\n<div class=\"p note\">解得<\/div>\n<div class=\"f\">a=(1±√(1+4c))/2。<\/div>\n<div class=\"p note\">由题意知 a&gt;0，所以<\/div>\n<div class=\"f\">a=(1+√(1+4c))/2。<\/div>\n<div class=\"p note\">由于 a 太复杂，我们对它作适当放大。<\/div>\n<div class=\"f\">a&lt;(1+√(1+4c+4√c))/2=(1+(1+2√c))/2=1+√c，<\/div>\n<div class=\"p note\">则必有<\/div>\n<div class=\"f\">xₙ≤1+√c。<\/div>\n<div class=\"p note\">证：我们先证明 {xₙ} 是递增的，即 xₙ&lt;x n+1。<\/div>\n<div class=\"p note\">由于 x₁=√c，x₂=√(c+√c)，显然 x₁&lt;x₂，即当 n=1 时成立。<\/div>\n<div class=\"p note\">假设当 n=k 时成立，即 x k&lt;x k+1。<\/div>\n<div class=\"p note\">现在证明当 n=k+1 时成立，当 n=k+1 时，<\/div>\n<div class=\"f\">c+x k&lt;c+x k+1，<\/div>\n<div class=\"p note\">有<\/div>\n<div class=\"f\">√(c+x k)&lt;√(c+x k+1)，<\/div>\n<div class=\"p note\">即<\/div>\n<div class=\"f\">x k+1&lt;x k+2，<\/div>\n<div class=\"p note\">所以当 n=k+1 时也成立。<\/div>\n<div class=\"p note\">因此，对一切正整数 n，都有 xₙ&lt;x n+1，即 {xₙ} 递增。<\/div>\n<div class=\"p note\">再证明 {xₙ} 有一个上界为 1+√c。<\/div>\n<div class=\"f\">x₁=√c&lt;1+√c，<\/div>\n<div class=\"p note\">即当 n=1 时成立。<\/div>\n<div class=\"p note\">假设当 n=k 时成立，即有<\/div>\n<div class=\"f\">x k&lt;1+√c。<\/div>\n<div class=\"p note\">当 n=k+1 时，有<\/div>\n<div class=\"f\">x k+1=√(c+x k)&lt;√(c+1+√c)&lt;√(1+2√c+c)=1+√c，<\/div>\n<div class=\"p note\">即当 n=k+1 时也成立。<\/div>\n<div class=\"p note\">所以对一切正整数 n，都有 xₙ&lt;1+√c，即 {xₙ} 有上界。<\/div>\n<div class=\"p note\">由单调有界定理知，{xₙ} 收敛。<\/div>\n<div class=\"p note\">设 lim(n→∞)xₙ=a，对 x n+1=√(c+xₙ)，令 n→∞，得<\/div>\n<div class=\"f\">a=√(c+a)，<\/div>\n<div class=\"p note\">即<\/div>\n<div class=\"f\">a²-a-c=0，<\/div>\n<div class=\"p note\">解得<\/div>\n<div class=\"f\">a=(1±√(1+4c))/2，<\/div>\n<div class=\"p note\">由 a&gt;0 知<\/div>\n<div class=\"f\">a=(1+√(1+4c))/2，<\/div>\n<div class=\"p note\">即<\/div>\n<div class=\"f\">lim(n→∞)xₙ=(1+√(1+4c))/2。（见例18）<\/div>\n<p class=\"lb note\">例20 分析<\/p>\n<div class=\"p note\">例20：由于 xₙ-x n-1=(1-x³ n-1)/(3x² n-1)，且 3x² n-1&gt;0，所以要判断 {xₙ} 是否单调，关键是判断分式的分子中 x³ n-1 与 1 之间的大小。<\/div>\n<div class=\"p note\">若 {xₙ} 收敛，设 lim(n→∞)xₙ=a，对 xₙ=(2x³ n-1+1)/(3x² n-1) 令 n→∞，有<\/div>\n<div class=\"f\">a=(2a³+1)/(3a²)，<\/div>\n<div class=\"p note\">解得<\/div>\n<div class=\"f\">a=1。<\/div>\n<div class=\"p note\">若 xₙ≥1，则 xₙ-x n-1&lt;0，即 {xₙ} 递减；若 xₙ≤1，则 {xₙ} 递增。<\/div>\n<div class=\"p note\">证：由于<\/div>\n<div class=\"f\">xₙ=(2x³ n-1+1)/(3x² n-1)=1/3(2x n-1+1/x² n-1)=1/3(x n-1+x n-1+1/x² n-1)≥∛(x n-1·x n-1·1/x² n-1)=1。（见例20）<\/div>\n<p class=\"lb note\">柯西收敛准则的优点在于无需借助数列以外的数 a<\/p>\n<div class=\"p note\">柯西收敛准则的优点在于无需借助数列以外的数 a，<\/div>\n<div class=\"p note\">只要根据数列本身的特征就可以判别它的敛散性。<\/div>\n<p class=\"lb note\">注：为了保证当 n&gt;N 时，对一切正整数 p<\/p>\n<div class=\"p note\">注：为了保证当 n&gt;N 时，对一切正整数 p，<\/div>\n<div class=\"p note\">都有 |aₙ₊ₚ-aₙ|&lt;ε 成立，N 应与 p 无关。<\/div>\n<p class=\"lb note\">由于 |f(x)-A|&lt;ε，即 A-ε&lt;f(x)&lt;A+ε<\/p>\n<div class=\"p note\">由于 |f(x)-A|&lt;ε，即 A-ε&lt;f(x)&lt;A+ε，<\/div>\n<div class=\"p note\">从而得到 lim(x→∞)f(x)=A 的几何意义是：<\/div>\n<div class=\"p note\">对于任给的 ε&gt;0，存在正数 X，当 |x|&gt;X 时，曲线 y=f(x) 上的点 (x, f(x)) 全部落在直线 y=A-ε 与 y=A+ε 之间的带形区域内（图1-10）。<\/div>\n<div class=\"p note\">（图略：带形区域 A-ε 与 A+ε 之间夹着曲线 y=f(x)，横轴上标出 -X 与 X）<\/div>\n<p class=\"lb note\">几何意义：对于任给的 ε&gt;0，存在 δ&gt;0，当 0&lt;|x-x₀|&lt;δ 时<\/p>\n<div class=\"p note\">几何意义：对于任给的 ε&gt;0，存在 δ&gt;0，当 0&lt;|x-x₀|&lt;δ 时，曲线 y=f(x) 上的点 (x, f(x)) 全部落在直线 y=A-ε 与 y=A+ε 之间的带形区域内（图1-11）。<\/div>\n<div class=\"p note\">（图略：带形区域 A-ε 与 A+ε 之间，横轴上标出 x₀-δ 与 x₀+δ）<\/div>\n<p class=\"lb note\">注：当 x₀ 为 ∞ 或 +∞ 或 -∞ 时，结论仍成立。<\/p>\n<div class=\"p note\">注：当 x₀ 为 ∞ 或 +∞ 或 -∞ 时，结论仍成立。<\/div>\n<h2 id=\"ch1_3\">四、无穷小量与无穷大量<span class=\"src\">选自 §3.5<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义1.19 无穷小量<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=0，则称 f(x) 是当 x→x₀ 时的无穷小量，这里 x₀ 可以是常数，也可以是 +∞，-∞ 或 ∞。<span class=\"refgrp\">（见例13）<\/span><\/div>\n<p class=\"lb\">定义1.20 有界量<\/p>\n<div class=\"p\">若存在 x₀ 的某空心邻域 Ů(x₀)，f(x) 在 Ů(x₀) 内有界，则称 f(x) 当 x→x₀ 时是有界量。<\/div>\n<div class=\"p\">这个定义的否定陈述就是无界量定义。<\/div>\n<p class=\"lb\">定义1.21 无界量<\/p>\n<div class=\"p\">对 x₀ 无论多么小的空心邻域 Ů(x₀, δ)，任给 M&gt;0，存在 x′∈Ů(x₀, δ)，|f(x′)|&gt;M，称 f(x) 当 x→x₀ 时是无界量。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">性质5 推论 常函数与恒等函数的极限<\/p>\n<div class=\"p\">按定义，容易证明 lim(x→x₀)c=c（c 为常数），lim(x→x₀)x=x₀。<\/div>\n<p class=\"lb\">性质5 推论 多项式与有理函数的极限<\/p>\n<div class=\"p\">设 Pₙ(x)=a₀xⁿ+a₁xⁿ⁻¹+…+aₙ₋₁x+aₙ，n 为正整数，由极限的四则运算性质，可得<\/div>\n<div class=\"f\">lim(x→x₀)Pₙ(x)=a₀x₀ⁿ+a₁x₀ⁿ⁻¹+…+aₙ₋₁x₀+aₙ=Pₙ(x₀)；<\/div>\n<div class=\"p\">设 Qₘ(x)=b₀xᵐ+b₁xᵐ⁻¹+…+bₘ₋₁x+bₘ，若 Qₘ(x₀)≠0，则<\/div>\n<div class=\"f\">lim(x→x₀)(Pₙ(x)/Qₘ(x))=(lim(x→x₀)Pₙ(x))/(lim(x→x₀)Qₘ(x))=Pₙ(x₀)/Qₘ(x₀)；<\/div>\n<div class=\"p\">lim(x→∞)((a₀xⁿ+a₁xⁿ⁻¹+…+aₙ₋₁x+aₙ)/(b₀xᵐ+b₁xᵐ⁻¹+…+bₘ₋₁x+bₘ))=a₀/b₀（n=m），0（n&lt;m），其中 a₀，b₀ 为常数且不为 0，n，m 为正整数。<\/div>\n<p class=\"lb\">性质6 复合函数的极限<\/p>\n<div class=\"p\">设 y=f(u)，u=φ(x)，若 lim(x→x₀)φ(x)=u₀，lim(u→u₀)f(u)=A，<\/div>\n<div class=\"p\">且存在 x₀ 的某邻域 U(x₀, δ′)，当 x∈Ů(x₀, δ′) 时，φ(x)≠u₀，则<\/div>\n<div class=\"f\">lim(x→x₀)f(φ(x))=lim(u→u₀)f(u)=A。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：由于 lim(u→u₀)f(u)=A，所以，任给 ε&gt;0，存在 η&gt;0，使得当 0&lt;|u-u₀|&lt;η 时，<\/div>\n<div class=\"f\">|f(u)-A|&lt;ε；<\/div>\n<div class=\"z\">又因为 lim(x→x₀)φ(x)=u₀，所以对上述 η&gt;0，存在 δ₁&gt;0，当 0&lt;|x-x₀|&lt;δ₁ 时，<\/div>\n<div class=\"f\">|φ(x)-u₀|&lt;η。<\/div>\n<div class=\"z\">取 δ=min{δ′, δ₁}，当 0&lt;|x-x₀|&lt;δ 时，有 0&lt;|φ(x)-u₀|&lt;η，从而有<\/div>\n<div class=\"p\">|f(φ(x))-A|&lt;ε，即 lim(x→x₀)f(φ(x))=lim(u→u₀)f(u)=A。□<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理1.11 夹逼定理<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=lim(x→x₀)g(x)=A，且存在 x₀ 的某空心邻域 Ů(x₀, δ′)，<\/div>\n<div class=\"p\">使得对一切 x∈Ů(x₀, δ′)，都有 f(x)≤h(x)≤g(x)，则 lim(x→x₀)h(x)=A。<span class=\"refgrp\">（见例11）<\/span><\/div>\n<p class=\"lb\">定理1.12 归结原则或海涅（Heine）定理<\/p>\n<div class=\"p\">设 f(x) 在 x₀ 的某空心邻域 Ů(x₀) 内有定义，则 lim(x→x₀)f(x) 存在的充要条件是<\/div>\n<div class=\"p\">对任何以 x₀ 为极限且含于 Ů(x₀) 的数列 {xₙ}，极限 lim(n→∞)f(xₙ) 都存在且相等。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：必要性. 由于 lim(x→x₀)f(x)=A，所以任给 ε&gt;0，存在 δ&gt;0，当 0&lt;|x-x₀|&lt;δ 时，<\/div>\n<div class=\"f\">|f(x)-A|&lt;ε。<\/div>\n<div class=\"z\">对任何 xₙ∈Ů(x₀) 且 lim(n→∞)xₙ=x₀，由 xₙ∈Ů(x₀) 知 xₙ≠x₀，lim(n→∞)xₙ=x₀。根据定义，对上述的 δ&gt;0，存在正整数 N，当 n&gt;N 时，有 0&lt;|xₙ-x₀|&lt;δ，从而有<\/div>\n<div class=\"p\">|f(xₙ)-A|&lt;ε。即 lim(n→∞)f(xₙ)=A。<\/div>\n<div class=\"z\">充分性. 若 lim(n→∞)f(xₙ)=A，用反证法. 假设 lim(x→x₀)f(x)≠A，则存在 ε₀&gt;0，对无论多么小的 δ&gt;0，总存在一点 x′，尽管 0&lt;|x′-x₀|&lt;δ，但有 |f(x′)-A|≥ε₀。<\/div>\n<div class=\"z\">设 f(x) 在空心邻域 Ů(x₀, δ′) 内有定义，现依次取 δ=δ′/2，δ′/2²，…，δ′/2ⁿ，…，则存在相应的 x₁，x₂，…，xₙ，…，尽管 0&lt;|x₁-x₀|&lt;δ′/2，但 |f(x₁)-A|≥ε₀；0&lt;|x₂-x₀|&lt;δ′/2²，但 |f(x₂)-A|≥ε₀；…；0&lt;|xₙ-x₀|&lt;δ′/2ⁿ，但 |f(xₙ)-A|≥ε₀；…。<\/div>\n<div class=\"z\">显然数列 {xₙ}⊂Ů(x₀, δ′)，且 lim(n→∞)xₙ=x₀。但对任何 n，f(xₙ) 与 A 的距离始终大于 ε₀，这与 lim(n→∞)f(xₙ)=A 相矛盾，所以假设不成立。因此 lim(x→x₀)f(x)=A。□<\/div>\n<p class=\"lb\">定理1.13 极限不存在的充要条件<\/p>\n<div class=\"p\">f(x) 当 x→x₀ 时极限不存在的充要条件是（1）存在 {xₙ′}，{xₙ″}⊂Ů(x₀)，lim(n→∞)xₙ′=x₀，lim(n→∞)xₙ″=x₀，lim(n→∞)f(xₙ′)=A，lim(n→∞)f(xₙ″)=B，A≠B；<\/div>\n<div class=\"p\">或（2）存在 {xₙ}⊂Ů(x₀)，lim(n→∞)xₙ=x₀，使 lim(n→∞)f(xₙ) 不存在。<\/div>\n<div class=\"p\">我们常常用（1）证明 lim(x→x₀)f(x) 不存在。<span class=\"refgrp\">（见例12）<\/span><\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：例12 证明 lim(x→+∞)sin x 不存在。取 xₙ′=2nπ，n 是正整数，lim(n→∞)xₙ′=+∞，lim(n→∞)sin 2nπ=0；<\/div>\n<div class=\"z\">取 xₙ″=2nπ+π/2，lim(n→∞)xₙ″=+∞，lim(n→∞)sin(2nπ+π/2)=1，由于 0≠1，所以 lim(x→+∞)sin x 不存在。□<\/div>\n<p class=\"lb\">定理1.14 充分条件<\/p>\n<div class=\"p\">单调有界函数必有单侧极限。现就 x→x₀⁺ 与 x→-∞ 的两种情形、分别叙述如下：<\/div>\n<div class=\"p\">（1）若 f(x) 在 U₋(x₀) 内递增（或递减）有上界（或下界），则 lim(x→x₀⁻)f(x) 存在；<\/div>\n<div class=\"p\">（2）若 f(x) 在 (-∞, a) 内递增（或递减）有下界（或上界），则 lim(x→-∞)f(x) 存在。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：（1）不妨设 f(x) 在 U₋(x₀, δ′) 内递减有下界。记 Y={f(x): x∈(x₀-δ′, x₀)，δ′&gt;0} 有下界，由确界原理知，必有下确界 β=inf Y，于是①当 x∈(x₀-δ′, x₀) 时，f(x)≥β。②任给 ε&gt;0，存在 x′∈(x₀-δ′, x₀)，f(x′)∈Y，f(x′)&lt;β+ε。<\/div>\n<div class=\"z\">由于 f(x) 递减，当 x′&lt;x&lt;x₀ 时，有 β-ε≤β≤f(x)≤f(x′)&lt;β+ε，取 x₀-x′=δ，当 x₀-δ&lt;x&lt;x₀ 时，都有 |f(x)-β|&lt;ε。按定义有 lim(x→x₀⁻)f(x)=β。□<\/div>\n<div class=\"z\">对于（2）的证明及 x→x₀⁺，x→+∞ 的叙述及证明，留作练习，请读者完成。<\/div>\n<p class=\"lb\">定理1.15 柯西收敛准则<\/p>\n<div class=\"p\">设 f(x) 在 x₀ 的某空心邻域 Ů(x₀) 内有定义，lim(x→x₀)f(x) 存在的充要条件是<\/div>\n<div class=\"p\">任给 ε&gt;0，总存在 δ&gt;0，当 x′，x″∈Ů(x₀)，且 0&lt;|x′-x₀|&lt;δ，0&lt;|x″-x₀|&lt;δ 时，都有<\/div>\n<div class=\"f\">|f(x′)-f(x″)|&lt;ε。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：必要性. 设 lim(x→x₀)f(x)=A，即任给 ε&gt;0，存在 δ&gt;0，当 0&lt;|x-x₀|&lt;δ 时，都有<\/div>\n<div class=\"f\">|f(x)-A|&lt;ε/2。<\/div>\n<div class=\"z\">当 0&lt;|x′-x₀|&lt;δ，0&lt;|x″-x₀|&lt;δ 时，有 |f(x′)-A|&lt;ε/2，|f(x″)-A|&lt;ε/2，则<\/div>\n<div class=\"f\">|f(x′)-f(x″)|=|f(x′)-A+A-f(x″)|≤|f(x′)-A|+|f(x″)-A|&lt;ε/2+ε/2=ε。<\/div>\n<div class=\"z\">充分性. 由条件知任给 ε&gt;0，存在 δ&gt;0，当 x′，x″∈Ů(x₀) 且 0&lt;|x′-x₀|&lt;δ，0&lt;|x″-x₀|&lt;δ 时，都有<\/div>\n<div class=\"f\">|f(x′)-f(x″)|&lt;ε。<\/div>\n<div class=\"z\">对数列 {xₙ}⊂Ů(x₀)，lim(n→∞)xₙ=x₀，由数列极限的定义知，对上述的 δ&gt;0，存在正整数 N，当 n&gt;N 时，都有 0&lt;|xₙ-x₀|&lt;δ，当 m&gt;N 时，有 0&lt;|xₘ-x₀|&lt;δ，所以有<\/div>\n<div class=\"f\">|f(xₘ)-f(xₙ)|&lt;ε。<\/div>\n<div class=\"z\">由数列极限的柯西收敛准则知 {f(xₙ)} 收敛，设 lim(n→∞)f(xₙ)=A。设任一数列 {yₙ}⊂Ů(x₀)，lim(n→∞)yₙ=x₀，如上所证，lim(n→∞)f(yₙ) 存在，记为 B，现证 A=B。<\/div>\n<div class=\"z\">设 {zₙ}=x₁，y₁，x₂，y₂，…，xₙ，yₙ，…，则 {zₙ}⊂Ů(x₀)，lim(n→∞)zₙ=x₀，如上所证 {f(zₙ)} 收敛，于是 {f(zₙ)} 的两个子列 {f(xₙ)}，{f(yₙ)} 极限存在且相等，则 A=B。<\/div>\n<div class=\"z\">由归结原则知 lim(x→x₀)f(x)=A。□<\/div>\n<div class=\"z\">对于 x→x₀⁻，x→x₀⁺，x→+∞，x→-∞，x→∞ 的情形，读者可相应地叙述出来，并可类似证明.<\/div>\n<p class=\"lb\">定理1.16 极限不存在的充要条件<\/p>\n<div class=\"p\">极限 lim(x→x₀)f(x) 不存在的充要条件是存在 ε₀&gt;0，对无论多么小的 δ&gt;0，总存在 x′，x″∈Ů(x₀)，<\/div>\n<div class=\"p\">尽管 0&lt;|x′-x₀|&lt;δ，0&lt;|x″-x₀|&lt;δ，但是<\/div>\n<div class=\"f\">|f(x′)-f(x″)|≥ε₀。<\/div>\n<p class=\"lb\">定理1.17 无穷小量与极限的关系<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=A，则 f(x)-A 当 x→x₀ 时是无穷小量或者<\/div>\n<div class=\"p\">f(x)=A+α(x)，其中 α(x)→0（x→x₀）。<\/div>\n<h3>注<\/h3>\n<p class=\"bullet\">• <b>由性质6，我们可得到求极限的一个重要方法——变量替换法，即 lim(x→x₀)f(φ(x)) 令 φ(x)=u，当 x→x₀ 时，φ(x)→u₀，等于 lim(u→u₀)f(u)=A。（见例9、例10）以后这个变量代换过程可省去。<\/b>（例9例10）<\/p>\n<p class=\"bullet\">• <b>归结原则的意义在于把函数极限归结为数列极限问题来处理，从而我们能通过归结原则和数列极限的有关定理来解决一些问题，比如我们可以证明函数极限的唯一性、局部有界性、局部保号性、不等式性质、四则运算法则及夹逼定理。<\/b><\/p>\n<p class=\"lb note\">无穷小量注<\/p>\n<div class=\"p note\">无穷小量不是很小的量，而是一类特殊的以 0 为极限的变量，它依赖于某个无限变化过程。<\/div>\n<div class=\"p note\">用 ε-δ 定义叙述则为：任给 ε&gt;0，存在 δ&gt;0，当 0&lt;|x-x₀|&lt;δ 时，都有 |f(x)|&lt;ε。<span class=\"refgrp\">（见例13）<\/span><\/div>\n<h2 id=\"ch1_4\">五、函数的连续性<span class=\"src\">选自 §4.1、§4.2、§4.3、§4.4<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义1.22 无穷小量阶的比较<\/p>\n<div class=\"p\">设 lim(x→x₀)f(x)=0，lim(x→x₀)g(x)=0，那么，我们如何来判断当 x→x₀ 时 f(x)，g(x) 趋于 0 的快慢程度呢？<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=0，则称当 x→x₀ 时，f(x) 是比 g(x) 高阶的无穷小量，记作 f(x)=o(g(x))（x→x₀）。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=c≠0，则称当 x→x₀ 时，f(x) 与 g(x) 是同阶的无穷小量。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=1，则称当 x→x₀ 时，f(x) 与 g(x) 是等价无穷小量。记作 f(x)~g(x)（x→x₀）。<\/div>\n<div class=\"p\">lim(x→x₀)(f(x)/g(x))=c≠0 也可记作 f(x)~cg(x)（x→x₀）。<\/div>\n<div class=\"p\">特别地，若 lim(x→x₀⁺)(f(x)/(x-x₀)ᵏ)=c≠0 时（k&gt;0 为常数），则称 f(x) 当 x→x₀⁺ 时是 (x-x₀) 的 k 阶无穷小量。<\/div>\n<p class=\"lb\">定义1.23 无穷大量<\/p>\n<div class=\"p\">设 f(x) 在 x₀ 的某邻域内有定义，任给 M&gt;0，总存在 δ&gt;0，当 x∈Ů(x₀, δ) 时，都有 |f(x)|&gt;M，则称 f(x) 是当 x→x₀ 时的无穷大量，记作 lim(x→x₀)f(x)=∞ 或 f(x)→∞（x→x₀）。<\/div>\n<div class=\"p\">若定义中 |f(x)|&gt;M，换成 f(x)&gt;M，则称 f(x) 是当 x→x₀ 时的正无穷大量，记作 lim(x→x₀)f(x)=+∞ 或 f(x)→+∞（x→x₀）。<\/div>\n<div class=\"p\">若定义中 |f(x)|&gt;M 换成 f(x)&lt;-M，则称 f(x) 是当 x→x₀ 时的负无穷大量，记作 lim(x→x₀)f(x)=-∞ 或 f(x)→-∞（x→x₀）。<\/div>\n<p class=\"lb\">无穷大量的阶的比较<\/p>\n<div class=\"p\">对于无穷大量，趋于无穷大的速度也有快慢之分。设 lim(x→x₀)f(x)=∞，lim(x→x₀)g(x)=∞。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=0，则称当 x→x₀ 时，f(x) 是比 g(x) 低阶的无穷大量，或 g(x) 是比 f(x) 高阶的无穷大量。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=c≠0，则称当 x→x₀ 时，f(x) 与 g(x) 是同阶无穷大量。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=1，则称当 x→x₀ 时，f(x) 与 g(x) 是等价无穷大量，记作 f(x)~g(x)（x→x₀）。<\/div>\n<div class=\"p\">尤其是等价这个概念，非常重要，我们可推广到一般的等价量。<\/div>\n<div class=\"p\">若 lim(x→x₀)(f(x)/g(x))=1，称当 x→x₀ 时，f(x) 与 g(x) 是等价的量，记作 f(x)~g(x)（x→x₀）。例如 lim(x→x₀)f(x)=A，若 A≠0，则 f(x)~A（x→x₀）。<\/div>\n<p class=\"lb\">复利<\/p>\n<div class=\"p\">如果支付利息的方式比一年一次频繁得多且利息不被取出，则对投资者是有利的，因为可用利息赚取利息，这种效果称为复式的。<\/div>\n<p class=\"lb\">年有效收益<\/p>\n<div class=\"p\">由于在一年支付四次，复利为年利率 8% 的条件下投 100 元，一年之后可增加到 108.24 元，我们就说在这种情形下年有效收益为 8.24%。<\/div>\n<p class=\"lb\">票面利率（APR）<\/p>\n<div class=\"p\">银行称 8% 为年百分率（或年利率）或 APR（annual percentage rate），我们也称为票面利率（票面的意思是“仅在名义上”）。<\/div>\n<div class=\"p\">然而，正是年有效收益确切地告诉你一笔投资所得的利息究竟有多少。<\/div>\n<p class=\"lb\">连续复利<\/p>\n<div class=\"p\">当年有效收益达到这一上界（7.250 82%）时，我们就说这种利息是连续支付的复利（使用“连续”一词，是因为随着复利支付次数越来越频繁，前后每两次支付的时间越来越接近，该上界被不断地趋近）。<\/div>\n<div class=\"p\">因此，当一个 7% 的票面年利率，其复利支付次数频繁得使年有效收益为 7.250 82% 时，我们就说 7% 是连续支付的复利，这是从 7% 的票面利率中能够取到的最大收益。<\/div>\n<div class=\"p\">在现实世界中，有许多事物的变化都类似连续复利。<\/div>\n<div class=\"p\">例如，放射物质的衰变；细胞的繁殖；物体被周围介质冷却或加热；大气随地面上的高度的变化而变化；电路接通或切断时，直流电流的产生或消失过程，等等。<\/div>\n<p class=\"lb\">将来值<\/p>\n<div class=\"p\">今天的 100 元可以购得一年后用 107 元购得的东西，我们说 107 元是 100 元的将来值。<\/div>\n<div class=\"p\">一般地，一笔 P 元的付款的将来值 B 元是指这样的一笔款额，你把它（P 元）今天存入银行账户而将来指定时刻其加上利息正好等于 B 元。<\/div>\n<p class=\"lb\">现值<\/p>\n<div class=\"p\">而 100 元是 107 元的现值。<\/div>\n<p class=\"lb\">定义1.24 函数在点 x₀ 处连续<\/p>\n<div class=\"p\">若 f(x) 在 x₀ 的某邻域 U(x₀) 内有定义，且 lim(x→x₀)f(x)=f(x₀)，则称函数 y=f(x) 在点 x=x₀ 处连续。用 ε-δ 语言叙述为：设 f(x) 在 x₀ 的某邻域内有定义，任给 ε&gt;0，总存在 δ&gt;0，当 |x-x₀|&lt;δ 时，都有<\/div>\n<div class=\"p\">|f(x)-f(x₀)|&lt;ε，则称 y=f(x) 在点 x=x₀ 处连续。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">无穷小量的性质<\/p>\n<div class=\"p\">（1）有限多个无穷小量之和仍是无穷小量；（2）有限多个无穷小量之积仍是无穷小量；<\/div>\n<div class=\"p\">（3）无穷小量与有界量之积仍是无穷小量。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：现证（3）. 设 lim(x→x₀)f(x)=0，g(x) 当 x→x₀ 时是有界量. 由定义知，存在 x₀ 的一个空心邻域 Ů(x₀, δ₁)，存在常数 M&gt;0，当 x∈Ů(x₀, δ₁) 时，<\/div>\n<div class=\"f\">|g(x)|≤M。<\/div>\n<div class=\"z\">任给 ε&gt;0，存在 δ₂&gt;0，当 x∈Ů(x₀, δ₂) 时，都有<\/div>\n<div class=\"p\">|f(x)|&lt;ε/M。取 δ=min{δ₁, δ₂}，当 x∈Ů(x₀, δ) 时，都有<\/div>\n<div class=\"p\">|f(x)g(x)|&lt;(ε/M)M=ε。即 lim(x→x₀)f(x)g(x)=0。□<\/div>\n<p class=\"lb\">无穷大量的性质<\/p>\n<div class=\"p\">（1）有限个无穷大量之积仍是无穷大量；（2）无穷大量与有界量之和仍是无穷大量。<\/div>\n<div class=\"p\">以上两条性质读者自证。<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理1.18 无穷小量与无穷大量的关系<\/p>\n<div class=\"p\">若 lim(x→x₀)f(x)=∞，则 lim(x→x₀)(1/f(x))=0。<\/div>\n<div class=\"p\">若 lim(x→x₀)f(x)=0，且存在 x₀ 的某空心邻域 Ů(x₀)，当 x∈Ů(x₀) 时，f(x)≠0，则 lim(x→x₀)(1/f(x))=∞。<\/div>\n<div class=\"p\">简述为：无穷大量的倒数是无穷小量，无穷小量（当 x 充分接近 x₀ 时不等于 0）的倒数为无穷大量（请读者自证）。<span class=\"refgrp\">（见例15、例16）<\/span><\/div>\n<p class=\"lb\">重要极限1<\/p>\n<div class=\"p\">lim(x→0) sin x/x = 1。<\/div>\n<div class=\"f\">（见例17、例18）<\/div>\n<div class=\"z\">证：<\/div>\n<div class=\"z\">设 0&lt;x&lt;π/2，作一个单位圆如图 1-12 所示，显然有 △OAB 面积&lt;扇形 OAB 面积&lt;△OAC 面积。<\/div>\n<div class=\"p\">即 (1/2)·1·sin x &lt; (1/2)·1²·x &lt; (1/2)·1·tan x，有<\/div>\n<div class=\"f\">sin x &lt; x &lt; sin x/cos x（0&lt;x&lt;π/2），<\/div>\n<div class=\"p\">上式同除以 sin x，得<\/div>\n<div class=\"f\">1 &lt; x/sin x &lt; 1/cos x，<\/div>\n<div class=\"p\">从而有<\/div>\n<div class=\"f\">cos x &lt; sin x/x &lt; 1，<\/div>\n<div class=\"p\">由于 cos x = 1+cos x-1 = 1-2sin²(x/2) &gt; 1-2·x²/4 = 1-x²/2，即<\/div>\n<div class=\"f\">1-x²/2 &lt; cos x &lt; sin x/x &lt; 1（0&lt;x&lt;π/2），<\/div>\n<div class=\"p\">而 lim(x→0⁺)(1-x²/2) = 1，lim(x→0⁺)1 = 1，根据夹逼定理知 lim(x→0⁺) sin x/x = 1，且 lim(x→0⁺) cos x = 1。<\/div>\n<div class=\"p\">又有 lim(x→0⁻) sin x/x =（令 x=-t）lim(t→0⁺) sin(-t)/(-t) = lim(t→0⁺) sin t/t = 1，所以<\/div>\n<div class=\"f\">lim(x→0) sin x/x = 1。<\/div>\n<div class=\"p\">（图略：作单位圆与 x 轴交于 A，∠AOB = x（0&lt;x&lt;π/2），过 A 作 x 轴的垂线与 OB 的延长线交于 C，BD⊥OA 于 D）<\/div>\n<p class=\"lb\">重要极限2<\/p>\n<div class=\"p\">lim(x→∞)(1+1/x)^x = e。<\/div>\n<div class=\"f\">（见例20、例21）<\/div>\n<div class=\"z\">证：<\/div>\n<div class=\"z\">先证明 lim(x→+∞)(1+1/x)^x = e。<\/div>\n<div class=\"p\">设 1&lt;x&lt;+∞，令 [x]=n，则 n≤x&lt;n+1，由此得<\/div>\n<div class=\"f\">(1+1/(n+1))^n ≤ (1+1/(n+1))^x &lt; (1+1/x)^x ≤ (1+1/n)^x &lt; (1+1/n)^(n+1)，<\/div>\n<div class=\"p\">由 x→+∞ 有 n→∞，于是<\/div>\n<div class=\"f\">lim(x→+∞)(1+1/(n+1))^n = lim(n→∞)(1+1/(n+1))^n = lim(n→∞) ((1+1/(n+1))^(n+1))/(1+1/(n+1)) = e，<\/div>\n<div class=\"f\">lim(x→+∞)(1+1/n)^(n+1) = lim(n→∞)(1+1/n)^n·(1+1/n) = e，<\/div>\n<div class=\"p\">从而由夹逼定理知<\/div>\n<div class=\"f\">lim(x→+∞)(1+1/x)^x = e。<\/div>\n<div class=\"p\">再证明 lim(x→-∞)(1+1/x)^x = e。<\/div>\n<div class=\"p\">由于 lim(x→-∞)(1+1/x)^x =（令 x=-y）lim(y→+∞)(1-1/y)^(-y) = lim(y→+∞)(y/(y-1))^y = lim(y→+∞)(1+1/(y-1))^(y-1)·(1+1/(y-1)) = e·1 = e，即<\/div>\n<div class=\"f\">lim(x→-∞)(1+1/x)^x = e。<\/div>\n<div class=\"p\">综合得<\/div>\n<div class=\"f\">lim(x→∞)(1+1/x)^x = e。<\/div>\n<p class=\"lb\">定理1.19 等价量替换定理<\/p>\n<div class=\"p\">若（1）f(x)~f₁(x)，g(x)~g₁(x)，h(x)~h₁(x)（x→x₀）；（2）lim(x→x₀) f₁(x)g₁(x)/h₁(x) = A（或∞），则<\/div>\n<div class=\"f\">lim(x→x₀) f(x)g(x)/h(x) = lim(x→x₀) f₁(x)g₁(x)/h₁(x) = A（或∞）。<\/div>\n<div class=\"p\"><span class=\"refgrp\">（见例22、例23）<\/span><\/div>\n<div class=\"z\">证：lim(x→x₀) f(x)g(x)/h(x) = lim(x→x₀) f₁(x)g₁(x)/h₁(x)·f(x)/f₁(x)·g(x)/g₁(x)·h₁(x)/h(x) = A·1·1·1 = A（或∞），即 lim(x→x₀) f(x)g(x)/h(x) = lim(x→x₀) f₁(x)g₁(x)/h₁(x) = A（或∞）。<\/div>\n<h3>注<\/h3>\n<p class=\"lb note\">无穷小量与有界量之积的用法<\/p>\n<div class=\"p note\">由于当 x→0 时，x 是无穷小量，sin(1/x) 是有界量，所以<\/div>\n<div class=\"p note\">lim(x→0)x sin(1/x)=0。<span class=\"refgrp\">（见例14）<\/span><\/div>\n<p class=\"lb note\">无穷小量之和的注<\/p>\n<div class=\"p note\">无限个无穷小量之和不一定是无穷小量。例如，<\/div>\n<div class=\"p note\">lim(n→∞)1/n=0，而<\/div>\n<div class=\"f\">lim(n→∞)(1/n+1/n+…+1/n)（n 个）=1。<\/div>\n<div class=\"p note\">从这个例子我们可以看出有限与无限的本质区别。无限的奥妙也使我们认识到一些结果必须通过推理证明才能予以接受。<\/div>\n<div class=\"p note\">换句话说，我们认为是正确的命题，要给予证明；我们认为是不正确的命题，要举一个例子说明。<\/div>\n<p class=\"lb note\">无穷小量阶的记号注<\/p>\n<div class=\"p note\">f(x)=o(g(x))（x→x₀）是一个记号，仅表示<\/div>\n<div class=\"p note\">lim(x→x₀)(f(x)/g(x))=0，不要理解为等式。<\/div>\n<p class=\"lb note\">无穷大量的注<\/p>\n<div class=\"p note\">无穷大量仍属于极限不存在之列，之所以还用极限的记号，是因为无穷大量当 x→x₀ 时具有按绝对值无限增大的趋势，故以符号「∞」作为它的极限，但 ∞ 不是一个数。<\/div>\n<div class=\"p note\">我们把这种极限叫做无穷极限，与趋于实数的极限（叫做有穷极限）有着本质的区别。我们说极限存在，指的是趋于某一个实数的极限。<\/div>\n<p class=\"lb note\">无穷大量之和的注<\/p>\n<div class=\"p note\">有限个无穷大量之和不一定是无穷大量，请读者自己举反例说明。<\/div>\n<p class=\"lb note\">无穷大量的运算注<\/p>\n<div class=\"p note\">或者直接写<\/div>\n<div class=\"p note\">lim(x→1)(1/(1-x²))=∞，但不能写成<\/div>\n<div class=\"p note\">lim(x→1)(1/(1-x²))=1/0=∞。<span class=\"refgrp\">（见例15）<\/span><\/div>\n<p class=\"lb note\">余弦极限的证明<\/p>\n<div class=\"p note\">在求极限的过程中，我们已证 lim(x→0⁺) cos x = 1，且 lim(x→0⁻) cos x =（令 x=-t）lim(t→0⁺) cos t = 1，所以 lim(x→0) cos x = 1。<\/div>\n<p class=\"lb note\">重要极限的推广式<\/p>\n<div class=\"p note\">在求极限时，我们经常用的是 lim(x→x₀) sin f(x)/f(x) = 1（当 x→x₀ 时，f(x)→0）。<\/div>\n<div class=\"p note\">事实上 lim(x→x₀) sin f(x)/f(x) =（令 f(x)=t）lim(t→0) sin t/t = 1。<\/div>\n<p class=\"lb note\">两个重要极限的推论<\/p>\n<div class=\"p note\">在证明 lim(x→0) sin x/x = 1 的过程中，我们还证明了 sin x &lt; x（0&lt;x&lt;π/2）。<\/div>\n<div class=\"p note\">实际上，我们可以证明 |sin x| ≤ |x|（x∈R），等号当且仅当 x=0 时成立。<\/div>\n<div class=\"p note\">事实上，当 x=0 时，|sin x| = 0 = |x|；当 0&lt;x&lt;π/2 时，|sin x| = sin x &lt; x = |x|；当 x≥π/2 时，|sin x| ≤ 1 &lt; π/2 ≤ x；当 x&lt;0 时，|sin x| = |sin(-x)| &lt; |-x| = |x|。<\/div>\n<div class=\"p note\">因此 |sin x| ≤ |x|。<\/div>\n<div class=\"p note\">这是一个重要的不等式，请大家记住。<\/div>\n<p class=\"lb note\">等价无穷小<\/p>\n<div class=\"p note\">当 x→0 时，sin x~x，tan x~x，1-cos x~(1/2)x²。<span class=\"refgrp\">（见例19）<\/span><\/div>\n<p class=\"lb note\">重要极限的推广式<\/p>\n<div class=\"p note\">若令 1/x = t，则 lim(t→0)(1+t)^(1/t) = e。<\/div>\n<div class=\"p note\">若 x→x₀ 时，f(x)→0，则 lim(x→x₀)(1+f(x))^(1/f(x)) = e。<\/div>\n<p class=\"lb note\">等价量替换的使用<\/p>\n<div class=\"p note\">这个定理告诉我们，在求函数极限时，分子、分母中的因式可用它们的简单的等价量来替换，以便进行化简。<\/div>\n<div class=\"p note\">但替换以后的函数极限要存在或为无穷大。<\/div>\n<div class=\"p note\">需要注意的是，分子、分母中进行加减的项不能替换，应分解因式，用因式来替换。<\/div>\n<p class=\"lb note\">等价量替换的反例<\/p>\n<div class=\"p note\">注：这里 sin x，1-cos x，cos x 都是因式，而且，如前所述，当 x→0 时，有 sin x~x，1-cos x~(1/2)x²，cos x~1。<\/div>\n<div class=\"p note\">但是以下做法是错误的：由于 tan x~x，sin x~x（x→0），因此 lim(x→0)(tan x-sin x)/x³ = lim(x→0)(x-x)/x³ = lim(x→0) 0/x³ = 0。<\/div>\n<p class=\"lb note\">每年多次复利<\/p>\n<div class=\"p note\">随着年份的延续，由于利息赚利息，每年四次复利可赚更多的钱。<\/div>\n<div class=\"p note\">所以，付复利的次数越频繁可赚取的钱越多（尽管差别不是很大）。<span class=\"refgrp\">（见例24）<\/span><\/div>\n<p class=\"lb note\">年有效收益的比较<\/p>\n<div class=\"p note\">为比较两种银行账户，只需比较年有效收益。<span class=\"refgrp\">（见例25）<\/span><\/div>\n<p class=\"lb note\">复利余额公式<\/p>\n<div class=\"p note\">如果年利率为 r（票面利率）的利息一年支付 n 次，那么当初始存款为 P 元时，t 年后的余额 A_t 为 A_t = P(1+r/n)^(nt)（r 是票面利率）。<\/div>\n<p class=\"lb note\">连续复利余额公式<\/p>\n<div class=\"p note\">如果初始存款为 P 元的利息水平是年利率为 r 的连续复利，则 t 年后，余额 B 可用以下公式计算：B = Pe^(rt)。<\/div>\n<p class=\"lb note\">复利计息说明<\/p>\n<div class=\"p note\">在解有关复利的问题时，重要的是弄清利率是票面利率还是年有效收益，以及复利是否为连续的。<\/div>\n<p class=\"lb note\">年复利公式<\/p>\n<div class=\"p note\">一笔 P 元的存款，以年复利方式计息，年利率为 r，在 t 年后的将来，余额为 B 元，那么有 B = P(1+r)^t 或 P = B/(1+r)^t。<\/div>\n<p class=\"lb note\">分期复利公式<\/p>\n<div class=\"p note\">若把一年分成 n 次来计算复利，年利率仍为 r，计算 t 年，并且如果 B 元为 t 年后 P 元的将来值，而 P 元是 B 元的现值，则 B = P(1+r/n)^(nt) 或 P = B/(1+r/n)^(nt)。<\/div>\n<p class=\"lb note\">连续复利公式<\/p>\n<div class=\"p note\">当 n 趋于无穷时，则复利计息变成连续的了（即连续复利），即 B = Pe^(rt) 或 P = B/e^(rt) = Be^(-rt)。<span class=\"refgrp\">（见例26）<\/span><\/div>\n<h1 id=\"ch2\">第二章　导数与微分<\/h1>\n<h2 id=\"ch2_0\">一、导数的概念<span class=\"src\">选自 §1.1<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义2.2 导数<\/p>\n<div class=\"p\">设函数 y=f(x) 在点 x₀ 的某邻域 U(x₀) 内有定义。<\/div>\n<div class=\"p\">若极限 lim(Δx→0) Δy/Δx=lim(Δx→0) (f(x₀+Δx)-f(x₀))/Δx（2.1）存在，则称 f(x) 在点 x₀ 可导，<\/div>\n<div class=\"p\">并称此极限值为 f(x) 在点 x₀ 处的导数（或微商），记作 f′(x₀) 或 y′|x=x₀ 或 dy/dx|x=x₀ 或 d/dx f(x)|x=x₀，即<\/div>\n<div class=\"f\">lim(Δx→0) Δy/Δx=lim(Δx→0) (f(x₀+Δx)-f(x₀))/Δx=f′(x₀)=y′|x=x₀=d/dx f(x)|x=x₀。<\/div>\n<div class=\"p\">另外导数的定义还可写成另一种常用的形式：<\/div>\n<div class=\"f\">lim(Δx→0) (f(x₀+Δx)-f(x₀))/Δx =(x-x₀=Δx)= lim(x→x₀) (f(x)-f(x₀))/(x-x₀)=f′(x₀)。<\/div>\n<div class=\"p\">若式（2.1）的极限不存在，则称函数 y=f(x) 在点 x₀ 不可导。<\/div>\n<div class=\"p\">应当注意，记号 dy/dx|x=x₀ 作为一个符号，表示 f(x) 在点 x₀ 的导数，看起来却像分数的样子。<\/div>\n<div class=\"p\">在后面的几节中，这个“分数”的分子和分母将获得独立的意义，而且它们的比值恰好与导数相等，但现在仍要把 dy/dx 看成一个整体，作为导数的符号。<\/div>\n<div class=\"p\">前面所提出几个问题的结果现在可用导数表达出来：<\/div>\n<div class=\"f\">k(P₀T)=f′(x₀)，v(t₀)=s′(t₀)，I(t₀)=Q′(t₀)，k(t₀)=N′(t₀)。<\/div>\n<p class=\"lb\">定义2.3 左导数<\/p>\n<div class=\"p\">设 f(x) 在点 x₀ 的左邻域 U₋(x₀) 内有定义，若极限<\/div>\n<div class=\"f\">lim(Δx→0⁻) Δy/Δx=lim(Δx→0⁻) (f(x₀+Δx)-f(x₀))/Δx=lim(x→x₀⁻) (f(x)-f(x₀))/(x-x₀)<\/div>\n<div class=\"p\">存在，则称 f(x) 在点 x₀ 左可导，<\/div>\n<div class=\"p\">此极限值称为 f(x) 在点 x₀ 的左导数，记作 f′₋(x₀)。<\/div>\n<p class=\"lb\">定义2.4 右导数<\/p>\n<div class=\"p\">设 f(x) 在点 x₀ 的右邻域 U₊(x₀) 内有定义，若极限<\/div>\n<div class=\"f\">lim(Δx→0⁺) Δy/Δx=lim(Δx→0⁺) (f(x₀+Δx)-f(x₀))/Δx=lim(x→x₀⁺) (f(x)-f(x₀))/(x-x₀)<\/div>\n<div class=\"p\">存在，则称 f(x) 在点 x₀ 右可导，<\/div>\n<div class=\"p\">此极限值称为 f(x) 在点 x₀ 的右导数，记作 f′₊(x₀)。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">导数的几何意义<\/p>\n<div class=\"p\">若 f(x) 在点 x₀ 可导，则 f′(x₀) 表示曲线 y=f(x) 在点 P₀(x₀,y₀) 处切线的斜率。<\/div>\n<div class=\"p\">曲线 y=f(x) 在曲线上点 P₀(x₀,y₀) 处的切线方程为<\/div>\n<div class=\"f\">y-y₀=f′(x₀)(x-x₀)。<\/div>\n<div class=\"p\">法线方程为<\/div>\n<div class=\"f\">y-y₀=-1/f′(x₀)(x-x₀)（f′(x₀)≠0）。<\/div>\n<div class=\"p\">若 f′(x₀)=0，则切线方程为 y=y₀，法线方程为 x=x₀。<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理2.1 左、右导数与导数<\/p>\n<div class=\"p\">f′(x₀) 存在的充要条件是左、右导数 f′₋(x₀)，f′₊(x₀) 存在且相等。<\/div>\n<h3>注<\/h3>\n<p class=\"lb note\">问题1 切线斜率（1）<\/p>\n<div class=\"p note\">定义2.1 设一平面曲线方程为 y=f(x)，P₀(x₀,y₀) 是曲线上一点，过 P₀ 作割线 P₀Q 与曲线相交于 Q 点，<\/div>\n<div class=\"p note\">点 Q 沿曲线无限趋于点 P₀ 时，若割线 P₀Q 的极限位置的直线 P₀T 存在且唯一，则称 P₀T 为该曲线在点 P₀ 处的切线（图2-1）。<\/div>\n<div class=\"p note\">（注：Q 可在 P₀ 左边也可在 P₀ 右边。）<\/div>\n<p class=\"lb note\">问题1 切线斜率（2）<\/p>\n<div class=\"p note\">设一平面曲线 y=f(x)，在曲线上点 P₀(x₀,y₀) 处存在不平行于 y 轴的切线 P₀T，试求切线 P₀T 的斜率 k(P₀T)。<\/div>\n<div class=\"p note\">在曲线上任意另取一点 Q(x₀+Δx, y₀+Δy)（Δx≠0），得割线 P₀Q 的斜率 k(P₀Q) 为<\/div>\n<div class=\"f\">k(P₀Q)=tan θ=Δy/Δx=(f(x₀+Δx)-f(x₀))/Δx，<\/div>\n<div class=\"p note\">则 k(P₀T)=tan α=lim(Q→P₀) tan θ=lim(Δx→0) Δy/Δx=lim(Δx→0) (f(x₀+Δx)-f(x₀))/Δx。<\/div>\n<p class=\"lb note\">问题2 瞬时速度<\/p>\n<div class=\"p note\">一质点做变速直线运动，其运动方程为 s=s(t)，其中 t 是时间，s 是路程，试求在 t₀ 时刻的瞬时速度 v(t₀)。<\/div>\n<div class=\"p note\">我们知道匀速直线运动的速度 v=s/t。对于非匀速直线运动，它只能表示某一段时间段的平均速度。<\/div>\n<div class=\"p note\">现在的问题是要求非匀速直线运动在 t₀ 时刻的瞬时速度，当时间间隔 |Δt| 很小时，从 t₀ 到 t₀+Δt 时间段内的平均速度 v̄ 与 t₀ 时刻的瞬时速度就近似相等，即<\/div>\n<div class=\"f\">v(t₀)≈v̄=Δs/Δt=(s(t₀+Δt)-s(t₀))/Δt，<\/div>\n<div class=\"p note\">而且 |Δt| 越小，v̄ 就越接近 v(t₀)，当 Δt→0 时，v̄→v(t₀)。<\/div>\n<div class=\"p note\">因此我们把该质点在时刻 t₀ 的瞬时速度定义为平均速度的极限，即<\/div>\n<div class=\"f\">v(t₀)=lim(Δt→0) Δs/Δt=lim(Δt→0) (s(t₀+Δt)-s(t₀))/Δt。<\/div>\n<p class=\"lb note\">问题3 电流强度<\/p>\n<div class=\"p note\">在导线中有一强度变化不定的电流通过，设在 t 时刻流过导线某一固定横截面的电量 Q=Q(t)，试求在 t₀ 时刻的电流强度 I(t₀)。<\/div>\n<div class=\"p note\">从 t₀ 到 t₀+Δt 这一时间段内有 ΔQ=Q(t₀+Δt)-Q(t₀) 的电量流过这一横截面，此时平均电流强度<\/div>\n<div class=\"f\">Ī=ΔQ/Δt=(Q(t₀+Δt)-Q(t₀))/Δt，<\/div>\n<div class=\"p note\">当 Δt→0 时的极限就给出了在时刻 t₀ 的电流强度 I(t₀)=lim(Δt→0) ΔQ/Δt=lim(Δt→0) (Q(t₀+Δt)-Q(t₀))/Δt。<\/div>\n<p class=\"lb note\">问题4 人口增长率<\/p>\n<div class=\"p note\">月有阴晴圆缺，人有生死祸福，这是自然界的规律。<\/div>\n<div class=\"p note\">人口的数量随着时间的变化而改变，把 t 时刻的人口记为 N(t)，并设 N(t) 连续，试求 t₀ 时刻的人口增长率 k(t₀)。<\/div>\n<div class=\"p note\">由于 t 时刻的人口为 N(t)，从 t₀ 到 t₀+Δt 时间段内人口的增长量为 N(t₀+Δt)-N(t₀)，所以，在 t₀ 到 t₀+Δt 时间段内人口的平均增长率为<\/div>\n<div class=\"f\">ΔN/Δt=(N(t₀+Δt)-N(t₀))/Δt，<\/div>\n<div class=\"p note\">|Δt| 越小，平均增长率就越接近于 t₀ 时刻的人口增长率 k(t₀)，于是 k(t₀)=lim(Δt→0) ΔN/Δt=lim(Δt→0) (N(t₀+Δt)-N(t₀))/Δt。<span class=\"refgrp\">（见例1、例2）<\/span><\/div>\n<p class=\"lb note\">切线存在与可导性的关系<\/p>\n<div class=\"p note\">若曲线 y=f(x) 在曲线上点 P₀(x₀,y₀) 处存在切线，但 f(x) 在点 x₀ 不一定可导。<\/div>\n<div class=\"p note\">（请读者想一想，为什么？）<span class=\"refgrp\">（见例1）<\/span><\/div>\n<p class=\"lb note\">判断可导性常用的极限形式<\/p>\n<div class=\"p note\">研究函数 f(x) 在一点 x₀ 处是否可导，常用极限形式 lim(x→x₀) (f(x)−f(x₀))/(x−x₀)，当 x₀=0 时，lim(x→0) (f(x)−f(0))/x（若存在）=f′(0)．特别当 f(0)=0 时，有 lim(x→0) f(x)/x（若存在）=f′(0)．<span class=\"refgrp\">（见例2、例3）<\/span><\/div>\n<p class=\"lb note\">分段函数分界点可导性判定<\/p>\n<div class=\"p note\">研究绝对值函数在零点处是否可导一般需把它化成分段函数，判断分段函数在分界点是否可导需利用左、右导数定义或导数定义．<span class=\"refgrp\">（见例3、例4）<\/span><\/div>\n<h2 id=\"ch2_1\">二、求导公式与运算法则<span class=\"src\">选自 §1.2<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">区间上的可导与导函数<\/p>\n<div class=\"p\">若 f(x) 在开区间 (a,b) 内的每一点 x 处都可导，则称 f(x) 在开区间 (a,b) 内可导。<\/div>\n<div class=\"p\">若 f(x) 在开区间 (a,b) 内可导，且在点 a 的右导数 f′₊(a) 及在点 b 的左导数 f′₋(b) 都存在，则称 f(x) 在闭区间 [a,b] 上可导。<\/div>\n<div class=\"p\">设函数 y=f(x) 在某个区间 I 上可导，则 I 上的每一点 x 处的导数（若 x 是区间端点，指的是单侧导数）f′(x) 也是区间 I 上的一个函数，称为 y=f(x) 在区间 I 上的导函数，或简称为导数。<\/div>\n<div class=\"p\">若我们求出了在区间 I 上 f(x) 的导函数 f′(x)，要求 I 上的一点 x₀ 处的导数，那么直接代入即可，即<\/div>\n<div class=\"f\">f′(x₀)=f′(x)|x=x₀。<\/div>\n<div class=\"p\">求函数导数的方法叫做微分法，求导数的运算简称求导。<\/div>\n<div class=\"p\">利用导数的定义，可以推出基本初等函数的导数公式、导数的四则运算法则、反函数求导法则及复合函数求导法则。<\/div>\n<p class=\"lb\">双曲函数<\/p>\n<div class=\"p\">在工程技术中经常要用到双曲函数<\/div>\n<div class=\"f\">sinh x=(eˣ-e⁻ˣ)/2（双曲正弦），cosh x=(eˣ+e⁻ˣ)/2（双曲余弦），tanh x=(eˣ-e⁻ˣ)/(eˣ+e⁻ˣ)（双曲正切），coth x=(eˣ+e⁻ˣ)/(eˣ-e⁻ˣ)（双曲余切）。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">导数基本公式（表）<\/p>\n<div class=\"f\">(c)'=0，c 为常数，<\/div>\n<div class=\"f\">(xᵃ)'=αx^(α-1)，<\/div>\n<div class=\"f\">(sin x)'=cos x，<\/div>\n<div class=\"f\">(cos x)'=-sin x，<\/div>\n<div class=\"f\">(tan x)'=sec²x，<\/div>\n<div class=\"f\">(cot x)=-csc²x，<\/div>\n<div class=\"f\">(sec x)'=sec x tan x，<\/div>\n<div class=\"f\">(csc x)'=-csc x cot x，<\/div>\n<div class=\"f\">(arcsin x)'=1/√(1-x²)，<\/div>\n<div class=\"f\">(arccos x)'=-1/√(1-x²)，<\/div>\n<div class=\"f\">(arctan x)'=1/(1+x²)，<\/div>\n<div class=\"f\">(arccot x)'=-1/(1+x²)，<\/div>\n<div class=\"f\">(aˣ)'=aˣ ln a，a&gt;0 且 a≠1，<\/div>\n<div class=\"f\">(eˣ)'=eˣ，<\/div>\n<div class=\"f\">(logₐx)'=1/(x ln a)，a&gt;0 且 a≠1，<\/div>\n<div class=\"f\">(ln x)'=1/x，<\/div>\n<div class=\"p\">(ln|x|)'=1/x。<span class=\"refgrp\">（见例9）<\/span><\/div>\n<p class=\"lb\">导数的运算法则（表）<\/p>\n<div class=\"p\">设 u(x)，v(x) 均可导，则<\/div>\n<div class=\"f\">(u±v)'=u'±v'，<\/div>\n<div class=\"f\">(uv)'=u'v+uv'，<\/div>\n<div class=\"f\">(cu)'=cu'，c 为常数，<\/div>\n<div class=\"f\">(u/v)'=(u'v-uv')/v²（v≠0），<\/div>\n<div class=\"f\">(1/v)'=-v'/v²（v≠0）。<\/div>\n<div class=\"p\">设 y=f(u) 及 u=φ(x) 均可导，则<\/div>\n<div class=\"f\">dy/dx=dy/du·du/dx。<\/div>\n<div class=\"p\">设 y=f(x) 的反函数是 x=φ(y) 且 φ'(y)≠0，则<\/div>\n<div class=\"f\">dy/dx=1/(dx/dy)。（见例7、例8）<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理2.2 可导与连续<\/p>\n<div class=\"p\">若函数 y=f(x) 在点 x₀ 可导，则函数 y=f(x) 在点 x₀ 连续。<\/div>\n<div class=\"z\">证：由于 f(x) 在点 x₀ 可导，所以有<\/div>\n<div class=\"f\">lim(Δx→0) Δy/Δx=f′(x₀)，<\/div>\n<div class=\"z\">于是 lim(Δx→0) Δy=lim(Δx→0) Δy/Δx·Δx=f′(x₀)·0=0。<\/div>\n<div class=\"z\">因此，f(x) 在点 x₀ 连续。□<\/div>\n<p class=\"lb\">定理2.3 不连续必不可导<\/p>\n<div class=\"p\">若 f(x) 在点 x₀ 不连续，则 f(x) 在点 x₀ 不可导。<\/div>\n<p class=\"lb\">定理2.4 导数的四则运算<\/p>\n<div class=\"p\">设函数 u=u(x)，v=v(x) 在点 x 处可导，则 u±v，u·v，u/v（v≠0）都在点 x 处可导，且<\/div>\n<div class=\"p\">（1）(u±v)′=u′±v′；<\/div>\n<div class=\"p\">（2）(uv)′=u′v+uv′，<\/div>\n<div class=\"p\">特别地，v=c（常数）时，<\/div>\n<div class=\"f\">(cu)′=cu′；<\/div>\n<div class=\"p\">（3）(u/v)′=(u′v-uv′)/v²（v≠0），<\/div>\n<div class=\"p\">特别地，<\/div>\n<div class=\"f\">(1/v)′=-v′/v²（v≠0）。<\/div>\n<div class=\"z\">证：由 Δu=u(x+Δx)-u(x) 知 u(x+Δx)=u+Δu；由 Δv=v(x+Δx)-v(x) 知 v(x+Δx)=v+Δv。<\/div>\n<div class=\"z\">（1）设 y=f(x)=u(x)+v(x)，有<\/div>\n<div class=\"f\">Δy=f(x+Δx)-f(x)=u(x+Δx)+v(x+Δx)-u(x)-v(x)=Δu+Δv，<\/div>\n<div class=\"z\">于是 lim(Δx→0) Δy/Δx = lim(Δx→0) (Δu+Δv)/Δx = lim(Δx→0) Δu/Δx + lim(Δx→0) Δv/Δx = u′+v′=(u+v)′。<\/div>\n<div class=\"z\">同理可证 (u-v)′=u′-v′。<\/div>\n<div class=\"z\">（2）设 y=f(x)=u(x)v(x)，有<\/div>\n<div class=\"f\">Δy=f(x+Δx)-f(x)=u(x+Δx)v(x+Δx)-uv=(u+Δu)(v+Δv)-uv=vΔu+uΔv+ΔuΔv，<\/div>\n<div class=\"z\">于是 lim(Δx→0) Δy/Δx = lim(Δx→0) (vΔu+uΔv+ΔuΔv)/Δx = lim(Δx→0) (v·Δu/Δx+u·Δv/Δx+Δu·Δv/Δx) = u′v+uv′=(uv)′。<\/div>\n<div class=\"z\">特别地，若 v=c（常数），则<\/div>\n<div class=\"f\">(cu)′=cu′。<\/div>\n<div class=\"z\">（3）设 y=f(x)=u/v（v≠0），有<\/div>\n<div class=\"f\">Δy=f(x+Δx)-f(x)=u(x+Δx)/v(x+Δx)-u/v=(u+Δu)/(v+Δv)-u/v=(vΔu-uΔv)/(v(v+Δv))，<\/div>\n<div class=\"z\">于是 lim(Δx→0) Δy/Δx = lim(Δx→0) (v·Δu/Δx-u·Δv/Δx)/(v(v+Δv)) = (u′v-uv′)/v² = (u/v)′（v≠0），<\/div>\n<div class=\"z\">特别地，(1/v)′=-v′/v²。<\/div>\n<p class=\"lb\">定理2.5 反函数的求导法则<\/p>\n<div class=\"p\">设 y=f(x) 为函数 x=φ(y) 的反函数，若 φ(y) 在点 y₀ 的某邻域内连续、严格单调且 φ′(y₀)≠0，则 f(x) 在点 x₀（x₀=φ(y₀)）可导，且<\/div>\n<div class=\"f\">f′(x₀)=1/φ′(y₀) 或 dy/dx|x=x₀ = 1/(dx/dy|y=y₀)。<\/div>\n<div class=\"z\">证：给 x₀ 以改变量 Δx≠0，由于 φ(y) 严格单调，所以 y=f(x) 也严格单调，从而可知 Δy≠0。<\/div>\n<div class=\"z\">由 φ(y) 在 y₀ 处连续，知 f(x) 在 x₀ 处也连续，因此 Δx→0 等价于 Δy→0。<\/div>\n<div class=\"z\">又 φ′(y₀)≠0，故<\/div>\n<div class=\"f\">f′(x₀)=lim(Δx→0) Δy/Δx = lim(Δy→0) 1/(Δx/Δy) = 1/φ′(y₀)，<\/div>\n<div class=\"z\">或 dy/dx|x=x₀ = 1/(dx/dy|y=y₀)。<\/div>\n<p class=\"lb\">定理2.6（复合函数的求导法则）链式法则<\/p>\n<div class=\"p\">设函数 y=f(u) 对 u 可导，u=φ(x) 对 x 可导，则复合函数 y=f(φ(x)) 对 x 可导，且<\/div>\n<div class=\"f\">dy/dx = dy/du · du/dx 或 (f(φ(x)))′=f′(u)φ′(x)=f′(φ(x))·φ′(x)。<\/div>\n<div class=\"z\">证：由于 f(u) 在 u 处可导，所以有<\/div>\n<div class=\"f\">lim(Δu→0) Δy/Δu = f′(u)。<\/div>\n<div class=\"z\">从而，当 Δu≠0 时，有<\/div>\n<div class=\"f\">Δy/Δu = f′(u)+α，<\/div>\n<div class=\"z\">其中 lim(Δu→0，Δu≠0) α = 0，于是 Δy=f′(u)Δu+αΔu。<\/div>\n<div class=\"z\">当 Δu=0 时，定义 α=0 且满足上面等式，于是<\/div>\n<div class=\"f\">lim(Δx→0) Δy/Δx = lim(Δx→0) (f′(u)Δu+αΔu)/Δx = lim(Δx→0) (f′(u)·Δu/Δx+α·Δu/Δx) = lim(Δx→0) f′(u)·Δu/Δx+lim(Δx→0) α·lim(Δx→0) Δu/Δx = f′(u)φ′(x)+0·φ′(x) = f′(u)φ′(x)=(f(φ(x)))′，<\/div>\n<div class=\"z\">即 dy/dx = dy/du · du/dx。<\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>导数的四则运算推广到有限多个函数<\/b><\/p>\n<p class=\"bullet\">• <b>正切函数的导数<\/b><\/p>\n<p class=\"bullet\">• <b>余切、正割、余割函数的导数<\/b><\/p>\n<p class=\"bullet\">• <b>反正弦、反余弦函数的导数<\/b><\/p>\n<p class=\"bullet\">• <b>反正切、反余切函数的导数<\/b><\/p>\n<p class=\"bullet\">• <b>三角函数、反三角函数导数“±”号的记忆方法<\/b><\/p>\n<p class=\"bullet\">• <b>链式法则的推广<\/b>（例5）<\/p>\n<p class=\"bullet\">• <b>导数公式与导数运算法则表<\/b><\/p>\n<h3>注<\/h3>\n<p class=\"lb note\">抽象函数可导性的极限形式<\/p>\n<div class=\"p note\">在利用抽象函数在一点可导作为条件，或证明抽象函数可导时，常用极限形式 lim(Δx→0) Δy/Δx．<span class=\"refgrp\">（见例3、例4）<\/span><\/div>\n<p class=\"lb note\">一、几个基本初等函数的导数<\/p>\n<div class=\"p note\">1. 常值函数 f(x)=c，x∈𝐑。由□（本页止）<\/div>\n<p class=\"lb note\">1. 常数函数的导数<\/p>\n<div class=\"p note\">lim(Δx→0) (f(x+Δx)-f(x))/Δx = lim(Δx→0) (c-c)/Δx = 0，得<\/div>\n<div class=\"f\">(c)′=0，x∈R。<\/div>\n<p class=\"lb note\">2. 正弦函数与余弦函数的导数<\/p>\n<div class=\"p note\">f(x)=sin x，x∈R；f(x)=cos x，x∈R。<\/div>\n<div class=\"p note\">由 lim(Δx→0) (f(x+Δx)-f(x))/Δx = lim(Δx→0) (sin(x+Δx)-sin x)/Δx = lim(Δx→0) (2cos((2x+Δx)/2)sin(Δx/2))/Δx = lim(Δx→0) (2·(Δx/2)cos((2x+Δx)/2))/Δx = cos x，得<\/div>\n<div class=\"f\">(sin x)′=cos x，x∈R。<\/div>\n<div class=\"p note\">例如 (sin x)′|x=0 = cos 0 = 1，(sin x)′|x=π/4 = cos π/4 = √2/2，(sin x)′|x=π/2 = cos π/2 = 0。<\/div>\n<div class=\"p note\">同理可证 (cos x)′=-sin x，x∈R。<\/div>\n<p class=\"lb note\">3. 指数函数的导数<\/p>\n<div class=\"p note\">f(x)=aˣ（a&gt;0，a≠1），x∈R。<\/div>\n<div class=\"p note\">由 lim(Δx→0) (f(x+Δx)-f(x))/Δx = lim(Δx→0) (a^(x+Δx)-aˣ)/Δx = aˣ lim(Δx→0) (a^Δx-1)/Δx = aˣ ln a，得<\/div>\n<div class=\"f\">(aˣ)′=aˣ ln a，x∈R。<\/div>\n<div class=\"p note\">特别地，(eˣ)′=eˣ，x∈R。<\/div>\n<p class=\"lb note\">4. 对数函数的导数<\/p>\n<div class=\"p note\">f(x)=log_a x（a&gt;0，a≠1），x∈(0,+∞)。<\/div>\n<div class=\"p note\">由 lim(Δx→0) (f(x+Δx)-f(x))/Δx = lim(Δx→0) (log_a(x+Δx)-log_a x)/Δx = lim(Δx→0) (log_a(1+Δx/x))/Δx = lim(Δx→0) (ln(1+Δx/x))/(Δx ln a) = lim(Δx→0) (Δx/x)/(Δx ln a) = 1/(x ln a)，得<\/div>\n<div class=\"f\">(log_a x)′=1/(x ln a)，x∈(0,+∞)。<\/div>\n<div class=\"p note\">特别地，(ln x)′=1/x，x∈(0,+∞)。<\/div>\n<p class=\"lb note\">5. 幂函数的导数<\/p>\n<div class=\"p note\">f(x)=xᵅ，x∈D（α 为常数，α≠0），D 由 α 确定。<\/div>\n<div class=\"p note\">（1）∀x∈D 且 x≠0，由 lim(Δx→0) (f(x+Δx)-f(x))/Δx = lim(Δx→0) ((x+Δx)ᵅ-xᵅ)/Δx = lim(Δx→0) xᵅ((1+Δx/x)ᵅ-1)/Δx = lim(Δx→0) xᵅ·(α·Δx/x)/Δx = αxᵅ⁻¹，得<\/div>\n<div class=\"f\">(xᵅ)′=αxᵅ⁻¹。<\/div>\n<div class=\"p note\">例如 (1/x)′=(x⁻¹)′=(-1)·x⁻²=-1/x²，(1/√x)′=(x^(-1/2))′=-1/2 x^(-3/2)。<\/div>\n<div class=\"p note\">（2）若有 x=0∈D，必有 α&gt;0，此时 f(0)=0，由于 lim(x→0) (f(x)-f(0))/x = lim(x→0) xᵅ/x = {0，α&gt;1；1，α=1；∞，0&lt;α&lt;1}，所以，当 α≥1 时，f(x)=xᵅ 在点 x=0 处可导且 f′(0)={0，α&gt;1；1，α=1}，且仍然适合公式 y′=αxᵅ⁻¹；<\/div>\n<div class=\"p note\">当 0&lt;α&lt;1 时，f(x)=xᵅ 在点 x=0 处不可导。<\/div>\n<div class=\"p note\">特别地，当 n 是正整数时，<\/div>\n<div class=\"f\">(xⁿ)′=nxⁿ⁻¹，x∈R。<\/div>\n<p class=\"lb note\">基本初等函数的可导性<\/p>\n<div class=\"p note\">从而，我们求出了所有基本初等函数的导数。<\/div>\n<div class=\"p note\">除了 y=arcsin x，y=arccos x 在 x=±1 处不可导，y=xᵅ 在 x=0 处有时可能不可导，其余的基本初等函数在它们的定义域内的每一点都可导。<\/div>\n<p class=\"lb note\">复合函数求导法则证明中应注意的问题<\/p>\n<div class=\"p note\">分析 有的读者看到结论 dy/dx = dy/du · du/dx，可能会采取下面的求法<\/div>\n<div class=\"p note\">lim(Δx→0) Δy/Δx = lim(Δx→0) (Δy/Δu · Δu/Δx) = lim(Δx→0) Δy/Δu · lim(Δx→0) Δu/Δx = lim(Δu→0) Δy/Δu · lim(Δx→0) Δu/Δx = f′(u)φ′(x)。<\/div>\n<div class=\"p note\">事实上，这种证法不合理：当 Δx≠0 而趋于 0 时，对应的 Δu 虽然也趋于 0，但在此过程中不能保证恒有 Δu≠0，因此以 Δu 去除 Δy 就不能保证有意义。<\/div>\n<div class=\"p note\">例如 u=φ(x)={x²sin(1/x)，x≠0；0，x=0}，令 x₀=0，取 xₙ=1/(nπ)，Δx=xₙ-x₀=1/(nπ)，这时 u(xₙ)=φ(xₙ)=0，Δuₙ=u(xₙ)-u(0)=0。<\/div>\n<div class=\"p note\">即在 Δx→0 时，虽然有 Δu→0，但它存在一个恒为 0 的子列 {Δuₙ}。<\/div>\n<div class=\"p note\">因此，在证明时应避免上述问题。<\/div>\n<p class=\"lb note\">复合函数求导的注意事项<\/p>\n<div class=\"p note\">注 要学会把一个复合函数拆成几个简单函数的复合（基本初等函数和由基本初等函数经过四则运算得到的函数称为简单函数）。<\/div>\n<div class=\"p note\">熟练以后，我们也可以反复利用两个函数复合的求导法则求复合函数的导数。<span class=\"refgrp\">（见例6）<\/span><\/div>\n<h2 id=\"ch2_2\">三、隐函数与高阶导数<span class=\"src\">选自 §1.3、§1.4<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义2.5 隐函数<\/p>\n<div class=\"p\">设 F(x,y)=0 为二元方程，若存在非空集合 D⊂ℝ，C⊂ℝ，任给 x∈D，都有唯一的 y∈C，使得 F(x,y)=0，则称由二元方程 F(x,y)=0 确定了一个隐函数 y=f(x)，x∈D。<\/div>\n<div class=\"p\">即 x∈D 时，<\/div>\n<div class=\"f\">F(x,f(x))≡0。<\/div>\n<p class=\"lb\">二阶导数<\/p>\n<div class=\"p\">若函数 y=f(x) 在区间 I 上可导，则导函数 f'(x) 是区间 I 上的函数。<\/div>\n<div class=\"p\">若 x₀∈I，f'(x) 在点 x₀ 可导，即极限<\/div>\n<div class=\"f\">lim(Δx→0)(f'(x₀+Δx)-f'(x₀))/Δx<\/div>\n<div class=\"p\">存在，则称此极限值为 f(x) 在点 x₀ 的二阶导数，记作<\/div>\n<div class=\"f\">f''(x₀) 或 d²y/dx²|x=x₀ 或 y''|x=x₀。<\/div>\n<p class=\"lb\">二阶导函数<\/p>\n<div class=\"p\">若 f'(x) 在区间 I 上每一点都可导，即任给 x∈I，有<\/div>\n<div class=\"f\">y''=f''(x)=lim(Δx→0)(f'(x+Δx)-f'(x))/Δx，<\/div>\n<div class=\"p\">按函数定义，f''(x) 是区间 I 上的函数，称为 f(x) 在区间 I 上的二阶导函数或二阶导数。<\/div>\n<div class=\"p\">于是<\/div>\n<div class=\"f\">y''=(y')'=dy'/dx=d(dy/dx)/dx=d²y/dx²=f''(x)=[f'(x)]'。<\/div>\n<p class=\"lb\">高阶导数<\/p>\n<div class=\"p\">同理，f(x) 的二阶导数的导数称为 f(x) 的三阶导数，记成<\/div>\n<div class=\"f\">f'''(x)=d³y/dx³=y'''。<\/div>\n<div class=\"p\">一般地，f(x) 的 n-1 阶导数的导数，称为 f(x) 的 n 阶导数，记作<\/div>\n<div class=\"f\">y⁽ⁿ⁾=d/dx(dⁿ⁻¹y/dxⁿ⁻¹)=dⁿy/dxⁿ=f⁽ⁿ⁾(x)=[f⁽ⁿ⁻¹⁾(x)]'。<\/div>\n<div class=\"p\">f'(x) 称为 f(x) 的一阶导数。f⁽ⁿ⁾(x)（n&gt;1）统称为 f(x) 的高阶导数。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">双曲函数的导数<\/p>\n<div class=\"p\">由求导公式可得<\/div>\n<div class=\"f\">(sinh x)'=cosh x，<\/div>\n<div class=\"f\">(cosh x)'=sinh x，<\/div>\n<div class=\"p\">(tanh x)'=1/cosh²x。<\/div>\n<p class=\"lb\">一、部分基本初等函数的高阶导数 1. 设 y=xᵅ，则<\/p>\n<div class=\"f\">y′=αxᵅ⁻¹，y″=α(α-1)xᵅ⁻²，…，y⁽ⁿ⁾=α(α-1)…(α-n+1)xᵅ⁻ⁿ，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">(xᵅ)⁽ⁿ⁾=α(α-1)…(α-n+1)xᵅ⁻ⁿ。<\/div>\n<div class=\"p\">特别当 α=n 是正整数时，(xⁿ)⁽ⁿ⁾=n!，<\/div>\n<div class=\"p\">若 k&gt;n，则 (xⁿ)⁽ᵏ⁾=0。<\/div>\n<div class=\"p\">同理，<\/div>\n<div class=\"f\">[(1+x)ᵅ]⁽ⁿ⁾=α(α-1)…(α-n+1)(1+x)ᵅ⁻ⁿ。<\/div>\n<p class=\"lb\">一、部分基本初等函数的高阶导数 2. 设 y=ln x，则<\/p>\n<div class=\"f\">y⁽ⁿ⁾=[(ln x)′]⁽ⁿ⁻¹⁾<\/div>\n<div class=\"f\">=(x⁻¹)⁽ⁿ⁻¹⁾<\/div>\n<div class=\"f\">=-1(-1-1)…[-1-(n-1)+1]x⁻¹⁻⁽ⁿ⁻¹⁾<\/div>\n<div class=\"p\">=(-1)ⁿ⁻¹(n-1)! x⁻ⁿ。即<\/div>\n<div class=\"p\">(ln x)⁽ⁿ⁾=(-1)ⁿ⁻¹(n-1)! x⁻ⁿ。同理，<\/div>\n<div class=\"f\">[ln(1+x)]⁽ⁿ⁾=(-1)ⁿ⁻¹(n-1)! (1+x)⁻ⁿ。<\/div>\n<p class=\"lb\">一、部分基本初等函数的高阶导数 3. 设 y=sin x，则<\/p>\n<div class=\"f\">y′=cos x=sin(x+π/2)，<\/div>\n<div class=\"f\">y″=[sin(x+π/2)]′=cos(x+π/2)=sin(x+π/2+π/2)=sin(x+2·π/2)，<\/div>\n<div class=\"p\">假设 n=k 时，y⁽ᵏ⁾=sin(x+k·π/2) 成立。<\/div>\n<div class=\"p\">当 n=k+1 时，<\/div>\n<div class=\"f\">y⁽ᵏ⁺¹⁾=[y⁽ᵏ⁾]′=[sin(x+k·π/2)]′=cos(x+k·π/2)=sin(x+k·π/2+π/2)=sin[x+(k+1)·π/2]。<\/div>\n<div class=\"p\">由数学归纳法知，对任意正整数 n，都有 (sin x)⁽ⁿ⁾=sin(x+n·π/2)。<\/div>\n<div class=\"p\">同理可证，(cos x)⁽ⁿ⁾=cos(x+n·π/2)。<\/div>\n<p class=\"lb\">一、部分基本初等函数的高阶导数 4. 设 y=aˣ，则<\/p>\n<div class=\"p\">y′=aˣ ln a，y″=aˣ(ln a)²，…，y⁽ⁿ⁾=aˣ(ln a)ⁿ。即 (aˣ)⁽ⁿ⁾=aˣ(ln a)ⁿ。特别地，(eˣ)⁽ⁿ⁾=eˣ。<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理2.7 二、高阶导数的运算法则<\/p>\n<div class=\"p\">若 u=u(x)，v=(x) 均存在 n 阶导数，则<\/div>\n<div class=\"f\">（1）(u±v)⁽ⁿ⁾=u⁽ⁿ⁾±v⁽ⁿ⁾；<\/div>\n<div class=\"p\">（2）(cu)⁽ⁿ⁾=cu⁽ⁿ⁾，其中 c 为常数；<\/div>\n<div class=\"p\">（3）(uv)⁽ⁿ⁾=Cₙ⁰u⁽ⁿ⁾v⁽⁰⁾+Cₙ¹u⁽ⁿ⁻¹⁾v′+…+Cₙᵏu⁽ⁿ⁻ᵏ⁾v⁽ᵏ⁾+…+Cₙⁿu⁽⁰⁾v⁽ⁿ⁾=∑(k=0→n) Cₙᵏu⁽ⁿ⁻ᵏ⁾v⁽ᵏ⁾，其中 v⁽⁰⁾=v，u⁽⁰⁾=u。<\/div>\n<div class=\"p\">证：（1），（2）略。<\/div>\n<div class=\"p\">（3）<\/div>\n<div class=\"z\">当 n=1 时，(uv)′=u′v+uv′=C₁⁰u′v⁽⁰⁾+C₁¹u⁽⁰⁾v′，公式成立。<\/div>\n<div class=\"z\">假设当 n=m 时，(uv)⁽ᵐ⁾=∑(k=0→m) Cₘᵏu⁽ᵐ⁻ᵏ⁾v⁽ᵏ⁾ 成立。<\/div>\n<div class=\"z\">当 n=m+1 时，<\/div>\n<div class=\"f\">(uv)⁽ᵐ⁺¹⁾=[(uv)⁽ᵐ⁾]′=[∑(k=0→m) Cₘᵏu⁽ᵐ⁻ᵏ⁾v⁽ᵏ⁾]′=<\/div>\n<div class=\"z\">∑(k=0→m) Cₘᵏ[u⁽ᵐ⁻ᵏ⁾v⁽ᵏ⁾]′=<\/div>\n<div class=\"z\">∑(k=0→m) Cₘᵏ[u⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+u⁽ᵐ⁻ᵏ⁾v⁽ᵏ⁺¹⁾]=<\/div>\n<div class=\"z\">∑(k=0→m) Cₘᵏu⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+∑(k=0→m) Cₘᵏu⁽ᵐ⁻ᵏ⁾v⁽ᵏ⁺¹⁾=<\/div>\n<div class=\"z\">u⁽ᵐ⁺¹⁾v+∑(k=1→m) Cₘᵏu⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+∑(k=1→m+1) Cₘᵏ⁻¹u⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾=<\/div>\n<div class=\"f\">Cₘ₊₁⁰u⁽ᵐ⁺¹⁾v⁽⁰⁾+∑(k=1→m) Cₘᵏu⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+∑(k=1→m) Cₘᵏ⁻¹u⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+u⁽⁰⁾v⁽ᵐ⁺¹⁾=<\/div>\n<div class=\"f\">Cₘ₊₁⁰u⁽ᵐ⁺¹⁾v⁽⁰⁾+∑(k=1→m) (Cₘᵏ+Cₘᵏ⁻¹)u⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+Cₘ₊₁ᵐ⁺¹u⁽⁰⁾v⁽ᵐ⁺¹⁾=<\/div>\n<div class=\"f\">Cₘ₊₁⁰u⁽ᵐ⁺¹⁾v⁽⁰⁾+∑(k=1→m) Cₘ₊₁ᵏu⁽ᵐ⁻ᵏ⁺¹⁾v⁽ᵏ⁾+Cₘ₊₁ᵐ⁺¹u⁽⁰⁾v⁽ᵐ⁺¹⁾=<\/div>\n<div class=\"z\">∑(k=0→m+1) Cₘ₊₁ᵏu⁽ᵐ⁺¹⁻ᵏ⁾v⁽ᵏ⁾。即当 n=m+1 时，公式也成立。<\/div>\n<div class=\"z\">由数学归纳法知公式对一切正整数 n 都成立。□<\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>初等函数的导数<\/b><\/p>\n<p class=\"bullet\">• <b>分段函数的求导<\/b>（例10例11）<\/p>\n<p class=\"bullet\">• <b>隐函数的求导法则<\/b>（例12例13）<\/p>\n<p class=\"bullet\">• <b>对数求导法<\/b>（例14例15例16例17）<\/p>\n<p class=\"bullet\">• <b>定理2.7 的公式(3)称为莱布尼茨（Leibniz）公式<\/b><\/p>\n<h3>注<\/h3>\n<p class=\"lb note\">隐函数求导的记法约定<\/p>\n<div class=\"p note\">若求 dy/dx|x=x₀，不必求出 dy/dx，<\/div>\n<div class=\"p note\">只需把 x₀，y₀ 代入式(2.2)，解出 y'|x=x₀，y=y₀ 即可。<\/div>\n<p class=\"lb note\">对数求导法适用的四种情况<\/p>\n<div class=\"p note\">对下述四种情况：<\/div>\n<div class=\"p note\">(1)一个函数是分式，且分子、分母都是若干因式的乘积；<\/div>\n<div class=\"p note\">(2)函数 y=u(x)^v(x)（称为幂指函数）；<\/div>\n<div class=\"p note\">(3)一个函数是分式，且分子、分母是幂指函数；<\/div>\n<div class=\"p note\">(4)一个函数是多个函数的乘积，均可利用对数求导法求导。<\/div>\n<div class=\"p note\"><span class=\"refgrp\">（见例18）<\/span><\/div>\n<h2 id=\"ch2_3\">四、微分<span class=\"src\">选自 §2.1、§2.2、§2.4<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义2.6 微分<\/p>\n<div class=\"p\">设 y=f(x) 在 x 的某邻域 U(x) 内有定义，若 Δy=f(x+Δx)-f(x) 可表示为<\/div>\n<div class=\"f\">Δy=AΔx+o(Δx) (Δx→0)，<\/div>\n<div class=\"p\">其中 A 是与 Δx 无关的量，则称 y=f(x) 在点 x 处可微.<\/div>\n<div class=\"p\">AΔx 是 Δy 的线性主部，并称其为 y=f(x) 在点 x 处的微分，记为 dy，即<\/div>\n<div class=\"f\">dy=AΔx。<\/div>\n<p class=\"lb\">参数方程与参数<\/p>\n<div class=\"p\">在直角坐标平面内，曲线上任意一点的坐标 (x,y)，分别表示为某一第三变量 t 的函数 {x=φ(t)，y=ψ(t)．这种方程叫做曲线的参数方程，这第三个变量 t 叫做参数．在同一个直角坐标系下，参数方程与普通方程可以互化，消去参数方程中的参数，即得普通方程．反之，对于曲线的普通方程，只要选择适当的参数，也可化为参数方程．<\/div>\n<p class=\"lb\">1．极坐标系<\/p>\n<div class=\"p\">在平面内取一个定点 O，引一条射线 Ox，再选定一个长度单位和角度的正向（通常取逆时针方向），这样就建立了一个极坐标系，如图 2-10 所示．O 点叫做极点，射线 Ox 叫做极轴．在平面内任取一点 P，用 r 表示线段 OP 的长度，θ 表示从 Ox 转到 OP 的角度，r 叫做点 P 的极径，θ 叫做点 P 的极角，有序数对 (r,θ) 就叫做点 P 的极坐标，可表示为 P(r,θ)．有时也允许 θ≥2π 或 θ&lt;0，这时 P(r,θ) 点的坐标也可以用 (r,θ+2nπ) 来表示（n 是整数）．经过这样的规定之后，对于给定的 r 和 θ，就可以在平面内确定唯一点 M，反过来，给定平面内一点都有无数多对的实数与其对应．但在规定了 r≥0，0≤θ&lt;2π 或 -π&lt;θ≤π 之后，平面上的点（除极点外）与有序数对 (r,θ) 就是一一对应关系．<\/div>\n<p class=\"lb\">2．极坐标与直角坐标的互化<\/p>\n<div class=\"p\">在以直角坐标系的原点作为极点，x 轴的正半轴作为极轴，并在两种坐标系中取相同的长度单位的条件下，同一个点的直角坐标 (x,y) 与极坐标 (r,θ) 之间有如图 2-11 所示的如下关系：<\/div>\n<p class=\"lb\">极坐标与直角坐标的互化关系式<\/p>\n<div class=\"p\">x=rcos θ，y=rsin θ．由上述关系可得出关系式<\/div>\n<div class=\"f\">r²=x²+y²，tan θ=y/x（x≠0）．<\/div>\n<div class=\"p\">用前一关系式可以把点的极坐标化为直角坐标，用后一关系式可以把点的直角坐标化为极坐标．<\/div>\n<p class=\"lb\">3．曲线的极坐标方程<\/p>\n<div class=\"p\">在极坐标系中，平面内的一条曲线可以用含有 r，θ 这两个变量的方程<\/div>\n<div class=\"f\">φ(r,θ)=0<\/div>\n<div class=\"p\">来表示，这种方程叫做曲线的极坐标方程．常见的极坐标方程的图形见附录 1．<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">性质 当 f′(x)≠0 时<\/p>\n<div class=\"p\">lim(Δx→0) Δy/dy=lim(Δx→0) (f′(x)Δx+o(Δx))/(f′(x)Δx)=lim(Δx→0)(1+o(Δx)/(f′(x)Δx))=1，<\/div>\n<div class=\"p\">因此，Δy～dy（Δx→0）．这是一个很重要的结论，在后面定积分的微元法中要用到．<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理2.8 可微与可导的关系<\/p>\n<div class=\"p\">函数 y=f(x) 在点 x 可微的充要条件是函数 y=f(x) 在点 x 处可导。<\/div>\n<div class=\"z\">证：充分性.<\/div>\n<div class=\"z\">由 f(x) 在点 x 处可导的定义知<\/div>\n<div class=\"f\">lim(Δx→0) Δy/Δx=f'(x).<\/div>\n<div class=\"z\">于是 Δy/Δx=f'(x)+α，其中 lim(Δx→0) α=0.<\/div>\n<div class=\"z\">从而有 Δy=f'(x)Δx+αΔx，而 lim(Δx→0) αΔx/Δx=0，即 αΔx=o(Δx) (Δx→0).<\/div>\n<div class=\"z\">所以 Δy=f'(x)Δx+o(Δx) (Δx→0).<\/div>\n<div class=\"z\">因此 y=f(x) 在点 x 处可微且 f'(x)=A.必要性.<\/div>\n<div class=\"z\">由于 y=f(x) 在点 x 处可微，由定义知 Δy=AΔx+o(Δx) (Δx→0)<\/div>\n<div class=\"z\">证：其中 A 与 Δx 无关．由于 lim(Δx→0) Δy/Δx=lim(Δx→0)[A+o(Δx)/Δx]=A=f′(x)，<\/div>\n<div class=\"p\">所以 y=f(x) 在点 x 处可导．□<\/div>\n<p class=\"lb\">定理2.9 微分四则运算<\/p>\n<div class=\"p\">设 u=u(x)，v=v(x) 在点 x 处均可微，则 u±v，uv，cu（c 为常数），u/v（v≠0）在点 x 处都可微，且<\/div>\n<div class=\"p\">（1）d(u±v)=du±dv；<\/div>\n<div class=\"p\">（2）d(uv)=vdu+udv，特别地，d(cu)=cdu（c 为常数）；<\/div>\n<div class=\"p\">（3）d(u/v)=(vdu-udv)/v²（v≠0），特别地，d(1/v)=-dv/v²（v≠0）．<\/div>\n<div class=\"z\">证：（1），（2）略．<\/div>\n<div class=\"fill\">〔补〕（1）d(u±v)=(u±v)′dx=(u′±v′)dx=u′dx±v′dx=du±dv；（2）d(uv)=(uv)′dx=(u′v+uv′)dx=v(u′dx)+u(v′dx)=vdu+udv，特别地 d(cu)=(cu)′dx=cu′dx=cdu。<\/div>\n<div class=\"p\">（3）d(u/v)=(u/v)′dx=(u′v-uv′)/v²dx=(vu′dx-uv′dx)/v²=(vdu-udv)/v²（v≠0）．□<\/div>\n<p class=\"lb\">定理2.10 一阶微分形式不变性<\/p>\n<div class=\"p\">若 u=φ(x) 在点 x 处可微，y=f(u) 在点 u（u=φ(x)）处可微，则复合函数 y=f(φ(x)) 在点 x 处可微，且<\/div>\n<div class=\"f\">dy=f′(u)du．<\/div>\n<div class=\"z\">证：由复合函数的求导法则知，y=f(φ(x)) 在点 x 处可导，所以在点 x 处可微．且<\/div>\n<div class=\"p\">dy=f′(φ(x))φ′(x)dx=f′(φ(x))dφ(x)=f′(u)du，即<\/div>\n<div class=\"f\">dy=f′(u)du．□<\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>求函数的高阶导数时<\/b>（例19例20例21）<\/p>\n<p class=\"bullet\">• <b>有时，我们需要求 f⁽ⁿ⁾(x₀)<\/b>（例24例25）<\/p>\n<p class=\"bullet\">• <b>应用导数的概念<\/b>（例26）<\/p>\n<p class=\"bullet\">• <b>极坐标方程确定函数的导数<\/b>（例4）<\/p>\n<h3>注<\/h3>\n<p class=\"lb note\">高阶导数的归纳法求法<\/p>\n<div class=\"p note\">求有些函数的高阶导数，须经求一、二阶导数，发现规律，再用归纳法证明．<span class=\"refgrp\">（见例22）<\/span><\/div>\n<p class=\"bullet\">• <b>在实际中如果不知道 x₀，只知道 x*，且 x₀，x* 相差很小，那么有 Δy≈f'(x*)Δx，从而可以估计出 Δy。<\/b><\/p>\n<p class=\"lb note\">于是，若 y=f(x) 在点 x 处可微，则 dy=AΔx，且 A=f′(x)，有 dy=f′(x)Δx．由于函数 f(x)=x 在 x 处可微，且 dx=(x)′Δx=Δx，即自变量的改变量等于自变量的微分，因此 dy=f′(x)dx，从而 dy=f′(x)dx 等价于 dy/dx=f′(x)．由此可见，导数 f′(x) 等于函数 y=f(x) 的微分 dy 与自变量 x 的微分 dx 之商．因此，导数又称为微商，这时 dy/dx 不仅可以看成一个整体记号，也可以看成 dy 与 dx 的商．<\/p>\n<p class=\"bullet\">• <b>（1）圆面积 S=πr²，其中 r 为圆半径．圆面积的增量 ΔS=π(r+Δr)²-πr²=2πrΔr+π(Δr)²，所以 dS=2πrΔr=2πrdr．当半径有增量 Δr 时，圆面积的增量 ΔS 如图 2-5 中圆环所示．若用微分 dS 作近似，即用长为 2πr（圆环内周长），宽为圆环厚度 Δr 的矩形面积 dS（图 2-6）来近似表示 ΔS．（图略：图 2-5 为圆环，内圆半径 r，环宽 Δr；图 2-6 为长 2πr、宽 Δr 的矩形）．（见例5）<\/b><\/p>\n<p class=\"bullet\">• <b>（2）圆柱体体积 V=πr²h，其中 r 为圆柱体的底圆半径，h 为圆柱的高．圆柱体体积的增量 ΔV=π(r+Δr)²h-πr²h=2πrhΔr+πh(Δr)²，所以 dV=2πrhΔr=2πrhdr．当底圆半径有增量 Δr 时，圆柱体体积的增量 ΔV 如图 2-7 中空心圆柱所示．用微分 dV 近似，即用底边长为 2πr（内圆柱底圆面周长），宽为 h（圆柱的高），高为空心圆柱厚度 Δr 的长方体体积（图 2-8）近似表示 ΔV．（图略：图 2-7 为空心圆柱，底圆半径 r，壁厚 Δr，高 h；图 2-8 为长 2πr、宽 h、高 Δr 的长方体）．（见例5）<\/b><\/p>\n<p class=\"bullet\">• <b>（3）球的体积 V=4/3πr³（其中 r 为球半径），当半径有增量 Δr 时，球体积的增量（即薄球壳的体积 ΔV）为 ΔV=4/3π(r+Δr)³-4/3πr³=4/3π(r³+3r²Δr+3r(Δr)²+(Δr)³-r³)=4πr²Δr+(4πrΔr+4/3π(Δr)²)Δr，所以 dV=4πr²Δr=4πr²dr．即薄球壳的体积 ΔV 用微分 dV：球壳内球面面积 4πr² 与厚度 dr 的乘积来近似表示．（见例5）<\/b><\/p>\n<p class=\"bullet\">• <b>四、微分的几何意义 如图 2-9 所示，若 y=f(x) 在点 x 处可微，则 Δy=f′(x)Δx+o(Δx)=dy+o(Δx)．曲线 y=f(x) 在曲线上点 P(x,y) 处的切线斜率 tanα=f′(x)，有 Δy=f(x+Δx)-f(x)=NQ，dy=f′(x)Δx=Δxtanα=NT，o(Δx)=Δy-dy=NQ-NT=TQ，由于 dy≈Δy（即用 dy 近似表示 Δy），即 NT≈NQ，所以 |PT|=√((Δx)²+|NT|²)≈√((Δx)²+|NQ|²)=|PQ|≈|PQ⌒|．因此，当 |Δx| 很小时，可用切线段 PT 近似表示曲线弧 PQ⌒（图 2-9）．（图略：图 2-9 为曲线 y=f(x) 上点 P(x,y) 与 Q(x+Δx,y+Δy)，过 P 的切线，N、T 在竖直方向）<\/b><\/p>\n<p class=\"lb note\">一、微分基本公式<\/p>\n<p class=\"lb note\">微分四则运算与导数四则运算的类比<\/p>\n<p class=\"lb note\">这里 u 是中间变量，它与当 x 是自变量时，dy=f′(x)dx 的形式一样。我们把此性质称为一阶微分形式不变性．<\/p>\n<p class=\"bullet\">• <b>求函数的微分主要有两种方法：解法一，先求 y′=e^(sin(x²+√x))cos(x²+√x)·(2x+1/(2√x))，所以 dy=y′dx=e^(sin(x²+√x))cos(x²+√x)(2x+1/(2√x))dx．解法二，利用微分的四则运算和一阶微分形式不变性，得 dy=de^(sin(x²+√x))=e^(sin(x²+√x))d sin(x²+√x)=e^(sin(x²+√x))cos(x²+√x)d(x²+√x)=e^(sin(x²+√x))cos(x²+√x)[d(x²)+d√x]=e^(sin(x²+√x))cos(x²+√x)(2xdx+1/(2√x)dx)=e^(sin(x²+√x))cos(x²+√x)(2x+1/(2√x))dx．也可得到导数 y′=e^(sin(x²+√x))cos(x²+√x)(2x+1/(2√x))．（见例1）<\/b><\/p>\n<p class=\"bullet\">• <b>求由方程确定的函数的微分：对方程两端求微分，有 d(2y-x)=ln(x-y)d(x-y)+(x-y)d ln(x-y)，即 2dy-dx=ln(x-y)(dx-dy)+(dx-dy)，得 dy=(2+ln(x-y))/(3+ln(x-y))dx．把 ln(x-y)=(2y-x)/(x-y) 代入上式整理得 dy=x/(2x-y)dx．（见例2）<\/b><\/p>\n<p class=\"bullet\">• <b>参数方程确定函数的导数：设函数 y=y(x) 由参数方程 {x=φ(t)，y=ψ(t)，α≤t≤β 所确定，如何求 dy/dx？由微分知 dy/dx 可以看成 dy 除以 dx，若 x=φ(t)，y=ψ(t) 均可导且 φ′(t)≠0，知 dy/dx=dψ(t)/dφ(t)=(ψ′(t)dt)/(φ′(t)dt)=ψ′(t)/φ′(t)，或由于 x=φ(t)，y=ψ(t) 均是 t 的函数，则 dy/dx=(dy/dt)/(dx/dt)=ψ′(t)/φ′(t)．若 x=φ(t)，y=ψ(t) 二阶可导且 φ′(t)≠0，由前面的结果知 y′=dy/dx=ψ′(t)/φ′(t)．于是 d²y/dx²=dy′/dx=(d/dt(ψ′(t)/φ′(t)))/(dφ(t)/dt)=((ψ″(t)φ′(t)-ψ′(t)φ″(t))/[φ′(t)]²)dt/(φ′(t)dt)=(ψ″(t)φ′(t)-ψ′(t)φ″(t))/[φ′(t)]³，或 d²y/dx²=dy′/dx=(ψ′(t)/φ′(t))′/φ′(t)=(ψ″(t)φ′(t)-ψ′(t)φ″(t))/[φ′(t)]³．<\/b><\/p>\n<p class=\"bullet\">• <b>参数式函数求导：例3 设 {x=ln(1+t²)，y=arctan t，求 dy/dx，d²y/dx²．解 dy/dx=1/(2t)，d²y/dx²=dy′/dx=(dy′/dt)/(dx/dt)=(1/(-2t²))/(2t/(1+t²))=(1+t²)/(-4t³)．（见例3）<\/b><\/p>\n<h2 id=\"ch2_4\">五、导数与微分的应用<span class=\"src\">选自 §1.5、§2.3<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">绝对误差与绝对误差限<\/p>\n<div class=\"p\">设 x₀ 为准确数，x* 为 x₀ 的近似数，则<\/div>\n<div class=\"f\">x*-x₀=Δx<\/div>\n<div class=\"p\">称为准确数 x₀ 的绝对误差，若存在正数 δₓ，使<\/div>\n<div class=\"p\">|x*-x₀|=|Δx|≤δₓ，则称 δₓ 为绝对误差限．<\/div>\n<p class=\"lb\">相对误差与相对误差限<\/p>\n<div class=\"p\">称 Δx/x₀（或 Δx/x*）为准确数的相对误差，而<\/div>\n<div class=\"f\">δₓ/|x₀|（或 δₓ/|x*|）<\/div>\n<div class=\"p\">为相对误差限．<\/div>\n<p class=\"lb\">二阶微分<\/p>\n<div class=\"p\">若 y=f(x) 在区间 I 上可微（x 为自变量），则<\/div>\n<div class=\"f\">dy=f′(x)dx<\/div>\n<div class=\"p\">．这里 dy 不仅与 x 有关，与 dx=Δx 也有关，而 Δx 是与 x 无关的一个量．我们现在研究 dy 与 x 之间的关系，在这里，Δx 相对于 x 来说是个常数，所以 dy 是 x 的函数．如果 dy 又可微，即 f″(x) 存在，则<\/div>\n<div class=\"p\">d(dy)=d(f′(x)dx)=d(f′(x))dx=f″(x)dxdx=f″(x)dx²，称为 f(x) 的二阶微分，记作 d²y，即<\/div>\n<div class=\"f\">d²y=f″(x)dx²<\/div>\n<div class=\"p\">．<\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>一、近似计算<\/b>（例5）<\/p>\n<p class=\"bullet\">• <b>常用近似公式<\/b><\/p>\n<p class=\"bullet\">• <b>二、误差估计<\/b>（例6）<\/p><\/main>\n<\/div>\n<script>\ndocument.querySelectorAll('#toc a[href^=\"#\"]').forEach(function(a){\n  a.addEventListener('click', function(e){\n    e.preventDefault();\n    var el = document.getElementById(a.getAttribute('href').slice(1));\n    if(el) el.scrollIntoView({block:'start'});\n  });\n});\n<\/script>\n<\/body><\/html>";
const LS = 'wjf-annot-v2';
const COLORS = {y:'#fff2a8',g:'#c9ecc9',b:'#c9e2f7',p:'#f8d7e3',
                o:'#e2ab4c',r:'#d9534f',t:'#2e7d32',v:'#6a5acd'};
const HAS_HL = (typeof Highlight !== 'undefined') && window.CSS && CSS.highlights;

let ANN = JSON.parse(JSON.stringify(BASE));
try {
  const local = JSON.parse(localStorage.getItem(LS) || '{}');
  Object.keys(local).forEach(k=>{
    if(!ANN[k]){ ANN[k] = local[k]; return; }
    const mk = (ANN[k].marks||[]).concat(local[k].marks||[]);
    const seen = new Set();
    ANN[k] = {
      marks: mk.filter(m=>{ const t=[m.start,m.end,m.type,m.c,m.fi].join('|');
        if(seen.has(t)) return false; seen.add(t); return true; }),
      notes: (ANN[k].notes||[]).concat(local[k].notes||[])
    };
  });
} catch(e) {}
function saveAnn(){ try{ localStorage.setItem(LS, JSON.stringify(ANN)); }catch(e){} }
function annOf(k){ return ANN[k] || (ANN[k] = {marks:[],notes:[]}); }

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
/* 把 **文字** 渲染成加粗（数据里沿用了 Markdown 强调） */
function md(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
function ulist(a){return a&&a.length?'<ul>'+a.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>':'';}
function card(r,inner){return '<div class="card"><div class="hd">'+r+'</div><div class="body">'+inner+'</div></div>';}

function renderProblems(list){
  return list.map(p=>{
    let hd='<span class="id">'+esc(p.id)+'</span>'
      +'<span class="star">'+stars(p.difficulty||3)+'</span>'
      +'<span class="ttl">'+esc(p.statement)+'</span>'
      +'<span class="tag">'+esc(p.type||'')+'</span>';
    let b='<div class="k">考点</div>'+ulist(p.topics);
    b+=p.key_points&&p.key_points.length?'<div class="k">解题关键</div>'+ulist(p.key_points):'';
    (p.solutions||[]).forEach(s=>{ b+='<div class="k">'+esc(s.name||'解法')+'</div>'+ulist(s.steps); });
    if(p.pitfalls&&p.pitfalls.length) b+='<div class="k">易错点</div>'+ulist(p.pitfalls);
    if(p.related&&p.related.length) b+='<div class="rel">关联：'+esc(p.related.join('；'))+'</div>';
    if(p.source) b+='<div class="rel">出处：'+esc(p.source)+'　收录：'+esc(p.added||'')+'</div>';
    return card(hd,b);
  }).join('');
}

let UID = 0;
function fml(list, a){
  return (list||[]).map((x,i)=>{
    let cls='f';
    (((a||{}).marks)||[]).forEach(m=>{
      if(m.fi===i) cls += (m.type==='fhl' ? ' mk-hl-' : ' mk-ul-') + (m.c||'y');
    });
    return '<div class="'+cls+'" data-f="'+i+'">'+esc(x)+'</div>';
  }).join('');
}
function itemBody(it, a){
  let b='';
  if(it.kind === '易错点'){
    if(it.rule) b+='<div class="p">'+md(it.rule)+'</div>';
    if(it.why) b+='<div class="p" style="color:#7a7a7a">'+md(it.why)+'</div>';
    if(it.valid) b+='<div class="ok">✓ '+md(it.valid)+'</div>';
    if(it.invalid) b+='<div class="no">✗ '+md(it.invalid)+'</div>';
    if(it.remedy) b+='<div class="p">'+md(it.remedy)+'</div>';
  } else if(it.kind === '题目'){
    b+='<div class="rel">出处：'+esc(it.source||'')+'　题型：'+esc(it.type||'')
      +'　难度：'+'★'.repeat(it.difficulty||3)+'　收录：'+esc(it.added||'')+'</div>';
    if(it.my_answer) b+='<div class="k">当时答案</div><div class="p">'+md(it.my_answer)+'</div>';
    if(it.right_answer) b+='<div class="k">正确答案</div><div class="p"><b>'+md(it.right_answer)+'</b></div>';
    if(it.error_analysis) b+='<div class="k">错因</div><div class="p">'+md(it.error_analysis)+'</div>';
    if(it.topics&&it.topics.length) b+='<div class="k">考点</div>'+ulist(it.topics);
    if(it.key_points&&it.key_points.length) b+='<div class="k">解题关键</div>'+ulist(it.key_points);
    (it.solutions||[]).forEach(s=>{ b+='<div class="k">'+esc(s.name||'解法')+'</div>'+ulist(s.steps); });
    if(it.pitfalls&&it.pitfalls.length) b+='<div class="k">易错点</div>'+ulist(it.pitfalls);
  } else {
    if(it.content) b+='<div class="p">'+md(it.content)+'</div>';
    b+=fml(it.formulas, a);
    b+=ulist(it.tips);
  }
  if(it.related&&it.related.length) b+='<div class="rel">关联：'+esc(it.related.join('；'))+'</div>';
  return b;
}
function itemHTML(ch, it){
  const key=ch.id+'|'+it.sec+'|'+it.name;
  const a=ANN[key]||{marks:[],notes:[]};
  const has=(a.marks&&a.marks.length)||(a.notes&&a.notes.length);
  const isErr = it.kind==='易错点';
  const isProb = it.kind==='题目';
  const bid='b'+(UID++);
  const bidge = isProb ? '<span class="badge prob">题目</span>'
              : isErr ? '<span class="badge err">易错点</span>'
                      : '<span class="badge">知识点</span>';
  const title = isProb
    ? '<span class="pid">'+esc(it.id)+'</span>'
      + '<span class="star">'+'★'.repeat(it.difficulty||3)+'</span>'
      + '<span class="pst">'+md(it.statement)+'</span>'
      + '<span class="pdate">'+esc(it.added||'')+'</span>'
    : '<span>'+md(it.name)+'</span>';
  const notes=(a.notes||[]).map((t,i)=>
    '<div class="pn"><span class="del" data-k="'+esc(key)+'" data-i="'+i+'">✕</span>'
    +'<textarea data-k="'+esc(key)+'" data-i="'+i+'">'+esc(t)+'</textarea></div>').join('');
  const mklist=(a.marks||[]).map((m,i)=>{
    const isF=(m.type||'').charAt(0)==='f';
    const isHL=(m.type||'').indexOf('hl')>=0;
    return '<div class="mk"><i style="background:'+(COLORS[m.c]||'#ddd')+'"></i>'
         + (isF?'公式':'文字')+(isHL?'高亮':'下划线')
         + '<span class="delm" data-k="'+esc(key)+'" data-i="'+i+'">✕</span></div>';
  }).join('');
  const margin=(notes+mklist)||'<div class="empty">选中文字或点公式可批注</div>';
  return '<div class="item" data-key="'+esc(key)+'">'
    + '<div class="ihd" data-t="'+bid+'">'
    +   '<span class="arw">▸</span>'
    +   bidge + title + '</div>'
    + '<div class="ibody hide" id="'+bid+'">'
    +   '<div class="ic">'+itemBody(it,a)+'</div>'
    +   '<div class="im">'+margin+'</div>'
    + '</div></div>';
}
function renderTree(chaps, kw, kinds){
  const hit = it => (!kinds || kinds.indexOf(it.kind) >= 0)
                && (!kw || JSON.stringify(it).toLowerCase().indexOf(kw) >= 0);
  let out='';
  chaps.forEach((ch, ci)=>{
    const items = (ch.items||[]).filter(hit);
    if(!items.length) return;
    let body='';
    (ch.outline||[]).forEach((g, gi)=>{
      const gid='c'+ci+'g'+gi;
      const ORD = {'知识点':0,'易错点':1,'题目':2};
      const srt = a => a.sort((x,y)=>(ORD[x.kind]||0)-(ORD[y.kind]||0));
      const direct = srt(items.filter(it=>it.sec===g.sec));
      let inner = direct.map(it=>itemHTML(ch,it)).join('');
      let gCount = direct.length;
      (g.subs||[]).forEach((s, si)=>{
        const sItems = srt(items.filter(it=>it.sec===s.sec));
        if(!sItems.length) return;
        gCount += sItems.length;
        const sid=gid+'s'+si;
        inner += '<div class="sub"><div class="shd" data-t="'+sid+'">'
              +  '<span class="arw">▸</span><span>'+esc(s.sec+'　'+s.name)+'</span>'
              +  '<span class="cnt">'+sItems.length+'</span></div>'
              +  '<div class="sbody hide" id="'+sid+'">'
              +  sItems.map(it=>itemHTML(ch,it)).join('') + '</div></div>';
      });
      if(!gCount){
        const hasAny = (ch.items||[]).some(it => it.sec===g.sec
                        || (g.subs||[]).some(s=>it.sec===s.sec));
        if(!kw && !hasAny) body += '<div class="grp empty-grp"><div class="ghd off">'
              + '<span class="arw">·</span><span>'+esc(g.sec+'　'+g.name)+'</span>'
              + '<span class="cnt">暂无收录</span></div></div>';
        return;
      }
      body += '<div class="grp"><div class="ghd" data-t="'+gid+'">'
           +  '<span class="arw">▸</span><span>'+esc(g.sec+'　'+g.name)+'</span>'
           +  '<span class="cnt">'+gCount+'</span></div>'
           +  '<div class="gbody hide" id="'+gid+'">'+inner+'</div></div>';
    });
    const cid='c'+ci;
    out += '<div class="chap"><div class="chd" data-t="'+cid+'">'
        +  '<span class="arw">▾</span><span>'+esc(ch.chapter)+'</span>'
        +  '<span class="cnt">'+items.length+' 条目</span></div>'
        +  '<div class="cbody" id="'+cid+'">'+body+'</div></div>';
  });
  return out || '<p style="color:#888">没有匹配的内容。</p>';
}

function textNodes(root){
  const out=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p) return NodeFilter.FILTER_REJECT;
    if(p.closest('mjx-assistive-mml,textarea,.im,.pn,#tb')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  let n; while(n=w.nextNode()) out.push(n);
  return out;
}
function makeRange(root, m){
  const ns=textNodes(root);
  const all=ns.map(n=>n.nodeValue).join('');
  let s=m.start, e=m.end;
  if(m.text && all.substr(s, e-s) !== m.text){
    const i=all.indexOf(m.text);
    if(i>=0){ s=i; e=i+m.text.length; }
  }
  if(s==null||e==null||s>=e) return null;
  let pos=0, sN=null,sO=0,eN=null,eO=0;
  for(const n of ns){
    const len=n.nodeValue.length;
    if(sN===null && pos+len>s){ sN=n; sO=s-pos; }
    if(eN===null && pos+len>=e){ eN=n; eO=e-pos; }
    pos+=len;
    if(sN&&eN) break;
  }
  if(!sN||!eN) return null;
  try{
    const r=document.createRange();
    r.setStart(sN,Math.max(0,Math.min(sO,sN.nodeValue.length)));
    r.setEnd(eN,Math.max(0,Math.min(eO,eN.nodeValue.length)));
    return r;
  }catch(err){ return null; }
}
function offsetsOf(root, range){
  const ns=textNodes(root);
  let pos=0,s=-1,e=-1;
  for(const n of ns){
    const len=n.nodeValue.length;
    if(s<0 && n===range.startContainer) s=pos+range.startOffset;
    if(e<0 && n===range.endContainer) e=pos+range.endOffset;
    pos+=len;
  }
  if(s<0||e<0||s===e) return null;
  return {start:Math.min(s,e), end:Math.max(s,e)};
}
function applyMarks(root){
  const groups={};
  root.querySelectorAll('.item').forEach(el=>{
    const a=ANN[el.dataset.key]; if(!a||!a.marks) return;
    const cell=el.querySelector('.ic');
    if(!cell) return;
    a.marks.forEach(m=>{
      if(m.fi!==undefined && m.fi!==null) return;
      const r=makeRange(cell,m); if(!r) return;
      if(HAS_HL){ (groups[m.type+'-'+m.c]=groups[m.type+'-'+m.c]||[]).push(r); }
      else {
        try{
          const s=document.createElement(m.type==='ul'?'span':'mark');
          if(m.type==='ul'){ s.className='uln'; s.style.borderBottomColor=COLORS[m.c]||'#e2ab4c'; }
          else s.style.background=COLORS[m.c]||'#fff2a8';
          r.surroundContents(s);
        }catch(err){}
      }
    });
  });
  if(HAS_HL){
    CSS.highlights.clear();
    Object.keys(groups).forEach(name=>{
      CSS.highlights.set(name, new Highlight(...groups[name]));
    });
  }
}
let CUR=null;
const tb=document.getElementById('tb');
function place(x,y){
  tb.style.display='flex';
  tb.style.left=Math.max(8,Math.min(window.innerWidth-430,x))+'px';
  tb.style.top=Math.max(8,y-46)+'px';
}
function pickText(){
  const s=window.getSelection();
  if(!s||!s.rangeCount||!s.toString().trim()) return false;
  let e=s.anchorNode; e=e.nodeType===1?e:e.parentElement;
  const el=e?e.closest('.item'):null;
  if(!el) return false;
  CUR={el:el, cell:el.querySelector('.ic'), range:s.getRangeAt(0).cloneRange(), fi:null};
  const r=s.getRangeAt(0).getBoundingClientRect();
  place(r.left,r.top);
  return true;
}
document.addEventListener('selectionchange',()=>{ if(!pickText()) tb.style.display='none'; });
tb.addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('click',e=>{
  const f=e.target.closest('.f');
  if(f){
    const el=f.closest('.item'); if(!el) return;
    document.querySelectorAll('.f.sel').forEach(x=>x.classList.remove('sel'));
    f.classList.add('sel');
    CUR={el:el, cell:el.querySelector('.ic'), range:null, fi:+f.dataset.f};
    const r=f.getBoundingClientRect(); place(r.left,r.top);
    e.stopPropagation();
    return;
  }
  const dm=e.target.closest('.delm');
  if(dm){
    const a=annOf(dm.dataset.k); a.marks.splice(+dm.dataset.i,1);
    if(!a.notes.length&&!(a.marks||[]).length) delete ANN[dm.dataset.k];
    saveAnn(); draw(); e.stopPropagation(); return;
  }
  const d=e.target.closest('.pn .del');
  if(d){
    const a=annOf(d.dataset.k); a.notes.splice(+d.dataset.i,1);
    if(!a.notes.length&&!(a.marks||[]).length) delete ANN[d.dataset.k];
    saveAnn(); draw(); e.stopPropagation(); return;
  }
  const t=e.target.closest('[data-t]');
  if(t){
    const b=document.getElementById(t.dataset.t);
    if(b){
      b.classList.toggle('hide');
      const a=t.querySelector('.arw');
      if(a) a.textContent = b.classList.contains('hide') ? '▸' : '▾';
    }
  }
});
tb.querySelectorAll('.sw,button').forEach(b=>b.onclick=()=>{
  if(!CUR) return;
  const k=CUR.el.dataset.key, a=annOf(k), act=b.dataset.a;
  if(act==='clr'){ delete ANN[k]; saveAnn(); draw(); tb.style.display='none'; CUR=null; return; }
  if(act==='note'){ a.notes=a.notes||[]; a.notes.push(''); saveAnn(); draw(); tb.style.display='none'; return; }
  a.marks=a.marks||[];
  if(CUR.fi!==null && CUR.fi!==undefined){
    a.marks=a.marks.filter(m=>m.fi!==CUR.fi);
    a.marks.push({type:'f'+act, c:b.dataset.c, fi:CUR.fi});
  } else if(CUR.range){
    const off=offsetsOf(CUR.cell,CUR.range);
    const txt=CUR.range.toString().replace(/\s+/g,' ').trim();
    if(!off||!txt) return;
    a.marks.push({type:act, c:b.dataset.c, start:off.start, end:off.end, text:txt});
  }
  saveAnn(); draw(); tb.style.display='none';
});
document.addEventListener('mousedown',e=>{
  if(!tb.contains(e.target) && !e.target.closest('.f')) tb.style.display='none';
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.tagName==='TEXTAREA'&&t.dataset.k){ annOf(t.dataset.k).notes[+t.dataset.i]=t.value; saveAnn(); }
});
document.getElementById('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(ANN,null,1)],{type:'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download='批注.json'; a.click(); URL.revokeObjectURL(u);
};
document.getElementById('imp').onclick=()=>document.getElementById('filein').click();
document.getElementById('filein').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
    Object.keys(o).forEach(k=>{ ANN[k]=o[k]; });
    saveAnn(); draw(); }catch(err){ alert('导入失败：'+err.message); } };
  r.readAsText(f);
};

let TAB='p';
function draw(){
  const isItv = (TAB==='i');
  document.getElementById('itvbox').style.display = isItv ? 'block' : 'none';
  document.getElementById('main').style.display = isItv ? 'none' : '';
  document.getElementById('q').style.display = isItv ? 'none' : '';
  document.getElementById('stat').style.display = isItv ? 'none' : '';
  document.getElementById('annbar').style.display = isItv ? 'none'
      : (TAB==='k' ? 'inline' : 'none');
  if(isItv){
    const f=document.getElementById('itv');
    if(!f.getAttribute('srcdoc')) f.setAttribute('srcdoc', BOOK);   /* 首次才注入 */
    return;
  }
  const kw=(document.getElementById('q').value||'').trim().toLowerCase();
  const m=document.getElementById('main');
  let html='', n=0;
  document.getElementById('annbar').style.display=(TAB==='k')?'inline':'none';
  const kinds = (TAB==='p') ? ['题目'] : ['知识点','易错点'];
  UID=0;
  CHAPS.forEach(ch=>{
    n += (ch.items||[]).filter(it=>{
      if(kinds.indexOf(it.kind) < 0) return false;
      return !kw || JSON.stringify(it).toLowerCase().indexOf(kw)>=0;
    }).length;
  });
  m.innerHTML = renderTree(CHAPS, kw, kinds);
  document.getElementById('stat').textContent=n+' 条';
  document.getElementById('annbar').style.display='inline';
  const done=()=>applyMarks(m);
  if(window.MathJax&&MathJax.typesetPromise){ MathJax.typesetPromise([m]).then(done).catch(done); }
  else done();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); TAB=t.dataset.t; draw();
});
document.getElementById('q').oninput=draw;
draw();
</script></body></html>
