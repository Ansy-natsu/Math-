^x-1=e^{x\\ln a}-1\\sim x\\ln a$"], "kind": "知识点", "sec": "§3.6", "topic": "等价量的推导方法"}, {"name": "用连续性交换极限符号", "formulas": ["$\\lim\\limits_{x\\to 0}\\ln\\bigl[(1+x)^{1/x}\\bigr]=\\ln\\bigl[\\lim\\limits_{x\\to 0}(1+x)^{1/x}\\bigr]=\\ln e=1$"], "content": "对数函数连续，故极限符号可以与 $\\ln$ 交换位置（复合函数极限的性质）。", "kind": "知识点", "sec": "§4.4", "topic": "等价量的推导方法"}, {"name": "接力推导：$(1+u)^\\gamma-1\\sim\\gamma u$", "content": "把幂改写成以 $e$ 为底，再用两条更基础的等价量接力，即可推出整个幂函数族的等价量。这是「用已知推未知」的典型示范。", "formulas": ["$(1+u)^\\gamma=e^{\\gamma\\ln(1+u)}$", "$(1+u)^\\gamma-1=e^{\\gamma\\ln(1+u)}-1\\sim\\gamma\\ln(1+u)$（第一棒：令 $v=\\gamma\\ln(1+u)\\to 0$，用 $e^v-1\\sim v$）", "$\\gamma\\ln(1+u)\\sim\\gamma u$（第二棒：用 $\\ln(1+u)\\sim u$）", "合起来即得 $(1+u)^\\gamma-1\\sim\\gamma u$（$u\\to 0$）", "极限形式：$\\lim\\limits_{u\\to 0}\\dfrac{(1+u)^\\gamma-1}{u}=\\lim\\limits_{u\\to 0}\\dfrac{e^{\\gamma\\ln(1+u)}-1}{\\gamma\\ln(1+u)}\\cdot\\gamma\\cdot\\dfrac{\\ln(1+u)}{u}=1\\cdot\\gamma\\cdot1=\\gamma$"], "tips": ["威力在于把「幂」降成「乘法」——带参数指数 $\\alpha$、$\\beta$ 的极限一替换就变成比例关系", "家族成员：取 $\\gamma=\\dfrac12$ 得 $\\sqrt{1+u}-1\\sim\\dfrac{u}{2}$；取 $\\gamma=-1$ 得 $\\dfrac{1}{1+u}-1\\sim-u$；$e^u-1\\sim u$ 与 $\\ln(1+u)\\sim u$ 是它的换底 / 反函数形态", "只要背一条 $(1+u)^\\gamma-1\\sim\\gamma u$，其余都能即时推出", "替换必须处在因式位置——见易错点 E-001"], "related": ["题库题目 1-4.12(2)", "题库易错点 E-001"], "kind": "知识点", "sec": "等价量", "topic": "常用等价量"}, {"name": "只能在因式位置替换", "content": "被替换的部分必须整体作为乘除中的因式；处在加减项里不能单独替换。", "formulas": ["正确：$\\lim\\limits_{x\\to 0}\\dfrac{\\sin x}{x}=\\lim\\dfrac{x}{x}=1$", "错误：$\\lim\\limits_{x\\to 0}\\dfrac{x-\\sin x}{x^3}$ 中把 $\\sin x$ 换成 $x$ 得 $0$（实际为 $\\dfrac{1}{6}$）"], "related": ["题库易错点 E-001"], "kind": "知识点", "sec": "等价量", "topic": "常用等价量"}, {"name": "替换必须整体进行，不能拆开分别替换", "content": "把式子拆成若干部分再各自替换、各自求极限，往往得到错误结论。", "formulas": ["错例（练习 B）：$\\lim\\limits_{x\\to\\infty}x^2\\sin\\dfrac{1}{x}$ 拆成 $(\\lim x)\\cdot\\lim\\dfrac{\\sin(1/x)}{1/x}$ —— 第一个极限是 $\\infty$，四则运算不适用"], "related": ["题库题目 10.14-B 的教训"], "kind": "知识点", "sec": "等价量", "topic": "常用等价量"}, {"name": "拆项的前提是拆出来的每一项极限都存在", "content": "$\\lim(fg)=\\lim f\\cdot\\lim g$ 成立要求 $\\lim f$ 与 $\\lim g$ 都是有限数。只要有一项是 $\\infty$ 或不存在，就不能拆。", "formulas": ["可以拆：$\\lim\\limits_{x\\to 0}\\Bigl[\\dfrac{\\tan 5x}{\\sin 3x}+\\dfrac{1-\\cos x}{\\sin 3x}\\Bigr]=\\dfrac{5}{3}+0=\\dfrac{5}{3}$（两项极限都存在）", "不能拆：$\\lim\\limits_{x\\to\\infty}x\\cdot\\dfrac{\\sin(1/x)}{1/x}$ 中的 $\\lim\\limits_{x\\to\\infty}x=\\infty$"], "tips": ["判断口诀：先看每一项是不是都收敛，再决定能不能拆"], "related": ["题库易错点 E-002", "题库题目 10.14-B"], "kind": "知识点", "sec": "§3.2", "topic": "极限四则运算的适用条件"}, {"name": "遇到三角和差 → 和差化积（把加减变成乘积）", "content": "看到同名三角函数相加减（$\\sin A\\pm\\sin B$、$\\cos A\\pm\\cos B$），第一反应就是和差化积。理由很实在：等价量替换只在乘除（因式）结构中合法（见易错点 E-001），而和差化积恰好能把「加减」变成「乘积」——一变完，等价量替换、有界量 × 无穷小量这些武器就全能用了。", "formulas": ["$\\sin A+\\sin B=2\\sin\\dfrac{A+B}{2}\\cos\\dfrac{A-B}{2}$", "$\\sin A-\\sin B=2\\cos\\dfrac{A+B}{2}\\sin\\dfrac{A-B}{2}$", "$\\cos A+\\cos B=2\\cos\\dfrac{A+B}{2}\\cos\\dfrac{A-B}{2}$", "$\\cos A-\\cos B=-2\\sin\\dfrac{A+B}{2}\\sin\\dfrac{A-B}{2}$", "模板一（凑重要极限）：$\\lim\\limits_{x\\to\\alpha}\\dfrac{\\sin x-\\sin\\alpha}{x-\\alpha}=\\lim\\limits_{x\\to\\alpha}\\cos\\dfrac{x+\\alpha}{2}\\cdot\\dfrac{\\sin\\frac{x-\\alpha}{2}}{\\frac{x-\\alpha}{2}}=\\cos\\alpha$", "模板二（有界 × 无穷小）：$\\lim\\limits_{x\\to+\\infty}\\left[\\sin\\ln(x+1)-\\sin\\ln x\\right]=0$"], "tips": ["化积之后分工明确：含 $A+B$ 的那一项通常**有界**（用「有界量 × 无穷小量」），含 $A-B$ 的那一项通常**趋于 $0$**（用等价量）", "$A-B$ 往往能化简成小量，别被「两个角都趋于 $\\infty$」吓住：例如 $\\ln(x+1)-\\ln x=\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$", "它是「提公因式」的姊妹招——两者都在做同一件事：把不能用等价量的**加减结构**，改造成能用的**乘积结构**"], "related": ["题库题目 10.14-C", "题库题目 1-4.12(8)", "题库易错点 E-001"], "kind": "知识点", "sec": "§3.6", "topic": "典型极限的处理技巧"}, {"name": "有理化", "content": "遇到根号差（$\\sqrt{A}-\\sqrt{B}$）时，分子分母同乘 $(\\sqrt{A}+\\sqrt{B})$，把 $\\infty-\\infty$ 或 $0-0$ 化成可算的商。", "formulas": ["$\\sqrt{A}-\\sqrt{B}=\\dfrac{A-B}{\\sqrt{A}+\\sqrt{B}}$"], "tips": ["有理化后常剩 $\\infty/\\infty$ 型，再上下同除最高次幂"], "kind": "知识点", "sec": "§3.6", "topic": "典型极限的处理技巧"}, {"name": "识别阶数，两步替换", "content": "复合结构如 $1-\\cos(1-\\cos 2x)$ 要分两步：先令 $u=1-\\cos 2x$ 用 $1-\\cos u\\sim\\dfrac{u^2}{2}$，再算 $u$ 的阶。", "formulas": ["$1-\\cos(1-\\cos 2x)\\sim\\dfrac{(1-\\cos 2x)^2}{2}\\sim\\dfrac{(2x^2)^2}{2}=2x^4$"], "tips": ["一次跳完容易把阶数算错", "相关题目：题库 10.14-D"], "kind": "知识点", "sec": "§3.6", "topic": "典型极限的处理技巧"}, {"name": "由等价关系求待定常数", "content": "若 $\\alpha\\sim\\beta$ 且其中含未知常数，用 $\\lim\\dfrac{\\beta}{\\alpha}=1$ 列出方程求解。", "formulas": ["例：$\\alpha=kx^2$，$\\beta=\\sqrt{1+x\\arcsin x}-\\sqrt{\\cos x}$", "有理化后 $\\beta\\sim\\dfrac{x\\arcsin x+1-\\cos x}{2}\\sim\\dfrac{x^2+x^2/2}{2}=\\dfrac{3}{4}x^2$", "故 $k=\\dfrac{3}{4}$"], "tips": ["相关题目：题库 10.14-E"], "kind": "知识点", "sec": "§3.6", "topic": "典型极限的处理技巧"}, {"name": "$o$ 记号的书写", "content": "把各部分的等价量写成「主项 $+\\ o(\\text{主项})$」，再通分、约分，可直接看出极限。", "formulas": ["$\\tan 5x=5x+o(x)$", "$1-\\cos x=\\dfrac{x^2}{2}+o(x^2)$", "$\\sin 3x=3x+o(x)$", "分子分母同除 $x$ 后 $\\to\\dfrac{5}{3}$"], "kind": "知识点", "sec": "§3.5", "topic": "典型极限的处理技巧"}, {"name": "带参数指数的 $0/0$ 型：换元 + 因式位置替换", "content": "含 $x^\\alpha$、$a^\\alpha$ 这类参数指数的 $0/0$ 型，标准套路是「换元 → 提公因子 → 因式位置等价替换」。", "formulas": ["求 $\\lim\\limits_{x\\to a}\\dfrac{x^\\alpha-a^\\alpha}{x^\\beta-a^\\beta}$（$a>0$，$\\beta\\neq 0$）", "令 $x=a(1+t)$，则 $t=\\dfrac{x-a}{a}$，且 $x\\to a\\iff t\\to 0$", "原式 $=\\dfrac{a^\\alpha[(1+t)^\\alpha-1]}{a^\\beta[(1+t)^\\beta-1]}=a^{\\alpha-\\beta}\\cdot\\dfrac{(1+t)^\\alpha-1}{(1+t)^\\beta-1}$", "$\\sim a^{\\alpha-\\beta}\\cdot\\dfrac{\\alpha t}{\\beta t}=\\dfrac{\\alpha}{\\beta}a^{\\alpha-\\beta}$"], "tips": ["换元后别漏分母的 $a$：$x-a=at$，不是 $t$", "答案里的 $a^{\\alpha-\\beta}$ 来自公因子 $\\dfrac{a^\\alpha}{a^\\beta}$，不是 $a^{\\alpha/\\beta}$", "分子、分母各自是完整因式 → 可整体替换（乘除结构）", "本章不能用洛必达，也不能硬套导数定义"], "related": ["题库题目 1-4.12(2)", "题库题目 10.14-E"], "kind": "知识点", "sec": "§3.6", "topic": "典型极限的处理技巧"}, {"name": "证明 $\\ln x$ 在 $(0,+\\infty)$ 上连续", "content": "法一（用等价量）：任取 $x_0>0$，$\\ln x-\\ln x_0=\\ln\\dfrac{x}{x_0}=\\ln(1+u)$，其中 $u=\\dfrac{x}{x_0}-1\\to 0$，由 $\\ln(1+u)\\sim u\\to 0$ 得 $\\lim\\limits_{x\\to x_0}\\ln x=\\ln x_0$。", "formulas": ["$\\lim\\limits_{x\\to x_0}\\ln x=\\ln x_0$"], "tips": ["法二（反函数定理）：$e^x$ 连续且严格单调，故其反函数 $\\ln x$ 也连续 —— 即「严格单调的连续函数必有严格单调的连续反函数」"], "kind": "知识点", "sec": "§4.4", "topic": "函数的连续性"}, {"name": "严格单调连续函数的反函数连续", "content": "这条定理是把 $e^x$ 的连续性「传」给 $\\ln x$ 的桥梁，也是反三角函数连续性的依据。", "kind": "知识点", "sec": "§4.4", "topic": "函数的连续性"}, {"name": "极限符号与连续函数可以交换", "content": "若 $f$ 在 $u_0$ 连续且 $\\lim g(x)=u_0$，则 $\\lim f(g(x))=f(\\lim g(x))$。", "formulas": ["$\\lim\\limits_{x\\to 0}\\ln\\bigl[(1+x)^{1/x}\\bigr]=\\ln e=1$"], "tips": ["这就是「复合函数极限的性质」，也是初等函数在定义域内连续的直接推论"], "kind": "知识点", "sec": "§4.4", "topic": "函数的连续性"}, {"name": "定义", "content": "若 $\\lim\\dfrac{\\gamma}{\\beta}=0$，则记 $\\gamma=o(\\beta)$，读作「$\\gamma$ 是 $\\beta$ 的高阶无穷小」。", "formulas": ["$\\gamma=o(\\beta)\\iff\\lim\\dfrac{\\gamma}{\\beta}=0$"], "tips": ["$o$ 记号里的等号是单向的，真义是「属于」"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "与等价的关系", "content": "等价无穷小只保证比值趋于 $1$，两者相差一个高阶无穷小。", "formulas": ["$\\alpha\\sim\\beta\\iff\\alpha=\\beta+o(\\beta)$（定理 4.4）"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "为什么 $1-\\cos x=\\dfrac{x^2}{2}+o(x^2)$", "content": "按定义验证：$\\lim\\limits_{x\\to 0}\\dfrac{1-\\cos x-x^2/2}{x^2}=\\lim\\limits_{x\\to 0}\\dfrac{1-\\cos x}{x^2}-\\dfrac{1}{2}=\\dfrac{1}{2}-\\dfrac{1}{2}=0$。", "formulas": ["$1-\\cos x=\\dfrac{x^2}{2}+o(x^2)$", "更精细：$1-\\cos x=\\dfrac{x^2}{2}-\\dfrac{x^4}{24}+o(x^4)$，故 $o(x^2)=-\\dfrac{x^4}{24}+o(x^4)$"], "tips": ["$o(x^2)$ 不是零，而是「比 $x^2$ 更高阶的量」，不必知道具体是什么"], "kind": "知识点", "sec": "§3.6", "topic": "$o$ 记号"}, {"name": "同阶相加：$o(x^n)\\pm o(x^n)=o(x^n)$", "content": "这不是「替换」，而是 $o$ 记号自身的运算律。$o(x^n)$ 代表「所有比 $x^n$ 高阶的无穷小」这一整类函数，从这一类里任取两个相加，结果仍属于这一类（封闭性）。", "formulas": ["设 $\\alpha=o(x^n)$，$\\beta=o(x^n)$，即 $\\lim\\limits_{x\\to 0}\\dfrac{\\alpha}{x^n}=0$，$\\lim\\limits_{x\\to 0}\\dfrac{\\beta}{x^n}=0$", "$\\lim\\limits_{x\\to 0}\\dfrac{\\alpha\\pm\\beta}{x^n}=\\lim\\limits_{x\\to 0}\\dfrac{\\alpha}{x^n}\\pm\\lim\\limits_{x\\to 0}\\dfrac{\\beta}{x^n}=0\\pm 0=0$", "按定义即得 $\\alpha\\pm\\beta=o(x^n)$"], "tips": ["与易错点 E-001 不冲突：E-001 禁的是「用一个具体量顶替另一个具体量」（主动丢信息）；$o$ 的运算是「分类的封闭性」（保留信息）", "根本区别：替换是主动丢掉高阶项；$o$ 运算一路保留，直到最后一步才决定能否忽略", "$o$ 记号的等号是单向的，真义是「属于」"], "related": ["题库易错点 E-001"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "不同阶相加：取低阶", "content": "阶数越高，类越小：$o(x^n)\\subset o(x^m)$（当 $n>m$）。所以两个不同阶的 $o$ 相加时，低阶（大集合）会把高阶吸收掉，结果按最低阶写。", "formulas": ["$o(x^m)\\pm o(x^n)=o\\bigl(x^{\\min(m,n)}\\bigr)$", "证明：设 $\\gamma=o(x^n)$ 且 $n>m$，则 $\\dfrac{\\gamma}{x^m}=\\dfrac{\\gamma}{x^n}\\cdot x^{n-m}\\to 0\\cdot 0=0$，故 $\\gamma=o(x^m)$", "验证：$x^3+x^6=o(x^2)$ ✅（$(x^3+x^6)/x^2=x+x^4\\to 0$）；但 $x^3+x^6\\neq o(x^5)$ ❌（$(x^3+x^6)/x^5\\to\\infty$）"], "tips": ["不能反着写：$o(x^2)+o(x^5)\\neq o(x^5)$，保留高阶是错的", "直观：$o(x^5)$ 里的东西「比 $x^5$ 还小得多」，当然也「比 $x^2$ 小得多」——高阶层被低阶层包住"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "乘除时阶数怎么变", "content": "乘除改变阶数，加减只做吸收。", "formulas": ["$o(x^m)\\cdot o(x^n)=o(x^{m+n})$（阶数相加）", "$x^k\\cdot o(x^n)=o(x^{n+k})$（乘 $x^k$ 升 $k$ 阶）", "$\\dfrac{o(x^n)}{x^k}=o(x^{n-k})$（除 $x^k$ 降 $k$ 阶，需 $n\\ge k$）"], "tips": ["口诀：乘除加阶，加减取低"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "乘积展开中合并同阶（$m=n$ 的真正用武之地）", "content": "在乘积里，不同阶的零头会自动变成同一阶，这时才需要同阶相加律把它们合并。", "formulas": ["$\\sin x=x+o(x)$，$1-\\cos x=\\dfrac{x^2}{2}+o(x^2)$", "$\\Bigl(x+o(x)\\Bigr)\\Bigl(\\dfrac{x^2}{2}+o(x^2)\\Bigr)=\\dfrac{x^3}{2}+\\underbrace{x\\cdot o(x^2)}_{o(x^3)}+\\underbrace{o(x)\\cdot\\dfrac{x^2}{2}}_{o(x^3)}+\\underbrace{o(x)\\cdot o(x^2)}_{o(x^3)}$", "$=\\dfrac{x^3}{2}+o(x^3)+o(x^3)+o(x^3)=\\dfrac{x^3}{2}+o(x^3)$"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "用法示范：用 $o$ 记号绕开「加减不能替换」的坑", "content": "算 $\\lim\\limits_{x\\to 0}\\dfrac{x-\\sin x}{x^3}$ 时，若直接把 $\\sin x$ 换成 $x$ 得 $0$（错）；用 $o$ 记号则把信息一路保留下来。", "formulas": ["$\\sin x=x-\\dfrac{x^3}{6}+o(x^3)$", "$x-\\sin x=x-\\Bigl(x-\\dfrac{x^3}{6}+o(x^3)\\Bigr)=\\dfrac{x^3}{6}-o(x^3)=\\dfrac{x^3}{6}+o(x^3)$", "$\\dfrac{x-\\sin x}{x^3}=\\dfrac{1}{6}+\\dfrac{o(x^3)}{x^3}=\\dfrac{1}{6}+o(1)\\to\\dfrac{1}{6}$"], "tips": ["$o$ 记号允许中间过程「记账」，最后才结算——这就是它比随手替换更安全的原因"], "related": ["题库易错点 E-001"], "kind": "知识点", "sec": "§3.6", "topic": "$o$ 记号"}, {"name": "常数倍与其它", "formulas": ["$k\\cdot o(x^n)=o(x^n)$（常数 $k\\neq 0$ 不影响趋于 $0$ 的速度）", "$-o(x^n)=o(x^n)$"], "kind": "知识点", "sec": "§3.5", "topic": "$o$ 记号"}, {"name": "总纲：把超越结构消成「幂函数的因式相乘除」", "content": "求极限的核心目标只有一件事——**约**。要把式子化成「幂函数的因式相乘除」，才可能约掉零因子、比较阶数。为此有两条主线：**三角用和差化积**（加减 → 乘积）；**指对用切线（线性主部）**（把超越函数换成幂函数）。", "formulas": ["目标形态：$\\dfrac{x^m\\cdot(\\text{趋于非零常数})}{x^n\\cdot(\\text{趋于非零常数})}$——约掉 $x$ 的幂后，$m>n$ 得 $0$，$m<n$ 得 $\\infty$，$m=n$ 得非零常数", "看到 $0/0$ → 目标：约掉零因子，或把式子变成乘除结构", "看到 $\\infty/\\infty$ → 目标：提取主项，把大数化成趋于 $0$ 的小量", "**三角**：$\\sin A-\\sin B=2\\cos\\dfrac{A+B}{2}\\sin\\dfrac{A-B}{2}$（加减 → 乘积）", "**指对**：$e^x-1\\sim x$，$\\ln(1+x)\\sim x$，$a^x-1\\sim x\\ln a$，$(1+x)^\\alpha-1\\sim\\alpha x$", "这些等价量的共同来源：**超越函数在 $0$ 处的切线就是它的主部**（$y=1+x$ 是 $e^x$ 在 $x=0$ 的切线；$y=x$ 是 $\\ln(1+x)$ 在 $x=0$ 的切线）", "最终目的：消掉 $e^{\\,\\cdot\\,}$、$\\ln$、$\\sin$ 这些超越结构，只剩 $x$ 的幂", "手段对照：提公因式（多项式）｜和差化积（三角）｜通分（分式差）｜有理化（根号差）｜提取主项（对数含 $\\infty$）"], "tips": ["术语分两层：求极限用的是「**切线近似 / 线性化**」，得到等价量（$\\sim$），在因式位置可直接替换；若要**严格论证**，才升级成「**切线放缩**」（用 $e^x\\ge 1+x$、$\\ln x\\le x-1$ 这类不等式）配合夹逼定理——结论一样，推理更长。两者是同一件事的「够用版」与「严谨版」", "判断变形是否到位：能不能把式子看成一串「因式」相乘除？能，就可以放心用等价量", "等价量替换只在乘除（因式）结构中合法——见易错点 E-001"], "related": ["题库易错点 E-001", "题库题目 1-4.12(8)（三角和差）", "题库题目 1-综.3(2)（指对，用 $a^x-1\\sim x\\ln a$ 消超越）", "本归档「五、遇到三角和差 → 和差化积」"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "$0/0$ 型的决策流程", "formulas": ["① 有公因式吗？→ 因式分解后约分", "② 有根号差吗？→ 有理化（上下同乘 $\\sqrt{A}+\\sqrt{B}$）", "③ 是纯乘除吗？→ 直接等价量替换", "④ 是加减吗？→ 提公因式 / 通分 / 和差化积，先凑成因式", "⑤ 复合嵌套？→ 分步换元，盯住阶数", "⑥ 都不行？→ $o$ 记号记账 → 夹逼 / 准则"], "tips": ["第 ③ 问是分水岭：乘除能直接替换，加减必须先变形"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "九种武器与模板", "content": "按式子外形直接对号入座：", "formulas": ["多项式÷多项式 → 因式分解约分：$\\lim\\limits_{x\\to1}\\dfrac{x^2-1}{x-1}=\\lim\\limits_{x\\to1}(x+1)=2$", "含根号 → 有理化：$\\lim\\limits_{x\\to0}\\dfrac{\\sqrt{1+x}-1}{x}=\\lim\\limits_{x\\to0}\\dfrac{1}{\\sqrt{1+x}+1}=\\dfrac{1}{2}$", "纯三角乘除 → 等价替换：$\\lim\\limits_{x\\to0}\\dfrac{\\tan3x}{\\sin2x}=\\dfrac{3}{2}$", "$1-\\cos$ → 等价 $\\dfrac{x^2}{2}$：$\\lim\\limits_{x\\to0}\\dfrac{1-\\cos x}{x\\sin x}=\\lim\\limits_{x\\to0}\\dfrac{x^2/2}{x\\cdot x}=\\dfrac{1}{2}$", "三角相减 → 和差化积：$\\lim\\limits_{x\\to\\alpha}\\dfrac{\\sin x-\\sin\\alpha}{x-\\alpha}=\\cos\\alpha$", "加减混合 → 提公因式：$\\lim\\limits_{x\\to0}\\dfrac{\\tan x-\\sin x}{x^3}=\\lim\\limits_{x\\to0}\\dfrac{\\sin x(1-\\cos x)}{x^3\\cos x}=\\dfrac{1}{2}$", "复合嵌套 → 两步等价：$\\lim\\limits_{x\\to0}\\dfrac{1-\\cos(1-\\cos2x)}{x^4}=2$", "幂指结构 → 写成 $e^{v\\ln u}$：$u(x)^{v(x)}=e^{v(x)\\ln u(x)}$", "含参数指数 → 换元 + 因式替换：$\\lim\\limits_{x\\to a}\\dfrac{x^\\alpha-a^\\alpha}{x^\\beta-a^\\beta}=\\dfrac{\\alpha}{\\beta}a^{\\alpha-\\beta}$"], "related": ["题库题目 10.14-C", "题库题目 10.14-D", "题库题目 1-4.12(2)"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "$\\infty/\\infty$ 型：提取主项", "content": "对数、根式里出现趋于 $\\infty$ 的量时，先用运算性质把「大因子」提出来，让剩下的小量趋于 $0$，这样等价量才能上场。", "formulas": ["示范：$\\lim\\limits_{x\\to+\\infty}\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}$", "提主项：$\\ln(1+3^x)=\\ln\\left[3^x(1+3^{-x})\\right]=x\\ln 3+\\ln(1+3^{-x})$", "分子分母同除 $x$：$=\\dfrac{\\ln 3+\\dfrac{\\ln(1+3^{-x})}{x}}{\\ln 2+\\dfrac{\\ln(1+2^{-x})}{x}}\\to\\dfrac{\\ln 3}{\\ln 2}$", "关键：$3^{-x}\\to 0$——大数化成小数之后，$\\ln(1+u)\\sim u$ 才能用"], "tips": ["不要对 $\\ln(1+3^x)$ 直接用 $\\ln(1+u)\\sim u$：这里 $u=3^x\\to+\\infty$，条件不成立"], "related": ["题库题目 1-4.12(5)"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "$1^\\infty$ 型：三条路（推广式 / 取对数 / 凑重要极限）", "content": "特征：底数 $\\to1$、指数 $\\to\\infty$。三条路其实是同一个式子的三种写法，选最顺手的即可。共同的核心动作是：**把 $v(u-1)$ 这个乘积算出来**——它通常是个 $0/0$ 型，于是回到前面那套手段。", "formulas": ["设 $u(x)\\to1$，$v(x)\\to\\infty$，求 $\\lim u^v$", "路①（推广式）：$\\lim u^v=e^{\\lim v(u-1)}$", "路②（取对数）：设 $y=u^v$，则 $\\ln y=v\\ln u=v\\ln\\left[1+(u-1)\\right]\\sim v(u-1)$，故 $y\\to e^{\\lim v(u-1)}$", "路③（凑重要极限）：$u^v=\\left[1+(u-1)\\right]^{\\frac{1}{u-1}\\cdot v(u-1)}\\to e^{\\lim v(u-1)}$", "三路殊途同归，都归到同一个指数 $\\lim v(u-1)$", "基本模板：$\\lim\\limits_{x\\to0}(1+x)^{1/x}=e$，$\\lim\\limits_{x\\to\\infty}\\left(1+\\dfrac{1}{x}\\right)^{x}=e$", "综合例：$\\lim\\limits_{x\\to0}\\left(\\dfrac{a_1^x+\\cdots+a_n^x}{n}\\right)^{1/x}=\\sqrt[n]{a_1a_2\\cdots a_n}$"], "tips": ["关键是算 $v(u-1)$：它一般是 $0/0$ 型，改用「提公因式 / 等价量替换 / 提取主项」处理", "注意 $(u-1)\\to0$，所以 $\\ln\\left[1+(u-1)\\right]\\sim u-1$ 合法（$\\ln$ 处在乘积因式位置）", "把 $u-1$ 化成幂常用 $a^x-1\\sim x\\ln a$、$(1+x)^\\alpha-1\\sim\\alpha x$", "取对数法不用背推广式，考场上更稳；但最后一定要**还原**（取指数），别停在 $\\ln y$ 上"], "related": ["题库题目 1-综.3(2)", "§3.6 重要极限2的推广式（$1^\\infty$ 型）", "本归档「二、等价量的推导方法」"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "有界量 × 无穷小量 = 无穷小量", "content": "三角函数在 $\\infty$ 附近振荡，处理时往往要把「有界性」一起用。最典型的是 $\\sin$ 相减：和差化积之后，$\\cos$ 那一项有界，$\\sin$ 那一项是无穷小。", "formulas": ["示范：$\\lim\\limits_{x\\to+\\infty}\\left[\\sin\\ln(x+1)-\\sin\\ln x\\right]$", "和差化积：$=2\\cos\\dfrac{\\ln(x+1)+\\ln x}{2}\\cdot\\sin\\dfrac{\\ln(x+1)-\\ln x}{2}$", "角差：$\\dfrac{\\ln(x+1)-\\ln x}{2}=\\dfrac{1}{2}\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$，故正弦部分 $\\sim\\dfrac{1}{2x}\\to 0$", "$\\left|\\cos(\\cdot)\\right|\\le 1$ 有界 $\\Longrightarrow$ 整个乘积 $\\to 0$", "另法：由 $|\\sin A-\\sin B|\\le|A-B|$ 直接得 $\\left|\\sin\\ln(x+1)-\\sin\\ln x\\right|\\le\\ln\\left(1+\\dfrac1x\\right)\\to 0$"], "tips": ["不要把 $\\ln(x+1)-\\ln x$ 当成 $\\infty-\\infty$，它其实等于 $\\ln(1+1/x)\\to 0$"], "related": ["题库题目 1-4.12(8)", "§3.5 无穷小量的性质"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "三条禁忌（本章）", "formulas": ["① 加减中直接替换等价量 —— 见易错点 E-001", "② 拆开极限分别求（有一项极限不存在时）—— 见易错点 E-002", "③ 用洛必达法则 —— 第二章才学，本章不能用"], "kind": "知识点", "sec": "专题", "topic": "八、未定式的处理流程"}, {"name": "题型一：判断间断点的类型", "content": "固定流程：先找无定义点/分段点 → 求两个单侧极限 → 对照四类判据下结论。**不写单侧极限直接下结论是最常见的失分点。**", "formulas": ["第一类（两侧极限都存在）：相等但 $\\ne f(x_0)$ 或 $f(x_0)$ 无定义 → **可去**；不相等 → **跳跃**", "第二类（至少一侧极限不存在）：一侧为 $\\infty$ → **无穷**；振荡无极限 → **振荡**", "示范（可去）：$\\lim\\limits_{x\\to0}\\dfrac{\\sqrt{1+\\sin x+\\sin^2x}-(1+\\frac12\\sin x)}{\\sin^2x}=\\dfrac38$，有限且两侧相等 ⟹ 可去", "示范（跳跃）：$\\arctan\\dfrac1x$ 在 $x=0$：左极限 $-\\dfrac\\pi2$、右极限 $\\dfrac\\pi2$，不等 ⟹ 跳跃", "示范（无穷）：$e^{1/x}$ 在 $x=0$：右极限 $+\\infty$ 不存在 ⟹ 第二类无穷"], "tips": ["只要有一侧为 $\\infty$，一律归第二类，**不能判成跳跃**", "遇 $\\sin\\frac1x$、$\\frac1x\\sin\\frac1x$ 这类振荡，另取两串点用归结原则证明极限不存在"], "related": ["题库错题 错-1-4.3(3)", "题库易错点 E-004"], "kind": "知识点", "sec": "§4.1", "topic": "典型题型与证明模板"}, {"name": "题型二：证明方程有根（存在性 + 唯一性）", "content": "两步走。存在性用零点定理（必须**具体找出两点使函数值异号**）；唯一性用反证法 + 单调性（第一章不能用导数，改用和差化积或直接比较）。", "formulas": ["存在性：构造 $F(x)=$ 左 − 右，找 $a<b$ 使 $F(a)F(b)<0$，由零点定理得 $\\exists\\xi\\in(a,b),F(\\xi)=0$", "唯一性（不能用导数时）：设两根 $x_1<x_2$，由 $F(x_1)=F(x_2)$ 推出 $|x_1-x_2|\\le\\varepsilon|x_1-x_2|<|x_1-x_2|$，矛盾", "关键不等式（由和差化积 + $|\\sin u|\\le|u|$）：$|\\sin x_1-\\sin x_2|\\le|x_1-x_2|$", "示范：$x-\\varepsilon\\sin x=1$（$0<\\varepsilon<1$）有且仅有一根；取 $F(0)=-1<0$、$F(2)=1-\\varepsilon\\sin2>0$"], "tips": ["「区间是 $(-\\infty,+\\infty)$，所以一定有一根」是**无效推理**——存在性必须由异号两点 + 零点定理给出", "第一章禁止用导数判单调（那是第二章）；改用和差化积、不等式放缩"], "related": ["题库错题 错-1-4.9(3)", "§4.3 闭区间上连续函数的性质"], "kind": "知识点", "sec": "§4.3", "topic": "典型题型与证明模板"}, {"name": "题型三：用夹逼定理处理函数极限（取整夹逼）", "content": "已知数列极限要推函数极限时，标准做法是**取整**：令 $n=\\lfloor x\\rfloor$，把 $x$ 夹在 $n$ 与 $n+1$ 之间，转化为两个已知的数列极限。", "formulas": ["取 $n=\\lfloor x\\rfloor$，则 $n\\le x<n+1$，且 $x\\to+\\infty\\iff n\\to+\\infty$", "示范：证 $\\lim\\limits_{x\\to+\\infty}\\dfrac{x^k}{a^x}=0$（$a>1$）", "下界：$\\dfrac{x^k}{a^x}\\ge\\dfrac{n^k}{a^{n+1}}=\\dfrac1a\\cdot\\dfrac{n^k}{a^n}\\to0$", "上界：$\\dfrac{x^k}{a^x}\\le\\dfrac{(n+1)^k}{a^{n}}=a\\cdot\\dfrac{(n+1)^k}{a^{n+1}}\\to0$", "两端都 $\\to0$，由夹逼定理得结论"], "tips": ["取整是为了**把 $x$ 的任意性抹掉**，只留下整数参数", "上界用 $n+1$、下界用 $n$，注意配出与已知极限**同形**的 $\\dfrac{(\\cdot)^k}{a^{(\\cdot)}}$", "'单调有界'只能保证极限**存在**，要定出数值必须另找工具"], "related": ["题库错题 错-1-3.6", "§3.6 夹逼定理"], "kind": "知识点", "sec": "§2.3", "topic": "典型题型与证明模板"}, {"name": "题型四：用归结原则构造反例数列的套路", "content": "要证 $\\lim\\limits_{x\\to x_0}f(x)$ 不存在，只需造两条路径给出不同结果。造法是**反解**：想得到函数值 $c$，就解 $f(x_n)=c$。", "formulas": ["套路一（踩零点/峰值）：要 $\\sin\\theta_n=0$ 取 $\\theta_n=2n\\pi$；要 $\\sin\\theta_n=1$ 取 $\\theta_n=2n\\pi+\\frac\\pi2$，再按题中的 $\\theta$ 反解 $x_n$", "示范：$\\lim\\limits_{x\\to+\\infty}\\sin\\sqrt x$ —— 取 $x_n=(2n\\pi)^2$、$x_n'=(2n\\pi+\\frac\\pi2)^2$，函数值 0 与 1，不等", "示范：$\\lim\\limits_{x\\to0}\\sin\\dfrac1{x^2}$ —— 取 $x_n=\\dfrac1{\\sqrt{2n\\pi}}$、$x_n'=\\dfrac1{\\sqrt{2n\\pi+\\pi/2}}$", "套路二（两侧不同）：如 $e^{1/x}$ 取 $x_n=\\frac1n\\to0^+$、$x_n'=-\\frac1n\\to0^-$，函数值 $+\\infty$ 与 $0$", "套路三（稠密性）：如狄利克雷函数，用有理数/无理数稠密性各取一串"], "tips": ["构造完**必须逐条验证**：$x_n\\ne x_0$？$x_n\\to x_0$？函数值真的趋于预期的常数？", "别猜显式公式，能用稠密性这类存在性定理「取一串」就用它", "一条路径跑向 $\\infty$ 也算「不存在有限极限」，此时用定理1.13(2)"], "related": ["题库错题 错-1-3.2", "题库题目 1-3.5(4)", "题库易错点 E-005"], "kind": "知识点", "sec": "§3.3", "topic": "典型题型与证明模板"}, {"name": "题型五：$o$ 记号等式的证明范式", "content": "$o$ 的等式（如 $o(x^n)o(x^m)=o(x^{m+n})$、$o(x^m)+o(x^n)=o(x^m)$）**一律回到定义**：设出 $\\alpha,\\beta$，写出两个比值的极限为 0，再算目标比值的极限。", "formulas": ["乘法：设 $\\alpha=o(x^n),\\beta=o(x^m)$，则 $\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}\\to0\\cdot0=0$", "加法（$n>m$）：先证 $o(x^n)\\subset o(x^m)$：$\\dfrac{\\alpha}{x^m}=\\dfrac{\\alpha}{x^n}\\cdot x^{n-m}\\to0\\cdot0=0$", "再合并：$\\dfrac{\\alpha+\\beta}{x^m}=\\dfrac{\\alpha}{x^m}+\\dfrac{\\beta}{x^m}\\to0$，即 $o(x^m)+o(x^n)=o(x^m)$"], "tips": ["$o$ 的等号是单向的，真义是「属于」", "证明关键是**凑成已知为 0 的两个比值**，而不是用 $x^mx^n=x^{m+n}$ 这类恒等式", "「显然成立」在证明题里等于没写"], "related": ["题库错题 错-1-3.12(4)", "本归档「七、$o$ 记号」", "题库易错点 E-006"], "kind": "知识点", "sec": "§3.5", "topic": "典型题型与证明模板"}, {"name": "题型六：求待定参数（极限/连续/可去间断点）", "content": "两步：**先由条件解出参数（必要条件），再代回验证（充分性）**。验证这一步是这类题唯一可能失分的地方。", "formulas": ["步骤①：由条件列出方程。例如「分母 $\\to0$ 而极限有限」⟹ 分子的一次项（及以上）必须全部为 0", "步骤②：把解出的值代回原式，重新算一遍极限，确认它确实有限（或确实相等/连续）", "示范：$\\alpha$ 由「分子常数项为 0」定出；$\\beta$ 由「分子一次项系数为 0」定出；最后回代算得极限为 $\\dfrac38$，有限 ⟹ 可去", "另一类：$\\lim\\limits_{x\\to\\infty}\\bigl[f(x)-ax-b\\bigr]=0$，则 $a=\\lim\\dfrac{f(x)}{x}$、$b=\\lim[f(x)-ax]$，解完同样回代核对"], "tips": ["只要写了「解得 $a=\\cdots$」就一定要跟一句「代入验证：……」", "常见遗漏：只保证极限存在，没检查是否等于题目要求的那个值"], "related": ["题库错题 错-1-综.17", "题库题目 1-4.12(2)", "题库易错点 E-008"], "kind": "知识点", "sec": "§3.6", "topic": "典型题型与证明模板"}, {"id": "E-001", "title": "等价量替换只能在全部为因式时使用", "rule": "用等价无穷小替换时，被替换的部分必须整体作为乘除中的因式；若它处在加减项里（或与别的项相加减），不能单独替换。", "why": "等价无穷小只保证 $\\lim\\dfrac{\\alpha}{\\beta}=1$，即 $\\alpha$ 与 $\\beta$ 的「主体部分」相同，两者相差一个高阶无穷小。做减法时主体可能正好互相抵消，剩下的高阶零头反而成为决定极限的「主角」；此时把 $\\alpha$ 换成 $\\beta$，等于把真正起作用的那一项扔掉了。", "valid": "$\\lim\\limits_{x\\to 0}\\dfrac{\\sin x}{x}$：$\\sin x$ 是分子整体的因式，可直接替换为 $x$，得 $\\lim\\dfrac{x}{x}=1$ ✓", "invalid": "$\\lim\\limits_{x\\to 0}\\dfrac{x-\\sin x}{x^3}$：$x$ 与 $\\sin x$ 是相减关系，若把 $\\sin x$ 换成 $x$ 得 $0$，而实际答案为 $\\dfrac{1}{6}$ ✗", "remedy": "① 先做恒等变形（提取公因子、通分、有理化），把式子凑成「因式」形态后再替换；② 或改用更高阶的等价量，如 $x-\\sin x\\sim\\dfrac{x^3}{6}$（$x\\to 0$）；③ 相加减的两个无穷小若不同阶，低阶者为主，可只保留低阶项。", "related": ["定理4.4（等价无穷小的结论：$\\alpha=\\beta+o(\\beta)$）", "§3.5 无穷小量、无穷大量、阶的比较", "§3.6 两个重要极限（等价量替换定理）"], "added": "2026-10-12", "kind": "易错点", "sec": "等价量", "topic": "常用等价量", "name": "等价量替换只能在全部为因式时使用"}, {"id": "E-002", "title": "极限四则运算不能拆开极限不存在的项", "rule": "$\\lim(f\\pm g)=\\lim f\\pm\\lim g$、$\\lim(fg)=\\lim f\\cdot\\lim g$ 成立的前提是拆出来的每一项极限都存在（都是有限数）。只要有一项是 $\\infty$ 或不存在，就不能拆。", "why": "四则运算法则本质是「两个收敛的量」之间的运算律，前提是 $\\lim f$、$\\lim g$ 都是确定的实数。当某一项的极限是 $\\infty$ 时，它根本不是实数；把 $\\infty$ 当作数参与运算会写出无意义的式子——$\\infty\\cdot 0$、$\\infty-\\infty$、$\\infty/\\infty$ 都是未定式，结果不由法则决定。", "valid": "$\\lim\\limits_{x\\to 0}\\Bigl[\\dfrac{\\tan 5x}{\\sin 3x}+\\dfrac{1-\\cos x}{\\sin 3x}\\Bigr]$：两项极限分别为 $\\dfrac{5}{3}$ 与 $0$，都存在，可以拆，得 $\\dfrac{5}{3}$ ✓", "invalid": "$\\lim\\limits_{x\\to\\infty}x^2\\sin\\dfrac{1}{x}$：若拆成 $(\\lim x)\\cdot\\lim\\dfrac{\\sin(1/x)}{1/x}$，第一个因子 $\\lim\\limits_{x\\to\\infty}x=\\infty$ 不存在，不能拆。本题正确做法是整体替换 $\\sin\\dfrac1x\\sim\\dfrac1x$，得 $x^2\\cdot\\dfrac1x=x\\to+\\infty$ ✗", "remedy": "① 拆之前先逐项检查极限是否存在，都收敛才可拆；② 不能拆时改用整体等价替换、提公因式、有理化、和差化积等恒等变形；③ 遇到 $\\infty-\\infty$、$0\\cdot\\infty$、$\\infty/\\infty$ 一律先变形再求。", "related": ["§3.2 函数极限的性质（四则运算）", "作业练习 B（$\\lim\\limits_{x\\to\\infty}x^2\\sin\\frac1x$，不能在 ∞ 处拆项）", "题库易错点 E-001"], "added": "2026-10-12", "kind": "易错点", "sec": "§3.2", "topic": "易错点", "name": "极限四则运算不能拆开极限不存在的项"}, {"id": "E-003", "title": "等价量与展开只在自变量趋于展开点时成立", "rule": "使用任何等价量替换或（局部）展开之前，必须先确认**括号里那个量确实趋于该展开点**（通常是趋于 $0$）。$\\sin u\\sim u$、$\\ln(1+u)\\sim u$、$\\cos u\\approx1-\\frac{u^2}{2}$ 等全部只对 $u\\to0$ 成立。", "why": "这些等价量都是函数在展开点（通常是 $0$）的**局部**线性/二次主部。当 $u$ 不趋于展开点时，主部形式完全改变：例如 $\\cos t$ 在 $t\\to\\infty$ 时并不趋于 $1-\\frac{t^2}{2}$（它根本没有极限，只是有界振荡），此时那个「二次项」与真实值毫无关系。", "valid": "$\\lim\\limits_{x\\to0}\\dfrac{\\sin(\\tan^2x)}{\\sqrt[n]{1+x^2}-1}$：$\\tan^2x\\to0$、$x^2\\to0$，两处都满足条件，得 $\\dfrac{x^2}{x^2/n}=n$ ✓", "invalid": "$\\lim\\limits_{x\\to0}\\dfrac{x^2\\cos\\frac1x}{(1+\\cos x)\\ln(1+x)}$ 中把 $\\cos\\frac1x$ 换成 $1-\\frac{1}{2x^2}$：这里 $\\frac1x\\to\\infty$，展开不成立。$x^2\\cos\\frac1x$ 应作有界量乘无穷小 $=o(x)$ ✗", "remedy": "① 每次替换前先问一句「括号里的量趋于几？」；② 若该量趋于 $\\infty$，改用「有界量 × 无穷小量」或「提取主项」；③ 若该量趋于某个 $a\\ne0$（如 $x\\to\\pi$ 时的 $mx\\to m\\pi$），应换元 $t=x-a$ 把它化成趋于 $0$。", "related": ["题库错题 错-1-综.3(1)", "题库错题 错-1-3.16(2)", "作业 习题1-3 第9(1)题（$\\lim\\limits_{x\\to\\pi}\\frac{\\sin mx}{\\sin nx}$，过程误用 $\\frac{\\sin mx}{mx}\\to1$）", "题库知识点「10.14」八、总纲"], "added": "2026-10-16", "kind": "易错点", "sec": "等价量", "topic": "常用等价量", "name": "等价量与展开只在自变量趋于展开点时成立"}, {"id": "E-004", "title": "判断间断点类型必须先写出两个单侧极限", "rule": "求间断点并分类时，**必须先把两个单侧极限算出来**（或写出分段表达式），再对照定义下结论。只写类型结论不给过程，等于没有依据。", "why": "四类间断点的判据全部建立在单侧极限上：「两侧都有限且相等但不等于函数值」→ 可去；「两侧都有限但不等」→ 跳跃（以上属第一类）；「至少一侧为 $\\infty$」→ 无穷；「振荡无极限」→ 振荡（以上属第二类）。不写出单侧极限，就无法排除其他类别。", "valid": "$f(x)=\\arctan\\frac1x$：$\\lim\\limits_{x\\to0^-}=-\\frac\\pi2$、$\\lim\\limits_{x\\to0^+}=\\frac\\pi2$，都有限且不等 ⟹ $x=0$ 是第一类跳跃间断点 ✓", "invalid": "$f(x)=e^{1/x}$ 判成「跳跃」：跳跃要求两侧极限都存在，而 $\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$ 不存在 ⟹ 实为第二类**无穷**间断点 ✗", "remedy": "① 先写出分段表达式或直接算 $f(x_0^-)$、$f(x_0^+)$；② 只要有一侧为 $\\infty$，一律归第二类（无穷型）；③ 两侧极限存在但$\\ne f(x_0)$（或无定义）才是可去；④ 遇 $\\sin\\frac1x$ 这类振荡，另取两串点证明极限不存在。", "related": ["题库错题 错-1-4.3(3)", "题库题目 1-3.5(4)（$e^{1/x}$ 的极限不存在）", "§4.1 函数连续的概念"], "added": "2026-10-16", "kind": "易错点", "sec": "§4.1", "topic": "易错点", "name": "判断间断点类型必须先写出两个单侧极限"}, {"id": "E-005", "title": "用归结原则构造数列，必须验证它真的具备所需性质", "rule": "用归结原则（海涅定理）证明极限不存在时，构造的数列 $\\{x_n\\}$ 必须同时满足：① $x_n\\in\\mathring U(x_0)$（即 $x_n\\ne x_0$）；② $x_n\\to x_0$；③ **函数值确实趋于两个不同的常数**（或确实不收敛）。第 ③ 条要靠数列本身的性质来保证。", "why": "很多人看到「有理数 / 无理数」就随手写 $x_0+\\frac1n$、$x_0+\\frac1{\\sqrt n}$，但 $x_0+\\frac1n$ 只在 $x_0$ 为有理数时才有理；而 $\\frac1{\\sqrt n}$ 在 $n$ 为完全平方数时是有理数。性质验证不过关，整个反例就无效。", "valid": "证 $D(x)$（Dirichlet 函数）处处无极限：直接用**稠密性**，在 $(x_0,x_0+\\frac1n)$ 内分别取有理数 $r_n$ 与无理数 $s_n$，则 $D(r_n)=1\\to1$、$D(s_n)=0\\to0$ ✓", "invalid": "取 $x_n'=x_0+\\frac1n$、$x_n''=x_0+\\frac1{\\sqrt n}$ 并断言「前者有理、后者无理」——对无理数的 $x_0$ 前者也无理；$n=4$ 时后者 $=\\frac12$ 是有理数 ✗", "remedy": "① 能不猜显式公式就不猜，优先用**稠密性**等存在性定理「取一串」；② 若一定要写显式公式，逐条验证所需性质在**所有 $n$** 下成立；③ 对导出的两串点再核一遍：$x_n\\to x_0$ 且 $x_n\\ne x_0$ 是否真的满足。", "related": ["题库错题 错-1-3.2", "§3.3 归结原则（海涅定理）"], "added": "2026-10-16", "kind": "易错点", "sec": "§3.3", "topic": "易错点", "name": "用归结原则构造数列，必须验证它真的具备所需性质"}, {"id": "E-006", "title": "不能引用未证明的结论，也不能用后面章节的工具", "rule": "证明过程中引用任何结论，都必须是**本章已经学过并证明过**的。第一章不得使用导数（第二章）与洛必达法则、泰勒展开；也不得引用教材上没有的不等式（如对数平均不等式）。", "why": "数学证明是把命题归约到**已知为真**的前提。引用未证结论，等于把待证的东西换了个名字；用超纲工具，在考试中不给分，而且掩盖了对本章方法的训练。", "valid": "证明 $x-\\varepsilon\\sin x=1$ 有唯一根：存在性用零点定理（取 $f(0)<0,f(2)>0$）；唯一性用和差化积得 $|\\sin x_1-\\sin x_2|\\le|x_1-x_2|$ 推出矛盾——全程第一章工具 ✓", "invalid": "用 $f'(x)=1-\\varepsilon\\cos x>0$ 判断单调（导数属第二章）；引用 $\\dfrac{x_1-x_2}{\\ln x_1-\\ln x_2}>\\sqrt{x_1x_2}$（对数平均不等式，本章未讲） ✗", "remedy": "① 写每一步时问自己「这条依据是书上哪一条？」；② 遇到「显然」「由某不等式」而说不出出处的，一律重做；③ 求极限时若想用洛必达，改回「等价量替换 / 提主项 / 有理化 / 和差化积 / 夹逼」。", "related": ["题库错题 错-1-4.9(3)", "题库错题 错-1-3.6", "题库错题 错-1-4.12(1)"], "added": "2026-10-16", "kind": "易错点", "sec": "专题", "topic": "易错点", "name": "不能引用未证明的结论，也不能用后面章节的工具"}, {"id": "E-007", "title": "约分和比较系数时，别丢掉最低次非零项的系数", "rule": "遇到 $0/0$ 型做「展开后约掉公共零因子」时，**决定极限值的是最低次非零项，而不是最高次项**。约分前后都要把最低次非零项的**系数**写清楚。", "why": "极限只看主部（最低次非零项）。把展开简写成「$t^{n-1}+\\cdots+1$」会让人误以为最低次项系数是 $1$，于是答案丢掉一个因子。", "valid": "$\\lim\\limits_{x\\to1}\\dfrac{x^3-3x+2}{(x-1)^2}$：令 $t=x-1$，分子 $=(1+t)^3-3t-2=3t^2+t^3$，除以 $t^2$ 得 $3$，即 $\\dfrac{n(n+1)}{2}\\big|_{n=2}=3$ ✓", "invalid": "$\\lim\\limits_{x\\to1}\\dfrac{x^{n+1}-(n+1)x+n}{(x-1)^2}$：分子 $=C_{n+1}^{2}t^2+C_{n+1}^{3}t^3+\\cdots$，最低次非零项系数是 $C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。若写成「$t^{n-1}+\\cdots+1$」就会答成 $1$ ✗", "remedy": "① 展开后**逐项写出系数**，至少写到 $t^2$ 项；② 约分前明确标出「最低次非零项」是哪一项；③ 做完用 $n=2$ 这类小值做数值自检。", "related": ["题库错题 错-1-3.8(8)", "同类型：作业 习题1-3 第8(2)题（展开后约 x² 得 10）"], "added": "2026-10-16", "kind": "易错点", "sec": "§3.6", "topic": "易错点", "name": "约分和比较系数时，别丢掉最低次非零项的系数"}, {"id": "E-008", "title": "求待定参数的题，只求必要条件是不够的", "rule": "凡「已知某极限/连续性/可去间断点成立，求参数 $a,b$」的题，由条件解出参数只是**必要条件**，**必须代回原式验证充分性**，才能确认答案正确。", "why": "由「条件成立」推出「参数取值」是单向的。可能存在多组解，也可能某组值代回后条件并不成立（例如极限仍发散、或极限值与要求不符）。验证花不了一分钟，却是这类题唯一可能失分的地方。", "valid": "求 $f(x)=\\dfrac{\\sqrt{1+\\sin x+\\sin^2x}-(\\alpha+\\beta\\sin x)}{\\sin^2x}$ 在 $x=0$ 可去时的 $\\alpha,\\beta$：得 $\\alpha=1,\\beta=\\dfrac12$ 后，回代算得两侧极限都是 $\\dfrac38$（有限且相等），确认可去 ✓", "invalid": "解出 $\\alpha=1,\\beta=\\dfrac12$ 就直接交卷，不说明该组值下极限确实存在 ✗", "remedy": "① 解出参数后，**把值代回原式重新算一遍极限**；② 明确写出「此时两个单侧（或整体）极限为 $\\cdots$，有限，故条件成立」；③ 若条件中含「$\\ne0$」等约束，也要一并核对。", "related": ["题库错题 错-1-综.17", "题库题目 1-4.12(2)", "题库题目 10.14-E"], "added": "2026-10-16", "kind": "易错点", "sec": "§3.6", "topic": "易错点", "name": "求待定参数的题，只求必要条件是不够的"}, {"id": "1-3.5(4)", "source": "习题1-3 第5题(4)", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "证明 $\\lim\\limits_{x\\to 0} e^{1/x}$ 不存在。", "type": "证明题", "topics": ["极限不存在的证明", "归结原则（海涅定理，定理1.12）", "定理1.13 极限不存在的充要条件（2）", "单侧极限与左右行为差异", "无穷大量与极限不存在的区别"], "difficulty": 3, "tags": ["经典反例", "无穷型", "左右极限不同", "第四章间断点预备"], "key_points": ["支点在 $1/x$：$x\\to 0^+$ 时 $1/x\\to+\\infty$，$x\\to 0^-$ 时 $1/x\\to-\\infty$，两侧趋势相反", "因此 $e^{1/x}$ 右趋 $+\\infty$、左趋 $0$，整体不可能有有限极限", "用定理1.13(2) 时，必须补一句「$\\infty$ 不是有限数，故该数列极限不存在」，否则该步是空的", "它只在右侧趋于 $\\infty$，左侧趋于 $0$，所以它不是无穷大量（无穷大量要求整个去心邻域内 $|f|$ 都任意大）"], "solutions": [{"name": "解法一：定理1.13(2)（最省字）", "steps": ["取 $x_n=\\dfrac1n$（$n=1,2,\\dots$），则 $x_n\\neq 0$ 且 $x_n\\to 0$。", "此时 $f(x_n)=e^{1/x_n}=e^{n}$。", "数列 $\\{e^{n}\\}$ 无界，故 $\\lim\\limits_{n\\to\\infty} e^{n}$ 不存在（不是有限数）。", "由定理1.13(2)，$\\lim\\limits_{x\\to 0} e^{1/x}$ 不存在。"]}, {"name": "解法二：两条路径相互矛盾（最直观）", "steps": ["取 $x_n=\\dfrac1n\\to 0$，则 $e^{1/x_n}=e^{n}\\to+\\infty$。", "取 $x_n'=-\\dfrac1n\\to 0$，则 $e^{1/x_n'}=e^{-n}\\to 0$。", "若极限存在为 $A$，则任何趋于 $0$ 的数列都须给出 $f\\to A$；", "由第二条路径得 $A=0$，由第一条路径得 $f\\to+\\infty\\neq 0$，矛盾。"]}, {"name": "解法三：用单侧极限判定", "steps": ["$\\lim\\limits_{x\\to 0^-} e^{1/x}=0$（因 $1/x\\to-\\infty$）。", "$\\lim\\limits_{x\\to 0^+} e^{1/x}=+\\infty$（不是有限数，右极限不存在）。", "极限存在 $\\iff$ 左右极限都存在且相等；此处左极限为 $0$、右极限不存在，故整体极限不存在。"]}], "pitfalls": ["只写「$e^{1/x}\\to\\infty$，所以极限不存在」——只看了右侧，必须两侧都看", "误判为「无穷大量」——它与无穷大量的定义不符（左侧并不任意大）", "把 $+\\infty$ 当成极限值与 $A$ 比较（$\\infty$ 不是数），应表述为「该路径下函数值无界，故不收敛到任何有限数」"], "related": ["定理1.12 归结原则（海涅定理）", "定理1.13 极限不存在的充要条件", "习题1-3 第5题 其余小题 (1)(2)(3)", "第四章：$x=0$ 是 $e^{1/x}$ 的无穷型（第二类）间断点"], "added": "2026-10-12", "kind": "题目", "sec": "§3.3", "name": "1-3.5(4)", "topic": "题目"}, {"id": "10.14-E", "source": "10.14 练习 E", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "当 $x\\to 0$ 时，$\\alpha(x)=kx^2$，$\\beta(x)=\\sqrt{1+x\\arcsin x}-\\sqrt{\\cos x}$。若 $\\alpha(x)\\sim\\beta(x)$，求常数 $k$。", "type": "计算题（含待定常数）", "topics": ["等价无穷小", "根式差有理化", "待定常数求法", "$\\arcsin x\\sim x$", "$1-\\cos x\\sim\\dfrac{x^2}{2}$", "$(1+u)^a-1\\sim au$"], "difficulty": 4, "tags": ["综合题", "有理化+等价", "常考"], "key_points": ["$\\alpha\\sim\\beta$ 等价于 $\\lim\\limits_{x\\to 0}\\dfrac{\\beta}{\\alpha}=1$，据此列出关于 $k$ 的方程", "$\\beta$ 是两根号之差，先有理化把差化成商：分母 $\\sqrt{1+x\\arcsin x}+\\sqrt{\\cos x}\\to 2$", "分子 $x\\arcsin x+1-\\cos x$ 中：$x\\arcsin x\\sim x^2$（因 $\\arcsin x\\sim x$），$1-\\cos x\\sim\\dfrac{x^2}{2}$，相加得 $\\dfrac{3}{2}x^2$", "于是 $\\beta\\sim\\dfrac{3}{4}x^2$，与 $\\alpha=kx^2$ 比较得 $k=\\dfrac{3}{4}$"], "solutions": [{"name": "解法一：有理化 + 等价", "steps": ["由 $\\alpha\\sim\\beta$ 得 $\\lim\\limits_{x\\to 0}\\dfrac{\\beta(x)}{\\alpha(x)}=1$。", "有理化：$\\beta(x)=\\dfrac{(1+x\\arcsin x)-\\cos x}{\\sqrt{1+x\\arcsin x}+\\sqrt{\\cos x}}$。", "分母 $\\to 1+1=2$，故 $\\beta(x)\\sim\\dfrac{x\\arcsin x+1-\\cos x}{2}$。", "$\\arcsin x\\sim x\\Rightarrow x\\arcsin x\\sim x^2$；又 $1-\\cos x\\sim\\dfrac{x^2}{2}$，故分子 $\\sim\\dfrac{3}{2}x^2$。", "于是 $\\beta(x)\\sim\\dfrac{1}{2}\\cdot\\dfrac{3}{2}x^2=\\dfrac{3}{4}x^2$。", "由 $\\beta\\sim\\alpha=kx^2$ 得 $k=\\dfrac{3}{4}$。"]}, {"name": "解法二：直接对两个根号用 $(1+u)^a-1\\sim au$", "steps": ["$\\sqrt{1+x\\arcsin x}=1+\\dfrac{x\\arcsin x}{2}+o(x^2)$，而 $x\\arcsin x\\sim x^2$，故 $\\sqrt{1+x\\arcsin x}=1+\\dfrac{x^2}{2}+o(x^2)$。", "$\\cos x=1-(1-\\cos x)$，故 $\\sqrt{\\cos x}=\\sqrt{1-(1-\\cos x)}=1-\\dfrac{1-\\cos x}{2}+o(x^2)=1-\\dfrac{x^2}{4}+o(x^2)$。", "两者相减：$\\beta(x)=\\dfrac{3}{4}x^2+o(x^2)$，故 $k=\\dfrac{3}{4}$。"]}], "pitfalls": ["忘了有理化，直接把两个根号相减当成 $0$（两个根号都 $\\to 1$，相减必须展开）", "把 $\\arcsin x$ 换成 $x$ 后忘了外面还乘着一个 $x$（正确是 $x\\arcsin x\\sim x^2$，不是 $x$）", "只算到 $\\beta\\sim\\dfrac{3}{2}x^2$ 就把系数当成 $k$（漏了有理化时分母的 $2$）"], "related": ["习题1-3 第11题（有理化求常数）", "§3.5 无穷小量、无穷大量、阶的比较", "题库易错点 E-001"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "10.14-E", "topic": "题目"}, {"id": "10.14-D", "source": "10.14 练习 D", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to 0}\\dfrac{1-\\cos(1-\\cos 2x)}{x^4}$。", "type": "计算题", "topics": ["等价无穷小", "复合函数中的等价替换", "$1-\\cos u\\sim\\dfrac{u^2}{2}$（二阶）"], "difficulty": 3, "tags": ["复合等价", "容易漏阶", "常考"], "key_points": ["$1-\\cos u\\sim\\dfrac{u^2}{2}$ 中的 $u$ 可以整体换成任何趋于 $0$ 的式子，本题 $u=1-\\cos 2x$", "关键看阶：$1-\\cos 2x$ 是二阶量（$\\sim 2x^2$），代进 $\\dfrac{u^2}{2}$ 后升到四阶，正好与分母 $x^4$ 匹配", "分两步替换，不要一步跳完，否则容易把阶数算错"], "solutions": [{"name": "两步等价替换", "steps": ["令 $u=1-\\cos 2x$（$x\\to 0$ 时 $u\\to 0$），由 $1-\\cos u\\sim\\dfrac{u^2}{2}$ 得分子 $\\sim\\dfrac{(1-\\cos 2x)^2}{2}$。", "再由 $1-\\cos 2x\\sim\\dfrac{(2x)^2}{2}=2x^2$，代回得 $\\dfrac{1}{2}(2x^2)^2=\\dfrac{1}{2}\\cdot 4x^4=2x^4$。", "所以原式 $\\sim\\dfrac{2x^4}{x^4}=2$。"]}], "pitfalls": ["把 $1-\\cos(1-\\cos 2x)$ 写成 $(1-\\cos 2x)^2/2$ 之后，误把 $1-\\cos 2x$ 当成一阶量写成 $x^2$（正确是 $2x^2$）", "记错公式：$1-\\cos x\\sim\\dfrac{x^2}{2}$ 中的 $\\dfrac{1}{2}$ 常被漏掉，导致答案差 $2$ 倍", "在复合处直接对整个分子用一次等价而不看阶数"], "related": ["题库易错点 E-001（等价替换只能在因式位置使用）", "§3.5 无穷小量阶的比较"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "10.14-D", "topic": "题目"}, {"id": "10.14-C", "source": "10.14 练习 C", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to\\alpha}\\dfrac{\\sin x-\\sin\\alpha}{x-\\alpha}$。", "type": "计算题", "topics": ["和差化积", "重要极限 $\\dfrac{\\sin t}{t}\\to 1$", "极限四则运算（两项极限都存在时可拆）"], "difficulty": 3, "tags": ["基本题型", "和差化积", "必会"], "key_points": ["被减的两项是「同名三角函数相减」，标准手段是和差化积", "$\\sin x-\\sin\\alpha=2\\cos\\dfrac{x+\\alpha}{2}\\sin\\dfrac{x-\\alpha}{2}$", "把 $\\dfrac{x-\\alpha}{2}$ 看成整体 $t$，凑出 $\\dfrac{\\sin t}{t}\\to 1$", "$\\cos$ 那一项因 $\\cos$ 连续，直接把 $x=\\alpha$ 代进去即可"], "solutions": [{"name": "和差化积 + 凑重要极限", "steps": ["和差化积：$\\sin x-\\sin\\alpha=2\\cos\\dfrac{x+\\alpha}{2}\\sin\\dfrac{x-\\alpha}{2}$。", "原式 $=2\\cos\\dfrac{x+\\alpha}{2}\\sin\\dfrac{x-\\alpha}{2}\\Big/(x-\\alpha)$。", "把分母写成 $2\\cdot\\dfrac{x-\\alpha}{2}$，提出系数：原式 $=\\cos\\dfrac{x+\\alpha}{2}\\cdot\\dfrac{\\sin\\frac{x-\\alpha}{2}}{\\frac{x-\\alpha}{2}}$。", "令 $t=\\dfrac{x-\\alpha}{2}$，则 $x\\to\\alpha$ 时 $t\\to 0$，由重要极限 $\\dfrac{\\sin t}{t}\\to 1$，方括号部分 $\\to 1$。", "而 $\\cos\\dfrac{x+\\alpha}{2}\\to\\cos\\alpha$（余弦函数连续）。", "故极限 $=\\cos\\alpha$。"]}], "pitfalls": ["想用 $\\sin x\\sim x$ 把 $\\sin x$ 换成 $x$——这是相减关系，属加减项，不能替换（见易错点 E-001）", "用洛必达法则或导数定义来解——那是第二章的内容，本章应走和差化积", "和差化积公式记错：$\\sin x-\\sin\\alpha=2\\cos\\dfrac{x+\\alpha}{2}\\sin\\dfrac{x-\\alpha}{2}$（系数 $2$ 与 $\\cos/\\sin$ 的先后别弄反）"], "related": ["题库知识点「10.14 函数极限·函数连续」五、和差化积", "题库易错点 E-001", "§3.6 两个重要极限"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "10.14-C", "topic": "题目"}, {"id": "1-4.12(2)", "source": "习题1-4 第12题(2)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to a}\\dfrac{x^\\alpha-a^\\alpha}{x^\\beta-a^\\beta}$（$a>0$，$\\beta\\neq 0$）。", "type": "计算题（含参数）", "topics": ["$0/0$ 型极限", "变量替换（换元改变变化趋势）", "等价量替换", "$(1+u)^\\gamma-1\\sim\\gamma u$", "拆成两个标准极限"], "difficulty": 3, "tags": ["含参数", "换元+等价", "0/0型"], "key_points": ["先换元把 $x\\to a$ 化成 $t\\to 0$：令 $x=a(1+t)$，则 $t=\\dfrac{x-a}{a}$", "换元后分子分母都冒出公因子 $[(1+t)^\\bullet-1]$，整体成为乘除结构，等价替换才合法", "公共因子 $\\dfrac{a^\\alpha}{a^\\beta}=a^{\\alpha-\\beta}$ 要单独提出——这正是答案里 $a^{\\alpha-\\beta}$ 的来源", "最后只剩 $\\dfrac{(1+t)^\\alpha-1}{(1+t)^\\beta-1}\\sim\\dfrac{\\alpha t}{\\beta t}=\\dfrac{\\alpha}{\\beta}$"], "solutions": [{"name": "解法一：整体换元 + 等价量替换", "steps": ["令 $x=a(1+t)$，则 $t=\\dfrac{x-a}{a}$，且 $x\\to a\\iff t\\to 0$。", "于是 $x^\\alpha=a^\\alpha(1+t)^\\alpha$，$x^\\beta=a^\\beta(1+t)^\\beta$。", "代入得 $\\dfrac{x^\\alpha-a^\\alpha}{x^\\beta-a^\\beta}=\\dfrac{a^\\alpha[(1+t)^\\alpha-1]}{a^\\beta[(1+t)^\\beta-1]}=a^{\\alpha-\\beta}\\cdot\\dfrac{(1+t)^\\alpha-1}{(1+t)^\\beta-1}$。", "由 $(1+u)^\\gamma-1\\sim\\gamma u$（$u\\to 0$），分子分母同时替换：$\\dfrac{(1+t)^\\alpha-1}{(1+t)^\\beta-1}\\sim\\dfrac{\\alpha t}{\\beta t}=\\dfrac{\\alpha}{\\beta}$。", "故原式 $=\\dfrac{\\alpha}{\\beta}a^{\\alpha-\\beta}$。"]}, {"name": "解法二：拆成两个标准极限", "steps": ["$\\dfrac{x^\\alpha-a^\\alpha}{x^\\beta-a^\\beta}=\\dfrac{(x^\\alpha-a^\\alpha)/(x-a)}{(x^\\beta-a^\\beta)/(x-a)}$（$x\\neq a$ 时可除）。", "令 $x=a(1+t)$，则 $\\dfrac{x^\\alpha-a^\\alpha}{x-a}=\\dfrac{a^\\alpha[(1+t)^\\alpha-1]}{at}=a^{\\alpha-1}\\cdot\\dfrac{(1+t)^\\alpha-1}{t}\\to a^{\\alpha-1}\\alpha$。", "同理 $\\dfrac{x^\\beta-a^\\beta}{x-a}\\to a^{\\beta-1}\\beta$。", "两式相除得 $\\dfrac{\\alpha a^{\\alpha-1}}{\\beta a^{\\beta-1}}=\\dfrac{\\alpha}{\\beta}a^{\\alpha-\\beta}$。"]}], "pitfalls": ["换元后分母漏掉 $a$：$x-a=at$，不是 $t$", "漏掉系数 $\\gamma$：$(1+t)^\\gamma-1\\sim\\gamma t$ 前面的 $\\gamma$ 正是答案里的 $\\alpha$、$\\beta$", "把 $a^{\\alpha-\\beta}$ 错写成 $a^{\\alpha/\\beta}$（它来自 $a^\\alpha/a^\\beta$）", "用洛必达法则或导数定义——本章还没学，只能用换元 + 等价量"], "related": ["题库题目 10.14-E（同类：含参数 + 等价量）", "题库易错点 E-001（等价替换只能在因式位置）", "题库易错点 E-002（不能拆开不存在的极限）", "§3.6 两个重要极限", "常用等价无穷小：$(1+u)^\\gamma-1\\sim\\gamma u$"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "1-4.12(2)", "topic": "题目"}, {"id": "1-4.12(5)", "source": "习题1-4 第12题(5)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to+\\infty}\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}$。", "type": "计算题", "topics": ["$\\infty/\\infty$ 型极限", "对数运算性质 $\\ln(ab)=\\ln a+\\ln b$", "提取主项（把大数化成小数）", "等价量替换 $\\ln(1+u)\\sim u$（需 $u\\to 0$）", "夹逼定理"], "difficulty": 3, "tags": ["∞/∞型", "提主项", "对数运算", "与 1-4.12(2) 配对"], "key_points": ["先认清类型：$x\\to+\\infty$ 时分子分母都 $\\to+\\infty$，是 $\\infty/\\infty$ 型（不是 $0/0$）", "**不能**直接用 $\\ln(1+u)\\sim u$：它要求 $u\\to 0$，而本题 $u=3^x\\to+\\infty$，条件不成立", "关键一步是提主项：$\\ln(1+3^x)=\\ln\\left[3^x(1+3^{-x})\\right]=x\\ln 3+\\ln(1+3^{-x})$，把大数化成小数 $3^{-x}\\to 0$", "分子分母同除 $x$ 后，剩下的两项是「无穷小 ÷ 无穷大」，都 $\\to 0$，只剩 $\\dfrac{\\ln 3}{\\ln 2}$"], "solutions": [{"name": "解法一：提取主项（标准做法）", "steps": ["$\\ln(1+3^x)=\\ln\\left[3^x\\left(1+3^{-x}\\right)\\right]=x\\ln 3+\\ln\\left(1+3^{-x}\\right)$。", "同理 $\\ln(1+2^x)=x\\ln 2+\\ln\\left(1+2^{-x}\\right)$。", "代入并同除 $x$：$\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}=\\dfrac{\\ln 3+\\dfrac{\\ln(1+3^{-x})}{x}}{\\ln 2+\\dfrac{\\ln(1+2^{-x})}{x}}$。", "$x\\to+\\infty$ 时 $3^{-x}\\to 0$、$2^{-x}\\to 0$，由 $\\ln(1+u)\\sim u$ 知两个对数都是无穷小，再除以 $x\\to+\\infty$，故两个分式都 $\\to 0$。", "所以原式 $=\\dfrac{\\ln 3}{\\ln 2}=\\log_2 3$。"]}, {"name": "解法二：夹逼定理（不用等价量）", "steps": ["当 $x$ 充分大时，$3^x<1+3^x\\le 3^x+3^x=2\\cdot 3^x\\le 3^{x+1}$，取对数得 $x\\ln 3<\\ln(1+3^x)\\le(x+1)\\ln 3$。", "同理 $x\\ln 2<\\ln(1+2^x)\\le(x+1)\\ln 2$。", "两式相除：$\\dfrac{x\\ln 3}{(x+1)\\ln 2}<\\dfrac{\\ln(1+3^x)}{\\ln(1+2^x)}\\le\\dfrac{(x+1)\\ln 3}{x\\ln 2}$。", "左右两端当 $x\\to+\\infty$ 时都趋于 $\\dfrac{\\ln 3}{\\ln 2}$，由夹逼定理得原式 $=\\dfrac{\\ln 3}{\\ln 2}$。"]}], "pitfalls": ["误用 $\\ln(1+u)\\sim u$：它要求 $u\\to 0$。本题 $3^x\\to+\\infty$，若硬替换成 $\\dfrac{3^x}{2^x}$ 会得到 $+\\infty$，答案完全错", "提主项时漏掉系数：$\\ln 3^x=x\\ln 3$，那个 $x$ 不能丢", "答案写成 $\\ln\\dfrac{3}{2}$ 或 $\\dfrac{3}{2}$——正确是 $\\dfrac{\\ln 3}{\\ln 2}=\\log_2 3$"], "related": ["题库题目 1-4.12(2)（同为含参数极限，那题是 $0/0$ 型，可作对照）", "题库易错点 E-001（等价替换只能在因式位置）", "§3.6 两个重要极限", "常用等价无穷小：$\\ln(1+u)\\sim u$（$u\\to 0$）"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "1-4.12(5)", "topic": "题目"}, {"id": "1-4.12(8)", "source": "习题1-4 第12题(8)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to+\\infty}\\left[\\sin\\ln(x+1)-\\sin\\ln x\\right]$。", "type": "计算题", "topics": ["三角相减型 $\\infty-\\infty$", "和差化积", "有界量 × 无穷小量 = 无穷小量", "对数差化为 $\\ln(1+1/x)$", "夹逼定理"], "difficulty": 3, "tags": ["振荡", "有界×无穷小", "和差化积"], "key_points": ["**不能**对 $\\sin\\ln(x+1)$ 直接用 $\\sin u\\sim u$：这里 $u=\\ln(x+1)\\to+\\infty$，条件不成立", "先用和差化积，把「两个大角的正弦相减」拆成「有界 × 小角的正弦」", "关键观察：$\\ln(x+1)-\\ln x=\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$——两角之**差**趋于 $0$", "最后用「有界量 × 无穷小量 = 无穷小量」收尾"], "solutions": [{"name": "解法一：和差化积 + 有界×无穷小", "steps": ["和差化积：$\\sin\\ln(x+1)-\\sin\\ln x=2\\cos\\dfrac{\\ln(x+1)+\\ln x}{2}\\cdot\\sin\\dfrac{\\ln(x+1)-\\ln x}{2}$。", "算角差：$\\dfrac{\\ln(x+1)-\\ln x}{2}=\\dfrac{1}{2}\\ln\\dfrac{x+1}{x}=\\dfrac{1}{2}\\ln\\left(1+\\dfrac{1}{x}\\right)\\to 0$。", "由 $\\sin u\\sim u$ 与 $\\ln(1+v)\\sim v$：$\\sin\\dfrac{1}{2}\\ln\\left(1+\\dfrac{1}{x}\\right)\\sim\\dfrac{1}{2x}\\to 0$。", "而 $\\left|2\\cos\\dfrac{\\ln(x+1)+\\ln x}{2}\\right|\\le 2$ 有界，由「有界量 × 无穷小量 = 无穷小量」得原式 $=0$。"]}, {"name": "解法二：用 $|\\sin A-\\sin B|\\le|A-B|$ 直接夹逼", "steps": ["由和差化积与 $|\\sin u|\\le|u|$ 推出 $|\\sin A-\\sin B|=2\\left|\\cos\\dfrac{A+B}{2}\\right|\\left|\\sin\\dfrac{A-B}{2}\\right|\\le|A-B|$。", "取 $A=\\ln(x+1)$，$B=\\ln x$：$\\left|\\sin\\ln(x+1)-\\sin\\ln x\\right|\\le\\ln\\dfrac{x+1}{x}=\\ln\\left(1+\\dfrac{1}{x}\\right)$。", "$x\\to+\\infty$ 时右端 $\\to 0$，由夹逼定理得原式 $=0$。"]}], "pitfalls": ["对 $\\sin\\ln(x+1)$ 直接用 $\\sin u\\sim u$（要求 $u\\to 0$，这里却趋于 $+\\infty$）", "把 $\\ln(x+1)-\\ln x$ 当成 $\\infty-\\infty$——它其实 $=\\ln(1+1/x)\\to 0$", "只算正弦部分，忘了前面那个 $\\cos$ 因子，没说明它「有界」"], "related": ["题库题目 1-4.12(5)", "题库知识点「10.14 函数极限·函数连续」八、未定式的处理流程", "§3.6 两个重要极限"], "added": "2026-10-12", "kind": "题目", "sec": "§3.6", "name": "1-4.12(8)", "topic": "题目"}, {"id": "1-综.3(2)", "source": "第一章综合题 第3题(2)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（$1^\\infty$ 型）", "statement": "求 $\\lim\\limits_{x\\to0}\\left(\\dfrac{a_1^x+a_2^x+\\cdots+a_n^x}{n}\\right)^{\\frac{1}{x}}$（$a_1,a_2,\\cdots,a_n$ 均为正数）。", "type": "计算题（含参数，$1^\\infty$ 型）", "topics": ["$1^\\infty$ 型极限", "第二重要极限的推广式 $\\lim u^v=e^{\\lim v(u-1)}$", "取对数法", "$a^x-1\\sim x\\ln a$", "对数运算与几何平均数"], "difficulty": 4, "tags": ["1^∞型", "含参数", "取对数", "几何平均"], "key_points": ["先识别类型：底数 $\\to1$、指数 $\\to\\infty$，是 $1^\\infty$ 型", "两条路：① 直接用推广式 $\\lim u^v=e^{\\lim v(u-1)}$　② 取对数后算 $\\ln y$ 再还原", "核心一步：$v(u-1)=\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$", "每项用 $a_i^x-1\\sim x\\ln a_i$，于是 $\\dfrac{a_i^x-1}{x}\\to\\ln a_i$", "结果 $=\\sqrt[n]{a_1a_2\\cdots a_n}$（几何平均数），别停在 $\\dfrac{1}{n}\\sum\\ln a_i$ 上"], "solutions": [{"name": "解法一：用 $1^\\infty$ 型推广式", "steps": ["取 $u=\\dfrac{a_1^x+\\cdots+a_n^x}{n}$，$v=\\dfrac{1}{x}$，则 $u\\to1$、$v\\to\\infty$，由推广式 $\\lim u^v=e^{\\lim v(u-1)}$ 入手。", "计算 $v(u-1)=\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$。", "对每项用 $a_i^x-1\\sim x\\ln a_i$，得 $\\dfrac{a_i^x-1}{x}\\to\\ln a_i$。", "所以 $\\lim v(u-1)=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\ln a_i=\\ln\\sqrt[n]{a_1a_2\\cdots a_n}$。", "原式 $=e^{\\ln\\sqrt[n]{a_1\\cdots a_n}}=\\sqrt[n]{a_1a_2\\cdots a_n}$。"]}, {"name": "解法二：取对数（不背推广式也行）", "steps": ["设 $y=\\left(\\dfrac{a_1^x+\\cdots+a_n^x}{n}\\right)^{1/x}$，取对数得 $\\ln y=\\dfrac{1}{x}\\ln\\left(1+\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}\\right)$。", "$x\\to0$ 时括号内的量 $\\to0$，用 $\\ln(1+u)\\sim u$（$\\ln(1+u)$ 是乘积中的因式，替换合法）：$\\ln y\\sim\\dfrac{1}{x}\\cdot\\dfrac{a_1^x+\\cdots+a_n^x-n}{n}=\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\dfrac{a_i^x-1}{x}$。", "再用 $a_i^x-1\\sim x\\ln a_i$，得 $\\ln y\\to\\dfrac{1}{n}\\sum\\limits_{i=1}^{n}\\ln a_i=\\ln\\sqrt[n]{a_1a_2\\cdots a_n}$。", "由对数函数连续，$y\\to\\sqrt[n]{a_1a_2\\cdots a_n}$。"]}], "pitfalls": ["直接把和拆开求极限——整体是 $1^\\infty$ 型，要先化到 $v(u-1)$ 再处理（参见易错点 E-002）", "漏掉 $\\ln a_i$：$a_i^x-1\\sim x\\ln a_i$ 里的 $\\ln a_i$ 正是答案的来源", "算到 $\\dfrac{1}{n}\\sum\\ln a_i$ 就停手——要还原成 $\\ln\\sqrt[n]{a_1\\cdots a_n}$，再取指数", "用洛必达法则——本章超纲"], "related": ["题库知识点「10.14 函数极限·函数连续」八、未定式的处理流程", "§3.6 重要极限2的推广式（$1^\\infty$ 型）", "常用等价无穷小：$a^x-1\\sim x\\ln a$", "题库易错点 E-002（不能拆开极限不存在的项）"], "added": "2026-10-12", "kind": "题目", "sec": "综合", "name": "1-综.3(2)", "topic": "题目"}, {"id": "错-1-3.8(8)", "source": "第一章作业 习题1-3 第8题(8)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to1}\\dfrac{x^{n+1}-(n+1)x+n}{(x-1)^2}$（$n$ 为正整数）。", "type": "计算题", "topics": ["二项式展开", "约分时提取最低次非零项系数", "$0/0$ 型（可约）"], "difficulty": 3, "tags": ["错题", "丢系数", "0/0型"], "my_answer": "1", "right_answer": "$\\dfrac{n(n+1)}{2}$", "error_analysis": "令 $t=x-1$ 后分子 $=(1+t)^{n+1}-(n+1)t-1=C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$，除以 $t^2$ 的常数项应是 $C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。我把展开写成 $t^{n-1}+\\cdots+1$，等于默认二次项系数为 1，**约分时把最低次非零项的系数丢了**。", "key_points": ["约分前必须先写出**最低次非零项及其系数**", "数值自检最快：取 $n=2$，$\\lim\\limits_{x\\to1}\\dfrac{x^3-3x+2}{(x-1)^2}=\\lim\\limits_{x\\to1}(x+2)=3$，与 $\\dfrac{2\\cdot3}{2}=3$ 相符", "$n=1$ 时答案才是 1——只验一个特例容易被骗过去"], "solutions": [{"name": "换元 + 二项式展开", "steps": ["令 $t=x-1$（$t\\to0$），则 $x=1+t$，分子 $=(1+t)^{n+1}-(n+1)t-1$。", "二项式展开：$(1+t)^{n+1}=1+(n+1)t+C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$", "代入得分子 $=C_{n+1}^{2}t^{2}+C_{n+1}^{3}t^{3}+\\cdots$。", "除以 $t^2$ 后令 $t\\to0$：原式 $=C_{n+1}^{2}=\\dfrac{n(n+1)}{2}$。"]}], "pitfalls": ["把 $t^{n-1}+\\cdots+1$ 当成分子主部——这只保留了最高次项，最低次非零项的系数才是答案"], "related": ["同类型：作业 习题1-3 第8(2)题（展开后约 x² 得 10）", "题库易错点 E-007"], "added": "2026-10-16", "kind": "题目", "sec": "§3.6", "name": "错-1-3.8(8)", "topic": "题目"}, {"id": "错-1-3.12(4)", "source": "第一章作业 习题1-3 第12题(4)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（$o$ 记号）", "statement": "证明 $o(x^n)\\cdot o(x^m)=o(x^{m+n})$（$x\\to0$）。", "type": "证明题", "topics": ["$o$ 记号的定义", "$o$ 的运算律（乘法）", "回到定义证明"], "difficulty": 3, "tags": ["错题", "证明不成立", "o记号"], "my_answer": "把两个极限改写成同一个分母，说「显然成立」", "right_answer": "设 $\\alpha=o(x^n),\\beta=o(x^m)$，则 $\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}\\to0$", "error_analysis": "我只用了恒等式 $x^mx^n=x^{m+n}$，把「证明极限为 0」偷换成「两个分母相等」——**全程没用到 $o$ 的定义**。而且开头写的 $\\lim\\dfrac{f}{x^m}=\\lim\\dfrac{f}{x^{m+n}}$ 一般不成立（两者都趋于 0 才偶然相等）。", "key_points": ["$o$ 的等式本质是「属于」，证明时**必须回到定义**：证某个比值的极限为 0", "乘法律的关键是**拆成两个已知的无穷小之积**：$\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}$", "「显然成立」在数学证明里等于没证，考试必扣分"], "solutions": [{"name": "回到定义", "steps": ["设 $\\alpha=o(x^n)$，$\\beta=o(x^m)$，按定义即 $\\lim\\limits_{x\\to0}\\dfrac{\\alpha}{x^n}=0$，$\\lim\\limits_{x\\to0}\\dfrac{\\beta}{x^m}=0$。", "$\n\\dfrac{\\alpha\\beta}{x^{m+n}}=\\dfrac{\\alpha}{x^n}\\cdot\\dfrac{\\beta}{x^m}$。", "由极限的乘法法则：$\\lim\\limits_{x\\to0}\\dfrac{\\alpha\\beta}{x^{m+n}}=0\\cdot0=0$。", "按定义即 $\\alpha\\beta=o(x^{m+n})$，也就是 $o(x^n)\\cdot o(x^m)=o(x^{m+n})$。"]}], "pitfalls": ["用恒等式或「显然」代替定义验证——本题要证的是「极限为 0」，这是必须算出来的"], "related": ["题库知识点「10.14 函数极限·函数连续」七、$o$ 记号", "题库易错点 E-006"], "added": "2026-10-16", "kind": "题目", "sec": "§3.6", "name": "错-1-3.12(4)", "topic": "题目"}, {"id": "错-1-3.16(2)", "source": "第一章作业 习题1-3 第16题(2)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{\\sin(\\tan^2x)}{\\sqrt[n]{1+x^2}-1}$。", "type": "计算题", "topics": ["等价量替换", "$\\sin u\\sim u$", "$\\sqrt[n]{1+x^2}-1\\sim\\dfrac{x^2}{n}$"], "difficulty": 3, "tags": ["错题", "答数错", "等价量"], "my_answer": "1", "right_answer": "$n$", "error_analysis": "三重错误：① 无端把分式**取倒数**，还把 $x\\to0$ 改成 $x\\to\\infty$；② 最后 $\\sqrt[n]{\\frac{1}{x^{2n-2}}+\\frac{1}{x^{2n}}}\\to0$（$n>1$），却写成 1；③ 本题唯一该用的 $\\sqrt[n]{1+x^2}-1\\sim\\dfrac{x^2}{n}$ 反而没写出来。", "key_points": ["分母是 $\\sqrt[n]{1+x^2}-1$，用 $(1+u)^a-1\\sim au$（$a=\\frac1n$，$u=x^2$）：$\\sim\\dfrac{x^2}{n}$", "分子 $\\sin(\\tan^2x)\\sim\\tan^2x\\sim x^2$", "分子分母都是因式，比值 $=\\dfrac{x^2}{x^2/n}=n$", "**不要中途把分式取倒数、不要擅自改变极限过程**"], "solutions": [{"name": "等价量替换（因式位置）", "steps": ["$x\\to0$ 时 $\\tan^2x\\to0$，故 $\\sin(\\tan^2x)\\sim\\tan^2x\\sim x^2$。", "$\\sqrt[n]{1+x^2}-1=(1+x^2)^{1/n}-1\\sim\\dfrac{1}{n}x^2$。", "分子分母都是因式，可整体替换：原式 $=\\lim\\limits_{x\\to0}\\dfrac{x^2}{x^2/n}=n$。"]}], "pitfalls": ["忘记 $(1+u)^a-1\\sim au$ 里的系数 $a$（本题 $a=\\frac1n$，故答案是 $n$ 而不是 1）", "中途取倒数并改变极限过程"], "related": ["题库知识点「10.14」一、常用等价无穷小量", "题库易错点 E-003"], "added": "2026-10-16", "kind": "题目", "sec": "§3.6", "name": "错-1-3.16(2)", "topic": "题目"}, {"id": "错-1-4.3(3)", "source": "第一章作业 习题1-4 第3题(3)", "chapter": "第一章 函数与极限", "section": "§4.1 函数连续的概念", "statement": "指出 $f(x)=e^{1/x}$ 的间断点，并判断其类型。", "type": "讨论题", "topics": ["间断点的分类", "第一类（可去、跳跃）与第二类（无穷、振荡）", "单侧极限的求法"], "difficulty": 3, "tags": ["错题", "间断点分类", "经典反例"], "my_answer": "跳跃间断点", "right_answer": "$x=0$ 是**第二类无穷间断点**", "error_analysis": "跳跃间断点要求**两个单侧极限都存在**（且不相等）。而这里 $\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$——右极限根本不存在，所以不是第一类。我只写了类型结论、没写单侧极限，错误因此没被自己发现。", "key_points": ["判类型**必须先把两个单侧极限求出来**，再对照定义分类", "$x\\to0^+$ 时 $1/x\\to+\\infty$，$e^{1/x}\\to+\\infty$；$x\\to0^-$ 时 $1/x\\to-\\infty$，$e^{1/x}\\to0$", "分类口诀：两侧都有限但不等 → 跳跃；一侧为 $\\infty$ → 无穷（第二类）；一列点振荡无极限 → 振荡（第二类）；两侧相等但 $\\ne f(x_0)$ → 可去"], "solutions": [{"name": "标准流程", "steps": ["$f$ 在 $x=0$ 无定义，故 $x=0$ 是间断点。", "算右极限：$\\lim\\limits_{x\\to0^+}e^{1/x}=+\\infty$（因 $1/x\\to+\\infty$）。", "算左极限：$\\lim\\limits_{x\\to0^-}e^{1/x}=0$（因 $1/x\\to-\\infty$）。", "右极限不是有限数（极限不存在），故 $x=0$ 是**第二类无穷间断点**。"]}], "pitfalls": ["只写结论不写单侧极限", "把「一侧为 $\\infty$」误判为跳跃——跳跃要求两侧极限都是有限数"], "related": ["题库题目 1-3.5(4)（同一函数的极限不存在）", "题库易错点 E-004"], "added": "2026-10-16", "kind": "题目", "sec": "§4.1", "name": "错-1-4.3(3)", "topic": "题目"}, {"id": "错-1-综.3(1)", "source": "第一章作业 第一章综合题 第3题(1)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{3\\sin x+x^2\\cos\\frac1x}{(1+\\cos x)\\ln(1+x)}$。", "type": "计算题", "topics": ["等价量替换", "有界量 × 无穷小量 = 无穷小量", "$o$ 记号", "展开的适用条件"], "difficulty": 4, "tags": ["错题", "答数错", "超范围使用展开"], "my_answer": "$-\\infty$", "right_answer": "$\\dfrac{3}{2}$", "error_analysis": "我把 $2x\\cos\\frac1x$ 换成了 $2x-\\frac1x$，即对 $\\cos t$ 用了 $\\cos t\\approx1-\\frac{t^2}{2}$。但这里 **$t=\\frac1x\\to\\infty$**，二次展开**只在 $t\\to0$ 时成立**。随后又把分母 $x(4-x^2)$ 拆错，双重错误。", "key_points": ["$x^2\\cos\\frac1x$ 是「有界量 $\\cos\\frac1x$」乘「无穷小 $x^2$」，故是 $o(x)$，记作 $o(x)$ 保留即可", "分子 $=3\\sin x+o(x)=3x+o(x)$；分母 $(1+\\cos x)\\ln(1+x)\\sim2\\cdot x=2x+o(x)$", "结果 $=\\dfrac{3x+o(x)}{2x+o(x)}=\\dfrac{3+o(1)}{2+o(1)}\\to\\dfrac32$", "**用任何展开前，先看括号里那个量是否趋于展开点**"], "solutions": [{"name": "有界 × 无穷小 + 等价量", "steps": ["$\\left|x^2\\cos\\frac1x\\right|\\le x^2\\to0$，故 $x^2\\cos\\frac1x=o(x)$。", "$3\\sin x\\sim3x$，故分子 $=3x+o(x)$。", "$1+\\cos x\\to2$，$\\ln(1+x)\\sim x$，故分母 $\\sim2x$。", "原式 $=\\lim\\limits_{x\\to0}\\dfrac{3x+o(x)}{2x}=\\dfrac32$。"]}], "pitfalls": ["对 $\\cos\\frac1x$ 套用 $\\cos t\\approx1-\\frac{t^2}{2}$——$t=\\frac1x\\to\\infty$，展开不成立", "把分母拆成 $x(4-x^2)$ 后分数裂项算错"], "related": ["题库易错点 E-003（等价量/展开只在自变量趋于展开点时成立）", "题库知识点「10.14」八、总纲"], "added": "2026-10-16", "kind": "题目", "sec": "综合", "name": "错-1-综.3(1)", "topic": "题目"}, {"id": "错-1-3.2", "source": "第一章作业 习题1-3 第2题", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "设 $D(x)=1$（$x$ 为有理数），$D(x)=0$（$x$ 为无理数），证明 $D(x)$ 在每一点极限都不存在。", "type": "证明题", "topics": ["归结原则（海涅定理）", "有理数与无理数的稠密性", "极限不存在的证明"], "difficulty": 3, "tags": ["错题", "构造漏洞", "狄利克雷函数"], "my_answer": "取 $x_n'=x_0+\\dfrac1n$、$x_n''=x_0+\\dfrac1{\\sqrt n}$，断言前者有理、后者无理", "right_answer": "用稠密性：在 $(x_0,x_0+\\frac1n)$ 内分别取有理数 $r_n$ 与无理数 $s_n$", "error_analysis": "两处构造都站不住：① $x_0$ **无理**时 $x_0+\\frac1n$ 也无理，$D(x_n')\\to1$ 就不成立；② $n$ 为完全平方数时 $\\frac1{\\sqrt n}$ 是**有理数**，$x_n''$ 未必无理。所以数列根本不具备所需性质，只在个别情形下碰巧成立。", "key_points": ["归结原则要求：$\\{x_n\\}\\subset\\mathring U(x_0)$、$x_n\\to x_0$，且**函数值确实趋于两个不同的常数**", "构造之前先想清楚：这个数列真的能保证落在「有理数」/「无理数」集合里吗？", "最稳的做法是**直接用稠密性**：任何区间内既有无理数又有有理数，取一串即可，不必猜显式公式", "$x_0$ 是任意的，所以构造必须对一切 $x_0\\in\\mathbb R$ 都有效"], "solutions": [{"name": "用稠密性构造", "steps": ["任取 $x_0\\in\\mathbb R$。对每个 $n$，由有理数稠密性，在 $(x_0,x_0+\\frac1n)$ 内取有理数 $r_n$（自然 $r_n\\ne x_0$）。", "同样由无理数稠密性，在同一区间内取无理数 $s_n$。", "于是 $r_n\\to x_0$、$s_n\\to x_0$，而 $D(r_n)=1\\to1$、$D(s_n)=0\\to0$。", "由归结原则，$\\lim\\limits_{x\\to x_0}D(x)$ 不可能存在（否则两条路径必给同一极限）。由 $x_0$ 任意，$D$ 处处无极限。"]}], "pitfalls": ["凭直觉写 $x_0+\\frac1n$、$x_0+\\frac1{\\sqrt n}$ 并断言其有理/无理——性质依赖于 $x_0$ 与 $n$，一般不对"], "related": ["题库易错点 E-005（构造数列必须验证其性质）", "§3.3 归结原则"], "added": "2026-10-16", "kind": "题目", "sec": "§3.3", "name": "错-1-3.2", "topic": "题目"}, {"id": "错-1-3.6", "source": "第一章作业 习题1-3 第6题", "chapter": "第一章 函数与极限", "section": "§3.3 函数极限存在的准则", "statement": "利用 $\\lim\\limits_{n\\to\\infty}\\dfrac{n^k}{a^n}=0$（$a>1$ 为常数，$k$ 为常数），证明 $\\lim\\limits_{x\\to+\\infty}\\dfrac{x^k}{a^x}=0$（提示：用夹逼定理）。", "type": "证明题", "topics": ["夹逼定理", "取整夹逼（数列极限推函数极限）", "单调性"], "difficulty": 3, "tags": ["错题", "引用未证结论", "夹逼"], "my_answer": "证 $x^k/a^x$ 单调递减，然后直接说极限为 0", "right_answer": "用取整做双边夹逼", "error_analysis": "两个问题：① 引用了 $\\dfrac{x_1-x_2}{\\ln x_1-\\ln x_2}>\\sqrt{x_1x_2}$（对数平均 > 几何平均）——本章**没讲、我也没证**；② 更根本的是，**单调递减只能说明极限存在，不能说明极限等于 0**（还要证明下确界为 0）。此外 $k\\le0$ 的情形没讨论，$[x]$ 也没说明是取整。", "key_points": ["本题的提示是**夹逼定理**，思路应是把函数夹在两个数列之间", "取 $n=\\lfloor x\\rfloor$，则 $n\\le x<n+1$，于是 $\\dfrac{n^k}{a^{n+1}}\\le\\dfrac{x^k}{a^x}\\le\\dfrac{(n+1)^k}{a^n}$", "两端都化归为已知的数列极限：$\\dfrac{n^k}{a^{n+1}}=\\dfrac1a\\cdot\\dfrac{n^k}{a^n}\\to0$，$\\dfrac{(n+1)^k}{a^n}=a\\cdot\\dfrac{(n+1)^k}{a^{n+1}}\\to0$", "「单调有界」只能保证极限存在，要定出极限值必须另有工具"], "solutions": [{"name": "取整 + 双边夹逼（按提示）", "steps": ["对 $x>1$ 记 $n=\\lfloor x\\rfloor$（$x$ 的整数部分），则 $n\\le x<n+1$，且 $x\\to+\\infty$ 时 $n\\to\\infty$。", "因 $a>1$，$a^n\\le a^x$，故 $\\dfrac{x^k}{a^x}\\ge\\dfrac{n^k}{a^{n+1}}=\\dfrac1a\\cdot\\dfrac{n^k}{a^n}$（$k>0$ 时；$k\\le0$ 时同理可得）。", "又 $a^x>a^{n}$ 且 $x<n+1$，故 $\\dfrac{x^k}{a^x}\\le\\dfrac{(n+1)^k}{a^{n}}=a\\cdot\\dfrac{(n+1)^k}{a^{n+1}}$。", "由已知的数列极限，两端都 $\\to0$（$\\dfrac1a\\cdot0=0$，$a\\cdot0=0$）。", "由夹逼定理，$\\lim\\limits_{x\\to+\\infty}\\dfrac{x^k}{a^x}=0$。"]}], "pitfalls": ["引用未在书上证明的不等式（对数平均不等式）", "把「单调有界 ⇒ 极限存在」误当成「极限 = 0」"], "related": ["题库易错点 E-006（不能引用未证的结论）", "§3.6 夹逼定理"], "added": "2026-10-16", "kind": "题目", "sec": "§3.3", "name": "错-1-3.6", "topic": "题目"}, {"id": "错-1-4.9(3)", "source": "第一章作业 习题1-4 第9题(3)", "chapter": "第一章 函数与极限", "section": "§4.3 闭区间上连续函数的性质", "statement": "证明方程 $x-\\varepsilon\\sin x=1$（$0<\\varepsilon<1$）有且仅有一个实根。", "type": "证明题", "topics": ["零点定理（根的存在定理）", "介值定理", "根的唯一性", "和差化积"], "difficulty": 4, "tags": ["错题", "超纲用导数", "推理无效"], "my_answer": "用 $f'(x)=1-\\varepsilon\\cos x>0$ 证单调；存在性写「$\\because1\\in(-\\infty,+\\infty)\\therefore$至少一根」", "right_answer": "存在性用零点定理；唯一性用和差化积导出的 $|\\sin x_1-\\sin x_2|\\le|x_1-x_2|$", "error_analysis": "① 导数属于**第二章**内容，本章超纲；② 「$1\\in(-\\infty,+\\infty)$ 故作差以后必有零点」是**无效推理**——存在性必须由「找到两点使函数值异号」+ 零点定理给出。", "key_points": ["存在性：令 $f(x)=x-\\varepsilon\\sin x-1$。取 $x=0$ 得 $f(0)=-1<0$；取 $x=2$ 得 $f(2)=1-\\varepsilon\\sin2>1-1=0$。由零点定理，$(0,2)$ 内至少一根", "唯一性：反设有两根 $x_1<x_2$。由 $f(x_1)=f(x_2)=0$ 得 $x_1-x_2=\\varepsilon(\\sin x_1-\\sin x_2)$", "两边取绝对值并用和差化积：$|\\sin x_1-\\sin x_2|=2\\left|\\cos\\frac{x_1+x_2}{2}\\right|\\left|\\sin\\frac{x_1-x_2}{2}\\right|\\le|x_1-x_2|$", "于是 $|x_1-x_2|=\\varepsilon|\\sin x_1-\\sin x_2|\\le\\varepsilon|x_1-x_2|<|x_1-x_2|$（因 $0<\\varepsilon<1$），矛盾", "所以至多一根；结合存在性，恰有一根"], "solutions": [{"name": "零点定理 + 和差化积（第一章允许）", "steps": ["令 $f(x)=x-\\varepsilon\\sin x-1$，$f$ 在 $\\mathbb R$ 上连续。", "$f(0)=-1<0$；$f(2)=1-\\varepsilon\\sin2\\ge1-\\varepsilon>0$（因 $|\\sin2|<1$）。", "由零点定理，存在 $\\xi\\in(0,2)$ 使 $f(\\xi)=0$，即至少有一根。", "设另有一根 $\\eta\\ne\\xi$，由 $f(\\xi)=f(\\eta)=0$ 相减得 $\\xi-\\eta=\\varepsilon(\\sin\\xi-\\sin\\eta)$。", "取绝对值并用 $|\\sin\\xi-\\sin\\eta|\\le|\\xi-\\eta|$（和差化积 + $|\\sin u|\\le|u|$），得 $|\\xi-\\eta|\\le\\varepsilon|\\xi-\\eta|<|\\xi-\\eta|$，矛盾。", "故根唯一。"]}], "pitfalls": ["用导数判断单调——第二章才学", "把「区间是 $(-\\infty,+\\infty)$」当成存在性的理由"], "related": ["题库易错点 E-006", "§4.3 零点定理", "§3.6 和差化积"], "added": "2026-10-16", "kind": "题目", "sec": "§4.3", "name": "错-1-4.9(3)", "topic": "题目"}, {"id": "错-1-4.12(1)", "source": "第一章作业 习题1-4 第12题(1)", "chapter": "第一章 函数与极限", "section": "§3.6 两个重要极限（等价量替换）", "statement": "求 $\\lim\\limits_{x\\to0}\\dfrac{(1+\\alpha x)^a-(1+\\beta x)^b}{x}$。", "type": "计算题（含参数）", "topics": ["等价量替换", "$(1+u)^\\lambda-1\\sim\\lambda u$", "$0/0$ 型"], "difficulty": 3, "tags": ["错题", "超纲用广义二项式"], "my_answer": "按 $C_a^1,C_a^2,\\cdots$ 展开成幂级数后取常数项，得 $a\\alpha-b\\beta$（答案对）", "right_answer": "$a\\alpha-b\\beta$，但应用 $(1+u)^\\lambda-1=\\lambda u+o(u)$", "error_analysis": "答案正确，但**对非整数指数使用广义二项式 $C_a^k$ 属于超纲**（本章没有二项式级数），而且写成 $\\cdots$ 没有控制余项，证明不完整。", "key_points": ["第一章的合法工具：$(1+u)^\\lambda-1\\sim\\lambda u$（$u\\to0$，$\\lambda$ 任意实数）", "把分子拆成两个等价量之和：$(1+\\alpha x)^a-1\\sim a\\alpha x$，$(1+\\beta x)^b-1\\sim b\\beta x$", "注意这是**相减**结构，不能分别替换后相减了事，应先合并成**因式**或用 $o$ 记号：分子 $=a\\alpha x-b\\beta x+o(x)$", "最后除以 $x$ 得 $a\\alpha-b\\beta$"], "solutions": [{"name": "用 $(1+u)^\\lambda-1=\\lambda u+o(u)$", "steps": ["$(1+\\alpha x)^a=1+a\\alpha x+o(x)$（因为 $\\alpha x\\to0$，用 $(1+u)^\\lambda-1=\\lambda u+o(u)$）。", "同理 $(1+\\beta x)^b=1+b\\beta x+o(x)$。", "相减：分子 $=a\\alpha x-b\\beta x+o(x)=(a\\alpha-b\\beta)x+o(x)$。", "除以 $x$：原式 $=a\\alpha-b\\beta+o(1)\\to a\\alpha-b\\beta$。"]}], "pitfalls": ["对非整数指数用广义二项式展开（超纲）", "用 $\\cdots$ 代替余项控制", "在相减结构里分别替换却不注明 $o(x)$"], "related": ["题库题目 1-4.12(2)（同类：含参数）", "题库易错点 E-003"], "added": "2026-10-16", "kind": "题目", "sec": "§3.6", "name": "错-1-4.12(1)", "topic": "题目"}, {"id": "错-1-综.17", "source": "第一章作业 第一章综合题 第17题", "chapter": "第一章 函数与极限", "section": "§4.1 函数连续的概念", "statement": "设 $f(x)=\\dfrac{\\sqrt{1+\\sin x+\\sin^2x}-(\\alpha+\\beta\\sin x)}{\\sin^2x}$ 在 $x=0$ 处为可去间断点，求 $\\alpha,\\beta$。", "type": "计算题（含待定常数）", "topics": ["可去间断点的充要条件", "两个单侧极限相等", "有理化", "等价量替换", "充分性验证"], "difficulty": 4, "tags": ["错题", "只求必要条件", "待定常数"], "my_answer": "$\\alpha=1,\\ \\beta=\\dfrac12$（答案正确，但推导缺一步、也没回代验证）", "right_answer": "$\\alpha=1,\\ \\beta=\\dfrac12$", "error_analysis": "① 由「两个单侧极限相等」到 $2\\beta=1$ 中间少了关键一步：应先**两式相减保留 $t$**，得 $t\\left[\\sqrt{t^2+t+1}-\\sqrt{t^2-t+1}-2\\beta\\right]\\to0$，再由括号内 $\\to1-2\\beta$ 才得 $2\\beta=1$——我直接把 $t$ 约掉了，逻辑上有跳跃；② **只求了必要条件，没有回代验证充分性**。", "key_points": ["可去间断点的条件：两个单侧极限都存在、相等且为有限数（与 $f(0)$ 无关，$f$ 在该点本无定义）", "令 $t=\\sin x$（$x\\to0^\\pm$ 时 $t\\to0^\\pm$），分母 $t^2$，用 $\\sqrt{1+t+t^2}-(\\alpha+\\beta t)$", "为使极限有限，需 $\\alpha=1$（否则分子 $\\to1-\\alpha\\ne0$，商发散）", "代入 $\\alpha=1$ 后，分子的线性项系数必须为零，才得 $\\beta=\\dfrac12$", "**求参数题的最后一步永远是回代验证**：$\\alpha=1,\\beta=\\frac12$ 时两侧极限都是 $\\dfrac38$，有限且相等，确实是可去间断点"], "solutions": [{"name": "必要条件 + 回代验证", "steps": ["记 $t=\\sin x$，$x\\to0$ 时 $t\\to0$。原式 $=\\dfrac{\\sqrt{1+t+t^2}-\\alpha-\\beta t}{t^2}$。", "若 $\\alpha\\ne1$，分子 $\\to1-\\alpha\\ne0$ 而分母 $\\to0$，商必发散，不是可去间断点。故必须 $\\alpha=1$。", "此时用 $\\sqrt{1+u}=1+\\dfrac u2-\\dfrac{u^2}{8}+o(u^2)$（$u=t+t^2$）：分子 $=1+\\dfrac{t+t^2}{2}-\\dfrac{t^2}{8}-1-\\beta t+o(t^2)=\\left(\\dfrac12-\\beta\\right)t+\\dfrac38t^2+o(t^2)$。", "要使 $\\dfrac{\\text{分子}}{t^2}$ 有有限极限，一次项系数必须为 0：$\\dfrac12-\\beta=0$，即 $\\beta=\\dfrac12$。", "回代验证：$\\alpha=1,\\beta=\\dfrac12$ 时，原式 $=\\dfrac38+o(1)\\to\\dfrac38$，两个单侧极限都是 $\\dfrac38$（有限且相等），确为可去间断点。"]}], "pitfalls": ["只求必要条件就交卷——必须回代验证", "由「两侧极限相等」到方程组时跳过中间的极限论证"], "related": ["题库易错点 E-008（求参数必须回代验证）", "题库题目 1-4.12(2)"], "added": "2026-10-16", "kind": "题目", "sec": "综合", "name": "错-1-综.17", "topic": "题目"}, {"id": "经典-01", "source": "第一章经典难题（递推数列）", "chapter": "第一章 函数与极限", "section": "§2.3 数列极限存在的准则", "statement": "设 $x_1=1$，$x_{n+1}=x_n+\\dfrac{1}{x_n}$（$n=1,2,\\cdots$）。(1) 证明 $\\lim\\limits_{n\\to\\infty}x_n=+\\infty$；(2) 求 $\\lim\\limits_{n\\to\\infty}\\dfrac{x_n}{\\sqrt{2n}}$。", "type": "证明题 + 计算题", "topics": ["单调有界准则", "反证法排除有界", "平方后构造可累加的递推式", "夹逼定理", "初等裂项 $\\frac1k\\le 2(\\sqrt k-\\sqrt{k-1})$"], "difficulty": 5, "tags": ["经典难题", "递推数列", "四工具串联", "题眼：先平方"], "key_points": ["第(1)问的坑：**单调递增 ≠ 发散**（$1-\\frac1n$ 就递增但有界），必须反设**有界**、用单调有界准则导出 $L=L+\\frac1L$ 的矛盾", "第(2)问的题眼：递推式里 $x_{n+1}$ 与 $x_n$ 不是线性关系，**直接累加不了**；先**平方**才出现可累加的常数项 $+2$", "夹逼 $\\sum\\frac{1}{x_k^2}$ 时用初等裂项 $\\frac1k\\le 2(\\sqrt k-\\sqrt{k-1})$，避免引用对数不等式（防超纲）", "最后开方要说明 $x_n>0$ 且 $\\sqrt{\\ }$ 连续（极限符号可与它交换）"], "solutions": [{"name": "(1) 单调 + 反证有界", "steps": ["由 $x_1=1>0$ 与递推式归纳得 $x_n>0$，故 $x_{n+1}-x_n=\\dfrac{1}{x_n}>0$，$\\{x_n\\}$ 严格递增。", "反设 $\\{x_n\\}$ 有界。由单调有界准则存在有限极限 $L$。", "在 $x_{n+1}=x_n+\\dfrac1{x_n}$ 两端令 $n\\to\\infty$（两端极限均存在，可用四则运算）得 $L=L+\\dfrac1L$，即 $\\dfrac1L=0$，与 $L\\ge1>0$ 矛盾。", "故 $\\{x_n\\}$ 无界；又单调递增，所以 $x_n\\to+\\infty$。"]}, {"name": "(2) 平方累加 + 夹逼", "steps": ["平方：$x_{n+1}^2=x_n^2+2+\\dfrac{1}{x_n^2}$。", "累加（$k=1$ 到 $n-1$）得 $x_n^2=x_1^2+2(n-1)+\\sum\\limits_{k=1}^{n-1}\\dfrac{1}{x_k^2}=2n-1+\\sum\\limits_{k=1}^{n-1}\\dfrac{1}{x_k^2}$。", "下界：$\\dfrac{x_n^2}{2n}>\\dfrac{2n-1}{2n}=1-\\dfrac{1}{2n}$。", "上界：由 $x_k^2>2k-1\\ge k$ 得 $\\dfrac{1}{x_k^2}\\le\\dfrac1k$；又 $\\dfrac1k\\le2(\\sqrt k-\\sqrt{k-1})$，裂项相消得 $\\sum\\limits_{k=1}^{n-1}\\dfrac1k\\le2\\sqrt{n-1}$。", "故 $1-\\dfrac{1}{2n}<\\dfrac{x_n^2}{2n}\\le1-\\dfrac{1}{2n}+\\dfrac{\\sqrt{n-1}}{n}$，两端都 $\\to1$，由夹逼定理 $\\dfrac{x_n^2}{2n}\\to1$。", "由 $x_n>0$ 及 $\\sqrt{\\ }$ 连续，开方得 $\\dfrac{x_n}{\\sqrt{2n}}\\to1$。"]}], "pitfalls": ["第(1)问直接说「单调递增所以趋于 $+\\infty$」——递增不一定发散，必须反证排除有界", "第(2)问对 $x_{n+1}=x_n+\\frac1{x_n}$ 直接累加——它不是线性关系，累加不出简单式子", "用 $\\sum\\frac1k\\le1+\\ln n$ 估计——需要对数不等式，本章未必已证（易错点 E-006），本题的裂项法纯初等更稳", "开方时不说明 $x_n>0$ 与 $\\sqrt{\\ }$ 连续"], "related": ["题库易错点 E-006（不能引用 const BOOK = "<!DOCTYPE html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>微积分 · 交互版<\/title>\n<style>\n:root{--ink:#1a1a1a;--muted:#666;--line:#e3e3e3;--accent:#b5651d;--bg:#faf9f7}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Songti SC\",\"SimSun\",Georgia,serif;color:var(--ink);\n     background:var(--bg);line-height:1.85;\n     line-break:strict;word-break:normal;overflow-wrap:break-word;\n     hanging-punctuation:none;text-spacing-trim:trim-start}\n#wrap{display:flex;max-width:1400px;margin:0 auto;gap:28px;padding:24px}\n#toc{position:sticky;top:24px;align-self:flex-start;width:230px;flex:0 0 230px;\n     font-size:13.5px;font-family:\"Heiti SC\",\"SimHei\",sans-serif;max-height:92vh;overflow:auto}\n#toc a{display:block;text-decoration:none;color:#333;padding:3px 6px;border-radius:4px}\n#toc a:hover{background:#efe9e0;color:var(--accent)}\n#toc a.t1{font-weight:700;margin-top:10px;color:#111}\n#toc a.t2{padding-left:18px;color:#555}\nmain{flex:1;min-width:0}\nh1{font-size:26px;border-bottom:2px solid #d8d0c4;padding-bottom:8px;margin:34px 0 18px}\nh2{font-size:20px;margin:30px 0 10px;color:#111}\nh2 .src{font-size:12px;color:var(--muted);font-weight:400;margin-left:10px}\nh3{font-size:14px;font-family:\"Heiti SC\",\"SimHei\",sans-serif;color:#8a6b3a;\n   margin:20px 0 6px;padding-left:10px;border-left:3px solid #d9c39a}\np.lb{font-weight:700;margin:14px 0 4px;font-family:\"Heiti SC\",\"SimHei\",sans-serif;font-size:15px}\np.lb.note{font-family:inherit;font-weight:600;color:#444}\ndiv.p{margin:3px 0;text-indent:2em}\ndiv.p.note{font-family:\"KaiTi\",\"STKaiti\",serif;color:#444;font-size:14.5px}\ndiv.f{text-align:center;margin:7px 0;font-family:\"Cambria Math\",Cambria,serif}\ndiv.z{border-left:2px solid #cfcfcf;padding-left:12px;margin:5px 0;color:#333;\n      font-family:\"KaiTi\",\"STKaiti\",serif}\np.bullet{margin:6px 0 6px 1em;font-family:\"Heiti SC\",\"SimHei\",sans-serif;font-size:14.5px}\n.ex{color:#b5651d;border-bottom:1px dashed #d8b98d;cursor:pointer;padding:0 1px}\n.ex:hover{background:#f6ead9}\n.refgrp{white-space:nowrap}\n.fill{margin:5px 0;padding:5px 12px;background:#f7f3ea;border-left:2px solid #e0cfa8;\n      font-family:\"KaiTi\",\"STKaiti\",serif;color:#4a4a4a;font-size:14.5px;text-indent:0}\n\n#look:hover{background:#f7f0e2}\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n#pop h4{margin:0 0 6px;font-size:13px;color:#666;font-weight:400;\n        font-family:\"Heiti SC\",\"SimHei\",sans-serif}\n#pop img{width:100%;display:block;border:1px solid #eee;margin:6px 0}\n#pop .hint{font-size:12.5px;color:#8a6b3a;font-family:\"Heiti SC\",\"SimHei\",sans-serif;\n          margin-top:4px;padding-top:5px;border-top:1px dashed #eadfc8}\n\n#pop .ans{display:none}\n#pop .btn{font-size:12.5px;font-family:\"Heiti SC\",\"SimHei\",sans-serif;\n          background:#f3ede3;border:1px solid #d9c39a;border-radius:5px;\n          padding:3px 10px;cursor:pointer;color:#7a5a20}\n\n<\/style><\/head><body>\n<div id=\"wrap\">\n<nav id=\"toc\"><a class=\"t1\" href=\"#ch1\">第一章　函数与极限<\/a>\n<a class=\"t2\" href=\"#ch1_0\">一、函数与确界<\/a>\n<a class=\"t2\" href=\"#ch1_1\">二、数列极限<\/a>\n<a class=\"t2\" href=\"#ch1_2\">三、函数极限<\/a>\n<a class=\"t2\" href=\"#ch1_3\">四、无穷小量与无穷大量<\/a>\n<a class=\"t2\" href=\"#ch1_4\">五、函数的连续性<\/a>\n<a class=\"t1\" href=\"#ch2\">第二章　导数与微分<\/a>\n<a class=\"t2\" href=\"#ch2_0\">一、导数的概念<\/a>\n<a class=\"t2\" href=\"#ch2_1\">二、求导公式与运算法则<\/a>\n<a class=\"t2\" href=\"#ch2_2\">三、隐函数与高阶导数<\/a>\n<a class=\"t2\" href=\"#ch2_3\">四、微分<\/a>\n<a class=\"t2\" href=\"#ch2_4\">五、导数与微分的应用<\/a><\/nav>\n<main><h1 id=\"ch1\">第一章　函数与极限<\/h1>\n<h2 id=\"ch1_0\">一、函数与确界<span class=\"src\">选自 §1.1、§1.2<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义1.1 函数<\/p>\n<div class=\"p\">设 D，B 是两个非空实数集，如果存在一个对应法则 f，使得对 D 中任何一个实数 x，在 B 中都有唯一确定的实数 y 与 x 对应，则称 f：D→B 是 D 上的函数，记为<\/div>\n<div class=\"p\">f：x↦y，x∈D 或 f：D→B，y 称为 x 对应的函数值，记为<\/div>\n<div class=\"p\">y=f(x)，x∈D，其中 x 叫做自变量，y 叫做因变量；D 称为函数 f 的定义域，记为 D(f)，{y | y=f(x)，x∈D}=R(f) 称为函数的值域；在平面坐标系 Oxy 下，集合 {(x, y) | y=f(x)，x∈D} 称为函数 y=f(x) 的图形或图像。<\/div>\n<div class=\"p\">定义域和对应法则是确定函数的两个要素；如果同时研究几个不同的函数，就必须用不同的记号加以区别，如 f，g，φ，ψ，…；在函数的定义中，当 x 在 D 上每取一个值 x₀，所对应的值 y₀ 称为函数 f 在 x=x₀ 处的值，记作 f(x₀)，即有<\/div>\n<div class=\"f\">y₀=f(x₀)。<\/div>\n<div class=\"p\"><span class=\"refgrp\">（见例1、例2）<\/span><\/div>\n<p class=\"lb\">邻域（δ 邻域、空（去）心邻域，左、右邻域）<\/p>\n<div class=\"p\">开区间 (x₀-δ, x₀+δ)（δ&gt;0）称为以 x₀ 为心，以 δ 为半径的邻域，简称为 x₀ 的 δ 邻域；若不需要指明半径 δ 时，记作 U(x₀)，称为 x₀ 的某邻域。<\/div>\n<div class=\"p\">(x₀-δ, x₀)∪(x₀, x₀+δ) 称为以 x₀ 为心，以 δ 为半径的空（去）心邻域，简称为 x₀ 的 δ 空（去）心邻域；若不需要指明半径 δ 时，记作 Ů(x₀)，称为 x₀ 的某空（去）心邻域。<\/div>\n<div class=\"p\">同理，(x₀, x₀+δ)，[x₀, x₀+δ) 统称为 x₀ 的右邻域，(x₀-δ, x₀)，(x₀-δ, x₀] 统称为 x₀ 的左邻域。<\/div>\n<p class=\"lb\">定义1.2 复合函数<\/p>\n<div class=\"p\">设 y=f(u)，u∈E，u=φ(x)，x∈D。若 D(f)∩R(φ)≠∅，则 y 通过 u 构成的 x 的函数，称为由 y=f(u) 与 u=φ(x) 复合而成的函数，简称为复合函数，记作<\/div>\n<div class=\"f\">y=f(φ(x))。<\/div>\n<div class=\"p\">复合函数的定义域为 {x | x∈D 且 φ(x)∈E}，其中 x 称为自变量，y 称为因变量，u 称为中间变量，φ(x) 称为内函数，f(u) 称为外函数。<\/div>\n<div class=\"p\">要判断两个函数 y=f(u)，u=φ(x) 能不能构成复合函数，只要看 y=f(φ(x)) 的定义域是否为非空集。若不为空集，则能构成复合函数，否则就不能构成复合函数。<\/div>\n<p class=\"lb\">定义1.3 反函数<\/p>\n<div class=\"p\">设 y=f(x)，x∈D。若对 R(f) 中的每一个 y，都有唯一确定且满足 y=f(x) 的 x∈D 与之对应，则按此对应法则就能得到一个定义在 R(f) 上的函数，称这个函数为 f 的反函数，记作<\/div>\n<div class=\"f\">f⁻¹：R(f)→D 或 x=f⁻¹(y)，y∈R(f)。<\/div>\n<div class=\"p\">由于习惯上用 x 表示自变量，y 表示因变量，所以常把上述反函数改写成<\/div>\n<div class=\"f\">y=f⁻¹(x)，x∈R(f)。<\/div>\n<div class=\"p\">由函数、反函数的定义可知，反函数的定义域是原来函数的值域，值域是原来函数的定义域。<\/div>\n<div class=\"p\">注意函数 y=f(x) 与 x=f⁻¹(y) 的图像相同，函数 y=f(x) 与 y=f⁻¹(x) 的图像关于直线 y=x 对称。<\/div>\n<p class=\"lb\">初等函数<\/p>\n<div class=\"p\">常值函数 y=C（C 是常数），x∈R；幂函数<\/div>\n<div class=\"p\">y=xᵃ（a 为幂常数），该函数的定义域由常数 a 确定，且总包含区间 (0,+∞)；指数函数<\/div>\n<div class=\"p\">y=aˣ（a&gt;0，a≠1），x∈R；对数函数<\/div>\n<div class=\"p\">y=logₐx（a&gt;0，a≠1），x∈(0,+∞)；三角函数 y=sin x，x∈R，y=cos x，x∈R，y=tan x，x∈(kπ-π/2, kπ+π/2)，k∈Z，y=cot x，x∈(kπ, kπ+π)，k∈Z；反三角函数 y=arcsin x，x∈[-1,1]，y=arccos x，x∈[-1,1]，y=arctan x，x∈R，y=arccot x，x∈R。<\/div>\n<div class=\"p\">以上六类函数，我们统称为基本初等函数。由基本初等函数经过有限次四则运算与复合运算所得到的函数，统称为初等函数。凡不是初等函数的函数，皆称为非初等函数。一般来说，分段函数不是初等函数。<\/div>\n<div class=\"p\">例如，多项式函数 Pₙ(x)=a₀+a₁x+…+aₙxⁿ，x∈R 是常值函数与正整数幂函数经过有限次四则运算得到的。有理（分式）函数 f(x)=Pₙ(x)/Qₘ(x)（Pₙ(x)，Qₘ(x) 分别为 n 次和 m 次多项式函数）的定义域是 {x | x∈R，且 Qₘ(x)≠0}。<\/div>\n<div class=\"p\">但个别分段函数除外，例如 f(x)=-x（x≤0），f(x)=x（x&gt;0），由于 f(x)=|x|=√(x²) 是由 y=√u，u=x² 复合而成的，所以该函数是初等函数。<\/div>\n<p class=\"lb\">定义1.4 奇函数与偶函数<\/p>\n<div class=\"p\">设 D 是关于原点对称的数集，f 为定义在 D 上的函数，若对每一个 x∈D（这时也有 -x∈D），都有<\/div>\n<div class=\"p\">f(-x)=-f(x)（f(-x)=f(x)），则称 f 为 D 上的奇（偶）函数。<\/div>\n<div class=\"p\">从函数图像上看，奇函数的图像关于原点对称，偶函数的图像关于 y 轴对称。<span class=\"refgrp\">（见例9）<\/span><\/div>\n<p class=\"lb\">周期函数<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若存在某个非零常数 T，使得对一切 x∈D，都有 x+T∈D，且 f(x+T)=f(x)，则称 f 为周期函数。T 称为 f 的一个周期。<\/div>\n<div class=\"p\">显然，若 T 是 f(x) 的周期，则 kT 也是 f(x) 的周期，k∈Z。<\/div>\n<div class=\"p\">若周期函数 f 的所有正周期中存在最小正周期，则称这个最小正周期为 f 的基本周期。一般地，函数的周期指的是基本周期。<span class=\"refgrp\">（见例10、例11）<\/span><\/div>\n<p class=\"lb\">定义1.5 单调函数<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若对于 D 中的任意两个数 x₁，x₂ 且 x₁&lt;x₂，总有<\/div>\n<div class=\"p\">f(x₁)≤f(x₂)（f(x₁)≥f(x₂)），则称 f 为 D 上的递增（递减）函数；若对 D 中的任意两个数 x₁，x₂ 且 x₁&lt;x₂，总有<\/div>\n<div class=\"p\">f(x₁)&lt;f(x₂)（f(x₁)&gt;f(x₂)），则称 f 为 D 上的严格递增（递减）函数。<\/div>\n<div class=\"p\">递增和递减函数统称为单调函数，严格递增和严格递减函数统称为严格单调函数。<\/div>\n<p class=\"lb\">定义1.6 有（无）界集<\/p>\n<div class=\"p\">设 A⊂R，A≠∅，若存在常数 M（N），使得对一切 x∈A，都有<\/div>\n<div class=\"f\">x≤M（x≥N），<\/div>\n<div class=\"p\">则称 A 为有上（下）界的数集，数 M（N）称为 A 的一个上（下）界。<\/div>\n<div class=\"p\">显然，任何大（小）于 M（N）的数，也都是 A 的上（下）界。因此，若 A 有一个上界（下界）就有无数个上界（下界）。<\/div>\n<div class=\"p\">若数集 A 既有上界又有下界，则称 A 为有界集。若 A 不是有界集，则称 A 为无界集。<\/div>\n<div class=\"p\">有界集的定义可叙述如下：若存在常数 M&gt;0，对每一个 x∈A，都有<\/div>\n<div class=\"f\">|x|≤M，<\/div>\n<div class=\"p\">则称 A 为有界集。<\/div>\n<div class=\"p\">无界集的定义可叙述如下：若对任何实数 M&gt;0，都存在一个 x₀∈A，使<\/div>\n<div class=\"f\">|x₀|&gt;M，<\/div>\n<div class=\"p\">则称 A 为无界集。<\/div>\n<p class=\"lb\">定义1.7 上确界<\/p>\n<div class=\"p\">设 A⊂R，A≠∅，若常数 α 满足下列两个条件：<\/div>\n<div class=\"p\">（1）α 是 A 的上界，即对一切 x∈A，都有<\/div>\n<div class=\"f\">x≤α；<\/div>\n<div class=\"p\">（2）α 是 A 的最小上界，即对任意给定的 ε&gt;0，α-ε 都不是 A 的上界，即任给 ε&gt;0，一定存在 x₀∈A，使<\/div>\n<div class=\"f\">x₀&gt;α-ε（注意：这里的 x₀ 随 ε 变化而变化），<\/div>\n<div class=\"p\">则称数 α 为数集 A 的上确界，记作 α=sup A 或 α=sup{x | x∈A}。<\/div>\n<p class=\"lb\">定义1.8 下确界<\/p>\n<div class=\"p\">设 A⊂R，A≠∅，若常数 β 满足下列两个条件：<\/div>\n<div class=\"p\">（1）β 是 A 的下界，即对一切 x∈A，都有<\/div>\n<div class=\"f\">x≥β；<\/div>\n<div class=\"p\">（2）β 是 A 的最大下界，即对任意给定的 ε&gt;0，一定存在 x₀∈A，使<\/div>\n<div class=\"f\">x₀&lt;β+ε，<\/div>\n<div class=\"p\">则称数 β 为数集 A 的下确界，记作 β=inf A 或 β=inf{x | x∈A}。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">上（下）确界的性质<\/p>\n<div class=\"p\">若数集 A 有上（下）确界，则上（下）确界可能属于 A，也可能不属于 A。<\/div>\n<div class=\"p\">可以证明上（下）确界属于 A 的充要条件是上（下）确界为 A 的最大（小）值。<\/div>\n<div class=\"p\">若数集 A 存在上（下）确界，则一定是唯一的。<\/div>\n<p class=\"lb\">推论 非空有界集的数集必有确界<\/p>\n<div class=\"p\">非空有界集的数集，必有上（下）确界。<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">反函数存在性定理<\/p>\n<div class=\"p\">严格递增（递减）的函数必有严格递增（递减）的反函数。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：设函数 y=f(x) 的定义域为 D，不妨设 y=f(x) 在 D 上严格递增。<\/div>\n<div class=\"z\">对 R(f) 中的每一个 y₀，有 x₀∈D，使 f(x₀)=y₀，我们证明这样的 x₀ 只能有一个。<\/div>\n<div class=\"z\">事实上，假设存在 x₀'≠x₀，使 f(x₀')=f(x₀)，由 f(x) 严格递增知，若 x₀'&lt;x₀，则 f(x₀')&lt;f(x₀)；若 x₀'&gt;x₀，则 f(x₀')&gt;f(x₀)，这与 f(x₀')=f(x₀) 相矛盾。<\/div>\n<div class=\"z\">所以，对每一个 y₀∈R(f)，都存在且只存在唯一的 x₀∈D，使<\/div>\n<div class=\"f\">f(x₀)=y₀。<\/div>\n<div class=\"z\">从而函数 y=f(x) 存在反函数<\/div>\n<div class=\"f\">x=f⁻¹(y)，y∈R(f)。<\/div>\n<div class=\"z\">现证 x=f⁻¹(y) 在 R(f) 上是严格递增的，任取 y₁，y₂∈R(f) 且 y₁&lt;y₂。设 x₁=f⁻¹(y₁)，x₂=f⁻¹(y₂)，则 y₁=f(x₁)，y₂=f(x₂)。<\/div>\n<div class=\"z\">由 f(x) 严格递增知，若 x₁&gt;x₂，则 f(x₁)&gt;f(x₂)，即 y₁&gt;y₂；若 x₁=x₂，则 f(x₁)=f(x₂)，即 y₁=y₂，都与 y₁&lt;y₂ 相矛盾。<\/div>\n<div class=\"z\">故只有 x₁&lt;x₂ 才能使 y₁&lt;y₂，所以 x=f⁻¹(y) 在 R(f) 上严格递增。□<\/div>\n<p class=\"lb\">确界原理<\/p>\n<div class=\"p\">非空有上（下）界的数集，必有上（下）确界。<\/div>\n<h3>注<\/h3>\n<p class=\"lb note\">求函数定义域<\/p>\n<div class=\"p note\">若一个函数由数学表达式给出，而定义域没有具体的规定，那么它的定义域就是使得函数在数学上有意义的自变量所取数值的全体；如果该函数有实际背景，则它的定义域还要根据问题的实际条件来确定。<\/div>\n<div class=\"p note\">表示函数的定义域常用区间、不等式这两种方法。<\/div>\n<p class=\"lb note\">函数的三种表示法<\/p>\n<div class=\"p note\">函数可以用三种不同的方法来表示，即表格法、图像法和公式法。<\/div>\n<div class=\"p note\">表格法的特点是简明方便，缺点是自变量的取值有限；图像法的特点是形象直观，富有启发性，一目了然；公式法（解析法）是把一个函数通过指明运算的数学式子表示出来，依照它，从自变量的值可以计算出因变量的对应值，其特点是精确、完整，便于理论上分析研究。<span class=\"refgrp\">（见例3、例4、例5）<\/span><\/div>\n<p class=\"lb note\">分段函数<\/p>\n<div class=\"p note\">有一类函数，称为分段函数，它是一个在其定义域的不同部分用不同数学表达式表示的函数。<\/div>\n<div class=\"p note\">注意分段函数不是由几个函数组成，而是一个函数。<span class=\"refgrp\">（见例6、例7、例8）<\/span><\/div>\n<h2 id=\"ch1_1\">二、数列极限<span class=\"src\">选自 §2.1、§2.2、§2.3<\/span><\/h2>\n<h3>定义<\/h3>\n<p class=\"lb\">定义1.9 有上（下）界的函数<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若存在常数 M(N)，对每一个 x∈D，都有<\/div>\n<div class=\"f\">f(x)≤M（f(x)≥N），<\/div>\n<div class=\"p\">则称 f 为 D 上的有上（下）界的函数，M(N) 称为 f 的一个上（下）界。<\/div>\n<p class=\"lb\">定义1.10 有界函数<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若存在常数 N≤M，使得对每一个 x∈D，都有<\/div>\n<div class=\"f\">N≤f(x)≤M，<\/div>\n<div class=\"p\">则称 f 为 D 上的有界函数。<\/div>\n<p class=\"lb\">定义1.10 有界函数的等价定义<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若存在常数 M&gt;0，使得对每一个 x∈D，都有<\/div>\n<div class=\"f\">|f(x)|≤M，<\/div>\n<div class=\"p\">则称 f 为 D 上的有界函数。<\/div>\n<p class=\"lb\">定义1.11 无界函数<\/p>\n<div class=\"p\">设 f 为定义在 D 上的函数，若对每一个正常数 M（无论 M 多么大），都存在 x₀∈D，使<\/div>\n<div class=\"f\">|f(x₀)|&gt;M，<\/div>\n<div class=\"p\">则称 f 为 D 上的无界函数。<span class=\"refgrp\">（见例12）<\/span><\/div>\n<p class=\"lb\">定义1.12 数列<\/p>\n<div class=\"p\">若函数的定义域为全体正整数集，则称函数 f：N₊→R 或 f(n)（n∈N₊）为自变量取正整数的函数。<\/div>\n<div class=\"p\">因正整数集 N₊ 的元素可按大小顺序依次排列，因此，函数值 f(n) 也可按 n 从小到大的次序排列成一列：f(1)，f(2)，f(3)，⋯，f(n)，⋯，称为数列。<\/div>\n<div class=\"p\">若令 aₙ=f(n)，则把 a₁，a₂，a₃，⋯，aₙ，⋯简记为 {aₙ}，其中 aₙ 称为数列的通项。<span class=\"refgrp\">（见例1、例2）<\/span><\/div>\n<p class=\"lb\">定义1.13 数列极限（ε-N）<\/p>\n<div class=\"p\">设 {aₙ} 是一个数列，a 是一个确定的常数，若对任意给定的正数 ε，总存在一个正整数 N，使得当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，<\/div>\n<div class=\"p\">则称数列 {aₙ} 的极限是 a。或者说数列 {aₙ} 收敛到 a，记作<\/div>\n<div class=\"f\">lim(n→∞)aₙ=a<\/div>\n<div class=\"p\">（读作当 n 趋向于无穷大时，aₙ 的极限是 a）或记作<\/div>\n<div class=\"f\">aₙ→a（n→∞）<\/div>\n<div class=\"p\">（读作当 n 趋向于无穷大时，aₙ 趋向于 a）。此定义称为数列极限的 ε-N 定义。<\/div>\n<p class=\"lb\">ε-N 定义的逻辑量词表述<\/p>\n<div class=\"p\">若“任给”用“∀”表示，“存在”用“∃”表示，则 ε-N 定义可叙述为：<\/div>\n<div class=\"p\">若 ∀ε&gt;0，∃正整数 N，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，<\/div>\n<div class=\"p\">则 lim(n→∞)aₙ=a。<\/div>\n<p class=\"lb\">收敛数列与发散数列<\/p>\n<div class=\"p\">一个数列 {aₙ} 若有极限，就称它为收敛数列，否则称为发散数列。<\/div>\n<h3>性质<\/h3>\n<p class=\"lb\">上（下）界的性质<\/p>\n<div class=\"p\">由定义知，若 M(N) 为 f 的上（下）界，则任何大（小）于 M(N) 的数也是 f 在 D 上的上（下）界。<\/div>\n<p class=\"lb\">性质1（唯一性）<\/p>\n<div class=\"p\">若数列 {aₙ} 的极限存在，则极限值是唯一的。<\/div>\n<p class=\"lb\">性质2（有界性）<\/p>\n<div class=\"p\">若数列 {aₙ} 收敛，则 {aₙ} 为有界数列。<\/div>\n<div class=\"p\">即存在某正常数 M，使得对一切正整数 n，都有<\/div>\n<div class=\"f\">|aₙ|≤M。<\/div>\n<div class=\"z\">证：设 lim(n→∞)aₙ=a。<\/div>\n<div class=\"z\">由极限定义知，取 ε=1，存在相应的正整数 N，对一切 n&gt;N，有<\/div>\n<div class=\"f\">|aₙ-a|&lt;1，<\/div>\n<div class=\"z\">由 |aₙ|-|a|≤|aₙ-a|&lt;1 知，对一切 n&gt;N，有<\/div>\n<div class=\"f\">|aₙ|&lt;1+|a|。<\/div>\n<div class=\"p\">设<\/div>\n<div class=\"f\">M=max{|a₁|，|a₂|，…，|aN|，1+|a|}，<\/div>\n<div class=\"p\">则对一切正整数 n，都有<\/div>\n<div class=\"f\">|aₙ|≤M。<\/div>\n<p class=\"lb\">推论<\/p>\n<div class=\"p\">若数列 {aₙ} 无界，则数列 {aₙ} 发散。<\/div>\n<p class=\"lb\">性质3<\/p>\n<div class=\"p\">设 lim(n→∞)aₙ=a，lim(n→∞)bₙ=b 且 a&lt;b，则存在正整数 N，当 n&gt;N 时（即 n 充分大时），都有<\/div>\n<div class=\"f\">aₙ&lt;bₙ。<\/div>\n<div class=\"z\">证：由于 lim(n→∞)aₙ=a，lim(n→∞)bₙ=b，且 a&lt;b。<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">ε=(b-a)/2&gt;0，<\/div>\n<div class=\"z\">存在正整数 N₁ 及 N₂，使得当 n&gt;N₁ 时，<\/div>\n<div class=\"f\">|aₙ-a|&lt;(b-a)/2，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">(3a-b)/2&lt;aₙ&lt;(a+b)/2，<\/div>\n<div class=\"p\">当 n&gt;N₂ 时，<\/div>\n<div class=\"f\">|bₙ-b|&lt;(b-a)/2，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">(a+b)/2&lt;bₙ&lt;(3b-a)/2，<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">N=max{N₁，N₂}，<\/div>\n<div class=\"z\">当 n&gt;N 时，都有<\/div>\n<div class=\"f\">aₙ&lt;(a+b)/2 且 (a+b)/2&lt;bₙ，<\/div>\n<div class=\"p\">即<\/div>\n<div class=\"f\">aₙ&lt;bₙ。<\/div>\n<p class=\"lb\">推论（保号性）<\/p>\n<div class=\"p\">若 lim(n→∞)aₙ=a&gt;0（a&lt;0），则对于满足 0&lt;η&lt;a（a&lt;η&lt;0）的任何常数 η，存在正整数 N，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">aₙ&gt;η&gt;0（aₙ&lt;η&lt;0）。<\/div>\n<div class=\"z\">证：对 0&lt;η&lt;a，设<\/div>\n<div class=\"f\">bₙ=η（n=1，2，…），<\/div>\n<div class=\"p\">则<\/div>\n<div class=\"f\">lim(n→∞)bₙ=η。<\/div>\n<div class=\"z\">由 lim(n→∞)aₙ=a（0&lt;η&lt;a）及性质3知，存在正整数 N，当 n&gt;N 时，都有<\/div>\n<div class=\"f\">aₙ&gt;bₙ=η&gt;0。<\/div>\n<div class=\"p\">对 a&lt;0 的情况，同理可证。<\/div>\n<p class=\"lb\">性质4（不等式性质）<\/p>\n<div class=\"p\">若 lim(n→∞)aₙ=a，lim(n→∞)bₙ=b，且存在正整数 N₀，当 n&gt;N₀ 时，都有 aₙ≥bₙ，则<\/div>\n<div class=\"f\">a≥b。<\/div>\n<div class=\"z\">证：用反证法。<\/div>\n<div class=\"z\">假设 a&lt;b，由性质3知，存在正整数 N₁，当 n&gt;N₁ 时，都有<\/div>\n<div class=\"f\">aₙ&lt;bₙ。<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">N=max{N₀，N₁}，<\/div>\n<div class=\"z\">当 n&gt;N 时，有 aₙ&lt;bₙ，与当 n&gt;N 时 aₙ≥bₙ 相矛盾，所以假设不成立。<\/div>\n<div class=\"p\">因此<\/div>\n<div class=\"f\">a≥b。<\/div>\n<p class=\"lb\">性质5（数列极限的四则运算）<\/p>\n<div class=\"p\">如果 lim(n→∞)aₙ=a，lim(n→∞)bₙ=b，则数列 {aₙ±bₙ}，{aₙbₙ}，{aₙ/bₙ}（b≠0）的极限都存在，且<\/div>\n<div class=\"p\">（1）<\/div>\n<div class=\"f\">lim(n→∞)(aₙ±bₙ)=lim(n→∞)aₙ±lim(n→∞)bₙ=a±b；<\/div>\n<div class=\"p\">（2）<\/div>\n<div class=\"f\">lim(n→∞)(aₙ·bₙ)=lim(n→∞)aₙ·lim(n→∞)bₙ=a·b，<\/div>\n<div class=\"p\">特别地，当 k 为常数时，有<\/div>\n<div class=\"f\">lim(n→∞)kaₙ=k lim(n→∞)aₙ=ka；<\/div>\n<div class=\"p\">（3）<\/div>\n<div class=\"f\">lim(n→∞)aₙ/bₙ=lim(n→∞)aₙ/lim(n→∞)bₙ=a/b（b≠0）。<\/div>\n<div class=\"z\">证：由于<\/div>\n<div class=\"f\">aₙ-bₙ=aₙ+(-1)bₙ，aₙ/bₙ=aₙ·(1/bₙ)，<\/div>\n<div class=\"p\">所以我们只需证明关于和、积与倒数运算的结论。<\/div>\n<div class=\"z\">由于 lim(n→∞)aₙ=a，lim(n→∞)bₙ=b，所以，任给 ε&gt;0，由定义知，分别存在正整数 N₁ 和 N₂，当 n&gt;N₁ 时，有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，<\/div>\n<div class=\"p\">当 n&gt;N₂ 时，有<\/div>\n<div class=\"f\">|bₙ-b|&lt;ε。<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">N=max{N₁，N₂}，<\/div>\n<div class=\"p\">则当 n&gt;N 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε，|bₙ-b|&lt;ε。<\/div>\n<div class=\"p\">从而，有<\/div>\n<div class=\"p\">（1）<\/div>\n<div class=\"f\">|(aₙ+bₙ)-(a+b)|=|(aₙ-a)+(bₙ-b)|≤|aₙ-a|+|bₙ-b|&lt;ε+ε=2ε，<\/div>\n<div class=\"p\">所以，<\/div>\n<div class=\"f\">lim(n→∞)(aₙ+bₙ)=a+b=lim(n→∞)aₙ+lim(n→∞)bₙ。<\/div>\n<div class=\"p\">（2）<\/div>\n<div class=\"f\">|aₙbₙ-ab|=|aₙbₙ-abₙ+abₙ-ab|=|(aₙ-a)bₙ+a(bₙ-b)|≤|aₙ-a||bₙ|+|a||bₙ-b|，<\/div>\n<div class=\"p\">由收敛数列的有界性知，存在正数 M，对一切 n，有<\/div>\n<div class=\"f\">|bₙ|≤M。<\/div>\n<div class=\"p\">于是，<\/div>\n<div class=\"f\">|aₙbₙ-ab|&lt;εM+|a|ε=(M+|a|)ε，<\/div>\n<div class=\"p\">由 ε 的任意性知，<\/div>\n<div class=\"f\">lim(n→∞)aₙbₙ=ab=lim(n→∞)aₙ·lim(n→∞)bₙ。<\/div>\n<div class=\"p\">（3）<\/div>\n<div class=\"z\">由 lim(n→∞)bₙ=b≠0，知<\/div>\n<div class=\"f\">lim(n→∞)|bₙ|=|b|&gt;0，<\/div>\n<div class=\"p\">取<\/div>\n<div class=\"f\">0&lt;η=|b|/2&lt;|b|。<\/div>\n<div class=\"p\">由保号性知，存在正整数 N₀，当 n&gt;N₀ 时，有<\/div>\n<div class=\"f\">|bₙ|&gt;|b|/2。<\/div>\n<div class=\"z\">取<\/div>\n<div class=\"f\">N=max{N₀，N₂}，<\/div>\n<div class=\"p\">当 n&gt;N 时，有 |bₙ-b|&lt;ε，且 |bₙ|&gt;|b|/2，则<\/div>\n<div class=\"f\">|1/bₙ-1/b|=|bₙ-b|/(|bₙ||b|)&lt;|bₙ-b|/(|b|·|b|/2)&lt;2ε/|b|²，<\/div>\n<div class=\"p\">由 ε 的任意性知，<\/div>\n<div class=\"f\">lim(n→∞)1/bₙ=1/b=1/lim(n→∞)bₙ（b≠0）。<\/div>\n<h3>相关定理<\/h3>\n<p class=\"lb\">定理1.1 改变数列的有限项不改变数列的收敛性与极限<\/p>\n<div class=\"p\">改变数列的有限项，不改变数列的收敛性与极限。<\/div>\n<div class=\"z\">证<\/div>\n<div class=\"z\">证：设数列 {aₙ} 收敛且极限为 a，不妨设改变了前 k 项，得到数列 {bₙ}，即有<\/div>\n<div class=\"f\">{aₙ}：a₁，a₂，⋯，aₖ，aₖ₊₁，⋯，aₙ，⋯，{bₙ}：b₁，b₂，⋯，bₖ，aₖ₊₁，⋯，aₙ，⋯。<\/div>\n<div class=\"z\">由于 lim(n→∞)aₙ=a，所以，∀ε&gt;0，∃正整数 N₁，当 n&gt;N₁ 时，都有<\/div>\n<div class=\"f\">|aₙ-a|&lt;ε。<\/div>\n<div class=\"z\">取 N=max{k, N₁}，当 n&gt;N 时，都有 |aₙ-a|&lt;ε。<\/div>\n<div class=\"z\">当 n&gt;N≥k 时，有 aₙ=bₙ，从而 n&gt;N 时，都有 |bₙ-a|&lt;ε，所以 lim(n→∞)bₙ=a。<\/div>\n<div class=\"z\">从而 {bₙ} 收敛，且极限仍为 a。<\/div>\n<div class=\"z\">若 {aₙ} 不收敛，则 {bₙ} 亦不收敛。<\/div>\n<div class=\"z\">因若 {bₙ} 收敛，则 {aₙ} 可以看成经 {bₙ} 改变有限项后所得到的数列，由上面证明知，{aₙ} 收敛，矛盾。<\/div>\n<div class=\"z\">故 {bₙ} 发散。<\/div>\n<h3>典型题型解法<\/h3>\n<p class=\"bullet\">• <b>怎样用 ε-N 定义验证数列极限的存在<\/b><\/p>\n<p class=\"bullet\">• <b>1. 直接法<\/b>（例6例7例8）<\/p>\n<p class=\"bullet\">• <b>2. 适当放大法<\/b><\/p>\n<p class=\"bullet\">• <b>适当放大法<\/b><\/p>\n<p class=\"bullet\">• <b>直接放大<\/b>（例9）<\/p>\n<p class=\"bullet\">• <b>间接放大<\/b>（例10）<\/p>\n<h3>注<\/h3>\n<p class=\"lb note\">有界函数的几何意义<\/p>\n<div class=\"p note\">若 f 为 D 上的有界函数，则 f 的图像完全落在直线 y=M 与 y=-M 之间。<\/div>\n<p class=\"bullet\">• <b>当我们对一个陈述加以否定时，应该把逻辑量词“存在”换成“任给”，把“任给”换成“存在”，并且最后给出否定的结论。<\/b><\/p>\n<p class=\"lb note\">数列的两类情形<\/p>\n<div class=\"p note\">数列有两类，一类是 {aₙ} 中的 aₙ 随着 n 的无限增大而无限地接近某一个常数 a，我们称 a 是数列 {aₙ} 的极限；<\/div>\n<div class=\"p note\">另一类 {aₙ} 中的 aₙ 随着 n 的无限增大而不能无限接近于一个确定的常数 a。<\/div>\n<div class=\"p note\">第一类数列对我们很重要。<span class=\"refgrp\">（见例2、例3、例4、例5）<\/span><\/div>\n<p class=\"lb note\">不用“无限接近”作为极限定义的原因<\/p>\n<div class=\"p note\">尽管“aₙ 随着 n 的无限增大而无限地接近某一个常数 a”这句话很直观且通俗易懂，但不能精确地描述极限的过程，<\/div>\n<div class=\"p note\">首先它仅是形象表述，不符合数学的严密性与简洁性，其次把它作为定义不利于证明其他命题，证明过程也无法表述。<\/div>\n<div class=\"p note\">因此，我们需要的是清楚、简洁的数学表达式。<\/div>\n<p class=\"lb note\">数列极限的几何描述<\/p>\n<div class=\"p note\">若数列 {aₙ} 的极限是某一个确定的常数 a，那么在 a 的任意给定的 ε 邻域 (a-ε, a+ε) 外面有数列 aₙ 的多少项呢？<\/div>\n<div class=\"p note\">从给出的几何图形（图1-8）中可以看出，外面只有有限项。<\/div>\n<div class=\"p note\">（图略：数轴上点 a 的 ε 邻域 (a-ε, a+ε) 内集中了无穷多个项，邻域外只有有限个项）<\/div>\n<p class=\"lb note\">对数列极限定义的几点说明 1. ε 的任意性<\/p>\n<div class=\"p note\">ε 是一个正数，其作用在于衡量 aₙ 与 a 的接近程度。<\/div>\n<div class=\"p note\">尽管 ε 是任意给定的，但当它一经给出，就应暂时看成一个定值，以
